// ===== الختمة =====
const ORD=['الأولى','الثانية','الثالثة','الرابعة','الخامسة','السادسة','السابعة','الثامنة','التاسعة','العاشرة'];
const ordn=n=>ORD[n-1]||('رقم '+ar(n));
let KH=null;try{KH=JSON.parse(localStorage.getItem('q_kh')||'null')}catch(e){}
if(!KH||!Array.isArray(KH.done))KH={cur:null,done:[]};
if(KH.cur&&(typeof KH.cur.read!=='string'||KH.cur.read.length!==604))KH.cur=null;
const khSave=()=>{localStorage.setItem('q_kh',JSON.stringify(KH));const D=pend();D.d=1;localStorage.setItem('q_pend',JSON.stringify(D));flush()};
const dnum=d=>{const[y,m,x]=d.split('-').map(Number);return Date.UTC(y,m-1,x)/864e5};
const khRead=()=>KH.cur?KH.cur.read.split('1').length-1:0;
const cumP=(c,d)=>Math.ceil(604*Math.min(Math.max(d,0),c.days)/c.days);
const readRange=(c,a,b)=>{for(let p=a;p<=b;p++)if(c.read[p-1]!=='1')return false;return true};
function khSlotNames(c){if(c.mode==='daily')return['ورد اليوم'];const pf=c.mode==='before'?'قبل ':'بعد ';const L=[pf+'الفجر'];if(c.duha)L.push('الضحى');return L.concat([pf+'الظهر',pf+'العصر',pf+'المغرب',pf+'العشاء'])}
function khPlan(c){const di=dnum(today())-dnum(c.start)+1,d=Math.max(1,di),over=d>c.days,dd=Math.min(d,c.days);
  const from=cumP(c,dd-1)+1,to=cumP(c,dd),cnt=Math.max(0,to-from+1),names=khSlotNames(c),k=names.length,base=Math.floor(cnt/k),ex=cnt%k;
  let p=from;const sl=[];names.forEach((n,i)=>{const m=base+(i<ex?1:0);if(m>0){sl.push({n,from:p,to:p+m-1});p+=m}});
  const exp=cumP(c,dd-1);let missed=0;for(let i=0;i<exp;i++)if(c.read[i]!=='1')missed++;
  return{d:dd,over,from,to,cnt,sl,missed}}
let PEs=null;
function pe(k){if(!PGs||!KH.cur)return'';if(!PEs)PEs=new Set([...PGs.slice(1).map(x=>x-1),TOTAL]);if(!PEs.has(k))return'';const p=loc(PGs,k),on=KH.cur.read[p-1]==='1';
  return`<div class="pgend"><button class="pgb${on?' done':''}" data-p="${p}">${on?'✓ تمت قراءة الصفحة ':'تم قراءة الصفحة '}${ar(p)}</button></div>`}
function khToggle(p){const c=KH.cur;if(!c)return;const a=c.read.split('');a[p-1]=a[p-1]==='1'?'0':'1';c.read=a.join('');khSave();
  document.querySelectorAll(`.pgb[data-p="${p}"]`).forEach(b=>{const on=a[p-1]==='1';b.classList.toggle('done',on);b.textContent=(on?'✓ تمت قراءة الصفحة ':'تم قراءة الصفحة ')+ar(p)});
  if(a[p-1]==='1'&&khRead()===604)khFinish()}
function khFinish(){const c=KH.cur,days=Math.max(1,dnum(today())-dnum(c.start)+1);KH.done.push({n:KH.done.length+1,start:c.start,end:today(),days,plan:c.days});KH.cur=null;khSave();
  show(`<h4>🎉 اكتملت الختمة ${ordn(KH.done.length)}</h4><p>الحمد لله، أتممت ختمة القرآن في ${ar(days)} يوم. تقبّل الله منك وبارك فيك.</p><div class="act"><button class="pri" data-act="khnew">ختمة جديدة</button><button data-act="khclose">إغلاق</button></div>`)}
function khStat(){const e=$('khs');if(KH.cur){const r=khRead(),pl=khPlan(KH.cur);e.textContent=`الختمة ${ordn(KH.done.length+1)}: ${ar(r)} من ${ar(604)} صفحة${pl.cnt&&!pl.over?` • وردك اليوم ${ar(pl.cnt)} صفحة`:''}`}
  else e.textContent=KH.done.length?`ختمات مكتملة: ${ar(KH.done.length)} • ابدأ ختمة جديدة`:'ابدأ ختمة جديدة من هنا'}
function khHtml(){const c=KH.cur;let h='';
  if(KH.done.length)h+=`<div class="kc"><h3>🏅 الختمات المكتملة: ${ar(KH.done.length)}</h3><p>${KH.done.map(x=>`الختمة ${ordn(x.n)}: في ${ar(x.days)} يوم (انتهت ${x.end})`).join('<br>')}</p></div>`;
  if(!PGs)return h+'<div class="empty">الختمة تحتاج بيانات الصفحات داخل quran.json. من الأدمن حمّل quran-data.js ثم أعد تصدير quran.json</div>';
  if(!c){h+=`<div class="kc"><h3>ابدأ الختمة ${ordn(KH.done.length+1)}</h3><p>اختر عدد الأيام وسيحسب الموقع وردك كل يوم، ثم تسجّل بنفسك كل صفحة تقرؤها.</p>
<label>عدد الأيام (من ١ إلى ٣٦٥٠)</label><input id="khd" type="number" min="1" max="3650" value="30" inputmode="numeric">
<div class="chips">${[1,3,7,10,15,30,60,90,180,365,730,1095].map(x=>`<button data-kd="${x}">${ar(x)}</button>`).join('')}</div>
<label>طريقة التوزيع</label><select id="khm"><option value="after">بعد كل صلاة</option><option value="before">قبل كل صلاة</option><option value="daily">ورد واحد في اليوم</option></select>
<label style="display:flex;align-items:center;gap:8px"><input type="checkbox" id="khdu" style="width:auto;margin:0"> إضافة وقت الضحى</label>
<button class="kb pri" data-kh="start">ابدأ الختمة</button></div>`;return h}
  const r=khRead(),pl=khPlan(c);
  h+=`<div class="kc"><h3>الختمة ${ordn(KH.done.length+1)} — خطة ${ar(c.days)} يوم</h3><div class="pbar" style="background:var(--border)"><i style="width:${r*100/604}%"></i></div><p>قرأت ${ar(r)} من ${ar(604)} صفحة • اليوم ${ar(pl.d)} من ${ar(c.days)}</p>`;

  else if(!pl.cnt)h+='<p>لا ورد مقرر اليوم (يوم راحة في خطتك).</p>';

  if(pl.missed)h+=`<p>⚠️ متأخر عن ${ar(pl.missed)} صفحة من الأيام السابقة.</p>`;
  const fu=c.read.indexOf('0')+1;if(fu)h+=`<button class="kb pri" data-kp="${fu}">تابع من أول صفحة غير مقروءة (ص ${ar(fu)})</button>`;
  return h+'<button class="kb dg" data-kh="cancel" style="margin-top:8px">إلغاء هذه الختمة</button></div>'}
function khAct(a){
  if(a==='start'){const d=Math.round(+$('khd').value);if(!(d>=1&&d<=3650))return toast('اختر عدداً من ١ إلى ٣٦٥٠');KH.cur={start:today(),days:d,mode:$('khm').value,duha:$('khdu').checked,read:'0'.repeat(604)};khSave();toast('بدأت الختمة، بارك الله لك ✓');home()}
