<script type="module">

function mtBuild(){if(MTI)return;const W=new Array(TOTAL+1),G=new Map,E=new Map;
  for(let k=1;k<=TOTAL;k++){const o=[],n=[];for(const t of Q[k].split(' ')){const m=mtNorm(t);if(m){o.push(t);n.push(m)}}W[k]={o,n};

function mtRun(a,b){let best=0,ea=0,eb=0,prev=new Array(b.length+1).fill(0);
  for(let x=1;x<=a.length;x++){const cur=new Array(b.length+1).fill(0);for(let y=1;y<=b.length;y++)if(a[x-1]===b[y-1]){cur[y]=prev[y-1]+1;if(cur[y]>best){best=cur[y];ea=x;eb=y}}prev=cur}
  return{L:best,ea,eb}}
function mtFind(i){mtBuild();const{W,G,E}=MTI,A=W[i].n,out=[],seen=new Set([i]);
