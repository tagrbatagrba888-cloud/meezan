<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#0B3D2E;--primary-light:#145A43;--primary-lighter:#1E7A5A;--accent:#C9A961;--accent-light:#E0C888;--bg-page:#F5F1E8;--bg-card:#FFFFFF;--bg-input:#F8FBF9;--text-main:#0B3D2E;--text-sub:#5A6B66;--border:#E0E5E1;--shadow:rgba(11,61,46,.15);--error:#C0392B;--success:#1E7A5A;--warning:#E67E22;--on-primary:#fff}
[data-theme="dark"]{--primary:#C9A961;--primary-light:#E0C888;--primary-lighter:#F0DBA8;--accent:#0B3D2E;--accent-light:#145A43;--bg-page:#0A1612;--bg-card:#11201B;--bg-input:#1A2C25;--text-main:#F5F1E8;--text-sub:#9BAEA6;--border:#1E3A31;--shadow:rgba(0,0,0,.5);--error:#E74C3C;--success:#2ECC71;--warning:#F39C12;--on-primary:#0A1612}
body{font-family:Cairo,sans-serif;background:var(--bg-page);color:var(--text-main);min-height:100vh}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
.tb{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;background:var(--bg-card);border-bottom:1px solid var(--border);box-shadow:0 4px 20px var(--shadow)}
.tb img{width:42px;height:42px;border-radius:50%;object-fit:contain;border:2px solid var(--accent);padding:3px}
.tt{flex:1;font-weight:900;font-size:18px;color:var(--primary)}
.ib{width:42px;height:42px;border-radius:12px;background:var(--bg-input);border:2px solid var(--border);display:grid;place-items:center;text-decoration:none;color:var(--primary);font-size:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:800;font-size:14px;background:var(--bg-card);border:2px solid var(--border)}
.btn.p{background:linear-gradient(135deg,var(--primary),var(--primary-lighter));color:var(--on-primary);border-color:transparent}
.btn.d{background:var(--error);color:#fff;border-color:transparent}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}

.empty{grid-column:1/-1;text-align:center;padding:40px 14px;color:var(--text-sub);font-weight:700;border:2px dashed var(--border);border-radius:18px}
.note{font-size:13px;font-weight:600;line-height:1.9;background:var(--bg-input);border:1px dashed var(--accent);border-radius:12px;padding:10px 12px;margin-top:8px}
.ph{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,var(--primary),var(--primary-lighter));color:var(--on-primary);padding:12px 16px;border-radius:16px;margin-bottom:12px;font-weight:900}

.paper{position:relative;overflow:hidden;color:#2a2214;font-family:Amiri,serif;font-size:17px;line-height:2;padding:26px 24px 30px;margin:14px auto;max-width:640px;border-radius:3px;background:radial-gradient(ellipse at 20% 10%,rgba(255,255,255,.55),transparent 55%),repeating-linear-gradient(0deg,rgba(120,90,40,.035) 0 2px,transparent 2px 5px),linear-gradient(180deg,#f6efdc,#eadfc2);box-shadow:0 12px 30px rgba(0,0,0,.4),inset 0 0 70px rgba(120,90,40,.28);transform:rotate(-.35deg)}
.paper.aged{background:linear-gradient(180deg,#e9d9ae,#cdb680);box-shadow:0 12px 30px rgba(0,0,0,.45),inset 0 0 90px rgba(110,70,20,.5)}
.paper .hd{text-align:center;font-weight:700;font-size:15px;line-height:1.7;border-bottom:3px double #5a4a2a;padding-bottom:8px;margin-bottom:8px}.paper .hd h4{font-size:21px;margin-top:6px}
.paper .meta{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:700;color:#4b3f27;margin-bottom:10px;flex-wrap:wrap}
.paper .bd{white-space:pre-wrap;word-break:break-word;position:relative;z-index:1}.paper.hand .bd{font-family:'Aref Ruqaa',serif;font-size:19px;color:#1b2a52;line-height:2.1}

.paper .stamp{position:absolute;top:16px;left:16px;border:3px solid #b3261e;color:#b3261e;padding:1px 12px;transform:rotate(-12deg);font-family:'Aref Ruqaa',serif;font-weight:700;font-size:20px;border-radius:6px;opacity:.82;z-index:2;mix-blend-mode:multiply}
.paper .coffee{position:absolute;right:26px;bottom:20px;width:92px;height:92px;border-radius:50%;border:7px solid rgba(110,70,30,.32);box-shadow:inset 0 0 12px rgba(110,70,30,.3);transform:rotate(15deg);pointer-events:none}

.blood.heavy{background:radial-gradient(ellipse at 84% 14%,rgba(135,10,10,.92) 0 26px,rgba(135,10,10,.55) 42px,transparent 62px),radial-gradient(ellipse at 14% 82%,rgba(125,8,8,.8) 0 16px,rgba(125,8,8,.4) 30px,transparent 44px)}
.blood i{display:none}
</style></head><body>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,collection,doc,setDoc,getDoc,getDocs,updateDoc,deleteDoc,deleteField,onSnapshot,query,where,arrayUnion} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const db=getFirestore(initializeApp({apiKey:"AIzaSyAmkCOrSaklhUiDdDfZCpSDQNmMYP-Gdw0",authDomain:"qanon-c716d.firebaseapp.com",projectId:"qanon-c716d",storageBucket:"qanon-c716d.firebasestorage.app",messagingSenderId:"757756130875",appId:"1:757756130875:web:63c53534c6843e2a29ce1e"}));
const ss=sessionStorage;if(ss.getItem('meezan_logged_in')!=='true')location.replace('login.html');
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,5),sh=a=>[...a].sort(()=>Math.random()-.5),fmt=s=>(s/60|0)+':'+String(s%60).padStart(2,'0');
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3200)};
let real='لاعب';try{real=JSON.parse(ss.getItem('meezan_user_data')||'{}').fullName||ss.getItem('meezan_username')||real}catch(e){}
const pk=(ss.getItem('meezan_user_id')||ss.getItem('meezan_username')||'u'+uid()).replace(/[.\/~*\[\]`]/g,'_');
const th=()=>{$('#th').innerHTML=`<i class="fas fa-${document.documentElement.dataset.theme==='dark'?'sun':'moon'}"></i>`};th();
$('#th').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('meezan_theme',n);th()};

const DT={police:'محضر شرطة',autopsy:'تقرير الطب الشرعي',forensic:'تقرير الأدلة الجنائية',witness:'أقوال شاهد',interrogation:'محضر استجواب',phone:'سجل مكالمات',cctv:'تقرير كاميرات المراقبة',evidence:'حرز / دليل مادي',letter:'خطاب / رسالة',prosecution:'مذكرة النيابة',defense:'مذكرة الدفاع',court:'قرار المحكمة',other:'ورقة أخرى'};
const HD={police:'وزارة الداخلية<br>مديرية الأمن — قسم الشرطة',autopsy:'مصلحة الطب الشرعي',forensic:'الإدارة العامة للأدلة الجنائية',witness:'محضر جمع استدلالات',interrogation:'النيابة العامة — محضر تحقيق',phone:'شركة الاتصالات — بيان رسمي',cctv:'إدارة المراقبة والتأمين',evidence:'مخزن الأحراز',prosecution:'النيابة العامة<br>نيابة الجنايات',defense:'مكتب المحامي — مذكرة دفاع',court:'محكمة الجنايات'};
const PHS=[['investigation','التحقيق'],['prosecution','النيابة'],['defense','الدفاع'],['trial','المحاكمة'],['verdict','الحكم']],PHI={all:0,investigation:0,prosecution:1,defense:2,trial:3};
const SAY={officer:['تم ضبط المتهم وتحريز مسرح الجريمة يا فندم.'],investigator:['أين كنت وقت الواقعة؟ أجب بالتفصيل.'],prosecutor:['أطلب من عدالة المحكمة توقيع أقصى عقوبة.'],judge:['الجلسة منعقدة، تفضّل.','رُفعت الجلسة للمداولة.'],counselor:['لي تحفّظ على سلامة هذا الإجراء يا سيادة الرئيس.'],government:['أطلب تقريرًا رسميًا بالواقعة.'],lawyer:['موكلي ينكر التهمة ويلزم التحقق من الدليل.'],witness:['أقسم أنني أقول ما رأيته فقط.'],accused:['أنا بريء، والله العظيم ما فعلتها.']};
const ROLES=[['officer','ضابط المباحث','fa-user-shield','تتلقى البلاغ وتعاين مسرح الجريمة وتضبط المتهم وتحرر المحضر.'],['investigator','المحقق','fa-magnifying-glass','تستجوب المتهم والشهود وتربط الخيوط.'],['prosecutor','وكيل النائب العام','fa-landmark','توجه الاتهام وتطلب العقوبة.'],['judge','القاضي','fa-gavel','تدير الجلسة وتصدر الحكم.'],['counselor','المستشار','fa-scale-balanced','تشارك في المداولة وتراجع سلامة الإجراءات.'],['government','عضو الحكومة','fa-building-columns','تتابع سير العدالة وتطلب التقارير.'],['lawyer','محامي الدفاع','fa-user-tie','تدافع عن المتهم وتفنّد الأدلة.'],['witness','شاهد','fa-eye','تدلي بما رأيت وسمعت.'],['accused','المتهم','fa-handcuffs','الاتهام موجّه إليك: أنكر أو اعترف.']].map(([key,name,icon,desc])=>({key,name,icon,desc,pick:key!=='accused',enabled:true}));
const S={cases:[],servers:[],roles:ROLES,room:null,tab:'file'};
const rr=()=>doc(db,'crime_rooms',S.room.id),cs=()=>S.cases.find(c=>c.id===S.room?.caseId),ch=id=>cs()?.characters?.find(x=>x.id===id),srv=()=>S.servers.find(x=>x.id===S.room.serverId)||{};
function paper(d){const body=esc(d.content||'').replace(/\[\[(.+?)\]\]/g,'<span class="rd">$1</span>');
 return `<div class="paper ${d.aged?'aged':''} ${d.hand?'hand':''}"><div class="hd">${HD[d.type]||''}<h4>${esc(d.title||DT[d.type]||'ورقة')}</h4></div><div class="meta"><span>رقم: ${esc(d.number||'—')}</span><span>التاريخ: ${esc(d.date||'—')}</span></div><div class="bd">${body}</div>${d.stamp?`<div class="stamp">${esc(d.stamp)}</div>`:''}${d.coffee?'<div class="coffee"></div>':''}${d.blood&&d.blood!=='none'?`<div class="blood ${d.blood}"></div>`:''}</div>`}

/* ===== الواجهات ===== */
const vLobby=()=>`<div class="sec"><h3><i class="fas fa-gavel"></i> قاعة المحكمة</h3><p class="sub">ادخل قضية، واستلم دورك الحقيقي: ضابط، محقق، نيابة، قاضٍ، دفاع، شاهد أو متهم. داخل الجلسة لا يظهر اسمك الشخصي — يظهر دورك فقط.</p></div>
<div class="grid">${S.servers.filter(s=>s.status==='open').map(s=>`<div class="card"><h3><i class="fas ${s.mode==='ai'?'fa-robot':'fa-users'}"></i> ${esc(s.name)}</h3><p>${esc(s.desc||'')}</p><div class="chips"><span class="chip">${s.mode==='ai'?'فردي مع بوتات':'أونلاين جماعي'}</span><span class="chip">${s.minPlayers}–${s.maxPlayers} لاعبين</span><span class="chip">${s.phaseSeconds} ث للمرحلة</span></div><button class="btn p" data-a="join" data-id="${s.id}"><i class="fas fa-door-open"></i> دخول القضية</button></div>`).join('')||'<div class="empty"><i class="fas fa-server"></i><br>لا توجد سيرفرات مفتوحة الآن</div>'}</div>`;
function vWait(){const r=S.room,sv=srv(),n=Object.keys(r.players).length,mine=r.players[pk]||{},host=r.host===pk,taken=Object.values(r.players).map(p=>p.pick);
 const pick=sv.roleAssign==='random'?[]:S.roles.filter(x=>x.enabled&&x.pick&&x.key!=='accused'&&(x.key==='witness'||!taken.includes(x.key)||mine.pick===x.key));
 return `<div class="sec"><h3><i class="fas fa-hourglass-half"></i> غرفة الانتظار — ${esc(sv.name)}</h3><p class="sub">${n} / ${sv.maxPlayers} لاعبين${n<sv.minPlayers&&sv.mode!=='ai'?` — يلزم ${sv.minPlayers} على الأقل للبدء`:''}</p>
 ${pick.length?`<p class="sub">اختر دورك أو اترك الأمر للقرعة (المتهم لا يُختار، يُسند عشوائيًا):</p><div class="chips">${pick.map(x=>`<button class="btn sm ${mine.pick===x.key?'p':''}" data-a="pick" data-k="${x.key}"><i class="fas ${x.icon}"></i> ${esc(x.name)}</button>`).join('')}<button class="btn sm" data-a="pick" data-k="">قرعة</button></div>`:'<p class="sub">الأدوار توزَّع بالقرعة.</p>'}
 <div class="acts">${host?`<button class="btn p" data-a="start" ${n<sv.minPlayers&&sv.mode!=='ai'?'disabled':''}><i class="fas fa-gavel"></i> افتح الجلسة</button>`:'<span class="sub">بانتظار المضيف ليفتح الجلسة…</span>'}<button class="btn" data-a="leave">خروج</button></div></div>`}
function vGame(){const r=S.room,c=cs();if(!c)return '<div class="empty">جارٍ تحميل القضية…</div>';
 const p=r.players[pk]||{},ro=S.roles.find(x=>x.key===p.roleKey)||{},mc=ch(p.charId),pi=PHS.findIndex(x=>x[0]===r.phase),t=S.tab,acc=p.roleKey==='accused',v=c.victim||{};
 const docs=(c.documents||[]).filter(d=>(PHI[d.phase||'all']??0)<=pi&&(!(d.visibleTo||[]).length||d.visibleTo.includes(p.roleKey)));
 const body=t==='file'?`<div class="sec"><h3><i class="fas fa-folder-open"></i> ${esc(c.title)}</h3><p class="sub">${esc(c.summary)}</p><div class="chips"><span class="chip">${esc(c.crimeType)}</span><span class="chip">${esc(c.location)}</span><span class="chip">${esc(c.dateTime)}</span></div><p class="sub">المجني عليه: <b>${esc(v.name)}</b> (${esc(v.age)}) — ${esc(v.job)}. ${esc(v.causeOfDeath)}</p></div>
 <div class="sec"><h3><i class="fas ${ro.icon||'fa-user'}"></i> دورك: ${esc(ro.name)}</h3><p class="sub">${esc(ro.desc)} ${esc(ro.duties||'')}</p>${mc?`<div class="note">${mc.id===c.killerId?'🔪 <b>أنت القاتل الحقيقي.</b> لا أحد يعرف — أنكر بذكاء أو اعترف إن شئت.<br>':''}شخصيتك: <b>${esc(mc.name)}</b>، ${esc(mc.age)} سنة، ${esc(mc.job)}.<br>علاقتك بالمجني عليه: ${esc(mc.relation)}<br>حجتك: ${esc(mc.alibi)}<br>أقوالك: ${esc(mc.statement)}</div>`:''}</div>
 <div class="sec"><h3><i class="fas fa-users"></i> الحاضرون</h3><div class="chips">${[...Object.values(r.players),...(r.bots||[])].map(x=>`<span class="chip">${esc(x.label)}${x.roleKey==='accused'?' ⛓️':''}</span>`).join('')}</div></div>`
 :t==='docs'?(docs.map(paper).join('')||'<div class="empty">لا أوراق متاحة لك الآن</div>')
 :`<div class="sec"><div id="ms" class="ms">${(r.chat||[]).slice(-80).map(m=>`<div class="m ${m.k===pk?'me':m.k==='sys'?'sys':''}"><b>${esc(m.n)}</b>${esc(m.t)}</div>`).join('')}</div>
 ${r.phase==='verdict'&&!acc?`<div class="note">صوّت على الحكم: ${r.votes?.[pk]?'تم تسجيل صوتك ✓':'<button class="btn sm d" data-a="vote" data-k="g">مذنب</button> <button class="btn sm p" data-a="vote" data-k="i">بريء</button>'}</div>`:''}
 <div class="chips">${(SAY[p.roleKey]||[]).map(s=>`<button class="btn sm" data-a="say" data-t="${esc(s)}">${esc(s)}</button>`).join('')}</div><div style="display:flex;gap:6px"><input id="ci" placeholder="تكلّم بصفتك ${esc(ro.name)}…" autocomplete="off"><button class="btn p" data-a="send"><i class="fas fa-paper-plane"></i></button></div></div>`;
 return `<div class="ph"><i class="fas fa-gavel"></i><b>مرحلة ${PHS[pi][1]}</b><span id="tm"></span>${r.host===pk?'<button class="btn sm" data-a="next">التالي</button>':''}</div>
 <div class="tabs">${[['file','الملف'],['docs','الأوراق'],['chat','الجلسة']].map(([k,n])=>`<button class="tab ${t===k?'on':''}" data-tab="${k}">${n}</button>`).join('')}</div>${body}`}
function vDone(){const r=S.room,c=cs();if(!c)return '';const a=ch(c.accusedId),k=ch(c.killerId),truth=c.accusedId===c.killerId,R=r.result,ok=R.guilty===truth;
 return `<div class="sec"><h3><i class="fas fa-gavel"></i> نطقت المحكمة</h3><p class="sub">حكمت المحكمة ${R.guilty?'بإدانة':'ببراءة'} <b>${esc(a?.name)}</b> (${R.g} مذنب / ${R.i} بريء).</p>
 <div class="note">الحقيقة: القاتل هو <b>${esc(k?.name)}</b>، و${truth?'المتهم هو القاتل فعلًا':'المتهم كان بريئًا'}. ${ok?'⚖️ تحققت العدالة.':'❌ أخطأت المحكمة.'}<br>قوة أوراق البراءة في القضية: ${esc(c.innocencePct)}%</div>
 <div class="chips">${Object.values(r.players).map(x=>`<span class="chip">${esc(x.label)} ← ${esc(x.real)}</span>`).join('')}</div><div class="acts"><button class="btn p" data-a="leave">قضية جديدة</button></div></div>`}
function render(){const v=$('#ci')?.value||'',f=document.activeElement?.id==='ci',r=S.room;
 $('#v').innerHTML=!r?vLobby():r.status==='waiting'?vWait():r.status==='done'?vDone():vGame();
 const i=$('#ci');if(i){i.value=v;if(f)i.focus()}const m=$('#ms');if(m)m.scrollTop=m.scrollHeight}

/* ===== المنطق ===== */
let unsub;
function enter(id){ss.setItem('crime_rid',id);unsub&&unsub();unsub=onSnapshot(doc(db,'crime_rooms',id),s=>{if(!s.exists())return out();S.room={id:s.id,...s.data()};if(S.room.status==='waiting'&&!S.room.players[pk])return out();render()})}
function out(){unsub&&unsub();S.room=null;ss.removeItem('crime_rid');render()}
async function join(sid){const sv=S.servers.find(x=>x.id===sid);if(!sv)return;let r=null;
 if(sv.mode!=='ai'){const q=await getDocs(query(collection(db,'crime_rooms'),where('serverId','==',sid),where('status','==','waiting')));r=q.docs.map(d=>({id:d.id,...d.data()})).find(x=>x.players[pk]||Object.keys(x.players||{}).length<sv.maxPlayers)}
 if(!r){const id=uid();await setDoc(doc(db,'crime_rooms',id),{serverId:sid,host:pk,status:'waiting',phase:'lobby',players:{},chat:[],votes:{},createdAt:Date.now()});r={id}}
 await updateDoc(doc(db,'crime_rooms',r.id),{['players.'+pk]:{pick:'',real}});enter(r.id)}
async function leave(){const r=S.room;if(r&&r.status==='waiting'){const o=Object.keys(r.players).filter(k=>k!==pk);if(!o.length)await deleteDoc(rr());else await updateDoc(rr(),{['players.'+pk]:deleteField(),...(r.host===pk?{host:o[0]}:{})})}out()}
function botSay(p,c,bots){const a=c.characters.find(x=>x.id===c.accusedId)||{},v=c.victim||{};
 const B={investigation:['officer',`تلقّينا بلاغًا بوفاة ${v.name} في ${c.location}. جرت المعاينة وضُبط ${a.name} للتحقيق.`],prosecution:['prosecutor',`أتهم ${a.name} بجريمة ${c.crimeType}، وأطلب من عدالة المحكمة أقصى العقوبة.`],defense:['lawyer',`موكلي ${a.name} ينكر، وأتمسك بأقواله: «${(a.statement||'').slice(0,120)}»`],trial:['judge','الجلسة منعقدة. اعرضوا ما لديكم قبل أن ننطق بالحكم.'],verdict:['judge','المحكمة تطلب التصويت: مذنب أم بريء؟']}[p],now=Date.now();
 const out=[{k:'sys',n:'المحكمة',t:'بدأت مرحلة '+PHS.find(x=>x[0]===p)[1],ts:now}],b=bots.find(x=>x.roleKey===B[0]);if(b)out.push({k:b.k,n:b.label,t:B[1],ts:now+1});return out}
async function start(){const r=S.room,sv=srv(),c=(sv.caseMode==='fixed'&&S.cases.find(x=>x.id===sv.caseId))||sh(S.cases.filter(x=>x.active))[0];if(!c)return toast('لا توجد قضايا مفعّلة');
 const en=S.roles.filter(x=>x.enabled),ids=Object.keys(r.players),P={},used={},acc=c.characters.find(x=>x.id===c.accusedId)||{};
 ids.forEach(i=>{const k=r.players[i].pick;if(k&&sv.roleAssign!=='random'&&k!=='accused'&&(k==='witness'||!used[k])){P[i]=k;used[k]=1}});
 const un=sh(ids.filter(i=>!P[i]));if(en.some(x=>x.key==='accused')&&un.length){P[un.shift()]='accused';used.accused=1}
 const free=sh(en.filter(x=>!['witness','accused'].includes(x.key)&&!used[x.key]).map(x=>x.key));un.forEach(i=>{const k=free.shift()||'witness';P[i]=k;used[k]=1});
 const bots=(sv.fillBots||sv.mode==='ai')?en.filter(x=>x.key!=='witness'&&!used[x.key]).map(x=>({k:'b_'+x.key,roleKey:x.key,label:x.name+(x.key==='accused'?' — '+acc.name:'')})):[];
 const pool=sh(c.characters.filter(x=>x.id!==c.accusedId)),cnt={},pl={};
 ids.forEach(i=>{const k=P[i],ca=k==='accused'?acc:k==='witness'?pool.shift():null;cnt[k]=(cnt[k]||0)+1;pl[i]={...r.players[i],roleKey:k,charId:ca?.id||'',label:(en.find(x=>x.key===k)||{name:k}).name+(ca?' — '+ca.name:cnt[k]>1?' '+cnt[k]:'')}});
 const sec=sv.phaseSeconds||300;await updateDoc(rr(),{status:'playing',caseId:c.id,players:pl,bots,phase:'investigation',sec,phaseEnd:Date.now()+sec*1000,chat:botSay('investigation',c,bots),votes:{}})}
async function next(){const r=S.room;if(r.phase==='verdict')return finish();const p=PHS[PHS.findIndex(x=>x[0]===r.phase)+1][0];
 await updateDoc(rr(),{phase:p,phaseEnd:Date.now()+r.sec*1000,chat:arrayUnion(...botSay(p,cs(),r.bots||[]))})}
async function finish(){const r=S.room,c=cs();let g=0,i=0;Object.values(r.votes||{}).forEach(x=>x==='g'?g++:i++);
 (r.bots||[]).forEach(b=>{if(b.roleKey!=='accused')Math.random()*100<(c.innocencePct??50)?i++:g++});await updateDoc(rr(),{status:'done',result:{g,i,guilty:g>i}})}
const say=async t=>{t=(t||'').trim();if(!t)return;const p=S.room.players[pk]||{};await updateDoc(rr(),{chat:arrayUnion({k:pk,n:p.label||'—',t:t.slice(0,400),ts:Date.now()})})};
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a],[data-tab]');if(!b)return;const d=b.dataset,a=d.a;if(d.tab){S.tab=d.tab;return render()}
 try{if(a==='join')await join(d.id);else if(a==='pick')await updateDoc(rr(),{[`players.${pk}.pick`]:d.k});else if(a==='start')await start();else if(a==='leave')await leave();else if(a==='next')await next();
 else if(a==='send'){const i=$('#ci');await say(i.value);i.value=''}else if(a==='say')await say(d.t);else if(a==='vote')await updateDoc(rr(),{[`votes.${pk}`]:d.k})}
 catch(er){toast(er.code==='permission-denied'?'لا توجد صلاحية — أضف قاعدة Firestore للمجموعة crime_rooms':(er.message||er))}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ci')$('[data-a=send]').click()});
setInterval(()=>{const r=S.room;if(!r||r.status!=='playing')return;const l=Math.max(0,Math.round((r.phaseEnd-Date.now())/1000)),t=$('#tm');if(t)t.textContent=fmt(l);
 if(r.host!==pk||S.busy)return;const el=Object.values(r.players).filter(p=>p.roleKey!=='accused').length;
 if(l<=0||(r.phase==='verdict'&&el&&Object.keys(r.votes||{}).length>=el)){S.busy=1;next().catch(()=>{}).finally(()=>S.busy=0)}},1000);
onSnapshot(collection(db,'crime_cases'),s=>{S.cases=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>toast('تعذر تحميل القضايا'));
onSnapshot(collection(db,'crime_servers'),s=>{S.servers=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
getDoc(doc(db,'crime_settings','roles')).then(r=>{if(r.exists()&&Array.isArray(r.data().items)){const m=new Map(r.data().items.map(x=>[x.key,x]));S.roles=ROLES.map(x=>({...x,...(m.get(x.key)||{})}));render()}}).catch(()=>{});
const old=ss.getItem('crime_rid');if(old)enter(old);render();
</script></body></html>
