function vDone(){const r=S.room,c=cs();if(!c)return '';const a=ch(c.accusedId),k=ch(c.killerId),truth=c.accusedId===c.killerId,R=r.result,ok=R.guilty===truth;

const visDocs=r=>{const c=cs(),p=r.players?.[pk]||{},pi=PHS.findIndex(x=>x[0]===r.phase);return [...(c?.documents||[]),...(r.extraDocs||[])].filter(d=>(PHI[d.phase||'all']??0)<=pi&&(!(d.visibleTo||[]).length||d.visibleTo.includes(p.roleKey)))};

function enter(id){ss.setItem('crime_rid',id);unsub&&unsub();unm&&unm();S.msgs=[];S.mf=0;unm=onSnapshot(collection(db,'crime_rooms',id,'messages'),q=>{if(S.mf)q.docChanges().forEach(c=>{if(c.type==='added'){const m=c.doc.data();if((!m.to||m.to===pk)&&m.k!==pk)(m.kind==='event'?knock:bell)()}});S.mf=1;S.msgs=q.docs.map(d=>d.data());render()},()=>{});unsub=onSnapshot(doc(db,'crime_rooms',id),s=>{if(!s.exists())return out();S.room={id:s.id,...s.data()};{const h=S.room.hearing;if(h?.on&&h.to===pk&&S.hid!==h.id){S.hid=h.id;S.dm=h.by;S.tab='chat';toast('🔔 تم استدعاؤك إلى غرفة التحقيق')}}if(S.room.status==='waiting'&&!S.room.players[pk])return out();render()})}

async function join(sid,rid){const sv=S.servers.find(x=>x.id===sid);if(!sv)return;let id=null;
 if(sv.mode!=='ai')id=rid||S.wait.find(x=>x.serverId===sid&&!x.private&&Object.keys(x.players||{}).length<sv.maxPlayers)?.id||null;

  await updateDoc(doc(db,'crime_rooms',id),up)}
 else{id=uid();await setDoc(doc(db,'crime_rooms',id),{serverId:sid,host:pk,status:'waiting',phase:'lobby',players:{},chat:[],votes:{},createdAt:Date.now(),joinedAt:Date.now()});await updateDoc(doc(db,'crime_rooms',id),{['players.'+pk]:{pick:'',real,ready:false}})}

async function leave(){log('leave','');const r=S.room;if(r&&r.status==='waiting'){const o=Object.keys(r.players).filter(k=>k!==pk);if(!o.length)await deleteDoc(rr());else await updateDoc(rr(),{['players.'+pk]:deleteField(),...(r.host===pk?{host:o[0]}:{})})}out()}
function botSay(p,c,bots){const a=c.characters.find(x=>x.id===c.accusedId)||{},v=c.victim||{};
 const B={investigation:['officer',`تلقّينا بلاغًا بواقعة (${c.crimeType}) بحق ${v.name} في ${c.location}. جرت المعاينة وضُبط ${a.name} للتحقيق.`],prosecution:['prosecutor',`أتهم ${a.name} بجريمة ${c.crimeType}، وأطلب من عدالة المحكمة أقصى العقوبة.`],defense:['lawyer',`موكلي ${a.name} ينكر، وأتمسك بأقواله: «${(a.statement||'').slice(0,120)}»`],trial:['judge','الجلسة منعقدة. اعرضوا ما لديكم قبل أن ننطق بالحكم.'],verdict:['judge','المحكمة تطلب التصويت: مذنب أم بريء؟']}[p],now=Date.now();
 const out=[{k:'sys',n:'المحكمة',t:'بدأت مرحلة '+PHS.find(x=>x[0]===p)[1],ts:now}],b=bots.find(x=>x.roleKey===B[0]);if(b)out.push({k:b.k,n:b.label,t:B[1],ts:now+1});return out}
async function start(force){const r=S.room,sv=srv();if(r.status!=='waiting')return;const act=S.cases.filter(x=>x.active&&(x.characters||[]).length>=2);if(!act.length)return toast('لا توجد قضايا مفعّلة');
 const seen=lastCases(),fresh=act.filter(x=>!seen.includes(x.id)),c0=sh(fresh.length?fresh:act)[0],T=draw(c0),c={...c0,...T};noteCase(c0.id);
 const en=S.roles.filter(x=>x.enabled),ids=Object.keys(r.players),P={},used={},acc=c.characters.find(x=>x.id===c.accusedId)||{};
 ids.forEach(i=>{const k=r.players[i].pick;if(k&&sv.roleAssign!=='random'&&k!=='accused'&&(k==='witness'||!used[k])){P[i]=k;used[k]=1}});
 const un=sh(ids.filter(i=>!P[i]));if(en.some(x=>x.key==='accused')&&un.length){P[un.shift()]='accused';used.accused=1}
 const free=sh(en.filter(x=>!['witness','accused'].includes(x.key)&&!used[x.key]).map(x=>x.key));un.forEach(i=>{const k=free.shift()||'witness';P[i]=k;used[k]=1});
 const bots=(sv.fillBots||sv.mode==='ai'||r.private||force)?en.filter(x=>x.key!=='witness'&&!used[x.key]).map(x=>({k:'b_'+x.key,roleKey:x.key,label:x.name+(x.key==='accused'?' — '+acc.name:'')})):[];
 const pool=sh(c.characters.filter(x=>x.id!==c.accusedId)),cnt={},pl={};
 ids.forEach(i=>{const k=P[i],ca=k==='accused'?acc:k==='witness'?pool.shift():null;cnt[k]=(cnt[k]||0)+1;pl[i]={...r.players[i],roleKey:k,charId:ca?.id||'',label:(en.find(x=>x.key===k)||{name:k}).name+(ca?' — '+ca.name:cnt[k]>1?' '+cnt[k]:'')}});
 const plan=fbPlan(c),sec=sv.phaseSeconds||300;await updateDoc(rr(),{status:'playing',caseId:c.id,accusedId:T.accusedId,killerId:T.killerId,innocencePct:T.innocencePct,players:pl,bots,phase:'investigation',sec,phaseEnd:Date.now()+sec*1000,chat:botSay('investigation',c,bots),votes:{},plan,fired:{}});bgPlan(c,r.id);if(!r.private)ensureRoom(r.serverId,r.id).catch(()=>{});const ap=ids.find(i=>P[i]==='accused'),n=Date.now(),mc=doc(db,'crime_rooms',r.id,'messages',uid()),mp=doc(db,'crime_rooms',r.id,'messages',uid());await setDoc(mc,{k:'sys',n:'المحكمة',t:`فجر اليوم داهمت قوة من الشرطة منزل ${acc.name} واقتادته إلى القسم بتهمة ${c.crimeType}.`,to:null,kind:'sys',ts:n});if(ap)await setDoc(mp,{k:'sys',n:'مصدر مجهول',t:'الساعة الثالثة فجرًا: طرق عنيف على بابك… أفراد الشرطة يقتادونك مكبّلًا وأنت تقول إنك بريء. تذكّر: أي محاولة هروب قد يُطلق عليها النار.',to:ap,kind:'hint',ts:n+1})}
async function next(){const r=S.room;if(r.phase==='verdict')return finish();const p=PHS[PHS.findIndex(x=>x[0]===r.phase)+1][0];
 await updateDoc(rr(),{phase:p,phaseEnd:Date.now()+r.sec*1000,chat:arrayUnion(...botSay(p,cs(),r.bots||[]))})}
async function finish(){const r=S.room,c=cs();let g=0,i=0;Object.values(r.votes||{}).forEach(x=>x==='g'?g++:i++);
 (r.bots||[]).forEach(b=>{if(b.roleKey!=='accused')Math.random()*100<(c.innocencePct??50)-(r.escaped?30:0)?i++:g++});await updateDoc(rr(),{status:'done',result:{g,i,guilty:g>i}})}

const BR=['هذا كلام لا يليق، وسأسجّله في المحضر.','أنت تعرّض نفسك للمساءلة، لا تكرر هذا.','سأنظر في الأمر… لكن لا تعد إلى هذا ثانية.'];
const say=async t=>{t=(t||'').trim();if(!t)return;const r=S.room,p=r.players[pk]||{},to=S.dm||null;if(r.muted?.[pk])return toast('كتمتك الإدارة عن الكلام');
 await setDoc(doc(db,'crime_rooms',r.id,'messages',uid()),{k:pk,n:p.label||'—',t:t.slice(0,400),to,kind:to?'dm':'chat',ts:Date.now()});log('msg',(to?'[خاص إلى '+nmOf(r,to)+'] ':'')+t);
