 <div class="chips">${(SAY[p.roleKey]||[]).map(s=>`<button class="btn sm" data-a="say" data-t="${esc(s)}">${esc(s)}</button>`).join('')}</div>${sumUI(r,p)}${acc&&!r.escaped?'<button class="btn sm d" data-a="run" style="margin-bottom:8px"><i class="fas fa-person-running"></i> حاول الهروب</button>':''}${dmSel(r)}<div style="display:flex;gap:6px"><input id="ci" placeholder="تكلّم بصفتك ${esc(ro.name)}…" autocomplete="off"><button class="btn p" data-a="send"><i class="fas fa-paper-plane"></i></button></div></div>`;
 return `<div class="ph"><i class="fas fa-gavel"></i><b>مرحلة ${PHS[pi][1]}</b><span id="tm"></span>${c.audio?.[r.phase]?'<button class="btn sm" data-a="aud" title="إعادة تشغيل صوت المرحلة"><i class="fas fa-headphones"></i></button>':''}${r.host===pk?'<button class="btn sm" data-a="next">التالي</button>':''}</div>
 <div class="tabs">${[['file','الملف'],['docs','الأوراق'],['chat','الجلسة']].map(([k,n])=>`<button class="tab ${t===k?'on':''}" data-tab="${k}">${n}</button>`).join('')}</div>${body}`}
function vDone(){const r=S.room,c=cs();if(!c)return '';const a=ch(c.accusedId),k=ch(c.killerId),truth=c.accusedId===c.killerId,R=r.result,ok=R.guilty===truth;
 return `<div class="sec"><h3><i class="fas fa-gavel"></i> نطقت المحكمة</h3><p class="sub">حكمت المحكمة ${R.guilty?'بإدانة':'ببراءة'} <b>${esc(a?.name)}</b> (${R.g} مذنب / ${R.i} بريء).</p>
 <div class="note">الحقيقة: القاتل هو <b>${esc(k?.name)}</b>، و${truth?'المتهم هو القاتل فعلًا':'المتهم كان بريئًا'}. ${ok?'⚖️ تحققت العدالة.':'❌ أخطأت المحكمة.'}<br>قوة أوراق البراءة في القضية: ${esc(c.innocencePct)}%${r.escaped?'<br>⚠️ حاول المتهم الهروب، وأضرّ ذلك بموقفه.':''}</div>
 <div class="chips">${Object.values(r.players).map(x=>`<span class="chip">${esc(x.label)} ← ${esc(x.real)}</span>`).join('')}</div><div class="acts"><button class="btn p" data-a="leave">قضية جديدة</button></div></div>`}
function render(){const v=$('#ci')?.value||'',f=document.activeElement?.id==='ci',fcv=$('#fc')?.value||'',ff=document.activeElement?.id==='fc',fsv=$('#fsv')?.value,r=S.room;if(r&&r.phase!==S.lp){const nf=S.lp;S.lp&&r.status==='playing'&&gavel();S.lp=r.phase;if(r.status==='playing')setTimeout(()=>playPhase(S.room),nf?700:0)}
 if(r?.status==='done'&&!AUD.a.paused)stopAud();
 $('#v').innerHTML=!r?vLobby():r.status==='waiting'?vWait():r.status==='done'?vDone():vGame();
 const i=$('#ci');if(i){i.value=v;if(f)i.focus()}const fi=$('#fc');if(fi){fi.value=fcv;if(ff)fi.focus()}const fs=$('#fsv');if(fs&&fsv)fs.value=fsv;const m=$('#ms');if(m)m.scrollTop=m.scrollHeight}

/* ===== المنطق ===== */
let unsub,unm;
function enter(id){ss.setItem('crime_rid',id);unsub&&unsub();unm&&unm();S.msgs=[];S.mf=0;unm=onSnapshot(collection(db,'crime_rooms',id,'messages'),q=>{if(S.mf)q.docChanges().forEach(c=>{if(c.type==='added'){const m=c.doc.data();if((!m.to||m.to===pk)&&m.k!==pk)(m.kind==='event'?knock:bell)()}});S.mf=1;S.msgs=q.docs.map(d=>d.data());render()},()=>{});unsub=onSnapshot(doc(db,'crime_rooms',id),s=>{if(!s.exists())return out();S.room={id:s.id,...s.data()};{const h=S.room.hearing;if(h?.on&&h.to===pk&&S.hid!==h.id){S.hid=h.id;S.dm=h.by;S.tab='chat';toast('🔔 تم استدعاؤك إلى غرفة التحقيق')}}if(S.room.status==='waiting'&&!S.room.players[pk])return out();render()})}
function out(){unsub&&unsub();unm&&unm();stopAud();S.lp=null;S.room=null;ss.removeItem('crime_rid');render()}
async function join(sid){const sv=S.servers.find(x=>x.id===sid);if(!sv)return;let r=null;
 if(sv.mode!=='ai'){const q=await getDocs(query(collection(db,'crime_rooms'),where('serverId','==',sid),where('status','==','waiting')));r=q.docs.map(d=>({id:d.id,...d.data()})).find(x=>!x.private&&(x.players[pk]||Object.keys(x.players||{}).length<sv.maxPlayers))}
 if(!r){const id=uid();await setDoc(doc(db,'crime_rooms',id),{serverId:sid,host:pk,status:'waiting',phase:'lobby',players:{},chat:[],votes:{},createdAt:Date.now()});r={id}}
 await updateDoc(doc(db,'crime_rooms',r.id),{['players.'+pk]:{pick:'',real}});log('join','');enter(r.id)}
async function leave(){log('leave','');const r=S.room;if(r&&r.status==='waiting'){const o=Object.keys(r.players).filter(k=>k!==pk);if(!o.length)await deleteDoc(rr());else await updateDoc(rr(),{['players.'+pk]:deleteField(),...(r.host===pk?{host:o[0]}:{})})}out()}
function botSay(p,c,bots){const a=c.characters.find(x=>x.id===c.accusedId)||{},v=c.victim||{};
 const B={investigation:['officer',`تلقّينا بلاغًا بوفاة ${v.name} في ${c.location}. جرت المعاينة وضُبط ${a.name} للتحقيق.`],prosecution:['prosecutor',`أتهم ${a.name} بجريمة ${c.crimeType}، وأطلب من عدالة المحكمة أقصى العقوبة.`],defense:['lawyer',`موكلي ${a.name} ينكر، وأتمسك بأقواله: «${(a.statement||'').slice(0,120)}»`],trial:['judge','الجلسة منعقدة. اعرضوا ما لديكم قبل أن ننطق بالحكم.'],verdict:['judge','المحكمة تطلب التصويت: مذنب أم بريء؟']}[p],now=Date.now();
 const out=[{k:'sys',n:'المحكمة',t:'بدأت مرحلة '+PHS.find(x=>x[0]===p)[1],ts:now}],b=bots.find(x=>x.roleKey===B[0]);if(b)out.push({k:b.k,n:b.label,t:B[1],ts:now+1});return out}
async function start(){const r=S.room,sv=srv(),act=S.cases.filter(x=>x.active&&(x.characters||[]).length>=2);if(!act.length)return toast('لا توجد قضايا مفعّلة');
 const seen=lastCases(),fresh=act.filter(x=>!seen.includes(x.id)),c0=sh(fresh.length?fresh:act)[0],T=draw(c0),c={...c0,...T};noteCase(c0.id);
 const en=S.roles.filter(x=>x.enabled),ids=Object.keys(r.players),P={},used={},acc=c.characters.find(x=>x.id===c.accusedId)||{};
 ids.forEach(i=>{const k=r.players[i].pick;if(k&&sv.roleAssign!=='random'&&k!=='accused'&&(k==='witness'||!used[k])){P[i]=k;used[k]=1}});
 const un=sh(ids.filter(i=>!P[i]));if(en.some(x=>x.key==='accused')&&un.length){P[un.shift()]='accused';used.accused=1}
 const free=sh(en.filter(x=>!['witness','accused'].includes(x.key)&&!used[x.key]).map(x=>x.key));un.forEach(i=>{const k=free.shift()||'witness';P[i]=k;used[k]=1});
 const bots=(sv.fillBots||sv.mode==='ai'||r.private)?en.filter(x=>x.key!=='witness'&&!used[x.key]).map(x=>({k:'b_'+x.key,roleKey:x.key,label:x.name+(x.key==='accused'?' — '+acc.name:'')})):[];
 const pool=sh(c.characters.filter(x=>x.id!==c.accusedId)),cnt={},pl={};
 ids.forEach(i=>{const k=P[i],ca=k==='accused'?acc:k==='witness'?pool.shift():null;cnt[k]=(cnt[k]||0)+1;pl[i]={...r.players[i],roleKey:k,charId:ca?.id||'',label:(en.find(x=>x.key===k)||{name:k}).name+(ca?' — '+ca.name:cnt[k]>1?' '+cnt[k]:'')}});
 const plan=await mkPlan(c),sec=sv.phaseSeconds||300;await updateDoc(rr(),{status:'playing',caseId:c.id,accusedId:T.accusedId,killerId:T.killerId,innocencePct:T.innocencePct,players:pl,bots,phase:'investigation',sec,phaseEnd:Date.now()+sec*1000,chat:botSay('investigation',c,bots),votes:{},plan,fired:{}});const ap=ids.find(i=>P[i]==='accused'),n=Date.now(),mc=doc(db,'crime_rooms',r.id,'messages',uid()),mp=doc(db,'crime_rooms',r.id,'messages',uid());await setDoc(mc,{k:'sys',n:'المحكمة',t:`فجر اليوم داهمت قوة من الشرطة منزل ${acc.name} واقتادته إلى القسم بتهمة ${c.crimeType}.`,to:null,kind:'sys',ts:n});if(ap)await setDoc(mp,{k:'sys',n:'مصدر مجهول',t:'الساعة الثالثة فجرًا: طرق عنيف على بابك… أفراد الشرطة يقتادونك مكبّلًا وأنت تقول إنك بريء. تذكّر: أي محاولة هروب قد يُطلق عليها النار.',to:ap,kind:'hint',ts:n+1})}
async function next(){const r=S.room;if(r.phase==='verdict')return finish();const p=PHS[PHS.findIndex(x=>x[0]===r.phase)+1][0];
 await updateDoc(rr(),{phase:p,phaseEnd:Date.now()+r.sec*1000,chat:arrayUnion(...botSay(p,cs(),r.bots||[]))})}
async function finish(){const r=S.room,c=cs();let g=0,i=0;Object.values(r.votes||{}).forEach(x=>x==='g'?g++:i++);
 (r.bots||[]).forEach(b=>{if(b.roleKey!=='accused')Math.random()*100<(c.innocencePct??50)-(r.escaped?30:0)?i++:g++});await updateDoc(rr(),{status:'done',result:{g,i,guilty:g>i}})}
const log=(type,text)=>{const p=S.room?.players?.[pk]||{};setDoc(doc(db,'crime_logs',uid()),{ts:Date.now(),k:pk,real,label:p.label||'',type,text:String(text||'').slice(0,200)}).catch(()=>{})};
const nmOf=(r,k)=>r.players?.[k]?.label||(r.bots||[]).find(b=>b.k===k)?.label||'—';
function feed(r){return [...(r.chat||[]),...S.msgs].filter(m=>!m.to||m.to===pk||m.k===pk).sort((a,b)=>(a.ts||0)-(b.ts||0)).slice(-100).map(m=>`<div class="m ${m.k===pk?'me':m.k==='sys'?'sys':''}"><b>${m.to?'🔒 خاص — ':''}${esc(m.n)}${m.to&&m.to!==pk?' ← '+esc(nmOf(r,m.to)):''}</b>${esc(m.t)}</div>`).join('')}
function dmSel(r){const o=[...Object.entries(r.players).filter(([k])=>k!==pk).map(([k,x])=>[k,x.label]),...(r.bots||[]).map(b=>[b.k,b.label])];return `<select id="cto" style="width:100%;margin-bottom:6px;padding:8px;border-radius:10px;border:2px solid var(--border);background:var(--bg-input);color:var(--text-main);font:600 13px Cairo"><option value="">الكلام للجميع في القاعة</option>${o.map(([k,l])=>`<option value="${esc(k)}" ${S.dm===k?'selected':''}>رسالة خاصة إلى ${esc(l)}</option>`).join('')}</select>`}
const BR=['هذا كلام لا يليق، وسأسجّله في المحضر.','أنت تعرّض نفسك للمساءلة، لا تكرر هذا.','سأنظر في الأمر… لكن لا تعد إلى هذا ثانية.'];
const say=async t=>{t=(t||'').trim();if(!t)return;const r=S.room,p=r.players[pk]||{},to=S.dm||null;if(r.muted?.[pk])return toast('كتمتك الإدارة عن الكلام');
 await setDoc(doc(db,'crime_rooms',r.id,'messages',uid()),{k:pk,n:p.label||'—',t:t.slice(0,400),to,kind:to?'dm':'chat',ts:Date.now()});log('msg',(to?'[خاص إلى '+nmOf(r,to)+'] ':'')+t);
 const b=to&&(r.bots||[]).find(x=>x.k===to);if(to&&(to.startsWith('n_')||to==='b_accused'))npcSay(r,to,t);else if(b)setTimeout(()=>setDoc(doc(db,'crime_rooms',r.id,'messages',uid()),{k:b.k,n:b.label,t:BR[Math.random()*BR.length|0],to:pk,kind:'dm',ts:Date.now()}),2500)};
async function run(){const r=S.room;if(r.escaped)return;await updateDoc(rr(),{escaped:true});const p=r.players[pk]||{};log('msg','محاولة هروب');await setDoc(doc(db,'crime_rooms',r.id,'messages',uid()),{k:'sys',n:'المحكمة',t:`حاول ${p.label} الفرار من القسم، فأطلق الحرس النار وأُعيد القبض عليه — وسيُحتسب ذلك قرينة ضده.`,to:null,kind:'sys',ts:Date.now()})}
document.addEventListener('change',e=>{if(e.target.id==='cto')S.dm=e.target.value;if(e.target.id==='smn')S.sm=e.target.value});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-a],[data-tab]');if(!b)return;const d=b.dataset,a=d.a;if(d.tab){S.tab=d.tab;if(d.tab==='docs')log('doc','فتح الأوراق');return render()}
 try{if(a==='join')await join(d.id);else if(a==='pick'){await updateDoc(rr(),{[`players.${pk}.pick`]:d.k});log('pick',d.k)}else if(a==='start')await start();else if(a==='leave')await leave();else if(a==='next')await next();
 else if(a==='send'){const i=$('#ci');await say(i.value);i.value=''}else if(a==='say')await say(d.t);else if(a==='vote'){await updateDoc(rr(),{[`votes.${pk}`]:d.k});log('vote',d.k==='g'?'مذنب':'بريء')}else if(a==='run')await run();else if(a==='summon')await summon();else if(a==='endh')await endh();else if(a==='aud')await playPhase(S.room,true);else if(a==='invite')await invite();else if(a==='accept')await accept(d.id);else if(a==='decline')await decline(d.id)}
 catch(er){toast(er.code==='permission-denied'?'لا توجد صلاحية — أضف قاعدة Firestore للمجموعة crime_rooms':(er.message||er))}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ci')$('[data-a=send]').click()});
setInterval(()=>{const r=S.room;if(!r||r.status!=='playing')return;const l=Math.max(0,Math.round((r.phaseEnd-Date.now())/1000)),t=$('#tm');if(t)t.textContent=fmt(l);
 if(r.host!==pk||S.busy)return;const el=Object.values(r.players).filter(p=>p.roleKey!=='accused').length;if(l>0&&r.plan&&!(r.fired||{})[r.phase]&&l<=(r.sec||300)/2&&r.phase!=='verdict'){S.busy=1;fire(r).catch(()=>{}).finally(()=>S.busy=0);return}
 if(l<=0||(r.phase==='verdict'&&el&&Object.keys(r.votes||{}).length>=el)){S.busy=1;next().catch(()=>{}).finally(()=>S.busy=0)}},1000);
onSnapshot(collection(db,'crime_cases'),s=>{S.cases=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>toast('تعذر تحميل القضايا'));
onSnapshot(collection(db,'crime_servers'),s=>{S.servers=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{});
getDoc(doc(db,'crime_settings','roles')).then(r=>{if(r.exists()&&Array.isArray(r.data().items)){const m=new Map(r.data().items.map(x=>[x.key,x]));S.roles=ROLES.map(x=>({...x,...(m.get(x.key)||{})}));render()}}).catch(()=>{});
