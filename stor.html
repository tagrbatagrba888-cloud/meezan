<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B3D2E">
<title>المتجر والمحفظة | MEEZAN</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/ymXPqr46/file-00000000af0c820aa687a3c3181a6a24.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --primary:#0B3D2E; --primary-light:#145A43; --accent:#C9A961; --accent-light:#E0C888;
    --bg-page:#F5F1E8; --bg-card:#FFFFFF; --bg-input:#F8FBF9; --text-main:#0B3D2E; --text-sub:#5A6B66; --border:#E0E5E1;
    --shadow:rgba(11,61,46,.15); --error:#C0392B; --success:#1E7A5A; --warning:#E67E22; --info:#2980B9;
    --grad:linear-gradient(135deg,#0B3D2E 0%,#145A43 55%,#1E7A5A 100%); --grad-gold:linear-gradient(135deg,#C9A961,#E0C888);
  }
  [data-theme="dark"] {
    --primary:#C9A961; --primary-light:#E0C888; --accent:#C9A961;
    --bg-page:#0A1612; --bg-card:#11201B; --bg-input:#1A2C25; --text-main:#F5F1E8; --text-sub:#9BAEA6; --border:#1E3A31;
    --shadow:rgba(0,0,0,.5); --error:#E74C3C; --success:#2ECC71; --warning:#F39C12; --info:#3498DB;
    --grad:linear-gradient(135deg,#11201B 0%,#173128 55%,#1E3A31 100%);
  }
  html { scroll-behavior:smooth; }
  body { font-family:'Cairo',sans-serif; background:var(--bg-page); color:var(--text-main); min-height:100vh; padding-bottom:calc(86px + env(safe-area-inset-bottom)); transition:background .3s; }
  button { font-family:inherit; cursor:pointer; border:none; }
  input,select,textarea { font-family:inherit; }

  .header { background:var(--grad); color:#fff; position:sticky; top:0; z-index:50; border-bottom:3px solid var(--accent); box-shadow:0 6px 22px var(--shadow); padding-top:env(safe-area-inset-top); }
  .header-in { max-width:900px; margin:0 auto; padding:11px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .hl { display:flex; align-items:center; gap:10px; min-width:0; }
  .ibtn { width:40px; height:40px; border-radius:12px; background:rgba(255,255,255,.14); color:#fff; display:flex; align-items:center; justify-content:center; text-decoration:none; font-size:15px; flex-shrink:0; transition:.2s; }
  .ibtn:active { background:var(--accent); color:var(--primary); }
  .ttl h1 { font-size:17px; font-weight:900; line-height:1.2; } .ttl small { font-size:10px; letter-spacing:2px; opacity:.7; font-weight:700; }

  .wrap { max-width:900px; margin:0 auto; padding:14px; }
  .tab { display:none; animation:up .3s ease; } .tab.on { display:block; }
  @keyframes up { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

  /* Hero wallet */
  .hero { background:var(--grad); color:#fff; border-radius:24px; padding:22px 20px; border:2px solid var(--accent); position:relative; overflow:hidden; box-shadow:0 14px 36px var(--shadow); }
  .hero::before { content:''; position:absolute; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle,rgba(201,169,97,.38),transparent 70%); top:-130px; left:-90px; }
  .hero > * { position:relative; z-index:1; }
  .hero small { opacity:.78; font-weight:700; font-size:12px; }
  .bal { font-size:40px; font-weight:900; color:var(--accent-light); line-height:1.25; margin:2px 0 4px; }
  .bal span { font-size:16px; color:#fff; opacity:.85; margin-right:6px; }
  .hero-name { font-size:13px; font-weight:800; opacity:.9; display:flex; align-items:center; gap:8px; }
  .acts { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
  .abtn { padding:13px 10px; border-radius:15px; font-weight:900; font-size:14px; display:flex; align-items:center; justify-content:center; gap:8px; transition:.2s; }
  .abtn:active { transform:scale(.97); }
  .abtn.dep { background:var(--grad-gold); color:#0B3D2E; } .abtn.wd { background:rgba(255,255,255,.14); color:#fff; border:1.5px solid rgba(255,255,255,.3); }

  .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin:14px 0; }
  .stat { background:var(--bg-card); border:2px solid var(--border); border-radius:16px; padding:12px 8px; text-align:center; }
  .stat i { font-size:16px; color:var(--accent); margin-bottom:5px; } .stat b { display:block; font-size:15px; font-weight:900; } .stat small { font-size:10.5px; color:var(--text-sub); font-weight:700; }

  .sec-h { display:flex; align-items:center; justify-content:space-between; margin:18px 2px 10px; }
  .sec-h h3 { font-size:15px; font-weight:900; display:flex; align-items:center; gap:8px; } .sec-h h3 i { color:var(--accent); }
  .link { background:none; color:var(--text-sub); font-weight:800; font-size:12px; }
  .panel { background:var(--bg-card); border:2px solid var(--border); border-radius:20px; padding:6px 14px; }
  .row { display:flex; align-items:center; gap:11px; padding:12px 0; border-bottom:1px dashed var(--border); }
  .row:last-child { border-bottom:none; }
  .ric { width:40px; height:40px; border-radius:13px; display:flex; align-items:center; justify-content:center; font-size:15px; color:#fff; flex-shrink:0; }
  .ric.cr { background:var(--success); } .ric.db { background:var(--warning); } .ric.gift { background:var(--grad-gold); color:#0B3D2E; }
  .rm { flex:1; min-width:0; } .rm b { display:block; font-size:13px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .rm small { font-size:11px; color:var(--text-sub); font-weight:600; }
  .amt { font-weight:900; font-size:14px; white-space:nowrap; } .amt.p { color:var(--success); } .amt.n { color:var(--error); }
  .empty { text-align:center; padding:34px 16px; color:var(--text-sub); font-weight:700; font-size:13px; } .empty i { display:block; font-size:34px; opacity:.4; margin-bottom:8px; }

  .chips { display:flex; gap:8px; overflow-x:auto; padding:2px 0 10px; scrollbar-width:none; } .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; padding:8px 15px; border-radius:12px; background:var(--bg-card); border:2px solid var(--border); color:var(--text-sub); font-weight:800; font-size:12.5px; }
  .chip.on { background:var(--primary); color:#fff; border-color:var(--primary); } [data-theme="dark"] .chip.on { color:#0A1612; }
  .search { width:100%; padding:12px 14px; border-radius:14px; border:2px solid var(--border); background:var(--bg-card); color:var(--text-main); font-size:14px; font-weight:600; outline:none; margin-bottom:10px; }
  .search:focus,.inp:focus { border-color:var(--accent); box-shadow:0 0 0 4px rgba(201,169,97,.18); }

  /* Products */
  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; }
  @media (min-width:640px){ .grid { grid-template-columns:repeat(3,1fr); } }
  .pc { background:var(--bg-card); border:2px solid var(--border); border-radius:20px; overflow:hidden; display:flex; flex-direction:column; transition:.2s; }
  .pc:active { transform:scale(.98); }
  .pimg { aspect-ratio:1/.85; background:var(--bg-input); display:flex; align-items:center; justify-content:center; font-size:34px; color:var(--text-sub); position:relative; overflow:hidden; }
  .pimg img { width:100%; height:100%; object-fit:cover; }
  .pimg .tg { position:absolute; top:8px; right:8px; }
  .pb { padding:11px; display:flex; flex-direction:column; gap:4px; flex:1; }
.sent-body {
    font-size: 13px;
    color: var(--text-sub);
    margin-top: 3px;
    display: -webkit-box;
    line-clamp: 2;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
}  .pp { font-size:17px; font-weight:900; color:var(--success); margin-top:auto; padding-top:4px; }
  .tag { font-size:10.5px; font-weight:800; padding:3px 9px; border-radius:20px; background:var(--bg-card); border:1px solid var(--border); color:var(--text-sub); display:inline-flex; align-items:center; gap:4px; }
  .tag.ok { background:rgba(30,122,90,.14); color:var(--success); border-color:rgba(30,122,90,.4); } .tag.bad { background:rgba(192,57,43,.12); color:var(--error); border-color:rgba(192,57,43,.35); } .tag.wait { background:rgba(230,126,34,.13); color:var(--warning); border-color:rgba(230,126,34,.4); }

  .btn { padding:12px 16px; border-radius:14px; font-weight:900; font-size:13.5px; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.2s; border:2px solid transparent; }
  .btn:disabled { opacity:.55; cursor:not-allowed; } .btn:active:not(:disabled) { transform:scale(.97); }
  .btn-p { background:var(--grad); color:#fff; } [data-theme="dark"] .btn-p { color:var(--text-main); }
  .btn-g { background:var(--grad-gold); color:#0B3D2E; } .btn-o { background:transparent; color:var(--text-main); border-color:var(--border); }
  .btn-b { width:100%; } .btn-s { padding:9px 12px; font-size:12px; border-radius:11px; }

  /* Request cards */
  .rq { background:var(--bg-card); border:2px solid var(--border); border-radius:18px; padding:14px; margin-bottom:10px; }
  .rq-top { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:8px; }
  .note { background:rgba(201,169,97,.13); border-right:4px solid var(--accent); border-radius:10px; padding:8px 11px; font-size:12px; font-weight:600; margin-top:8px; }

  /* Bottom nav */
  .nav { position:fixed; bottom:0; left:0; right:0; z-index:60; background:var(--bg-card); border-top:2px solid var(--border); display:flex; padding:6px 6px calc(6px + env(safe-area-inset-bottom)); box-shadow:0 -8px 24px var(--shadow); }
  .nav button { flex:1; background:none; color:var(--text-sub); padding:7px 2px; border-radius:14px; font-weight:800; font-size:11px; display:flex; flex-direction:column; align-items:center; gap:3px; position:relative; }
  .nav button i { font-size:18px; } .nav button.on { color:var(--primary); background:rgba(201,169,97,.16); }
  .dot { position:absolute; top:3px; right:calc(50% - 20px); min-width:17px; height:17px; border-radius:9px; background:var(--error); color:#fff; font-size:10px; display:none; align-items:center; justify-content:center; padding:0 4px; }

  /* Modal (bottom sheet) */
  .modal { position:fixed; inset:0; background:rgba(5,15,11,.6); backdrop-filter:blur(5px); z-index:100; display:none; align-items:flex-end; justify-content:center; }
  .modal.show { display:flex; animation:fade .2s; } @keyframes fade { from{opacity:0} }
  .sheet { background:var(--bg-card); width:100%; max-width:560px; max-height:92vh; overflow-y:auto; border-radius:26px 26px 0 0; border:2px solid var(--accent); border-bottom:none; animation:sl .3s cubic-bezier(.2,.9,.3,1); padding-bottom:env(safe-area-inset-bottom); }
  @keyframes sl { from{transform:translateY(60px);opacity:0} }
  @media (min-width:640px){ .modal { align-items:center; } .sheet { border-radius:26px; border-bottom:2px solid var(--accent); } }
  .sh-head { padding:16px 18px; background:var(--grad); color:#fff; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:2; }
  .sh-head h3 { font-size:15.5px; font-weight:900; display:flex; gap:9px; align-items:center; } .sh-head h3 i { color:var(--accent); }
  .sh-x { width:34px; height:34px; border-radius:10px; background:rgba(255,255,255,.15); color:#fff; }
  .sh-body { padding:16px 18px; } .sh-foot { padding:0 18px 18px; display:flex; gap:10px; } .sh-foot .btn { flex:1; }
  .field { margin-bottom:13px; } .field label { display:block; font-size:12px; font-weight:800; color:var(--text-sub); margin-bottom:6px; }
  .inp { width:100%; padding:12px 14px; border-radius:13px; border:2px solid var(--border); background:var(--bg-input); color:var(--text-main); font-size:15px; font-weight:700; outline:none; transition:.2s; }
  .hint { background:rgba(41,128,185,.1); border:1px solid rgba(41,128,185,.3); color:var(--info); border-radius:12px; padding:9px 12px; font-size:12px; font-weight:700; margin-bottom:13px; line-height:1.7; }
  .err { background:rgba(192,57,43,.1); color:var(--error); border:1px solid rgba(192,57,43,.35); padding:10px 12px; border-radius:12px; font-size:12.5px; font-weight:700; margin-bottom:12px; display:none; }
  .sum { background:var(--bg-input); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:13px; }
  .sum div { display:flex; justify-content:space-between; font-size:13px; font-weight:700; padding:4px 0; } .sum span { color:var(--text-sub); } .sum .tot { border-top:1px dashed var(--border); margin-top:5px; padding-top:9px; font-size:16px; font-weight:900; color:var(--success); }
  .cp { display:flex; gap:8px; } .cp .inp { direction:ltr; text-align:left; text-transform:uppercase; font-family:monospace; letter-spacing:1px; }
  .rcpt { width:100%; max-height:150px; object-fit:cover; border-radius:12px; margin-top:8px; display:none; border:1px solid var(--border); }

  .toast { position:fixed; top:calc(14px + env(safe-area-inset-top)); left:50%; transform:translate(-50%,-120px); z-index:200; background:var(--bg-card); border:2px solid var(--border); border-radius:14px; padding:12px 20px; font-weight:800; font-size:13px; box-shadow:0 12px 36px rgba(0,0,0,.3); display:flex; gap:9px; align-items:center; max-width:92vw; transition:.35s; opacity:0; }
  .toast.show { transform:translate(-50%,0); opacity:1; } .toast.success { border-color:var(--success); } .toast.success i { color:var(--success); } .toast.error { border-color:var(--error); } .toast.error i { color:var(--error); }
  .sk { height:120px; border-radius:20px; background:linear-gradient(90deg,var(--bg-card),var(--bg-input),var(--bg-card)); background-size:200% 100%; animation:sk 1.2s infinite; } @keyframes sk { to{ background-position:-200% 0 } }
</style>
</head>
<body>

<header class="header"><div class="header-in">
  <div class="hl"><a href="index.html" class="ibtn" title="الرئيسية"><i class="fas fa-arrow-right"></i></a>
    <div class="ttl"><h1>المتجر والمحفظة</h1><small>STORE &amp; WALLET</small></div></div>
  <button class="ibtn" id="themeBtn" title="الوضع"><i class="fas fa-moon" id="themeIc"></i></button>
</div></header>

<main class="wrap">
  <!-- المحفظة -->
  <section class="tab on" id="tab-wallet">
    <div class="hero">
      <div class="hero-name"><i class="fas fa-circle-user"></i><span id="uName">—</span></div>
      <small>رصيدك الحالي</small>
      <div class="bal"><span>ج.م</span><b id="balV">0</b></div>
      <div class="acts">
        <button class="abtn dep" id="openDep"><i class="fas fa-arrow-down-long"></i> إيداع</button>
        <button class="abtn wd" id="openWd"><i class="fas fa-arrow-up-long"></i> سحب</button>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><i class="fas fa-gift"></i><b id="stGift">0</b><small>هدايا النجاح</small></div>
      <div class="stat"><i class="fas fa-bag-shopping"></i><b id="stSpent">0</b><small>مشترياتك</small></div>
      <div class="stat"><i class="fas fa-hourglass-half"></i><b id="stPend">0</b><small>طلبات معلّقة</small></div>
    </div>
    <div class="sec-h"><h3><i class="fas fa-clock-rotate-left"></i> آخر المعاملات</h3><button class="link" data-go="tx">عرض الكل <i class="fas fa-chevron-left"></i></button></div>
    <div class="panel" id="lastTx"><div class="sk"></div></div>
  </section>

  <!-- المتجر -->
  <section class="tab" id="tab-shop">
    <input class="search" id="shopQ" placeholder="🔍 ابحث عن منتج...">
    <div class="chips" id="catChips"></div>
    <div class="grid" id="prodGrid"><div class="sk"></div><div class="sk"></div></div>
  </section>

  <!-- الطلبات -->
  <section class="tab" id="tab-req">
    <div class="chips" id="reqChips">
      <button class="chip on" data-s="all">الكل</button><button class="chip" data-s="pending">قيد الانتظار</button><button class="chip" data-s="approved">مقبولة</button><button class="chip" data-s="rejected">مرفوضة</button>
    </div>
    <div id="reqList"></div>
  </section>

  <!-- المعاملات -->
  <section class="tab" id="tab-tx">
    <div class="chips" id="txChips">
      <button class="chip on" data-f="all">الكل</button><button class="chip" data-f="credit">إضافة</button><button class="chip" data-f="debit">خصم</button><button class="chip" data-f="reward">هدايا</button><button class="chip" data-f="purchase">مشتريات</button>
    </div>
    <div class="panel" id="txList"></div>
    <div style="text-align:center;margin:14px 0"><button class="btn btn-o" id="txMore" style="display:none"><i class="fas fa-chevron-down"></i> عرض المزيد</button></div>
  </section>
</main>

<nav class="nav" id="nav">
  <button class="on" data-tab="wallet"><i class="fas fa-wallet"></i>المحفظة</button>
  <button data-tab="shop"><i class="fas fa-store"></i>المتجر</button>
  <button data-tab="req"><i class="fas fa-money-bill-transfer"></i>طلباتي<span class="dot" id="reqDot">0</span></button>
  <button data-tab="tx"><i class="fas fa-receipt"></i>المعاملات</button>
</nav>

<!-- Modal: طلب إيداع/سحب -->
<div class="modal" id="reqModal"><div class="sheet">
  <div class="sh-head"><h3 id="rqTitle"><i class="fas fa-arrow-down-long"></i> إيداع</h3><button class="sh-x" data-close="reqModal"><i class="fas fa-times"></i></button></div>
  <div class="sh-body">
    <div class="err" id="rqErr"></div>
    <div class="hint" id="rqHint"></div>
    <div class="field"><label>المبلغ (ج.م)</label><input class="inp" id="rqAmt" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>
    <div class="field"><label>وسيلة <span id="rqMLbl">التحويل</span></label>
      <select class="inp" id="rqMethod"><option>فودافون كاش</option><option>إنستاباي</option><option>تحويل بنكي</option><option>أخرى</option></select></div>
    <div class="field"><label id="rqDLbl">بيانات التحويل</label><input class="inp" id="rqDet" maxlength="120" placeholder="رقم الهاتف / الحساب"></div>
    <div class="field" id="rqRcWrap"><label>صورة إيصال التحويل</label>
      <button class="btn btn-o btn-b" id="rqPick" type="button"><i class="fas fa-image"></i> اختر صورة</button>
      <input type="file" id="rqFile" accept="image/*" style="display:none"><img class="rcpt" id="rqPrev" alt=""></div>
    <div class="field"><label>ملاحظة (اختياري)</label><input class="inp" id="rqNote" maxlength="200"></div>
  </div>
  <div class="sh-foot"><button class="btn btn-o" data-close="reqModal">إلغاء</button><button class="btn btn-p" id="rqOk"><i class="fas fa-paper-plane"></i> إرسال الطلب</button></div>
</div></div>

<!-- Modal: شراء -->
<div class="modal" id="buyModal"><div class="sheet">
  <div class="sh-head"><h3><i class="fas fa-bag-shopping"></i> إتمام الشراء</h3><button class="sh-x" data-close="buyModal"><i class="fas fa-times"></i></button></div>
  <div class="sh-body">
    <div class="err" id="byErr"></div>
    <div style="font-weight:900;font-size:16px;margin-bottom:12px" id="byName">—</div>
    <div class="field"><label>كود الخصم (اختياري)</label><div class="cp"><input class="inp" id="byCode" maxlength="24" placeholder="MZN-XXXX-XXXX"><button class="btn btn-g" id="byApply" type="button">تطبيق</button></div></div>
    <div class="sum"><div><span>السعر</span><b id="byPrice">0</b></div><div id="byDiscRow" style="display:none"><span>الخصم</span><b id="byDisc" style="color:var(--success)">0</b></div><div><span>رصيدك</span><b id="byBal">0</b></div><div class="tot"><span style="color:inherit">الإجمالي</span><b id="byTot">0</b></div></div>
  </div>
  <div class="sh-foot"><button class="btn btn-o" data-close="buyModal">إلغاء</button><button class="btn btn-p" id="byOk"><i class="fas fa-check"></i> تأكيد الشراء</button></div>
</div></div>

<div class="toast" id="toast"><i class="fas fa-check-circle" id="toastI"></i><span id="toastT"></span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, collection, onSnapshot, setDoc, getDoc, query, where, runTransaction, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const db = getFirestore(initializeApp({
  apiKey: "AIzaSyAmkCOrSaklhUiDdDfZCpSDQNmMYP-Gdw0", authDomain: "qanon-c716d.firebaseapp.com", projectId: "qanon-c716d",
  storageBucket: "qanon-c716d.firebasestorage.app", messagingSenderId: "757756130875", appId: "1:757756130875:web:63c53534c6843e2a29ce1e"
}));
const $ = (id) => document.getElementById(id);

function compress(file, side = 900, q = .72) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej; fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => { const k = Math.min(1, side / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', q)); }; im.src = fr.result; }; fr.readAsDataURL(file); });
}
$('rqFile').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; try { rqImg = await compress(f); $('rqPrev').src = rqImg; $('rqPrev').style.display = 'block'; } catch (er) { toast('تعذّر قراءة الصورة', 'error'); } };

// 🎟️ الشراء + كود الخصم
let bP = null, bCode = '', bDisc = 0;
function calcCoupon(c, p) {
  if (!c) return { err: 'كود الخصم غير موجود' };
  if (c.active === false) return { err: 'هذا الكود متوقف' };
  if (c.expiresAt && new Date(c.expiresAt + 'T23:59:59') < new Date()) return { err: 'انتهت صلاحية الكود' };
  if (c.usageLimit && num(c.usedCount) >= num(c.usageLimit)) return { err: 'تم استنفاد هذا الكود' };
  if (!c.allUsers && !(c.userIds || []).includes(uid)) return { err: 'هذا الكود غير مخصص لك' };
  if (c.usedBy && c.usedBy[uid]) return { err: 'لقد استخدمت هذا الكود من قبل' };
  if (!c.allProducts && !(c.productIds || []).includes(p.id)) return { err: 'الكود لا ينطبق على هذا المنتج' };
  let d = c.type === 'percent' ? num(p.price) * num(c.value) / 100 : num(c.value);
  if (c.type === 'percent' && num(c.maxDiscount) > 0) d = Math.min(d, num(c.maxDiscount));
  return { disc: r2(Math.min(d, num(p.price))) };
}
function buyUI() {
  const tot = r2(Math.max(0, num(bP.price) - bDisc));
  $('byPrice').textContent = money(bP.price); $('byDiscRow').style.display = bDisc ? '' : 'none'; $('byDisc').textContent = '− ' + money(bDisc);
  $('byBal').textContent = money(bal()); $('byTot').textContent = money(tot);
  $('byOk').disabled = false;
}
function openBuy(p) { if (!p) return; bP = p; bCode = ''; bDisc = 0; $('byName').textContent = p.name; $('byCode').value = ''; hideErr('byErr'); buyUI(); openM('buyModal'); }
$('byApply').onclick = async () => {
  hideErr('byErr'); const code = clean($('byCode').value).toUpperCase(); if (!code) { bCode = ''; bDisc = 0; return buyUI(); }
  try { const s = await getDoc(doc(db, 'store_coupons', code)); const r = calcCoupon(s.exists() ? s.data() : null, bP); if (r.err) { bCode = ''; bDisc = 0; buyUI(); return showErr('byErr', r.err); } bCode = code; bDisc = r.disc; buyUI(); toast('تم تطبيق الكود 🎉'); }
  catch (e) { showErr('byErr', 'تعذّر التحقق من الكود'); }
};
$('byOk').onclick = async () => {
  hideErr('byErr'); const btn = $('byOk'); btn.disabled = true;
  const pRef = doc(db, 'store_products', bP.id), wRef = doc(db, 'wallets', uid), cRef = bCode ? doc(db, 'store_coupons', bCode) : null;
  const oRef = doc(db, 'store_orders', newId('ord')), tRef = doc(db, 'wallet_transactions', newId('tx'));
  try {
    let after = 0;
    await runTransaction(db, async (tx) => {
      const [ps, ws, cs] = await Promise.all([tx.get(pRef), tx.get(wRef), cRef ? tx.get(cRef) : Promise.resolve(null)]);
      if (!ps.exists() || ps.data().active === false) throw new Error('المنتج لم يعد متاحاً');
      const p = ps.data(), price = num(p.price);
      if (p.stock != null && num(p.stock) <= 0) throw new Error('نفد هذا المنتج');
      let disc = 0; if (cRef) { const r = calcCoupon(cs.exists() ? cs.data() : null, { ...p, id: bP.id }); if (r.err) throw new Error(r.err); disc = r.disc; }
      const total = r2(Math.max(0, price - disc)), cur = ws.exists() ? num(ws.data().balance) : 0;
      if (cur < total) throw new Error('رصيدك لا يكفي — اشحن محفظتك أولاً');
      after = r2(cur - total); const now = iso();
      tx.set(wRef, { userId: uid, userName: uName, role, balance: after, updatedAt: now }, { merge: true });
      tx.set(tRef, { userId: uid, userName: uName, role, type: 'debit', amount: total, balanceAfter: after, label: 'شراء من المتجر', note: p.name, source: 'purchase', by: uName, createdAt: now });
      tx.set(oRef, { id: oRef.id, userId: uid, userName: uName, role, productId: bP.id, productName: p.name, price, discount: disc, total, couponCode: bCode, status: 'new', createdAt: now });
      if (p.stock != null) tx.update(pRef, { stock: num(p.stock) - 1 });
      if (cRef) tx.set(cRef, { usedCount: increment(1), usedBy: { [uid]: now } }, { merge: true });
    });
    closeM('buyModal'); toast('تمت عملية الشراء بنجاح ✅'); go('wallet');
  } catch (e) { showErr('byErr', e.message); } finally { btn.disabled = false; }
};

// 🔔 إشعار Push فوري للهدية — بنفس طريقة إشعارات الإيداع والسحب (صفحة إدارة المتجر)
const PUSH_URL = 'https://vercel-server-nine-tau.vercel.app/api/send';
const PUSH_KEY = 'Meezan2026Secret';
async function sendRewardPush(kind, amount, itemName, txId) {
  try {
    const notifId = 'rwn_' + txId; // رقم ثابت: نفس الهدية ما تتبعتش مرتين
    const title = kind === 'exam' ? '🎁 مبروك! هدية نجاح الامتحان' : '🎁 مبروك! هدية نجاح الواجب';
    const body = `تمت إضافة ${money(amount)} إلى محفظتك${itemName ? ' — ' + itemName : ''}`;
    const now = iso();
    await setDoc(doc(db, 'notifications', notifId), {
      id: notifId, title, body, type: 'page', url: 'stor.html', kind: 'store', mediaType: 'page',
      senderId: 'system', senderName: 'MEEZAN', createdAt: now, target: 'custom', targetLabel: 'محفظة', recipients: [uid]
    });
    const uRef = doc(db, 'user_notifications', uid);
    const old = (await getDoc(uRef)).data() || {};
    let notifIds = old.notifIds || [], unread = old.unreadCount || 0;
    if (!notifIds.includes(notifId)) { notifIds = [notifId, ...notifIds].slice(0, 100); unread++; }
    await setDoc(uRef, { userId: uid, notifIds, unreadCount: unread, updatedAt: serverTimestamp() }, { merge: true });
    await fetch(PUSH_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-admin-key': PUSH_KEY },
      body: JSON.stringify({ notifId, resend: false })
    });
  } catch (e) { console.warn('reward push failed:', e); }
}

async function grantReward(kind, s, idKey, nameKey) {
  const itemId = s[idKey]; if (!itemId) return;
  const key = kind + '_' + itemId;
  if (rewardBusy.has(key)) return;
  rewardBusy.add(key);
  try {
    const c = (await getDoc(doc(db, 'settings', 'store_config'))).data() || {};
    const rw = c.rewards?.[kind];
    if (!rw?.on || !(num(rw.amount) >= 0.01)) return;
    const wRef = doc(db, 'wallets', uid), tRef = doc(db, 'wallet_transactions', `rw_${uid}_${kind}_${itemId}`);
    let granted = false;
    await runTransaction(db, async (tx) => {
      granted = false;
      if ((await tx.get(tRef)).exists()) return; // مرة واحدة لكل واجب/امتحان
      const ws = await tx.get(wRef), now = new Date().toISOString();
      const after = r2((ws.exists() ? num(ws.data().balance) : 0) + num(rw.amount));
      tx.set(wRef, { userId: uid, userName: uName, role, balance: after, updatedAt: now }, { merge: true });
      tx.set(tRef, { userId: uid, userName: uName, role, type: 'credit', amount: num(rw.amount), balanceAfter: after,
        label: kind === 'exam' ? 'هدية نجاح امتحان' : 'هدية نجاح واجب', note: s[nameKey] || '',
        source: 'reward', by: 'system', createdAt: now });
      granted = true;
    });
    if (granted) toast(`🎁 مبروك! تمت إضافة هدية ${kind === 'exam' ? 'الامتحان' : 'الواجب'}: ${money(rw.amount)}`);
    if (granted && c.notificationsEnabled !== false) sendRewardPush(kind, rw.amount, s[nameKey] || '', tRef.id);
  } catch (e) { console.error('reward error:', e); }
  finally { rewardBusy.delete(key); }
}
if (uid) REWARD_SOURCES.forEach(({ kind, col, idKey, nameKey }) => {
  onSnapshot(doc(db, col, 'all'), (snap) => {
    (snap.data()?.items || []).forEach(s => {
      if (s.userId !== uid || !isPassed(s)) return;
      if (REWARD_SINCE && String(s.correctedAt || s.submittedAt || '') < REWARD_SINCE) return;
      grantReward(kind, s, idKey, nameKey);
    });
  }, (e) => console.error('reward watch error (' + col + '):', e));
});

renderWallet(); renderTx(); renderReqs();
</script>
</body>
