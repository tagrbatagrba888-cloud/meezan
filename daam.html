<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B3D2E">
<title>الدعم الفني | MEEZAN</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/ymXPqr46/file-00000000af0c820aa687a3c3181a6a24.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --primary: #0B3D2E;
    --primary-light: #145A43;
    --primary-lighter: #1E7A5A;
    --accent: #C9A961;
    --accent-light: #E0C888;
    --bg-page: #F5F1E8;
    --bg-card: #FFFFFF;
    --bg-input: #F8FBF9;
    --text-main: #0B3D2E;
    --text-sub: #5A6B66;
    --border: #E0E5E1;
    --shadow: rgba(11, 61, 46, 0.15);
    --error: #C0392B;
    --success: #1E7A5A;
    --warning: #E67E22;
    --info: #2980B9;
  }

  [data-theme="dark"] {
    --primary: #C9A961;
    --primary-light: #E0C888;
    --primary-lighter: #F0DBA8;
    --accent: #0B3D2E;
    --accent-light: #145A43;
    --bg-page: #0A1612;
    --bg-card: #11201B;
    --bg-input: #1A2C25;
    --text-main: #F5F1E8;
    --text-sub: #9BAEA6;
    --border: #1E3A31;
    --shadow: rgba(0, 0, 0, 0.5);
    --error: #E74C3C;
    --success: #2ECC71;
    --warning: #F39C12;
    --info: #3498DB;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Cairo', sans-serif;
    background: var(--bg-page);
    min-height: 100vh;
    color: var(--text-main);
    opacity: 0;
    transition: opacity 0.3s ease, background 0.4s ease;
    overflow-x: hidden;
  }

  body.ready { opacity: 1; }

  /* ============================================================
     شاشة الزائر
     ============================================================ */
  .guest-screen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 60%, var(--primary-lighter) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
    overflow-y: auto;
  }

  .guest-screen.hidden { display: none; }

  .guest-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image: 
      radial-gradient(circle at 20% 30%, rgba(201, 169, 97, 0.15) 0%, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(201, 169, 97, 0.1) 0%, transparent 40%);
    pointer-events: none;
  }

  .guest-box {
    background: var(--bg-card);
    border-radius: 24px;
    padding: 36px 28px;
    max-width: 440px;
    width: 100%;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
    border-top: 6px solid var(--accent);
    animation: modalPop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    position: relative;
    z-index: 2;
    max-height: 92vh;
    overflow-y: auto;
  }

  .guest-logo {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    margin: 0 auto 18px;
    background: rgba(201, 169, 97, 0.1);
    padding: 8px;
    border: 3px solid var(--accent);
    display: block;
  }

  .guest-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--text-main);
    text-align: center;
    margin-bottom: 8px;
  }

  .guest-subtitle {
    font-size: 13.5px;
    color: var(--text-sub);
    text-align: center;
    margin-bottom: 22px;
    line-height: 1.7;
    font-weight: 500;
  }

  .guest-note {
    background: rgba(201, 169, 97, 0.1);
    border: 1.5px solid var(--accent);
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 12.5px;
    color: var(--text-main);
    font-weight: 600;
    margin-bottom: 18px;
    display: flex;
    gap: 10px;
    align-items: flex-start;
    line-height: 1.6;
  }

  .guest-note i {
    color: var(--accent);
    font-size: 16px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  /* ============================================================
     الشاشة الرئيسية
     ============================================================ */
  .main-container {
    display: none;
    flex-direction: column;
    min-height: 100vh;
  }

  .main-container.visible { display: flex; }

  /* ============================================================
     الهيدر
     ============================================================ */
  .header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    box-shadow: 0 4px 20px var(--shadow);
  }

  .header-inner {
    max-width: 1000px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }

  .back-btn {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--bg-input);
    border: 2px solid var(--border);
    color: var(--primary);
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    transition: all 0.25s ease;
    flex-shrink: 0;
  }

  [data-theme="dark"] .back-btn { color: var(--accent); }

  .back-btn:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    transform: translateX(-3px);
  }

  [data-theme="dark"] .back-btn:hover { color: var(--bg-page); }

  .header-info {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    flex: 1;
  }

  .support-avatar {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-lighter));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    border: 2px solid var(--accent);
    position: relative;
  }

  [data-theme="dark"] .support-avatar { color: var(--bg-page); }

  .support-avatar.online::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--success);
    border: 2px solid var(--bg-card);
    box-shadow: 0 0 8px var(--success);
    animation: pulseOnline 2s ease-in-out infinite;
  }

  .support-avatar.offline::after {
    content: '';
    position: absolute;
    bottom: 0;
    right: 0;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #95A5A6;
    border: 2px solid var(--bg-card);
  }

  @keyframes pulseOnline {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  .support-info { min-width: 0; }

  .support-name {
    font-size: 15px;
    font-weight: 800;
    color: var(--text-main);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }

  .support-status {
    font-size: 11.5px;
    color: var(--success);
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .support-status.offline { color: var(--text-sub); }
  .support-status.waiting { color: var(--warning); }

  .support-status i {
    font-size: 8px;
    animation: pulseOnline 2s ease-in-out infinite;
  }

  .header-actions {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }

  .btn-transfer {
    padding: 10px 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-lighter));
    color: #fff;
    border: none;
    font-family: 'Cairo', sans-serif;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    transition: all 0.25s ease;
    white-space: nowrap;
    box-shadow: 0 4px 12px var(--shadow);
  }

  [data-theme="dark"] .btn-transfer { color: var(--bg-page); }

  .btn-transfer:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px var(--shadow);
  }

  .btn-transfer.cancel {
    background: linear-gradient(135deg, var(--error), #E74C3C);
    color: #fff;
  }

  .btn-transfer i { font-size: 13px; }

  /* ============================================================
     منطقة الشات
     ============================================================ */
  .chat-container {
    flex: 1;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
    padding: 16px;
    display: flex;
    flex-direction: column;
  }

  .chat-box {
    flex: 1;
    background: var(--bg-card);
    border-radius: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 24px var(--shadow);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    margin-bottom: 12px;
    min-height: 400px;
    max-height: calc(100vh - 240px);
  }

  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .chat-messages::-webkit-scrollbar { width: 8px; }
  .chat-messages::-webkit-scrollbar-track { background: var(--bg-input); border-radius: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .chat-messages::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* ====== رسالة ====== */
  .msg {
    display: flex;
    gap: 10px;
    max-width: 85%;
    animation: msgIn 0.3s ease;
  }

  @keyframes msgIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
    flex-direction: row-reverse;
  }

  .msg.support,
  .msg.bot {
    align-self: flex-start;
  }

  .msg.system {
    align-self: center;
    max-width: 90%;
  }

  .msg-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-lighter));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    font-weight: 800;
    flex-shrink: 0;
    overflow: hidden;
    border: 2px solid var(--accent);
  }

  [data-theme="dark"] .msg-avatar { color: var(--bg-page); }

  .msg.user .msg-avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent-light));
    color: #fff;
    border-color: var(--primary);
  }

  .msg.bot .msg-avatar {
    background: linear-gradient(135deg, var(--info), #5DADE2);
  }

  .msg-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .msg-content {
    background: var(--bg-input);
    border-radius: 14px;
    padding: 10px 14px;
    border: 1px solid var(--border);
    position: relative;
    min-width: 0;
  }

  .msg.user .msg-content {
    background: linear-gradient(135deg, var(--primary), var(--primary-lighter));
    color: #fff;
    border-color: var(--primary);
  }

  [data-theme="dark"] .msg.user .msg-content { color: var(--bg-page); }

  .msg.bot .msg-content {
    background: linear-gradient(135deg, rgba(41, 128, 185, 0.08), rgba(41, 128, 185, 0.03));
    border-color: rgba(41, 128, 185, 0.3);
  }

  .msg.system .msg-content {
    background: var(--bg-input);
    border-color: var(--border);
    border-radius: 20px;
    font-size: 12px;
    color: var(--text-sub);
    text-align: center;
    padding: 6px 14px;
  }

  .msg-sender-name {
    font-size: 11px;
    font-weight: 800;
    color: var(--accent);
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .msg.bot .msg-sender-name { color: var(--info); }

  .msg-text {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .msg-media {
    margin-top: 8px;
    border-radius: 10px;
    overflow: hidden;
    max-width: 100%;
  }

  .msg-media img,
  .msg-media video {
    max-width: 100%;
    max-height: 300px;
    border-radius: 10px;
    display: block;
    cursor: pointer;
  }

  .msg-media video { background: #000; }

  .msg-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--info);
    text-decoration: underline;
    font-size: 12.5px;
    font-weight: 600;
    margin-top: 6px;
    word-break: break-all;
  }

  .msg-meta {
    font-size: 10.5px;
    opacity: 0.7;
    margin-top: 5px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 5px;
    justify-content: flex-end;
  }

  .msg.user .msg-meta { color: rgba(255,255,255,0.85); }

  /* ============================================================
     🎯 الأزرار التفاعلية داخل الرسالة
     ============================================================ */
  .msg-actions {
    margin-top: 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding-top: 10px;
    border-top: 1px dashed rgba(90, 107, 102, 0.2);
  }

  .msg.bot .msg-actions {
    border-top-color: rgba(41, 128, 185, 0.25);
  }

  .action-btn-chat {
    padding: 8px 14px;
    border-radius: 12px;
    background: var(--bg-card);
    border: 1.5px solid var(--border);
    color: var(--text-main);
    font-family: 'Cairo', sans-serif;
    font-size: 12.5px;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.2s ease;
    white-space: nowrap;
    position: relative;
  }

  .action-btn-chat i {
    font-size: 12px;
    color: var(--accent);
    transition: all 0.2s ease;
  }

  .action-btn-chat:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--primary), var(--primary-lighter));
    color: #fff;
    border-color: var(--primary);
    transform: translateY(-2px);
    box-shadow: 0 6px 16px var(--shadow);
  }

  .action-btn-chat:hover:not(:disabled) i {
    color: var(--accent-light);
  }

  [data-theme="dark"] .action-btn-chat:hover:not(:disabled) {
    color: var(--bg-page);
  }

  .action-btn-chat:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  .action-btn-chat.primary {
    background: linear-gradient(135deg, var(--primary), var(--primary-lighter));
    color: #fff;
    border-color: var(--primary);
  }

  [data-theme="dark"] .action-btn-chat.primary { color: var(--bg-page); }

  .action-btn-chat.danger {
    color: var(--error);
    border-color: rgba(192, 57, 43, 0.3);
  }

  .action-btn-chat.danger:hover:not(:disabled) {
    background: linear-gradient(135deg, var(--error), #E74C3C);
    color: #fff;
    border-color: var(--error);
  }

  .action-btn-chat.back {
    color: var(--text-sub);
  }

  /* ============================================================
     مؤشر الكتابة
     ============================================================ */
  .typing-indicator {
    display: flex;
    gap: 6px;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg-input);
    border-radius: 14px;
    border: 1px solid var(--border);
    align-self: flex-start;
    margin-left: 46px;
    animation: msgIn 0.3s ease;
  }

  .typing-indicator.hidden { display: none; }

  .typing-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--text-sub);
    animation: typingBounce 1.4s infinite ease-in-out;
  }

  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-8px); opacity: 1; }
  }

  /* ============================================================
     منطقة الإدخال
     ============================================================ */
  .chat-input-area {
    background: var(--bg-card);
    border-radius: 18px;
    border: 1px solid var(--border);
    box-shadow: 0 6px 24px var(--shadow);
    padding: 10px;
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .attach-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: var(--bg-input);
    border: 2px solid var(--border);
    color: var(--primary);
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    flex-shrink: 0;
  }

  .attach-btn:hover {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    transform: translateY(-2px);
  }

  [data-theme="dark"] .attach-btn:hover { color: var(--bg-page); }

  .chat-input {
    flex: 1;
    padding: 12px 16px;
    font-size: 14px;
    font-family: 'Cairo', sans-serif;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--bg-input);
    color: var(--text-main);
    outline: none;
    font-weight: 500;
    transition: all 0.25s ease;
    resize: none;
    max-height: 120px;
    min-height: 44px;
    line-height: 1.5;
  }

  .chat-input:focus {
    border-color: var(--primary);
    background: var(--bg-card);
    box-shadow: 0 0 0 4px rgba(11, 61, 46, 0.1);
  }

  [data-theme="dark"] .chat-input:focus {
    box-shadow: 0 0 0 4px rgba(201, 169, 97, 0.15);
  }

  .chat-input::placeholder { color: #A8B5B1; }

  .send-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--primary-lighter));
    color: #fff;
    border: none;
    font-size: 17px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.25s ease;
    flex-shrink: 0;
    box-shadow: 0 4px 12px var(--shadow);
  }

  [data-theme="dark"] .send-btn { color: var(--bg-page); }

  .send-btn:hover:not(:disabled) {
    transform: translateY(-2px) scale(1.05);
    box-shadow: 0 8px 20px var(--shadow);
  }

  .send-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ============================================================
     Modal
     ============================================================ */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10000;
    overflow-y: auto;
  }

  .modal-overlay.show { display: flex; }

  .modal-box {
    background: var(--bg-card);
    border-radius: 22px;
    padding: 28px 24px;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 25px 70px rgba(0, 0, 0, 0.5);
    border-top: 6px solid var(--accent);
    animation: modalPop 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    max-height: 92vh;
    overflow-y: auto;
    text-align: center;
  }

  @keyframes modalPop {
    from { opacity: 0; transform: scale(0.85) translateY(20px); }
    to { opacity: 1; transform: scale(1) translateY(0); }
  }

  .modal-icon {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--primary-lighter));
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    margin: 0 auto 18px;
    box-shadow: 0 10px 25px var(--shadow);
  }

  [data-theme="dark"] .modal-icon { color: var(--bg-page); }

  .modal-title {
    font-size: 19px;
    font-weight: 800;
    color: var(--text-main);
    margin-bottom: 8px;
  }

  .modal-message {
    font-size: 13.5px;
    color: var(--text-sub);
    font-weight: 500;
    line-height: 1.7;
    margin-bottom: 20px;
  }

  .modal-input-wrap {
    margin-bottom: 20px;
    text-align: right;
  }

  .modal-label {
    display: block;
    font-size: 12.5px;
    font-weight: 700;
    color: var(--text-main);
    margin-bottom: 8px;
  }

  .modal-input {
    width: 100%;
    padding: 13px 16px;
    font-size: 14px;
    font-family: 'Cairo', sans-serif;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: var(--bg-input);
    color: var(--text-main);
    outline: none;
    font-weight: 500;
    transition: all 0.25s ease;
    direction: ltr;
    text-align: left;
  }

  .modal-input:focus {
    border-color: var(--primary);
    background: var(--bg-card);
    box-shadow: 0 0 0 4px rgba(11, 61, 46, 0.1);
  }

  .modal-error {
    background: rgba(192, 57, 43, 0.1);
    color: var(--error);
    border: 1px solid rgba(192, 57, 43, 0.3);
    padding: 10px 14px;
    border-radius: 10px;

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { 
  getFirestore, doc, onSnapshot, setDoc, getDoc, serverTimestamp 
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAmkCOrSaklhUiDdDfZCpSDQNmMYP-Gdw0",
  authDomain: "qanon-c716d.firebaseapp.com",
  projectId: "qanon-c716d",
  storageBucket: "qanon-c716d.firebasestorage.app",
  messagingSenderId: "757756130875",
  appId: "1:757756130875:web:63c53534c6843e2a29ce1e",
  measurementId: "G-8FZGTC779Y"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const $ = (id) => document.getElementById(id);

// ============================================================
// 🧹 التنظيف
// ============================================================
function cleanInput(v) {
  if (typeof v !== 'string') return '';
  return v
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/[\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]/g, ' ')
    .replace(/^\s+|\s+$/g, '')
    .trim();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : String(text);
  return div.innerHTML;
}

// ============================================================
// 📊 الحالة
// ============================================================
let isLoggedIn = false;
let currentUser = null;
let currentRole = 'guest';
let currentUserId = null;
let currentUserName = '';
let sessionId = null;
let unsubscribeMessages = null;
let unsubscribeUser = null;
let unsubscribeBotSettings = null;

// حالة المحادثة
let isTransferredToSupport = false;
let isClosed = false;
let claimedBy = null;
let claimedByName = null;

// كاش
let lastRenderedMessagesHash = '';
let lastBotReplyForMsgId = null;
let botReplyInProgress = false;

// مؤقت إشارة الكتابة
let typingSignalTimeout = null;
let isSendingTypingSignal = false;

// إعدادات البوت
const DEFAULT_BOT_SETTINGS = {
  enabled: true,
  accessDb: true,
  autoGreet: true,
  typingSignal: true,
  botName: 'ميزان الذكي',
  // API
  apiEnabled: false,
  apiUrl: '',
  apiKey: '',
  apiModel: '',
  apiHeaders: '',
  apiMaxTokens: 500,
  apiTemperature: 0.7,
  apiTimeout: 30,
  // Persona
  systemPrompt: 'أنت "ميزان الذكي"، مساعد دعم فني ذكي ولطيف في منصة MEEZAN التعليمية.',
  contextTemplate: '== بيانات المستخدم ==\nالاسم: {name}\nالدور: {role}\nالكود: {code}\nالفرقة: {grade}\nالهاتف: {phone}\nالامتحانات: {completedExams}/{totalExams}\nالواجبات: {completedHomeworks}/{totalHomeworks}\n== نهاية البيانات ==',
  // Messages
  welcomeMsg: 'أهلاً بك يا {name} 👋\nأنا ميزان الذكي، مساعدك في المنصة.\nكيف أقدر أساعدك اليوم؟',
  transferMsg: '✅ تم تحويل محادثتك لفريق الدعم الفني.\nسيتم الرد عليك في أقرب وقت ممكن.\nشكراً لصبرك 🌸',
  apiErrorMsg: '⚠️ حدث خطأ مؤقت، جاري تحويلك للدعم البشري.'
};

let botSettings = { ...DEFAULT_BOT_SETTINGS };

// كاش بيانات المستخدمين (لبوت)
const userDataCache = new Map();
let cachedUsers = null;
let cachedTeachers = null;
let cachedUsersTime = 0;
let cachedTeachersTime = 0;
const CACHE_TTL = 60000;

// ============================================================
// 💬 Toast
// ============================================================
let toastTimeout;
function showToast(text, type = 'success') {
  const toast = $('toast');
  const icon = $('toastIcon');
  $('toastText').textContent = text;
  toast.className = 'toast show ' + type;
  const icons = {
    success: 'fa-check-circle',
    error: 'fa-times-circle',
    warning: 'fa-exclamation-triangle',
    info: 'fa-info-circle'
  };
  icon.className = `fas ${icons[type] || icons.success}`;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ============================================================
// 🔐 التحقق من الدخول
// ============================================================
function checkLoginStatus() {
  isLoggedIn = sessionStorage.getItem('meezan_logged_in') === 'true';
  currentRole = sessionStorage.getItem('meezan_role') || 'guest';
  currentUserId = sessionStorage.getItem('meezan_user_id') || null;
  const username = sessionStorage.getItem('meezan_username') || '';

  const guestMode = sessionStorage.getItem('meezan_guest_mode') === 'true';
  const guestName = sessionStorage.getItem('meezan_guest_name') || '';
  const guestPhone = sessionStorage.getItem('meezan_guest_phone') || '';

  if (isLoggedIn && username) {
    loadLoggedInUser();
  } else if (guestMode && guestName && guestPhone) {
    currentRole = 'guest';
    currentUserId = 'guest_' + guestPhone;
    currentUserName = guestName;
    sessionId = 'chat_guest_' + guestPhone;
    openChat();
    loadMessages();
    startUserMonitoring();
  } else {
    showGuestScreen();
  }
}

// ============================================================
// 👤 تحميل بيانات المستخدم المسجل
// ============================================================
async function loadLoggedInUser() {
  try {
    const collectionName = currentRole === 'teacher' ? 'teachers' : 'users';
    const userId = currentUserId;
    const username = sessionStorage.getItem('meezan_username') || '';

    const cachedData = sessionStorage.getItem('meezan_user_data');
    if (cachedData) {
      try {
        const parsed = JSON.parse(cachedData);
        if (parsed.fullName) currentUserName = parsed.fullName;
      } catch (e) {}
    }

    if (!currentUserName) currentUserName = username;

    const userSnap = await new Promise((resolve) => {
      onSnapshot(doc(db, collectionName, 'all'), (s) => resolve(s), { once: true });
    });

    if (userSnap.exists()) {
      const items = userSnap.data().items || [];
      const user = items.find(u => u.id === userId) ||
                   items.find(u => (u.username || '').toLowerCase() === username.toLowerCase());
      if (user) {
        currentUser = user;
        currentUserName = user.fullName || user.username || 'مستخدم';
      }
    }

    sessionId = 'chat_' + (currentUserId || username);

    openChat();
    loadMessages();
    startUserMonitoring();

  } catch (e) {
    console.error('load user error:', e);
    showToast('تعذّر تحميل بياناتك — حاول تحديث الصفحة', 'error');
  }
}

// ============================================================
// 🔓 شاشة الزائر
// ============================================================
function showGuestScreen() {
  $('guestScreen').classList.remove('hidden');
  $('mainContainer').classList.remove('visible');

  try {
    const savedGuest = localStorage.getItem('meezan_guest_data');
    if (savedGuest) {
      const data = JSON.parse(savedGuest);
      if (data.name) $('guestName').value = data.name;
      if (data.phone) $('guestPhone').value = data.phone;
    }
  } catch (e) {}
}

$('guestBack').addEventListener('click', () => {
  window.location.replace('login.html');
});

$('guestForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('guestError').classList.remove('show');

  const name = cleanInput($('guestName').value);
  const phone = cleanInput($('guestPhone').value).replace(/\D/g, '');

  if (!name || name.length < 3) {
    $('guestError').textContent = 'الاسم يجب أن يكون 3 أحرف على الأقل';
    $('guestError').classList.add('show');
    return;
  }
  if (!/^01[0-9]{9}$/.test(phone)) {
    $('guestError').textContent = 'رقم الهاتف غير صحيح (01xxxxxxxxx)';
    $('guestError').classList.add('show');
    return;
  }

  const btn = $('guestSubmit');
  const originalHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

  try {
    localStorage.setItem('meezan_guest_data', JSON.stringify({ name, phone }));

    let foundUser = null;
    let foundRole = 'guest';
    let foundCollection = 'users';

    for (const coll of ['users', 'teachers']) {
      const snap = await new Promise((resolve) => {
        onSnapshot(doc(db, coll, 'all'), (s) => resolve(s), { once: true });
      });
      if (snap.exists()) {
        const items = snap.data().items || [];
        const user = items.find(u => (u.phone || '') === phone);
        if (user) {
          foundUser = user;
          foundCollection = coll;
          foundRole = coll === 'teachers' ? 'teacher' : 'student';
          break;
        }
      }
    }

    if (foundUser) {
      currentUser = foundUser;
      currentRole = foundRole;
      currentUserId = foundUser.id;
      currentUserName = foundUser.fullName || name;
      sessionId = 'chat_' + foundUser.id;

      sessionStorage.setItem('meezan_logged_in', 'true');
      sessionStorage.setItem('meezan_username', foundUser.username || name);
      sessionStorage.setItem('meezan_role', foundRole);
      sessionStorage.setItem('meezan_user_id', foundUser.id);
      sessionStorage.setItem('meezan_user_data', JSON.stringify({
        fullName: foundUser.fullName || name,
        username: foundUser.username || '',
        avatarUrl: foundUser.avatarUrl || '',
        role: foundRole
      }));

      showToast('تم التحقق من حسابك ✓', 'success');
    } else {
      currentRole = 'guest';
      currentUserId = 'guest_' + phone;
      currentUserName = name;
      sessionId = 'chat_guest_' + phone;

      sessionStorage.setItem('meezan_guest_mode', 'true');
      sessionStorage.setItem('meezan_guest_name', name);
      sessionStorage.setItem('meezan_guest_phone', phone);
    }

    openChat();
    loadMessages();
    startUserMonitoring();

  } catch (e) {
    console.error(e);
    $('guestError').textContent = 'حدث خطأ، حاول مرة أخرى';
    $('guestError').classList.add('show');

function updateBannersVisibility() {

// ============================================================
// 📡 تحميل الرسائل Real-time
// ============================================================
function loadMessages() {
  if (unsubscribeMessages) unsubscribeMessages();

  const ref = doc(db, 'support_chats', sessionId);

  unsubscribeMessages = onSnapshot(ref, (snap) => {
    if (!snap.exists()) {
      initChat();
      return;
    }

    const data = snap.data();
    const messages = data.messages || [];

    // تحديث الحالة
    isTransferredToSupport = data.isTransferred === true;
    isClosed = data.isClosed === true;
    claimedBy = data.claimedBy || null;
    claimedByName = data.claimedByName || null;

    // حدّث الهيدر
    updateHeaderState();

    // تحديث الأزرار والبانرات
    updateTransferButton();
    updateBannersVisibility();

    // hash للرسائل (لتجنب إعادة الرسم لو مفيش تغيير)
    const hash = messages.map(m => m.id).join('|');
    if (hash === lastRenderedMessagesHash && messages.length > 0) {
      // بس ممكن يكون فيه تغيير في actionsUsed → نعيد الرسم
      const actionsUsedHash = messages.map(m => m.actionsUsed ? '1' : '0').join('');
      if (actionsUsedHash === (window._lastActionsHash || '')) {
        return;
      }
      window._lastActionsHash = actionsUsedHash;
    }
    lastRenderedMessagesHash = hash;

    // رتّب
    messages.sort((a, b) => {
      const ta = new Date(a.createdAt || 0).getTime();
      const tb = new Date(b.createdAt || 0).getTime();
      return ta - tb;
    });

    if (messages.length === 0) {
      initChat();
      return;
    }

    // ارسم
    const messagesEl = $('chatMessages');
    messagesEl.innerHTML = '';
    messages.forEach(msg => renderMessage(msg));

    // لو مغلقة
    if (isClosed) {
      const closedMsg = document.createElement('div');
      closedMsg.className = 'msg system';
      closedMsg.innerHTML = `<div class="msg-content"><i class="fas fa-lock"></i> هذه المحادثة مغلقة</div>`;
      messagesEl.appendChild(closedMsg);
    }

    scrollToBottom();

  }, (err) => {
    console.error('messages error:', err);
  });
}

function updateHeaderState() {
  const nameEl = $('supportName');
  const statusEl = $('supportStatus');
  const statusWrap = $('supportStatusWrap');
  const avatar = $('supportAvatar');
  const avatarIcon = $('supportAvatarIcon');

  if (claimedBy) {
    // مشرف بشري يرد
    nameEl.textContent = claimedByName || 'الدعم الفني';
    statusEl.textContent = 'متصل الآن';
    statusWrap.className = 'support-status';
    avatar.classList.remove('offline');
    avatar.classList.add('online');
    if (avatarIcon) avatarIcon.className = 'fas fa-headset';
  } else if (isTransferredToSupport) {
    // منتظر مشرف
    nameEl.textContent = 'الدعم الفني';
    statusEl.textContent = 'بانتظار الرد';
    statusWrap.className = 'support-status waiting';
    avatar.classList.remove('online');
    avatar.classList.add('offline');
    if (avatarIcon) avatarIcon.className = 'fas fa-headset';
  } else {
    // البوت
    nameEl.textContent = botSettings.botName || 'ميزان الذكي';
    if (isBotAvailable()) {
      statusEl.textContent = 'متصل الآن';
      statusWrap.className = 'support-status';
      avatar.classList.remove('offline');
      avatar.classList.add('online');
    } else {
      statusEl.textContent = 'متوقف';
      statusWrap.className = 'support-status offline';
      avatar.classList.remove('online');
      avatar.classList.add('offline');
    }
    if (avatarIcon) avatarIcon.className = 'fas fa-robot';
  }
}

// 🎨 عرض رسالة
// ============================================================
function renderMessage(msg) {
  const messagesEl = $('chatMessages');
  const type = msg.sender || 'user';

  // رسالة نظام
  if (msg.isSystem) {
    const el = document.createElement('div');
    el.className = 'msg system';
    el.innerHTML = `<div class="msg-content">${escapeHtml(msg.text || '')}</div>`;
    messagesEl.appendChild(el);
    return;
  }

  const text = msg.text || '';
  const mediaUrl = msg.mediaUrl || '';
  const mediaType = msg.mediaType || '';
  const actions = msg.actions || [];
  const time = msg.createdAt ? new Date(msg.createdAt) : new Date();
  const senderName = msg.senderName || '';

  const msgDiv = document.createElement('div');
  msgDiv.className = `msg ${type === 'user' ? 'user' : (type === 'support' || type === 'admin' ? 'support' : 'bot')}`;

  // الأفاتار
  const avatarDiv = document.createElement('div');
  avatarDiv.className = 'msg-avatar';

  if (type === 'user') {
    const firstChar = (currentUserName || 'م').charAt(0).toUpperCase();
    if (currentUser && currentUser.avatarUrl) {
      avatarDiv.innerHTML = `<img src="${currentUser.avatarUrl}" alt="" onerror="this.parentNode.innerHTML='<span>${firstChar}</span>'">`;
    } else {
      avatarDiv.textContent = firstChar;
    }
  } else if (type === 'bot') {
    avatarDiv.innerHTML = '<i class="fas fa-robot"></i>';
  } else {
    avatarDiv.innerHTML = '<i class="fas fa-headset"></i>';
  }

  // المحتوى
  const contentDiv = document.createElement('div');
  contentDiv.className = 'msg-content';

  let html = '';

  // اسم المرسل (للبوت والدعم)
  if (type === 'bot') {
    html += `<div class="msg-sender-name"><i class="fas fa-robot"></i> ${escapeHtml(botSettings.botName || 'ميزان الذكي')}</div>`;
  } else if (type === 'support' || type === 'admin') {
    html += `<div class="msg-sender-name" style="color:var(--accent);"><i class="fas fa-headset"></i> ${escapeHtml(senderName || 'الدعم')}</div>`;
  }

  if (text) {
    html += `<div class="msg-text">${escapeHtml(text)}</div>`;
  }

  if (mediaUrl) {
    if (mediaType === 'video') {
      html += `<div class="msg-media"><video src="${escapeHtml(mediaUrl)}" controls preload="metadata"></video></div>`;
      html += `<a href="${escapeHtml(mediaUrl)}" target="_blank" rel="noopener" class="msg-link"><i class="fas fa-external-link-alt"></i> فتح الفيديو</a>`;
    } else {
      html += `<div class="msg-media"><img src="${escapeHtml(mediaUrl)}" alt="" loading="lazy" onerror="this.parentNode.innerHTML='<div style=\\'padding:12px;text-align:center;font-size:12px;color:var(--error);\\'>تعذّر تحميل الصورة</div>'"></div>`;
      html += `<a href="${escapeHtml(mediaUrl)}" target="_blank" rel="noopener" class="msg-link"><i class="fas fa-external-link-alt"></i> فتح الصورة</a>`;
    }
  }

  html += `<div class="msg-meta">
    <i class="far fa-clock"></i>
    ${formatTimeAgo(time)}
  </div>`;

  contentDiv.innerHTML = html;

  // الأزرار التفاعلية (للبوت فقط + غير مستخدمة + البوت متاح)
  if (type === 'bot' && actions.length > 0 && !msg.actionsUsed && isBotAvailable()) {
    const actionsDiv = document.createElement('div');
    actionsDiv.className = 'msg-actions';

    actions.forEach(action => {
      const btn = document.createElement('button');
      btn.className = 'action-btn-chat';
      if (action.type === 'danger') btn.classList.add('danger');
      if (action.type === 'primary') btn.classList.add('primary');
      if (action.id === 'main_menu') btn.classList.add('back');

      btn.innerHTML = `<i class="fas ${action.icon || 'fa-circle'}"></i> <span>${escapeHtml(action.label)}</span>`;

      btn.addEventListener('click', () => {
        handleActionClick(action, msg.id);
      });

      actionsDiv.appendChild(btn);
    });

    contentDiv.appendChild(actionsDiv);
  }

  msgDiv.appendChild(avatarDiv);
  msgDiv.appendChild(contentDiv);
  messagesEl.appendChild(msgDiv);
}

function formatTimeAgo(date) {
  try {
    const now = new Date();
    const diff = Math.floor((now - date) / 1000);
    if (diff < 10) return 'الآن';
    if (diff < 60) return `منذ ${diff} ث`;
    if (diff < 3600) return `منذ ${Math.floor(diff / 60)} د`;
    if (diff < 86400) return `منذ ${Math.floor(diff / 3600)} س`;
    return date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });
  } catch (e) { return ''; }
}

  const messagesEl = $('chatMessages');
  setTimeout(() => {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }, 100);
}

async function saveMessage(message) {
  const ref = doc(db, 'support_chats', sessionId);

  try {
    const snap = await getDoc(ref);
    const existing = snap.exists() ? (snap.data().messages || []) : [];

    const newMessage = {
      id: 'msg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      sender: message.sender || 'user',
      text: message.text || '',
      mediaUrl: message.mediaUrl || '',
      mediaType: message.mediaType || '',
      actions: message.actions || [],
      senderName: message.senderName || '',
      userName: currentUserName,
      userRole: currentRole,
      createdAt: new Date().toISOString()
    };

    existing.push(newMessage);

    await setDoc(ref, {
      sessionId: sessionId,
      userId: currentUserId,
      userName: currentUserName,
      userRole: currentRole,
      userAvatar: currentUser?.avatarUrl || '',
      userCode: currentUser?.code || '',
      userPhone: currentUser?.phone || sessionStorage.getItem('meezan_guest_phone') || '',
      isUserOnline: true,
      messages: existing,
      lastMessageText: message.text || (message.mediaType === 'video' ? '🎥 فيديو' : '📷 صورة'),
      updatedAt: serverTimestamp()
    }, { merge: true });

    return newMessage;

  } catch (e) {
    console.error('save message error:', e);
    throw e;
  }
}

// ============================================================
async function sendMessage(text = '', mediaUrl = '', mediaType = '') {
  if (isClosed) {
    showToast('المحادثة مغلقة — لا يمكن الإرسال', 'warning');
    return;
  }

  const msgText = cleanInput(text);
  if (!msgText && !mediaUrl) return;

  try {
    await saveMessage({
      sender: 'user',
      text: msgText,
      mediaUrl: mediaUrl,
      mediaType: mediaType
    });

    updateLastSeen();

    // ✅ إذا البوت متاح → شغّل الرد
    if (isBotAvailable() && msgText && !mediaUrl) {
      // علّم آخر رسالة (لمنع التكرار)
      lastBotReplyForMsgId = null;
      // ابدأ الرد
      respondWithBot(msgText);
    }

  } catch (e) {
    console.error(e);
    showToast('تعذّر الإرسال', 'error');
  }
}

/**
 * جلب بيانات المستخدم من Firestore
 */
async function fetchUserData(userId, role) {
  if (!userId || role === 'guest') return null;

  const cacheKey = `${role}_${userId}`;
  const now = Date.now();
  const cached = userDataCache.get(cacheKey);
  if (cached && (now - cached.time) < CACHE_TTL) {
    return cached.data;
  }

  const collName = role === 'teacher' ? 'teachers' : 'users';

  if (role === 'teacher' && cachedTeachers && (now - cachedTeachersTime) < CACHE_TTL) {
    const found = cachedTeachers.find(u => u.id === userId);
    userDataCache.set(cacheKey, { data: found, time: now });
    return found;
  }
  if (role !== 'teacher' && cachedUsers && (now - cachedUsersTime) < CACHE_TTL) {
    const found = cachedUsers.find(u => u.id === userId);
    userDataCache.set(cacheKey, { data: found, time: now });
    return found;
  }

  try {
    const snap = await getDoc(doc(db, collName, 'all'));
    if (snap.exists()) {
      const items = snap.data().items || [];
      if (role === 'teacher') {
        cachedTeachers = items;
        cachedTeachersTime = now;
      } else {
        cachedUsers = items;
        cachedUsersTime = now;
      }
      const found = items.find(u => u.id === userId);
      userDataCache.set(cacheKey, { data: found, time: now });
      return found;
    }
  } catch (e) {
    console.warn('fetchUserData error:', e);
  }

  return null;
}

/**
 * بناء سياق المستخدم
 */
function buildUserContext(chat, userData) {
  const name = userData?.fullName || chat.userName || 'مستخدم';
  const role = chat.userRole === 'teacher' ? 'معلم' : (chat.userRole === 'student' ? 'طالب' : 'ضيف');
  const code = userData?.code || chat.userCode || '—';
  const grade = userData?.grade || '—';
  const phone = userData?.phone || chat.userPhone || '—';
  const completedExams = userData?.completedExams || 0;
  const totalExams = userData?.totalExams || 0;
  const completedHomeworks = userData?.completedHomeworks || 0;
  const totalHomeworks = userData?.totalHomeworks || 0;

  let template = botSettings.contextTemplate || '';
  if (!template) return '';

  return template
    .replace(/\{name\}/g, name)
    .replace(/\{role\}/g, role)
    .replace(/\{code\}/g, code)
    .replace(/\{grade\}/g, grade)
    .replace(/\{phone\}/g, phone)
    .replace(/\{completedExams\}/g, completedExams)
    .replace(/\{totalExams\}/g, totalExams)
    .replace(/\{completedHomeworks\}/g, completedHomeworks)
    .replace(/\{totalHomeworks\}/g, totalHomeworks);
}

/**
 * استدعاء الـ API الخارجي
 */
async function callExternalAPI(userMessage, chat, userData) {
  if (!botSettings.apiEnabled || !botSettings.apiUrl) {
    return { ok: false, reason: 'api_disabled' };
  }

  const systemPrompt = botSettings.systemPrompt || DEFAULT_BOT_SETTINGS.systemPrompt;
  const userContext = buildUserContext(chat, userData);

  const systemContent = systemPrompt + (userContext ? '\n\n' + userContext : '');

  const history = (chat.messages || []).slice(-10).map(m => ({
    role: m.sender === 'user' ? 'user' : 'assistant',
    content: m.text || ''
  }));

  const body = {
    model: botSettings.apiModel || 'default',
    messages: [
      { role: 'system', content: systemContent },
      ...history,
      { role: 'user', content: userMessage }
    ],
    max_tokens: parseInt(botSettings.apiMaxTokens) || 500,
    temperature: parseFloat(botSettings.apiTemperature) || 0.7
  };

  let extraHeaders = {};
  if (botSettings.apiHeaders) {
    try { extraHeaders = JSON.parse(botSettings.apiHeaders); } catch (e) {}
  }

  const headers = {
    'Content-Type': 'application/json',
    ...extraHeaders
  };

  if (botSettings.apiKey && !headers['Authorization']) {
    headers['Authorization'] = 'Bearer ' + botSettings.apiKey;
  }

  const controller = new AbortController();
  const timeoutMs = (parseInt(botSettings.apiTimeout) || 30) * 1000;
  const timer = setTimeout(() => controller.abort(), timeoutMs);

  try {
    const res = await fetch(botSettings.apiUrl, {
      method: 'POST',
      headers,
      body: JSON.stringify(body),
      signal: controller.signal
    });

    clearTimeout(timer);

    if (!res.ok) {
      return { ok: false, reason: 'http_' + res.status };
    }

    const data = await res.json();

    let replyText = '';
    if (data.choices && data.choices[0]?.message?.content) {
      replyText = data.choices[0].message.content;
    } else if (data.candidates && data.candidates[0]?.content?.parts?.[0]?.text) {
      replyText = data.candidates[0].content.parts[0].text;
    } else if (data.content && typeof data.content === 'string') {
      replyText = data.content;
    } else if (data.reply) {
      replyText = data.reply;
    } else if (data.message) {
      replyText = typeof data.message === 'string' ? data.message : data.message.content;
    } else if (data.response) {
      replyText = data.response;
    } else if (typeof data === 'string') {
      replyText = data;
    }

    if (!replyText) {
      return { ok: false, reason: 'empty_response' };
    }

    return { ok: true, text: replyText.trim() };

  } catch (e) {
    clearTimeout(timer);
    console.warn('API error:', e.message);
    return { ok: false, reason: e.name === 'AbortError' ? 'timeout' : 'network' };
  }
}

/**
 * رد البوت الرئيسي
 */
async function respondWithBot(userText) {
  if (!isBotAvailable()) return;
  if (botReplyInProgress) return;
  botReplyInProgress = true;

  const name = currentUser?.fullName || currentUserName || 'صديقي';

  // جلب بيانات المستخدم
  let userData = null;
  if (botSettings.accessDb && currentUserId) {
    userData = await fetchUserData(currentUserId, currentRole);
  }

  // 1) جرب الـ API
  let reply = null;

  if (botSettings.apiEnabled && botSettings.apiUrl) {
    // أظهر مؤشر الكتابة
    if (botSettings.typingSignal !== false) {
      $('typingIndicator').classList.remove('hidden');
      scrollToBottom();
    }

    const apiResult = await callExternalAPI(userText, {
      ...currentUser,
      userName: currentUserName,
      userRole: currentRole,
      userCode: currentUser?.code || '',
      userPhone: currentUser?.phone || sessionStorage.getItem('meezan_guest_phone') || '',
      messages: (await getDoc(doc(db, 'support_chats', sessionId))).data()?.messages || []
    }, userData);

    if (apiResult.ok) {
      reply = {
        text: apiResult.text,
        actions: []
      };
    } else {
      // فشل API
      console.warn('API failed:', apiResult.reason);

      // ✅ الخيار B: البوت المحلي لا يعمل، ويُحوَّل للدعم
      if (botSettings.apiEnabled) {
        // أرسل رسالة تحويل
        await new Promise(r => setTimeout(r, 800));

        // أظهر مؤشر الكتابة
        $('typingIndicator').classList.add('hidden');

        // حوّل للدعم
        await triggerTransferToSupport();
        botReplyInProgress = false;
        return;
      }

      // Fallback للمحلي (لن يحدث لأننا نستخدم B)
      reply = buildLocalBotReply(userText, name, userData);
    }
  } else {
    // لا API → البوت المحلي
    // أظهر مؤشر الكتابة
    if (botSettings.typingSignal !== false) {
      $('typingIndicator').classList.remove('hidden');
      scrollToBottom();
    }

    await new Promise(r => setTimeout(r, 700));

    reply = buildLocalBotReply(userText, name, userData);
  }

  // أخفِ المؤشر
  $('typingIndicator').classList.add('hidden');

  if (!reply) {
    botReplyInProgress = false;
    return;
  }

  // لو طلب تحويل
  if (reply.transferToSupport) {
    await triggerTransferToSupport();
    botReplyInProgress = false;
    return;
  }

  // احفظ رسالة البوت
  try {
    await saveMessage({
      sender: 'bot',
      text: reply.text,
      actions: reply.actions || []
    });
    scrollToBottom();
  } catch (e) {
    console.error('bot save error:', e);
  }

  botReplyInProgress = false;
}

// 🧠 البوت المحلي (محسّن - احترافي)
// ============================================================
function buildLocalBotReply(userText, name, userData) {
  const lower = (userText || '').toLowerCase().trim();

  const has = (...kws) => kws.some(k => lower.includes(k));

  // ============ ترحيب ============
  if (has('مرحبا', 'اهلا', 'أهلا', 'السلام', 'هاي', 'hi', 'hello', 'صباح', 'مساء', 'ازيك', 'إزيك', 'هلا')) {
    const welcome = (botSettings.welcomeMsg || 'أهلاً بك 👋').replace(/\{name\}/g, name);
    return {
      text: welcome,
      actions: getMainMenu()
    };
  }

  // ============ القائمة ============
  if (has('قائمه', 'قائمة', 'رجوع', 'back', 'الرئيسية', 'menu', 'خيارات', 'ابدأ', 'ابدا')) {
    return {
      text: `تمام يا ${name}، اختر من القائمة:`,
      actions: getMainMenu()
    };
  }

  // ============ معلوماتي ============
  if (has('معلوماتي', 'حسابي', 'بياناتي', 'من انا', 'انا مين', 'بروفايل', 'profile')) {
    let txt = `📊 معلوماتك يا ${name}:\n\n`;
    const code = userData?.code || currentUser?.code || currentUserId || '—';
    txt += `• الكود: ${code}\n`;

    if (userData) {
      txt += `• الاسم: ${userData.fullName || name}\n`;
      txt += `• ${currentRole === 'teacher' ? 'المادة' : 'الفرقة'}: ${userData.grade || '—'}\n`;
      if (userData.phone) txt += `• الهاتف: ${userData.phone}\n`;
      if (userData.email) txt += `• البريد: ${userData.email}\n`;
    } else if (currentUser) {
      txt += `• اسم المستخدم: ${currentUser.username || '—'}\n`;
      txt += `• ${currentRole === 'teacher' ? 'المادة' : 'الفرقة'}: ${currentUser.grade || '—'}\n`;
    }

    return {
      text: txt,
      actions: [
        { id: 'stats', label: '📊 نسبة تفوقي', icon: 'fa-chart-line' },
        { id: 'main_menu', label: '🔙 القائمة', icon: 'fa-arrow-right' }
      ]
    };

  // ============ نسبة التفوق ============
  if (has('نسبه', 'نسبة', 'تفوق', 'معدل', 'درجات', 'نتيجه', 'نتيجة', 'مستوى')) {
    if (!userData && !currentUser) {

        ]
      };
    }

    const u = userData || currentUser;
    const cE = Number(u.completedExams) || 0;
    const tE = Number(u.totalExams) || 0;
    const cH = Number(u.completedHomeworks) || 0;
    const tH = Number(u.totalHomeworks) || 0;
    const total = tE + tH;
    const done = cE + cH;
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;

    let emoji = '📊';

// ============================================================
// 🖱️ معالجة الضغط على زر
// ============================================================
async function handleActionClick(action, originalMsgId) {
  if (!action) return;

  // علّم الرسالة كمستخدمة
  await markActionsUsed(originalMsgId);

  switch (action.id) {
    case 'main_menu':
      sendUserAction('القائمة الرئيسية');
      break;

    case 'my_info':
      sendUserAction('معلوماتي');
      break;

    case 'stats':
      sendUserAction('نسبة تفوقي');
      break;

    case 'exams':
      sendUserAction('الامتحانات');
      break;

    case 'homeworks':
      sendUserAction('الواجبات');
      break;

    case 'password':
      sendUserAction('كلمة السر');
      break;

    case 'grade':
      sendUserAction('فرقتي');
      break;

    case 'notifications':
      sendUserAction('الإشعارات');
      break;

    case 'support':
      triggerTransferToSupport();
      break;

    case 'open_login':
      sendUserAction('تسجيل الدخول');
      break;

    case 'open_sora':
    case 'sora':
      sendUserAction('فتح الملف الشخصي');
      setTimeout(() => window.location.href = 'sora.html', 800);
      break;

    case 'open_index':
      sendUserAction('فتح الرئيسية');
      setTimeout(() => window.location.href = 'index.html', 800);
      break;

    case 'open_notif':
      sendUserAction('فتح الإشعارات');
      setTimeout(() => window.location.href = 'ashara.html', 800);
      break;

    default:
      sendUserAction(action.label.replace(/[📊⭐📝📚🔑🎓🔔💬🔐🏠👤🔙]/g, '').trim());
  }
}

// إرسال رسالة من المستخدم بسبب ضغط زر (تُحسب كرسالة)
async function sendUserAction(text) {
  if (!text) return;
  const msgText = cleanInput(text);
  if (!msgText) return;

  try {
    await saveMessage({
      sender: 'user',
      text: msgText
    });

    updateLastSeen();

    if (isBotAvailable()) {
      respondWithBot(msgText);
    }
  } catch (e) {
    console.error(e);
  }
}

// علّم الرسالة كمستخدمة
async function markActionsUsed(msgId) {
  try {
    const ref = doc(db, 'support_chats', sessionId);
    const snap = await getDoc(ref);
    if (!snap.exists()) return;

    const data = snap.data();
    const messages = data.messages || [];

    const idx = messages.findIndex(m => m.id === msgId);
    if (idx !== -1 && !messages[idx].actionsUsed) {
      messages[idx].actionsUsed = true;
      await setDoc(ref, { messages, updatedAt: serverTimestamp() }, { merge: true });
    }
  } catch (e) {}
}

// ============================================================
// 🔄 التحويل للدعم
// ============================================================
$('transferBtn').addEventListener('click', () => {
  if (!isTransferredToSupport) {
    triggerTransferToSupport();
  } else {
    cancelTransfer();
  }
});

async function triggerTransferToSupport() {
  if (isTransferredToSupport) return;

  isTransferredToSupport = true;
  updateTransferButton();
  updateBannersVisibility();
  updateHeaderState();

  try {
    await setDoc(doc(db, 'support_chats', sessionId), {
      isTransferred: true,
      transferredAt: new Date().toISOString(),
      updatedAt: serverTimestamp()
    }, { merge: true });

    await saveMessage({
      sender: 'bot',
      text: botSettings.transferMsg || '✅ تم تحويل محادثتك للدعم'
    });

    showToast('تم التحويل للدعم البشري ✓', 'success');
  } catch (e) {
    console.error(e);
  }
}

async function cancelTransfer() {
  if (!isTransferredToSupport) return;

  isTransferredToSupport = false;
  updateTransferButton();
  updateBannersVisibility();
  updateHeaderState();

  try {
    await setDoc(doc(db, 'support_chats', sessionId), {
      isTransferred: false,
      updatedAt: serverTimestamp()
    }, { merge: true });

    if (botSettings.returnMsg) {
      await saveMessage({
        sender: 'bot',
        text: botSettings.returnMsg
      });
    } else {
      await saveMessage({
        sender: 'bot',
        text: '🔙 تم إلغاء التحويل. أنا هنا للمساعدة مرة أخرى.'
      });
    }

    showToast('تم إلغاء التحويل', 'info');
  } catch (e) {
    console.error(e);
  }
}

function updateTransferButton() {
  const btn = $('transferBtn');
  const txt = $('transferBtnText');

  if (isTransferredToSupport || claimedBy) {
    btn.classList.add('cancel');
    txt.textContent = 'إلغاء التحويل';
  } else {
    btn.classList.remove('cancel');
    txt.textContent = 'تحويل للدعم';
  }
}

// ============================================================
$('attachBtn').addEventListener('click', () => {
  $('attachModal').classList.add('show');
  $('attachError').classList.remove('show');
  $('attachUrl').value = '';
  attachType = 'image';

});

let attachType = 'image';

function updateAttachTypeBtns() {
  $('typeImageBtn').classList.toggle('active', attachType === 'image');
  $('typeVideoBtn').classList.toggle('active', attachType === 'video');
}

$('typeImageBtn').addEventListener('click', () => { attachType = 'image'; updateAttachTypeBtns(); });
$('typeVideoBtn').addEventListener('click', () => { attachType = 'video'; updateAttachTypeBtns(); });

$('attachCancel').addEventListener('click', () => $('attachModal').classList.remove('show'));
$('attachModal').addEventListener('click', (e) => {
  if (e.target === $('attachModal')) $('attachModal').classList.remove('show');
});

$('attachSend').addEventListener('click', async () => {
  const url = cleanInput($('attachUrl').value);
  const errEl = $('attachError');
  errEl.classList.remove('show');

  if (!url) {
    errEl.textContent = 'الرجاء إدخال رابط';
    errEl.classList.add('show');
    return;
  }
  if (!/^https?:\/\/.+/i.test(url)) {
    errEl.textContent = 'الرابط يجب أن يبدأ بـ http:// أو https://';
    errEl.classList.add('show');
    return;
  }

  const btn = $('attachSend');
  const originalHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإرسال...';

  try {
    await sendMessage('', url, attachType);
    $('attachModal').classList.remove('show');
    showToast('تم إرسال الرابط ✓', 'success');
  } catch (e) {
    errEl.textContent = 'حدث خطأ أثناء الإرسال';
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHTML;
  }
});

// ============================================================
// 📡 مراقبة حالة المستخدم
// ============================================================
function startUserMonitoring() {
  if (currentRole === 'guest') return;

  const collectionName = currentRole === 'teacher' ? 'teachers' : 'users';

  unsubscribeUser = onSnapshot(doc(db, collectionName, 'all'), (snap) => {
    if (!snap.exists()) return;

    const items = snap.data().items || [];
    const user = items.find(u => u.id === currentUserId);

    if (!user) {
      handleUserRemoved();
      return;
    }

    if (user.isDisabled === true) {
      const expired = user.disableUntil && new Date(user.disableUntil) < new Date();
      if (!expired) {
        handleUserDisabled(user);
        return;
      }
    }

    currentUser = user;
    currentUserName = user.fullName || currentUserName;

  }, (err) => console.log('user monitor error:', err.message));
}

function handleUserRemoved() {
  const overlay = document.createElement('div');
  overlay.style.cssText = `
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    z-index: 999999; padding: 20px;
  `;
  overlay.innerHTML = `
    <div style="background: var(--bg-card); border-radius: 22px; padding: 40px 30px; max-width: 480px; text-align: center; border-top: 8px solid var(--error);">
      <div style="width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #C0392B, #E74C3C); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px;">
        <i class="fas fa-user-slash"></i>
      </div>
      <h2 style="font-size: 22px; font-weight: 900; color: var(--error); margin-bottom: 12px;">تم حذف حسابك</h2>
      <p style="font-size: 14.5px; color: var(--text-sub); margin-bottom: 20px;">حسابك لم يعد موجوداً في المنصة.</p>
      <p style="font-size: 13px; color: var(--text-sub);">جاري تحويلك لصفحة الدخول...</p>
    </div>
  `;
  document.body.appendChild(overlay);

  setTimeout(() => {
    sessionStorage.clear();
    window.location.replace('login.html');
  }, 3000);
}

function handleUserDisabled(user) {
  const overlay = document.createElement('div');
  overlay.style.cssText = `
    position: fixed; inset: 0;
    background: rgba(0, 0, 0, 0.95);
    backdrop-filter: blur(10px);
    display: flex; align-items: center; justify-content: center;
    z-index: 999999; padding: 20px;
  `;

  const until = user.disableUntil ? formatDateTime(user.disableUntil) : '—';
  const reason = user.disableReason || 'غير محدد';

  overlay.innerHTML = `
    <div style="background: var(--bg-card); border-radius: 22px; padding: 40px 30px; max-width: 480px; text-align: center; border-top: 8px solid var(--error);">
      <div style="width: 90px; height: 90px; border-radius: 50%; background: linear-gradient(135deg, #C0392B, #E74C3C); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: 0 auto 20px;">
        <i class="fas fa-ban"></i>
      </div>
      <h2 style="font-size: 22px; font-weight: 900; color: var(--error); margin-bottom: 12px;">حسابك معطّل حالياً</h2>
      <div style="background: var(--bg-input); border-radius: 14px; padding: 16px; margin-bottom: 20px; text-align: right; border: 1px solid var(--border);">
        <div style="padding: 8px 0; font-size: 13.5px; font-weight: 600; color: var(--text-main); border-bottom: 1px dashed var(--border);">
          <i class="fas fa-clock" style="color: var(--error); width: 20px;"></i>
          حتى: <strong style="color: var(--error);">${until}</strong>
        </div>
        <div style="padding: 8px 0; font-size: 13.5px; font-weight: 600; color: var(--text-main);">
          <i class="fas fa-info-circle" style="color: var(--error); width: 20px;"></i>
          السبب: <strong style="color: var(--error);">${reason}</strong>
        </div>
      </div>
      <p style="font-size: 13px; color: var(--text-sub);">جاري تحويلك لصفحة الدخول...</p>
    </div>
  `;
  document.body.appendChild(overlay);

  setTimeout(() => {
    sessionStorage.clear();
    window.location.replace('login.html');
  }, 4000);
}

function formatDateTime(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    return d.toLocaleString('ar-EG', {
      year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  } catch (e) { return '—'; }
}

// ============================================================
// ⌨️ Escape
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('attachModal').classList.contains('show')) {
      $('attachModal').classList.remove('show');
    }
  }
});

// ============================================================
// 🚀 Init
// ============================================================
requestAnimationFrame(() => document.body.classList.add('ready'));

// ابدأ مراقبة الإعدادات أولاً
startBotSettingsListener();

// ثم افحص الدخول
checkLoginStatus();

// لما المستخدم يغادر
window.addEventListener('beforeunload', () => {
  if (sessionId) {
    try {
      setDoc(doc(db, 'support_chats', sessionId), {
        isUserOnline: false,
        lastSeen: new Date().toISOString()
      }, { merge: true });
    } catch (e) {}
  }
});

</script>
