<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B3D2E">
<title>الشروط والأحكام | MEEZAN</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/ymXPqr46/file-00000000af0c820aa687a3c3181a6a24.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#0B3D2E;--pl:#145A43;--pll:#1E7A5A;--accent:#C9A961;--bg:#F5F1E8;--card:#fff;--input:#F8FBF9;--text:#0B3D2E;--sub:#5A6B66;--border:#E0E5E1;--shadow:rgba(11,61,46,.15);--error:#C0392B;--warning:#E67E22}
[data-theme=dark]{--primary:#C9A961;--pl:#E0C888;--pll:#F0DBA8;--accent:#0B3D2E;--bg:#0A1612;--card:#11201B;--input:#1A2C25;--text:#F5F1E8;--sub:#9BAEA6;--border:#1E3A31;--shadow:rgba(0,0,0,.5);--error:#E74C3C;--warning:#F39C12}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .4s}
.hd{background:var(--card);border-bottom:1px solid var(--border);box-shadow:0 4px 20px var(--shadow);position:sticky;top:0;z-index:20}
.hi{max-width:860px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px}
.hi h1{flex:1;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}.hi h1 i{color:var(--accent)}
.ib{width:42px;height:42px;border-radius:12px;background:var(--input);border:2px solid var(--border);color:var(--primary);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-decoration:none;transition:.25s}
.ib:hover{background:var(--primary);color:var(--bg);transform:translateY(-2px)}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 50px}
.hero{background:linear-gradient(135deg,var(--primary),var(--pll));color:#fff;border-radius:20px;padding:22px;margin-bottom:18px;box-shadow:0 10px 30px var(--shadow)}
[data-theme=dark] .hero{color:var(--bg)}.hero h2{font-size:20px;font-weight:900;margin-bottom:6px}.hero p{font-size:13px;opacity:.85;font-weight:600;line-height:1.7}
.search{position:relative;margin-bottom:8px}.search i{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--sub)}
.search input,.fi{width:100%;padding:13px 40px 13px 14px;border-radius:12px;border:2px solid var(--border);background:var(--card);color:var(--text);font:600 14px 'Cairo',sans-serif;outline:0;transition:.25s}
.search input:focus,.fi:focus{border-color:var(--accent)}
.sec{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin:22px 4px 10px}.sec i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--pll));color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
[data-theme=dark] .sec i{color:var(--bg)}.sec span{margin-right:auto;font-size:12px;background:var(--input);border:1px solid var(--border);padding:2px 10px;border-radius:20px;color:var(--sub)}
.empty{text-align:center;padding:50px 10px;color:var(--sub);font-weight:700}.empty i{display:block;font-size:40px;margin-bottom:10px;opacity:.5}
.foot{text-align:center;color:var(--sub);font-size:12px;font-weight:700;margin-top:30px}
.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,120px);background:var(--card);border:2px solid var(--primary);padding:12px 20px;border-radius:14px;font-weight:700;box-shadow:0 10px 30px var(--shadow);transition:.35s;z-index:99;display:flex;gap:8px;align-items:center}
.toast.show{transform:translate(-50%,0)}.toast.error{border-color:var(--error)}
.it{background:var(--card);border:1.5px solid var(--border);border-radius:16px;margin-bottom:10px;overflow:hidden;transition:.3s}
.it.open{border-color:var(--accent);box-shadow:0 8px 24px var(--shadow)}
.q{width:100%;display:flex;align-items:center;gap:12px;padding:15px 16px;background:none;border:0;color:var(--text);font:800 15px 'Cairo',sans-serif;cursor:pointer;text-align:right}
.q b{min-width:30px;height:30px;border-radius:9px;background:var(--input);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--sub)}
.it.open .q b{background:var(--accent);color:#fff;border-color:var(--accent)}.q span{flex:1}.q>i{color:var(--sub);transition:.3s}.it.open .q>i{transform:rotate(180deg);color:var(--accent)}
.a{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}.it.open .a{grid-template-rows:1fr}.a>div{overflow:hidden}
.a p{padding:2px 18px 18px 18px;margin:0 46px 0 0;font-size:14px;line-height:2;color:var(--sub);font-weight:600;white-space:pre-line;border-top:1px dashed var(--border);padding-top:14px}</style></head><body>
<header class="hd"><div class="hi"><button class="ib" id="bk" title="رجوع"><i class="fas fa-arrow-right"></i></button><h1><i class="fas fa-file-contract"></i>الشروط والأحكام</h1><button class="ib" id="th" title="المظهر"><i class="fas fa-moon" id="thi"></i></button></div></header>
<main class="wrap"><div class="hero"><h2>شروط وأحكام منصة ميزان</h2><p>اقرأ الشروط التي تحفظ حقوق المنصة والطالب والمعلم. اضغط على أي شرط لعرض تفاصيله.</p></div>
<div class="search"><i class="fas fa-search"></i><input id="q" placeholder="ابحث في الشروط..."></div><div id="list"></div><p class="foot">MEEZAN © جميع الحقوق محفوظة</p></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const db = getFirestore(initializeApp({apiKey:"AIzaSyAmkCOrSaklhUiDdDfZCpSDQNmMYP-Gdw0",authDomain:"qanon-c716d.firebaseapp.com",projectId:"qanon-c716d",storageBucket:"qanon-c716d.firebasestorage.app",messagingSenderId:"757756130875",appId:"1:757756130875:web:63c53534c6843e2a29ce1e"}));
const DEFAULTS = [["platform", "استخدام المنصة", "المنصة مخصصة للأغراض التعليمية فقط. يلتزم كل مستخدم بالبيانات الصحيحة عند التسجيل، وبالحفاظ على سرية بيانات دخوله، ويتحمل مسؤولية أي نشاط يتم من حسابه."], ["platform", "حقوق الملكية الفكرية", "جميع المحتويات والتصميمات والشعارات والبرمجيات الخاصة بالمنصة محمية. يمنع نسخها أو إعادة نشرها أو بيعها أو تصويرها دون إذن كتابي من إدارة المنصة."], ["platform", "منع الغش والاستخدام المسيء", "يمنع الغش في الامتحانات والواجبات أو مشاركة كلمات السر أو استخدام حسابات الآخرين أو محاولة اختراق المنصة. تحتفظ المنصة بحق إلغاء النتيجة وإيقاف الحساب عند المخالفة."], ["platform", "الخصوصية وحماية البيانات", "تجمع المنصة البيانات اللازمة لتقديم الخدمة فقط، ولا تشاركها مع أي طرف خارجي إلا بما يقتضيه القانون أو تشغيل الخدمة، وتتخذ الإجراءات المعقولة لحمايتها."], ["platform", "حق المنصة في الإيقاف والتعديل", "يحق للمنصة تعديل خدماتها أو إيقافها مؤقتاً للصيانة، وإيقاف أي حساب يخالف الشروط، مع إخطار المستخدم قدر الإمكان."], ["student", "حق الوصول إلى المحتوى", "للطالب الحق في الوصول إلى الامتحانات والواجبات المتاحة له وفق الصلاحيات المحددة، والحصول على نتيجته وتقييمه بشكل واضح وعادل."], ["student", "نزاهة الامتحانات والواجبات", "يلتزم الطالب بحل الامتحان والواجب بنفسه ودون مساعدة غير مسموحة، وبعدم تسريب الأسئلة أو الإجابات. الأسئلة ملك للمنصة والمعلم."], ["student", "حق الاعتراض على النتيجة", "للطالب أن يتقدم بطلب مراجعة تصحيح أي سؤال عبر صفحة الدعم، وتلتزم الإدارة بالرد عليه ومراجعته بجدية."], ["student", "المحفظة والمشتريات", "الرصيد والهدايا خاصة بحساب الطالب ولا تُنقل لغيره. عمليات الشراء من المتجر تتم بعد موافقة الطالب، وتخضع طلبات الشحن والسحب لمراجعة الإدارة."], ["teacher", "حقوق المحتوى المنشور", "يحتفظ المعلم بحقوقه في المحتوى الذي ينشئه، ويمنح المنصة حق عرضه للطلاب المصرح لهم داخل المنصة فقط."], ["teacher", "جودة ودقة المحتوى", "يلتزم المعلم بدقة المادة العلمية، وعدم نشر محتوى مخالف للقانون أو الآداب العامة أو منتهك لحقوق الآخرين، ويتحمل مسؤولية ما ينشره."], ["teacher", "العدالة في التصحيح", "يلتزم المعلم بتصحيح الامتحانات والواجبات بعدالة وفي وقت مناسب، وبالنظر في اعتراضات الطلاب بموضوعية."], ["teacher", "احترام الطلاب وسرية بياناتهم", "يلتزم المعلم بحسن التعامل مع الطلاب، وبعدم استخدام بياناتهم أو نتائجهم خارج الغرض التعليمي أو الإفصاح عنها لأي طرف."], ["general", "حذف الحساب", "يحق للمستخدم حذف حسابه في أي وقت من صفحة الملف الشخصي. الحذف نهائي ولا يمكن التراجع عنه."], ["general", "تعديل الشروط", "يحق للمنصة تحديث هذه الشروط من وقت لآخر، ويُعد استمرار استخدامك للمنصة بعد التحديث موافقة عليها."], ["general", "التواصل والدعم", "لأي استفسار أو شكوى تواصل مع فريق الدعم عبر صفحة الدعم داخل المنصة."]];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SEC = {platform:['حقوق المنصة','fa-building-shield'],student:['حقوق الطالب','fa-user-graduate'],teacher:['حقوق المعلم','fa-chalkboard-user'],general:['أحكام عامة','fa-scale-balanced']};
const defItems = () => DEFAULTS.map(([section,title,content],i) => ({id:'d'+i,section,title,content}));
const applyTheme = (t) => {document.documentElement.setAttribute('data-theme',t);localStorage.setItem('meezan_theme',t);$('thi').className=t==='dark'?'fas fa-sun':'fas fa-moon';};
applyTheme(localStorage.getItem('meezan_theme')||'light');
$('th').onclick = () => applyTheme(document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark');
let items = defItems(), openId = decodeURIComponent(location.hash.slice(1) || '');
function render() {
  const q = $('q').value.trim().toLowerCase(); let h = '', n = 0;
  for (const k in SEC) {
    const l = items.filter(t => t.section === k && (!q || (t.title + ' ' + t.content).toLowerCase().includes(q)));
    if (!l.length) continue;
    h += `<h2 class="sec"><i class="fas ${SEC[k][1]}"></i>${SEC[k][0]}<span>${l.length}</span></h2>` + l.map(t => `<div class="it${t.id === openId ? ' open' : ''}" data-id="${esc(t.id)}"><button class="q"><b>${++n}</b><span>${esc(t.title)}</span><i class="fas fa-chevron-down"></i></button><div class="a"><div><p>${esc(t.content)}</p></div></div></div>`).join('');
  }
  $('list').innerHTML = h || '<div class="empty"><i class="fas fa-file-circle-question"></i>لا توجد شروط مطابقة</div>';
}
$('list').onclick = (e) => {
  const b = e.target.closest('.q'); if (!b) return;
  const it = b.parentElement, was = it.classList.contains('open');
  document.querySelectorAll('.it.open').forEach(x => x.classList.remove('open'));
  if (was) { openId = ''; return; }
  it.classList.add('open'); openId = it.dataset.id;
  setTimeout(() => it.scrollIntoView({ behavior: 'smooth', block: 'nearest' }), 380);
};
$('q').oninput = render;
$('bk').onclick = () => history.length > 1 ? history.back() : (location.href = 'login.html');
onSnapshot(doc(db, 'settings', 'terms'), (s) => { if (s.exists()) items = s.data().items || []; render(); }, () => render());
render();
</script></body></html>
