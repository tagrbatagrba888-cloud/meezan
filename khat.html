<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#0B3D2E">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ميزان | مصنع خط اليد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/opentype.js/1.3.4/opentype.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#F5F1E8;--sf:#fff;--tx:#0B3D2E;--mt:#5A6B66;--bd:#E0E5E1;--ac:#0B3D2E;--ac2:#E6EFE9;--ac-tx:#fff;--dg:#C0392B;--ok:#1E7A5A;--pg:linear-gradient(135deg,#0B3D2E,#1E7A5A);--sh:rgba(11,61,46,.2);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[data-theme="dark"]{--bg:#0A1612;--sf:#11201B;--tx:#F5F1E8;--mt:#9BAEA6;--bd:#1E3A31;--ac:#C9A961;--ac2:#1A2C25;--ac-tx:#0A1612;--dg:#E74C3C;--ok:#2ECC71;--pg:linear-gradient(135deg,#C9A961,#F0DBA8);--sh:rgba(0,0,0,.5);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 Cairo,"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
h1{font-size:18px;margin:0 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button,select,input[type=text]{font:inherit;font-weight:700;color:var(--tx);background:var(--sf);border:2px solid var(--bd);border-radius:12px;padding:9px 14px;transition:.2s}input[type=text]:focus,select:focus{outline:none;border-color:var(--ac)}
button{cursor:pointer}button:hover{border-color:var(--ac)}
.pri{background:var(--pg);color:var(--ac-tx);border-color:transparent;font-weight:800;box-shadow:0 6px 18px var(--sh)}
.dg{color:var(--dg)}select{flex:1;min-width:140px}
main{max-width:900px;margin:0 auto;padding:14px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:6px 0 12px}.bar i{display:block;height:100%;background:var(--ac);width:0;transition:width .3s}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px}.tabs button{white-space:nowrap}.tabs .on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.cell{aspect-ratio:1;padding:2px;position:relative;display:flex;align-items:center;justify-content:center;font-size:22px;border-radius:12px;overflow:hidden}
.cell img{width:100%;height:100%;object-fit:contain;border-radius:8px;background:#fff}
.cell.done{border-color:var(--ac)}
.cv.l{box-shadow:inset 5px 0 0 var(--ac)}.cv.r{box-shadow:inset -5px 0 0 var(--ac)}.cv.l.r{box-shadow:inset 5px 0 0 var(--ac),inset -5px 0 0 var(--ac)}#forms .on{background:var(--ac2);border-color:var(--ac);color:var(--ac);font-weight:600}
.hint{color:var(--mt);font-size:13px;margin:10px 0}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}.ov.show{display:flex}
.md{background:var(--sf);border:2px solid var(--bd);border-radius:20px;padding:22px;width:100%;max-width:420px;max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.md h2{margin:0 0 10px;font-size:17px}
.cv{position:relative;width:100%;max-width:340px;aspect-ratio:1;margin:0 auto;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:#fff;touch-action:none}
canvas{width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.gl{position:absolute;inset-inline:0;height:0;border-top:1px dashed #9ab;pointer-events:none}.gl b{position:absolute;inset-inline-start:3px;top:-14px;font:10px sans-serif;color:#789;font-weight:400}
.tools{margin:10px 0}.tools label{font-size:13px;color:var(--mt)}
.pv{margin:10px 0;padding:14px;background:#fff;color:#000;border:2px solid var(--ac);border-radius:12px;min-height:150px;max-height:50vh;font-size:80px;line-height:1.5;word-break:break-word;overflow:auto;-webkit-font-smoothing:antialiased}#dlov .md{max-width:620px}#dlov label input{vertical-align:middle}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(140px);background:var(--sf);color:var(--tx);padding:14px 22px;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.3);border:2px solid var(--bd);font-weight:700;font-size:14px;display:flex;align-items:center;gap:10px;z-index:99999;transition:transform .4s ease,opacity .3s;opacity:0;max-width:calc(100vw - 32px)}.toast.show{transform:translateX(-50%) translateY(0);opacity:1}.toast.success{border-color:var(--ok)}.toast.success i{color:var(--ok)}.toast.error{border-color:var(--dg)}.toast.error i{color:var(--dg)}
.dl{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom,0px));margin-top:16px;width:100%;padding:12px}
.lims{display:flex;gap:6px;flex-wrap:wrap}.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:800;padding:7px 12px;border-radius:12px;background:var(--ac2);color:var(--ac);border:2px solid var(--bd)}.chip.full{color:var(--dg);border-color:var(--dg)}
.md h2{font-weight:900}#dgov{z-index:40}
</style>
</head>
<body>
<header>
  <h1>✍️ مصنع خط اليد</h1>
  <div class="row">
    <select id="proj" aria-label="المشروع"></select>
    <button id="np">+ مشروع</button><button id="rn">تسمية</button><button id="dp" class="dg">حذف</button><button id="ex">تصدير</button><button id="im">استيراد</button><input type="file" id="fim" accept=".json,application/json" hidden><span class="lims" id="lims"></span>
  </div>
</header>
<main>
  <div class="row" style="justify-content:space-between"><span id="prog" class="hint" style="margin:0"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="tabs" id="tabs"></div>
  <div class="tabs" id="forms"></div>
  <div class="grid" id="grid"></div>
  <p class="hint">اختر المجموعة ثم الشكل (منفصل / أول / وسط / آخر الكلمة) واضغط على الحرف لتكتبه أو ترفع صورته أو تصوّره. الربط بين الحروف يتم تلقائياً داخل الخط. لا يشترط إكمال كل شيء؛ الأشكال الناقصة تُستبدل بالشكل المنفصل.</p>
  <button class="pri dl" id="dl">⬇ تنزيل الخط</button>
</main>

<div class="ov" id="edov"><div class="md">
  <h2>الحرف: <span id="edch" style="font-size:26px"></span></h2>
  <div class="cv" id="cv"><canvas id="c" width="240" height="240"></canvas>
    <div class="gl" style="top:20%"><b>الارتفاع</b></div><div class="gl" style="top:50%"><b>منتصف</b></div><div class="gl" style="top:80%;border-color:#c55"><b>خط الأساس</b></div></div>
  <p class="hint" id="edhint" style="margin:8px 0 0"></p>
  <div class="tools row">
    <label>سمك القلم <input type="range" id="sz" min="3" max="30" value="12"></label>
    <button id="er">ممحاة</button><button id="un">تراجع</button><button id="rd">إعادة</button><button id="cl">مسح</button>
  </div>
  <div class="tools row">
    <button id="up">🖼 رفع صورة</button><button id="cam">📷 تصوير</button>
    <input type="file" id="f1" accept="image/*" hidden><input type="file" id="f2" accept="image/*" capture="environment" hidden>
  </div>
  <div class="tools" id="thw" style="display:none"><label>حساسية الصورة <input type="range" id="th" min="60" max="210" value="140"></label></div>
  <div class="row"><button id="pv">→ السابق</button><button id="nx">التالي ←</button><span style="flex:1"></span>
    <button id="ca">إلغاء</button><button class="pri" id="sv">حفظ</button></div>
</div></div>

<div class="ov" id="dlov"><div class="md">
  <h2>تنزيل الخط</h2>
  <p class="hint" id="dlinfo" style="margin-top:0"></p>
  <input type="text" id="fname" placeholder="اسم الخط (مثال: MyHand)" style="width:100%" maxlength="40">
  <input type="text" id="ptxt" style="width:100%;margin-top:8px" value="بسم الله الرحمن الرحيم لا Hello ١٢٣">
  <div class="row" style="margin-top:8px"><label class="hint" style="margin:0">حجم المعاينة <input type="range" id="psz" min="24" max="180" value="80"></label><label class="hint" style="margin:0">سماكة الخط <input type="range" id="gw" min="0" max="24" value="6"></label><label class="hint" style="margin:0">توحيد الحجم <input type="range" id="nm" min="0" max="100" value="100"></label></div>
  <div class="row" style="margin-top:6px"><button data-p="ابتثجحخدذرزسشصضطظعغفقكلمنهوي">الحروف</button><button data-p="بسم الله الرحمن الرحيم">كلمات</button><button data-p="لا لأ لإ لآ الله">لام ألف</button><button data-p="ABC abc xyz 123">English</button><button data-p="٠١٢٣٤٥٦٧٨٩ 0123456789">أرقام</button></div>
  <div class="pv" id="pvbox" dir="auto">…</div>
  <div class="row"><button id="dlc">إغلاق</button><span style="flex:1"></span><button class="pri" id="dlgo">تنزيل .ttf</button></div>
</div></div>
<div class="ov" id="dgov"><div class="md">
  <h2 id="dgt"></h2><p class="hint" id="dgm" style="margin:0 0 10px"></p>
  <input type="text" id="dgi" style="width:100%" maxlength="40" autocomplete="off">
  <div class="row" style="margin-top:14px"><button class="pri" id="dgok" style="flex:1"></button><button id="dgno">إلغاء</button></div>
</div></div>
<div class="toast" id="toast"><i class="fas fa-check-circle" id="ticon"></i><span id="ttext"></span></div>

<script>
const $=s=>document.querySelector(s);
/* ===== ميزان: الدخول + Firebase + الحدود ===== */
if(sessionStorage.getItem('meezan_logged_in')!=='true')location.replace('login.html');
document.documentElement.setAttribute('data-theme',localStorage.getItem('meezan_theme')||'light');
firebase.initializeApp({apiKey:"AIzaSyAmkCOrSaklhUiDdDfZCpSDQNmMYP-Gdw0",authDomain:"qanon-c716d.firebaseapp.com",projectId:"qanon-c716d",storageBucket:"qanon-c716d.firebasestorage.app",messagingSenderId:"757756130875",appId:"1:757756130875:web:63c53534c6843e2a29ce1e"});
const db=firebase.firestore(),TS=()=>firebase.firestore.FieldValue.serverTimestamp();
const COL={fonts:'userFonts',glyphs:'userFontGlyphs',lim:'settings'};
const sessId=sessionStorage.getItem('meezan_user_id')||'',sessName=(sessionStorage.getItem('meezan_username')||'').trim().toLowerCase();let ME=null;try{const r=sessionStorage.getItem('meezan_user_data');if(r)ME=JSON.parse(r)}catch(e){}
const UKEY=String(sessId||sessName||'anon').replace(/[\/\s]/g,'_'),UNAME=String((ME&&(ME.name||ME.username))||sessName),UCODE=String((ME&&(ME.code||ME.userCode))||localStorage.getItem('meezan_my_code')||''),UID=UKEY,HP='hf_p_'+UID,HC='hf_c_'+UID;
const D='بتثجحخسشصضطظعغفقكلمنهيئى',R='اأإآدذرزوؤة';
const XD='پٹټٿٻچڃڄڇڤڨکڭڠگڳڱیېێہھښځڅڼڵ',XR='ڈڊډڍڌڎڑړڕږژۆۇۈۉۋۅۍےۓںۀۃٱ';
const LA=['لا','لأ','لإ','لآ'],AL={'لا':'ا','لأ':'أ','لإ':'إ','لآ':'آ'};
const SD=new Set([...D+XD]),SR=new Set([...R+XR]),ARS=new Set([...D+XD+R+XR+'ء']);
const jt=c=>SD.has(c)?'D':SR.has(c)?'R':'U';
const GR={
 'عربي أساسي':{c:[...'ابتثجحخدذرزسشصضطظعغفقكلمنهويءآأإؤئةى'],ar:1},
 'لام ألف':{c:LA,ar:1,la:1},
 'عربي ممتد (فارسي/أردو/كردي/بشتو…)':{c:[...XD+XR],ar:1},
 'أرقام وعلامات':{c:[...'٠١٢٣٤٥٦٧٨٩۰۱۲۳۴۵۶۷۸۹،؛؟٪٫٬']},
 'A–Z':{c:[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ']},
 'a–z':{c:[...'abcdefghijklmnopqrstuvwxyz']},
 '0–9':{c:[...'0123456789']},
 'رموز':{c:[...'.,:;!?\'"-_()[]{}/\\@#$%&*+=<>|~^`«»']}
};
const FM=[['','منفصل'],['i','أول الكلمة'],['m','وسط الكلمة'],['f','آخر الكلمة']];
const fmOf=g=>g.la?[FM[0],FM[3]]:g.ar?FM:[];
function slots(t=tab,f=form){const g=GR[t];if(!g.ar)return g.c.slice();
 return g.c.filter(c=>g.la||!f||f==='f'&&jt(c)!=='U'||(f==='i'||f==='m')&&jt(c)==='D').map(c=>c+(f?'|'+f:''))}
const ALL=new Set();for(const t in GR)for(const[f]of fmOf(GR[t]).length?fmOf(GR[t]):[['']])slots(t,f).forEach(k=>ALL.add(k));
const disp=k=>{const[c,f]=k.split('|');return f==='i'?c+'\u200D':f==='m'?'\u200D'+c+'\u200D':f==='f'?'\u200D'+c:c};
const HINT={i:'الحرف في أول الكلمة: مدّ الخط حتى يلمس الحافة اليسرى (حيث يتصل بالحرف التالي) عند خط الأساس.',f:'الحرف في آخر الكلمة: مدّ الخط حتى يلمس الحافة اليمنى (حيث يتصل بالحرف السابق) عند خط الأساس.',m:'الحرف في وسط الكلمة: مدّ الخط ليلمس الحافتين اليمنى واليسرى عند خط الأساس.'};
const N=240,BASE=192,S=1000/N;
let P=[],cur,tab='عربي أساسي',form='',ch=null,stack=[],eraser=false,srcImg=null,fontBuf=null;
const cv=$('#c'),cx=cv.getContext('2d',{willReadFrequently:true});
const uid=()=>Math.random().toString(36).slice(2,9);
const proj=()=>P.find(p=>p.id===cur);
function toast(m,type){const t=$('#toast'),er=type?type==='error':/^(تعذر|وصلت|اكتب|خطأ|لا يوجد|الخط غير)/.test(m);
 $('#ttext').textContent=m;$('#ticon').className=er?'fas fa-times-circle':'fas fa-check-circle';t.className='toast show '+(er?'error':'success');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),2800)}
function ask(o){return new Promise(res=>{const ov=$('#dgov'),i=$('#dgi');$('#dgt').textContent=o.title;$('#dgm').textContent=o.msg||'';$('#dgm').style.display=o.msg?'':'none';
 i.style.display=o.input?'':'none';i.value=o.value||'';i.placeholder=o.label||'';const ok=$('#dgok');ok.textContent=o.ok||'تأكيد';ok.className=o.danger?'':'pri';if(o.danger)ok.style.cssText='flex:1;color:var(--dg);border-color:var(--dg)';else ok.style.cssText='flex:1';
 ov.classList.add('show');if(o.input)setTimeout(()=>{i.focus();i.select()},40);
 const done=v=>{ov.classList.remove('show');ok.onclick=$('#dgno').onclick=ov.onclick=i.onkeydown=null;res(v)};
 ok.onclick=()=>done(o.input?(i.value.trim()||null):true);$('#dgno').onclick=()=>done(null);ov.onclick=e=>{if(e.target===ov)done(null)};
 i.onkeydown=e=>{if(e.key==='Enter')ok.click();if(e.key==='Escape')done(null)}})}
function load(){try{P=JSON.parse(localStorage.getItem(HP)||'[]');cur=localStorage.getItem(HC)}catch(e){P=[]}
 if(!P.length)P=[{id:uid(),name:'مشروعي الأول',g:{}}];if(!P.find(p=>p.id===cur))cur=P[0].id}
function save(){try{localStorage.setItem(HP,JSON.stringify(P));localStorage.setItem(HC,cur)}catch(e){toast('تعذر الحفظ: المساحة ممتلئة')}}
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

/* ---------- المزامنة والحدود (Firestore) ---------- */
const limits=async()=>{try{return(await db.collection(COL.lim).doc('limits').get()).data()||{}}catch(e){return{}}};
const filled=p=>Object.keys(p.g).length>0;
async function room(){const l=await limits();if(!(l.maxFonts>0))return true;
 try{const c=(await db.collection(COL.fonts).where('ownerKey','==',UKEY).get()).size+P.filter(x=>!x.fid&&filled(x)).length;
  if(c>=l.maxFonts){toast('وصلت للحد الأقصى لعدد الخطوط ('+l.maxFonts+')');return false}return true}
 catch(e){toast('تعذر الاتصال: '+e.message);return false}}
async function ensureFid(p){if(p.fid)return true;
 try{const l=await limits(),c=(await db.collection(COL.fonts).where('ownerKey','==',UKEY).get()).size;
  if(l.maxFonts>0&&c>=l.maxFonts){toast('وصلت للحد الأقصى لعدد الخطوط ('+l.maxFonts+')');return false}
  const r=db.collection(COL.fonts).doc();await r.set({name:p.name,ownerKey:UKEY,userName:UNAME,userCode:UCODE,downloads:0,createdAt:Date.now(),updatedAt:Date.now()});p.fid=r.id;save();return true}
 catch(e){toast('تعذر الاتصال: '+e.message);return false}}
const timers={};let tt;
function sync(p){clearTimeout(timers[p.id]);if(!p.fid&&!filled(p))return;
 timers[p.id]=setTimeout(async()=>{try{if(!await ensureFid(p))return;
  await db.collection(COL.fonts).doc(p.fid).set({name:p.name,updatedAt:Date.now()},{merge:true});
  await db.collection(COL.glyphs).doc(p.fid).set({g:p.g})}catch(e){toast('تعذرت المزامنة: '+e.message)}},1200)}
async function pushTtf(p){if(!p.fid||!fontBuf)return;const u=new Uint8Array(fontBuf);let s='';
 for(let i=0;i<u.length;i+=8192)s+=String.fromCharCode.apply(null,u.subarray(i,i+8192));
 await db.collection(COL.fonts).doc(p.fid).set({ttf:btoa(s),updatedAt:Date.now()},{merge:true})}
async function takeDownload(){const p=proj();if(p.adminEdit)return true;
 try{if(!await ensureFid(p))return false;
  await db.collection(COL.glyphs).doc(p.fid).set({g:p.g});await pushTtf(p);
  const l=await limits(),ref=db.collection(COL.fonts).doc(p.fid);
  return await db.runTransaction(async t=>{const d=(await t.get(ref)).data()||{},n=d.downloads||0;
   if(l.maxDownloads>0&&n>=l.maxDownloads){toast('وصلت للحد الأقصى لتحميل هذا الخط ('+l.maxDownloads+')');return false}
   t.update(ref,{downloads:n+1});return true})}
 catch(e){toast('تعذر التحقق من حد التحميل: '+e.message);return false}}
async function boot(){const q=new URLSearchParams(location.search),id=q.get('edit');if(!id||q.get('admin')!=='1')return;
 try{const[m,g]=await Promise.all([db.collection(COL.fonts).doc(id).get(),db.collection(COL.glyphs).doc(id).get()]);
  if(!m.exists)return toast('الخط غير موجود');
  let p=P.find(x=>x.fid===id&&x.adminEdit);if(!p){p={id:uid(),name:m.data().name,g:{},fid:id,adminEdit:true};P.push(p)}
  p.g=(g.data()||{}).g||{};cur=p.id;save();render();toast('تعديل خط "'+p.name+'" للمستخدم '+(m.data().userName||''))}
 catch(e){toast('تعذر فتح الخط: '+e.message)}}

function render(){
 $('#proj').innerHTML=P.map(p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${esc(p.name)}</option>`).join('');
 const p=proj(),n=Object.keys(p.g).filter(k=>ALL.has(k)).length;
 $('#prog').textContent=`تم ${n} من ${ALL.size} شكل`;$('#bar').style.width=(n/ALL.size*100)+'%';
 const g=GR[tab],fs=fmOf(g);if(!fs.some(x=>x[0]===form))form='';
 $('#tabs').innerHTML=Object.keys(GR).map(k=>`<button data-t="${esc(k)}" class="${k===tab?'on':''}">${esc(k)}</button>`).join('');
 $('#forms').style.display=fs.length?'flex':'none';
 $('#forms').innerHTML=fs.map(([f,l])=>`<button data-f="${f}" class="${f===form?'on':''}">${l}</button>`).join('');

async function buildFont(name){

  const g={};let bad=0;for(const[k,u]of Object.entries(d.g)){if(ALL.has(k)&&typeof u==='string'&&u.length<400000&&/^data:image\/png;base64,[A-Za-z0-9+\/=]+$/.test(u))g[k]=u;else bad++}
  if(!Object.keys(g).length)throw Error('لا توجد رسومات صالحة');
  if(!confirm(`استيراد "${d.name.slice(0,40)}" (${Object.keys(g).length} شكل${bad?`، وتجاهل ${bad} غير صالح`:''}) كمشروع جديد؟ لن يتم استبدال مشاريعك الحالية.`))return;
