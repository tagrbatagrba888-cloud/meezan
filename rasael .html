    c.toBlob(r=>{if(r&&r.type==='image/webp')fin(r);else{x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,h);c.toBlob(j=>fin(j),'image/jpeg',.5)}},'image/webp',.5)};

function packVideo(b,prog){return new Promise(res=>{

    try{const sc=Math.min(1,640/Math.max(v.videoWidth,v.videoHeight)),w=(Math.round(v.videoWidth*sc/2)*2)||2,h=(Math.round(v.videoHeight*sc/2)*2)||2;
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;const x=cv.getContext('2d');
      ac=new (window.AudioContext||window.webkitAudioContext)();const dest=ac.createMediaStreamDestination();ac.createMediaElementSource(v).connect(dest);

      const draw=()=>{if(done)return;x.drawImage(v,0,0,w,h);prog&&prog(Math.min(99,Math.round(v.currentTime/v.duration*100)));if(!v.ended)requestAnimationFrame(draw)};

  if(a==='close'){if(M.mode==='shared'&&L&&L.by===me){const x=L;updateDoc(lref(),{active:false}).catch(()=>{});dropFile({fileId:x.fileId,chunks:x.chunks})}else if(M.mode==='shared')M.declined=L?L.fileId:'';mReset()}});
$('mbar').addEventListener('input',e=>{if(e.target.id==='mbSl')e.target._d=1});
$('mbar').addEventListener('change',e=>{if(e.target.id!=='mbSl')return;const d=mDur(),pos=e.target.value/1000*d;e.target._d=0;if(!d)return;
  if(M.mode==='shared'&&L)updateDoc(lref(),{pos,at:Date.now()}).catch(()=>{});else mAud.currentTime=pos});
$('musicB').onclick=()=>$('mfile').click();
$('mfile').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!cur)return;
  if(M.mode!=='none'){if(M.mode==='shared'&&L&&L.by===me)updateDoc(lref(),{active:false}).catch(()=>{});mReset()}
  M={mode:'local',url:URL.createObjectURL(f),name:f.name.replace(/\.[^.]+$/,''),file:f,joined:false,declined:M.declined};mAud.src=M.url;mAud.play().catch(()=>{});renderMbar()};

/* ===== إشعار داخل الصفحة ===== */
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.setValueAtTime(.12,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.35);o.start();o.stop(a.currentTime+.35)}catch(e){}}
function banner(c){const o=c.kind==='platform'?'platform':other(c);
  $('ban').innerHTML=`${avatar(o)}<div class="grow"><div class="t">${esc(nm(o))}</div><div class="s">${esc(c.lastText)}</div></div><i class="fas fa-comment-dots" style="color:var(--success)"></i>`;
  $('ban').classList.add('on');clearTimeout(banner.h);banner.h=setTimeout(()=>$('ban').classList.remove('on'),5500);
  if(navigator.vibrate)navigator.vibrate([150,80,150]);beep();
  $('ban').onclick=()=>{$('ban').classList.remove('on');openById(c.id)}}

/* ===== المكالمات (WebRTC عبر Firestore) ===== */
const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302']}]};
let call=null,ringT=null;
const ring=on=>{clearInterval(ringT);ringT=null;if(on){beep();ringT=setInterval(beep,1600)}};
const cbtn=(id,ic,cls)=>`<button class="cb ${cls||''}" id="${id}"><i class="fas ${ic}"></i></button>`;
function callUI(o,kind,state){
  $('cuAv').innerHTML=avatar(o);$('cuName').textContent=nm(o);$('callUI').classList.add('on');
  $('callUI').classList.toggle('vid',kind==='video');$('callUI').classList.remove('conn');
  if(state==='incoming'){$('rv').style.display=$('lv').style.display='none';$('cuSt').textContent=kind==='video'?'مكالمة فيديو واردة':'مكالمة صوتية واردة';
    $('ctl').innerHTML=cbtn('cDec','fa-phone-slash','end')+cbtn('cAcc',kind==='video'?'fa-video':'fa-phone','ok')}
  else{$('cuSt').textContent=state;
    $('ctl').innerHTML=(kind==='video'?cbtn('cCam','fa-video'):'')+cbtn('cMic','fa-microphone')+cbtn('cSpk',kind==='video'?'fa-volume-high':'fa-volume-low',kind==='video'?'off':'')+cbtn('cEnd','fa-phone-slash','end')}}
function bindCtl(){const c=call;if(!c)return;
  const e=$('cEnd');if(e)e.onclick=()=>endCall('ended');
  const m=$('cMic');if(m)m.onclick=()=>{const t=c.stream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;m.classList.toggle('off',!t.enabled);m.innerHTML=`<i class="fas ${t.enabled?'fa-microphone':'fa-microphone-slash'}"></i>`}};
  const v=$('cCam');if(v)v.onclick=()=>{const t=c.stream.getVideoTracks()[0];if(t){t.enabled=!t.enabled;v.classList.toggle('off',!t.enabled);v.innerHTML=`<i class="fas ${t.enabled?'fa-video':'fa-video-slash'}"></i>`}};
  const sp=$('cSpk');if(sp){c.spk=c.kind==='video';sp.onclick=async()=>{const el=$('rv');
    if(!el.setSinkId)return toast('متصفحك لا يدعم تبديل السماعة من هنا، استخدم أزرار الصوت في جهازك');
    const on=!c.spk;let devs=[];try{devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audiooutput')}catch(e){}
    const pick=on?devs.find(d=>/speaker|مكبر|خارجية/i.test(d.label)&&!/earpiece|receiver|head/i.test(d.label)):devs.find(d=>/earpiece|receiver|الأذن|الداخلية/i.test(d.label));
    try{await el.setSinkId(pick?pick.deviceId:'default');if(!pick)toast('لا توجد سماعة أخرى متاحة في هذا المتصفح')}catch(e){return toast('تعذّر تبديل السماعة')}
    c.spk=on;sp.classList.toggle('off',on);sp.innerHTML=`<i class="fas ${on?'fa-volume-high':'fa-volume-low'}"></i>`;toast(on?'السماعة الخارجية':'السماعة الداخلية')}}}
function setupCall(id,isCaller,o,kind,stream){
  const pc=new RTCPeerConnection(ICE);call={id,pc,stream,isCaller,o,kind,connected:false,pend:[],unsubs:[]};
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack=e=>{$('rv').srcObject=e.streams[0];if(kind==='video')$('rv').style.display='block'};
  pc.onicecandidate=e=>{if(e.candidate)addDoc(collection(db,'calls',id,'cand'),{from:me,c:JSON.stringify(e.candidate)}).catch(()=>{})};
  pc.onconnectionstatechange=()=>{const s=pc.connectionState;if(s==='connected'&&call&&call.id===id){call.connected=true;clearTimeout(call.ringTimer);ring(false);$('callUI').classList.add('conn');call.t0=Date.now();call.tick=setInterval(()=>{$('cuSt').textContent=mmss((Date.now()-call.t0)/1000)},1000)}if(s==='failed'||s==='closed')endCall('ended')};
  const flush=()=>call.pend.splice(0).forEach(c=>pc.addIceCandidate(c).catch(()=>{}));call.flush=flush;
  call.unsubs.push(onSnapshot(collection(db,'calls',id,'cand'),s=>s.docChanges().forEach(ch=>{if(ch.type!=='added')return;const d=ch.doc.data();if(d.from===me)return;const c=JSON.parse(d.c);if(pc.remoteDescription)pc.addIceCandidate(c).catch(()=>{});else call.pend.push(c)})));
  call.unsubs.push(onSnapshot(doc(db,'calls',id),async s=>{const d=s.data();if(!d||!call||call.id!==id)return;
    if(isCaller&&d.answer&&!pc.currentRemoteDescription){await pc.setRemoteDescription(d.answer);flush()}
    if(['ended','declined','missed'].includes(d.status)){if(d.status==='declined')toast('تم رفض المكالمة');endCall(null,true)}}));
  if(kind==='video'){$('lv').srcObject=stream;$('lv').style.display='block'}}
async function startCall(kind){
  if(!allowed()||!cur||call)return;let stream;
  try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:kind==='video'?{facingMode:'user'}:false})}catch(e){return toast('اسمح بالميكروفون'+(kind==='video'?' والكاميرا':'')+' من الإعدادات')}
  const id='call_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),o=cur.o,chatId=cur.id;
  await setDoc(doc(db,'calls',id),{chatId,from:me,to:o,kind,status:'ringing',createdAt:serverTimestamp()});
  setupCall(id,true,o,kind,stream);callUI(o,kind,'جاري الاتصال...');
  if(kind==='video'){$('lv').srcObject=stream;$('lv').style.display='block'}
  bindCtl();
  const pc=call.pc,off=await pc.createOffer();await pc.setLocalDescription(off);
  await updateDoc(doc(db,'calls',id),{offer:{type:off.type,sdp:off.sdp}});
  if(o!=='platform'&&!(await isMutedByOther(chatId,o)))notifyUser(o,'📞 '+(realName(byId[me])),kind==='video'?'مكالمة فيديو واردة — اضغط للرد':'مكالمة صوتية واردة — اضغط للرد','rasael.html?call='+id,true,'call_'+id).catch(()=>{});
  call.ringTimer=setTimeout(()=>{if(call&&call.id===id&&!call.connected){toast('لم يرد');endCall('missed')}},45000)}
async function acceptCall(id,d){
  ring(false);let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true},video:d.kind==='video'?{facingMode:'user'}:false})}catch(e){toast('اسمح بالميكروفون والكاميرا');return declineCall(id)}
  setupCall(id,false,d.from,d.kind,stream);callUI(d.from,d.kind,'جاري التوصيل...');
  if(d.kind==='video'){$('lv').srcObject=stream;$('lv').style.display='block'}
  bindCtl();
  const pc=call.pc;await pc.setRemoteDescription(d.offer);call.flush();
  const ans=await pc.createAnswer();await pc.setLocalDescription(ans);
  await updateDoc(doc(db,'calls',id),{answer:{type:ans.type,sdp:ans.sdp},status:'active'})}
const declineCall=id=>{ring(false);$('callUI').classList.remove('on');updateDoc(doc(db,'calls',id),{status:'declined'}).catch(()=>{});cleanupCall(id)};
/* بعد انتهاء المكالمة نمسح بياناتها من الخادم */
function cleanupCall(id){setTimeout(async()=>{try{const s=await getDocs(collection(db,'calls',id,'cand'));const b=writeBatch(db);s.docs.forEach(d=>b.delete(d.ref));await b.commit();await deleteDoc(doc(db,'calls',id))}catch(e){}},5000)}
function endCall(st,remote){if(!call)return;const c=call;call=null;ring(false);clearTimeout(c.ringTimer);clearInterval(c.tick);c.unsubs.forEach(u=>u());try{c.pc.close()}catch(e){}c.stream.getTracks().forEach(t=>t.stop());
  $('callUI').classList.remove('on','conn');$('rv').srcObject=null;$('lv').srcObject=null;$('rv').style.display=$('lv').style.display='none';
  if(!remote&&st)updateDoc(doc(db,'calls',c.id),{status:st}).catch(()=>{});cleanupCall(c.id)}
$('cCall').onclick=()=>startCall('audio');$('cVid').onclick=()=>startCall('video');
let incId=null;
onSnapshot(query(collection(db,'calls'),where('to','==',me),where('status','==','ringing')),s=>s.docChanges().forEach(ch=>{
  const d=ch.doc.data(),id=ch.doc.id;
  if(ch.type==='removed'){if(incId===id&&!call){incId=null;ring(false);$('callUI').classList.remove('on')}return}
  if(!allowed()||call||!d.offer||incId===id)return;
  const age=Date.now()-(tsv(d.createdAt)||Date.now());if(age>45000)return;
  incId=id;callUI(d.from,d.kind,'incoming');if(navigator.vibrate)navigator.vibrate([400,200,400,200,400]);ring(true);
  $('cDec').onclick=()=>{incId=null;declineCall(id)};$('cAcc').onclick=async()=>{incId=null;await acceptCall(id,d)}}));

/* فتح آخر محادثة فورًا بعد التحديث (بدون انتظار) */
restore();
</script>
