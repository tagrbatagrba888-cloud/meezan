<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0B3D2E">
<title>الرسائل | MEEZAN</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/ymXPqr46/file-00000000af0c820aa687a3c3181a6a24.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#0B3D2E;--primary-light:#145A43;--accent:#C9A961;--bg-page:#F5F1E8;--bg-card:#fff;--bg-input:#F8FBF9;--text-main:#0B3D2E;--text-sub:#5A6B66;--border:#E0E5E1;--shadow:rgba(11,61,46,.15);--error:#C0392B;--success:#1E7A5A;--mine:#DCF1E6}
[data-theme=dark]{--primary:#C9A961;--primary-light:#E0C888;--accent:#0B3D2E;--bg-page:#0A1612;--bg-card:#11201B;--bg-input:#1A2C25;--text-main:#F5F1E8;--text-sub:#9BAEA6;--border:#1E3A31;--shadow:rgba(0,0,0,.5);--error:#E74C3C;--success:#2ECC71;--mine:#1E4A3A}
html,body{font-family:'Cairo',sans-serif;background:var(--bg-page);color:var(--text-main);min-height:100%;overflow-x:hidden}
input,textarea,button{font-family:inherit;font-size:16px}
.header{background:var(--bg-card);border-bottom:1px solid var(--border);box-shadow:0 4px 20px var(--shadow);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.header h1{font-size:19px;font-weight:900;flex:1}
.ib{width:42px;height:42px;border-radius:13px;background:var(--bg-input);border:2px solid var(--border);color:var(--primary);display:flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none;flex-shrink:0}
.wrap{max-width:700px;margin:auto;padding:14px 14px 100px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:12px;box-shadow:0 4px 16px var(--shadow);margin-bottom:10px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.t{font-weight:800}.s{font-size:12px;color:var(--text-sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.av{width:46px;height:46px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;object-fit:cover;flex-shrink:0;border:2px solid var(--accent)}
[data-theme=dark] .av{color:var(--bg-page)}
.badge{min-width:22px;height:22px;border-radius:11px;background:var(--success);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0 6px}
.empty{text-align:center;color:var(--text-sub);padding:36px 10px;font-weight:700}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:22px;width:60px;height:60px;border-radius:50%;border:none;background:#25A25A;color:#fff;font-size:24px;box-shadow:0 8px 24px rgba(37,162,90,.5);cursor:pointer;z-index:60}
.btn{padding:11px 16px;border-radius:13px;border:none;background:var(--primary);color:#fff;font-weight:800;cursor:pointer}
[data-theme=dark] .btn{color:var(--bg-page)}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:2px solid var(--border);background:var(--bg-input);color:var(--text-main);outline:none;margin-bottom:10px;direction:ltr;text-align:left;letter-spacing:1px}
.inp:focus{border-color:var(--accent)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg-page);width:100%;max-width:700px;border-radius:22px 22px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.res{margin-top:6px;font-weight:800}
.res.no{color:var(--error)}.res.ok{color:var(--success)}
.chat{position:fixed;left:0;right:0;top:0;height:100dvh;background:var(--bg-page);z-index:300;display:none;flex-direction:column}
.chat.on{display:flex}
.chead{background:var(--bg-card);border-bottom:1px solid var(--border);padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px;flex:0 0 auto}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 18px;display:flex;flex-direction:column;gap:7px}
.b{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--bg-card);border:1px solid var(--border);align-self:flex-start;position:relative;word-break:break-word;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.b.me{align-self:flex-end;background:var(--mine)}
.b.del{opacity:.55;font-style:italic}
.b img,.b video,.b iframe{max-width:100%;border-radius:12px;display:block;margin-top:6px;border:0}
.b iframe{width:260px;height:150px}
.b audio{max-width:100%;margin-top:4px}
.b a{color:var(--primary-light);font-weight:700}
.meta{font-size:10px;color:var(--text-sub);margin-top:3px;display:flex;gap:6px}
.rx{position:absolute;bottom:-12px;left:8px;background:var(--bg-card);border:1px solid var(--border);border-radius:12px;padding:0 6px;font-size:13px}
.cbar{flex:0 0 auto;background:var(--bg-card);border-top:1px solid var(--border);padding:8px 10px calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end}
.cbar textarea{flex:1;resize:none;max-height:110px;padding:10px 14px;border-radius:20px;border:2px solid var(--border);background:var(--bg-input);color:var(--text-main);outline:none;line-height:1.4}
.send{width:44px;height:44px;border-radius:50%;border:none;background:var(--primary);color:#fff;cursor:pointer;flex-shrink:0}
[data-theme=dark] .send{color:var(--bg-page)}
.send.rec{background:var(--error);color:#fff;animation:p 1s infinite}
@keyframes p{50%{opacity:.6}}
.menu{position:fixed;z-index:400;background:var(--bg-card);border:1px solid var(--border);border-radius:16px;box-shadow:0 8px 30px var(--shadow);padding:8px;display:none;min-width:180px}
.menu.on{display:block}
.emo{display:flex;gap:6px;padding:4px 4px 8px;font-size:24px;border-bottom:1px solid var(--border);margin-bottom:4px}
.emo span{cursor:pointer}
.mi{padding:9px 10px;border-radius:10px;font-weight:700;cursor:pointer;display:flex;gap:8px;align-items:center}
.mi:active{background:var(--bg-input)}.mi.red{color:var(--error)}
#toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:var(--primary);color:#fff;padding:10px 18px;border-radius:14px;z-index:900;display:none;font-weight:700;max-width:90%;text-align:center}
[data-theme=dark] #toast{color:var(--bg-page)}
.fl{margin-top:6px;padding:10px 12px;border-radius:12px;background:var(--bg-input);border:1px dashed var(--border);cursor:pointer;font-weight:700;font-size:13px}
</style>
</head>
<body>
<div class="header">
  <a href="index_1.html" class="ib"><i class="fas fa-arrow-right"></i></a>
  <h1><i class="fas fa-comments"></i> الرسائل</h1>
</div>
<div class="wrap"><div id="notice"></div><div id="list"></div></div>
<button class="fab" id="fab" title="محادثة جديدة"><i class="fas fa-message"></i></button>

<div class="ov" id="ovNew"><div class="sheet">
  <div class="t" style="margin-bottom:10px"><i class="fas fa-address-book"></i> مراسلة برقم الهاتف</div>
  <input class="inp" id="phone" type="tel" inputmode="numeric" placeholder="اكتب الرقم كاملًا" autocomplete="off">
  <button class="btn" id="srch" style="width:100%"><i class="fas fa-magnifying-glass"></i> بحث</button>
  <div class="res" id="res"></div>
  <div id="found"></div>
</div></div>

<div class="chat" id="chat">
  <div class="chead">
    <button class="ib" id="cBack"><i class="fas fa-arrow-right"></i></button>
    <div id="cAv"></div>
    <div class="grow" id="cHead" style="cursor:pointer"><div class="t" id="cName"></div><div class="s" id="cSub"></div></div>
    <button class="ib" id="cCall"><i class="fas fa-phone"></i></button>
    <button class="ib" id="cVid"><i class="fas fa-video"></i></button>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="cbar">
    <button class="ib" id="attach"><i class="fas fa-paperclip"></i></button>
    <input type="file" id="file" hidden>
    <textarea id="txt" rows="1" placeholder="اكتب رسالة..."></textarea>
    <button class="send" id="send"><i class="fas fa-microphone"></i></button>
  </div>
</div>
<div class="menu" id="menu"></div>
<div id="toast"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {getFirestore,doc,onSnapshot,setDoc,updateDoc,deleteField,collection,query,where,orderBy,limit,addDoc,serverTimestamp,arrayUnion,getDocs,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyAmkCOrSaklhUiDdDfZCpSDQNmMYP-Gdw0",authDomain:"qanon-c716d.firebaseapp.com",projectId:"qanon-c716d",storageBucket:"qanon-c716d.firebasestorage.app",messagingSenderId:"757756130875",appId:"1:757756130875:web:63c53534c6843e2a29ce1e"});
const db=getFirestore(app),$=id=>document.getElementById(id);
const PUSH_API='https://vercel-server-nine-tau.vercel.app/api/send';
if(sessionStorage.getItem('meezan_logged_in')!=='true')location.replace('login.html');
const me=sessionStorage.getItem('meezan_user_id');
try{const th=localStorage.getItem('meezan_theme')||localStorage.getItem('theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}

let users=[],byId={},cfg={allowAll:false,overrides:{}},chats=[],cur=null,unsub=null,msgCache={};
const nickKey='rsl_nick_'+me;let nicks={};try{nicks=JSON.parse(localStorage.getItem(nickKey)||'{}')}catch(e){}
const realName=u=>u?(u.fullName||u.username||'مستخدم'):'مستخدم';
const nm=id=>id==='platform'?'منصة ميزان':(nicks[id]||realName(byId[id]));
const avatar=id=>{const u=byId[id];if(id==='platform')return '<div class="av"><i class="fas fa-scale-balanced"></i></div>';return u&&/^https?:/.test(u.avatarUrl||'')?`<img class="av" src="${esc(u.avatarUrl)}">`:`<div class="av">${esc((nm(id)||'؟').trim()[0]||'؟')}</div>`};
const allowed=()=>me in (cfg.overrides||{})?!!cfg.overrides[me]:!!cfg.allowAll;
const other=c=>(c.members||[]).find(m=>m!==me);

onSnapshot(doc(db,'users','all'),s=>{users=s.exists()?(s.data().items||[]):[];byId={};users.forEach(u=>byId[u.id]=u);render();if(cur)head()});
onSnapshot(doc(db,'settings','messaging'),s=>{cfg=Object.assign({allowAll:false,overrides:{}},s.exists()?s.data():{});render()});
onSnapshot(query(collection(db,'chats'),where('members','array-contains',me)),s=>{chats=s.docs.map(d=>({id:d.id,...d.data()}));render();deep()});

/* قائمة المحادثات */
const ts=c=>c.updatedAt&&c.updatedAt.toMillis?c.updatedAt.toMillis():0;
const unread=c=>c.lastSenderId&&c.lastSenderId!==me&&ts(c)>((c.reads||{})[me]||0);
function render(){
  $('notice').innerHTML=allowed()?'':'<div class="card empty"><i class="fas fa-lock"></i><br>المراسلة غير متاحة لحسابك حاليًا</div>';
  $('fab').style.display=allowed()?'block':'none';
  const l=[...chats].sort((a,b)=>(a.kind==='platform'?-1:0)-(b.kind==='platform'?-1:0)||ts(b)-ts(a));
  $('list').innerHTML=l.length?l.map(c=>{const o=c.kind==='platform'?'platform':other(c);return `<div class="card row" data-c="${esc(c.id)}" style="cursor:pointer">${avatar(o)}<div class="grow"><div class="t">${esc(nm(o))}</div><div class="s">${esc(c.lastText||'')}</div></div>${unread(c)?'<div class="badge">●</div>':''}</div>`}).join(''):(allowed()?'<div class="empty">لا توجد محادثات بعد<br>اضغط الزر الأخضر لبدء محادثة</div>':'');
  $('list').querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>openById(e.dataset.c))}
let deepDone=false;function deep(){if(deepDone)return;const c=new URLSearchParams(location.search).get('c');if(c&&chats.find(x=>x.id===c)){deepDone=true;openById(c)}}
function openById(id){const c=chats.find(x=>x.id===id);if(!c)return;openChat(id,c.kind==='platform'?'platform':other(c),c.kind==='platform')}

/* محادثة جديدة بالرقم */
const norm=p=>{let d=String(p||'').replace(/[٠-٩]/g,x=>'٠١٢٣٤٥٦٧٨٩'.indexOf(x)).replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.startsWith('20')&&d.length===12)d='0'+d.slice(2);return d};
$('fab').onclick=()=>{$('phone').value='';$('res').textContent='';$('found').innerHTML='';$('ovNew').classList.add('on')};
$('ovNew').onclick=e=>{if(e.target===$('ovNew'))$('ovNew').classList.remove('on')};
$('srch').onclick=()=>{const n=norm($('phone').value);const r=$('res');$('found').innerHTML='';
  if(n.length<10){r.className='res no';r.textContent='اكتب الرقم كاملًا وصحيحًا';return}
  const u=users.find(x=>x.id!==me&&norm(x.phone)===n);
  if(!u){r.className='res no';r.textContent='هذا الرقم غير موجود';return}
  r.className='res ok';r.textContent='✅ موجود';
  $('found').innerHTML=`<div class="card row" style="margin-top:10px">${avatar(u.id)}<div class="grow t">${esc(realName(u))}</div><button class="btn" id="go">ابدأ مراسلة</button></div>`;
  $('go').onclick=()=>{$('ovNew').classList.remove('on');openChat(['x',me,u.id].slice(1).sort().join('_'),u.id,false)}};

/* نافذة الشات */
function fit(){const v=window.visualViewport;if(v){$('chat').style.height=v.height+'px';window.scrollTo(0,0)}}
if(window.visualViewport){visualViewport.addEventListener('resize',fit);visualViewport.addEventListener('scroll',fit)}
function head(){$('cName').textContent=nm(cur.o);$('cAv').innerHTML=avatar(cur.o);$('cSub').textContent=cur.plat?'الحساب الرسمي':'اضغط على الاسم لتغييره'}
function openChat(id,o,plat){cur={id,o,plat};head();
  $('cCall').style.display=$('cVid').style.display=plat?'none':'flex';
  $('chat').classList.add('on');fit();if(unsub)unsub();$('msgs').innerHTML='';
  unsub=onSnapshot(query(collection(db,'chats',id,'messages'),orderBy('createdAt'),limit(300)),s=>{
    msgCache={};s.docs.forEach(d=>msgCache[d.id]={id:d.id,...d.data()});
    $('msgs').innerHTML=s.docs.map(d=>bub(msgCache[d.id])).join('')||'<div class="empty">ابدأ المحادثة...</div>';
    bindBub();autoLoad();$('msgs').scrollTop=$('msgs').scrollHeight;markRead()})}
function markRead(){if(cur&&chats.find(c=>c.id===cur.id))setDoc(doc(db,'chats',cur.id),{reads:{[me]:Date.now()}},{merge:true}).catch(()=>{})}
$('cBack').onclick=()=>{$('chat').classList.remove('on');if(unsub)unsub();unsub=null;cur=null;if(history.replaceState)history.replaceState(null,'',location.pathname)};
$('cHead').onclick=()=>{if(!cur||cur.plat)return;const n=prompt('الاسم الذي يظهر لك (محفوظ على جهازك فقط)',nm(cur.o));if(n===null)return;if(n.trim())nicks[cur.o]=n.trim().slice(0,40);else delete nicks[cur.o];try{localStorage.setItem(nickKey,JSON.stringify(nicks))}catch(e){}head();render()};
$('cCall').onclick=$('cVid').onclick=()=>toast('المكالمات ستُضاف قريبًا');

/* عرض الرسائل */
const URL_RE=/(https?:\/\/[^\s<]+)/g;
function prev(url){const u=url.toLowerCase(),yt=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/);
  if(yt)return `<iframe src="https://www.youtube.com/embed/${yt[1]}" allowfullscreen loading="lazy"></iframe>`;
  if(/\.(png|jpe?g|gif|webp)(\?|$)/.test(u))return `<img src="${esc(url)}" loading="lazy">`;
  if(/\.(mp4|webm|mov)(\?|$)/.test(u))return `<video src="${esc(url)}" controls preload="metadata"></video>`;return ''}
const linkify=t=>esc(t).replace(URL_RE,m=>`<a href="${m}" target="_blank" rel="noopener">${m}</a>`);
function bub(m){
  if((m.hiddenFor||[]).includes(me))return '';
  const mine=m.senderId===me;let body='';
  if(m.deletedAll)body='<i class="fas fa-ban"></i> تم حذف هذه الرسالة';
  else{
    if(m.fileId)body+=fileEl(m);
    if(m.text){body+=`<div>${linkify(m.text)}</div>`;(m.text.match(URL_RE)||[]).slice(0,1).forEach(u=>body+=prev(u))}}
  const t=m.createdAt&&m.createdAt.toDate?m.createdAt.toDate().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'';
  const rx=Object.values(m.reactions||{});
  return `<div class="b ${mine?'me':''} ${m.deletedAll?'del':''}" data-m="${esc(m.id)}">${m.senderId==='platform'?'<div class="s" style="font-weight:800">منصة ميزان</div>':''}${body}<div class="meta"><span>${t}</span>${m.edited?'<span>معدّلة</span>':''}</div>${rx.length?`<div class="rx">${rx.join('')}</div>`:''}</div>`}
function bindBub(){document.querySelectorAll('#msgs .b').forEach(el=>{let h;const go=()=>showMenu(el.dataset.m,el.getBoundingClientRect());
  el.addEventListener('touchstart',()=>{h=setTimeout(go,450)},{passive:true});['touchend','touchmove','touchcancel'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(h),{passive:true}));
  el.addEventListener('contextmenu',e=>{e.preventDefault();go()})})}
function showMenu(mid,r){const m=msgCache[mid];if(!cur||!m||m.deletedAll)return;const mn=$('menu'),mine=m.senderId===me;
  mn.innerHTML=`<div class="emo">${['👍','❤️','😂','😮','😢','🙏'].map(e=>`<span data-e="${e}">${e}</span>`).join('')}</div>`+
   (mine&&(!m.type||m.type==='text')?'<div class="mi" data-a="edit"><i class="fas fa-pen"></i> تعديل</div>':'')+
   (m.text?'<div class="mi" data-a="copy"><i class="fas fa-copy"></i> نسخ</div>':'')+
   '<div class="mi red" data-a="me"><i class="fas fa-eye-slash"></i> حذف عندي</div>'+
   (mine?'<div class="mi red" data-a="all"><i class="fas fa-trash"></i> حذف عند الجميع</div>':'');
  mn.classList.add('on');mn.style.top=Math.min(r.bottom+6,innerHeight-260)+'px';mn.style.left=Math.max(10,Math.min(r.left,innerWidth-200))+'px';
  const mref=doc(db,'chats',cur.id,'messages',mid);
  mn.querySelectorAll('[data-e]').forEach(s=>s.onclick=async()=>{mn.classList.remove('on');await updateDoc(mref,{['reactions.'+me]:(m.reactions||{})[me]===s.dataset.e?deleteField():s.dataset.e})});
  mn.querySelectorAll('[data-a]').forEach(i=>i.onclick=async()=>{mn.classList.remove('on');const a=i.dataset.a;
    if(a==='copy'){navigator.clipboard&&navigator.clipboard.writeText(m.text);toast('تم النسخ')}
    if(a==='me')await updateDoc(mref,{hiddenFor:arrayUnion(me)});
    if(a==='all'&&confirm('حذف الرسالة عند الجميع؟')){await updateDoc(mref,{deletedAll:true});dropFile(m)}
    if(a==='edit'){const n=prompt('تعديل الرسالة',m.text);if(n!==null&&n.trim()&&n!==m.text)await updateDoc(mref,{text:n.trim(),edited:true})}})}
document.addEventListener('click',e=>{if(!e.target.closest('#menu'))$('menu').classList.remove('on')});

/* ملفات داخل Firestore: كل ملف يتقسّم لعدة مستندات (parts) */
const CH=600000,MAX=30*1024*1024,fcache={};
const pad=i=>String(i).padStart(4,'0');
const fmt=n=>!n?'':n>1048576?(n/1048576).toFixed(1)+' MB':Math.max(1,Math.round(n/1024))+' KB';
function media(m,u){
  if(m.type==='image')return `<img src="${u}">`;
  if(m.type==='video')return `<video src="${u}" controls preload="metadata"></video>`;
  if(m.type==='audio')return `<audio src="${u}" controls></audio>`;
  return `<a href="${u}" download="${esc(m.name||'file')}"><i class="fas fa-download"></i> ${esc(m.name||'ملف')}</a>`}
function fileEl(m){
  if(fcache[m.fileId])return media(m,fcache[m.fileId]);
  const auto=(m.type==='image'||m.type==='audio')&&(m.size||0)<=2097152?' data-auto="1"':'';
  const ic={image:'fa-image',video:'fa-film',audio:'fa-microphone'}[m.type]||'fa-file';
  return `<div class="fl" data-mid="${esc(m.id)}"${auto}><i class="fas ${ic}"></i> ${esc(m.name||'ملف')} <span class="s">${fmt(m.size)} · اضغط للتحميل</span></div>`}
async function loadFile(el){
  const m=msgCache[el.dataset.mid];if(!m||el.dataset.busy)return;el.dataset.busy='1';
  try{
    const sp=el.querySelector('.s');if(sp)sp.textContent='جاري التحميل...';
    const snap=await getDocs(query(collection(db,'chat_files',m.fileId,'parts'),orderBy('i')));
    const arr=snap.docs.map(d=>{const b=atob(d.data().data),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u});
    if(!arr.length)throw 0;
    fcache[m.fileId]=URL.createObjectURL(new Blob(arr,{type:m.mime||'application/octet-stream'}));
    el.outerHTML=media(m,fcache[m.fileId]);
  }catch(e){el.dataset.busy='';const sp=el.querySelector('.s');if(sp)sp.textContent='تعذّر التحميل، اضغط للمحاولة';}}
const autoLoad=()=>document.querySelectorAll('#msgs .fl[data-auto]').forEach(loadFile);
$('msgs').addEventListener('click',e=>{const f=e.target.closest('.fl');if(f)loadFile(f)});
async function dropFile(m){if(!m.fileId)return;try{for(let s=0;s<(m.chunks||0);s+=400){const b=writeBatch(db);for(let i=s;i<Math.min(m.chunks,s+400);i++)b.delete(doc(db,'chat_files',m.fileId,'parts',pad(i)));await b.commit()}delete fcache[m.fileId]}catch(e){}}
function shrink(b){return new Promise(res=>{const img=new Image(),u=URL.createObjectURL(b);img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(x=>{URL.revokeObjectURL(u);res(x&&x.size<b.size?x:b)},'image/jpeg',.8)};img.onerror=()=>res(b);img.src=u})}
async function up(blob,name,type){
  if(!cur)return;
  if(blob.size>MAX)return toast('الحجم أكبر من الحد المسموح (30 ميجا)');
  try{
    if(type==='image'&&blob.type!=='image/gif'&&blob.size>300*1024)blob=await shrink(blob);
    toast('جاري التجهيز...');
    const b64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=no;r.readAsDataURL(blob)});
    const fid='f_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),n=Math.ceil(b64.length/CH);
    for(let i=0;i<n;i++){await setDoc(doc(db,'chat_files',fid,'parts',pad(i)),{i,data:b64.slice(i*CH,(i+1)*CH)});toast('جاري الرفع '+Math.round((i+1)/n*100)+'%')}
    fcache[fid]=URL.createObjectURL(blob);
    await sendMsg({type,fileId:fid,name,mime:blob.type||'',size:blob.size,chunks:n,text:''});
    toast('تم الإرسال');
  }catch(e){toast('فشل الإرسال (راجع قواعد Firestore)')}}
/* الإرسال */
async function sendMsg(data){
  const label=data.text||({image:'📷 صورة',video:'🎬 فيديو',audio:'🎤 رسالة صوتية',file:'📎 ملف'}[data.type]||'');
  const cref=doc(db,'chats',cur.id);
  if(cur.plat)await setDoc(cref,{lastText:label,lastSenderId:me,updatedAt:serverTimestamp()},{merge:true});
  else await setDoc(cref,{kind:'user',members:[me,cur.o],senders:arrayUnion(me),lastText:label,lastSenderId:me,updatedAt:serverTimestamp(),reads:{[me]:Date.now()}},{merge:true});
  const r=await addDoc(collection(db,'chats',cur.id,'messages'),{senderId:me,createdAt:serverTimestamp(),...data});
  if(!cur.plat)fetch(PUSH_API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chatMsg:{chatId:cur.id,msgId:r.id}})}).catch(()=>{});
}
const btn=$('send');let rec=null,chunks=[];
const sync=()=>{if(rec)return;btn.innerHTML=$('txt').value.trim()?'<i class="fas fa-paper-plane"></i>':'<i class="fas fa-microphone"></i>'};
$('txt').oninput=e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,110)+'px';sync()};
btn.onclick=async()=>{
  if(rec){rec.stop();return}
  const t=$('txt').value.trim();
  if(t){$('txt').value='';$('txt').style.height='auto';sync();try{await sendMsg({type:'text',text:t})}catch(e){toast('تعذّر الإرسال')}return}
  try{const s=await navigator.mediaDevices.getUserMedia({audio:true});const mt=MediaRecorder.isTypeSupported('audio/webm')?'audio/webm':'audio/mp4';
    rec=new MediaRecorder(s,{mimeType:mt});chunks=[];rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{s.getTracks().forEach(x=>x.stop());rec=null;btn.classList.remove('rec');sync();up(new Blob(chunks,{type:mt}),'voice.'+(mt==='audio/webm'?'webm':'m4a'),'audio')};
    rec.start();btn.classList.add('rec');btn.innerHTML='<i class="fas fa-stop"></i>';toast('جاري التسجيل... اضغط للإرسال')}
  catch(e){toast('اسمح بالميكروفون من إعدادات المتصفح')}};
$('attach').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f||!cur)return;up(f,f.name,f.type.startsWith('image/')?'image':f.type.startsWith('video/')?'video':f.type.startsWith('audio/')?'audio':'file')};
</script>
