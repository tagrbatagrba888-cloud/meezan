try{var th=localStorage.getItem('meezan_theme')||localStorage.getItem('theme');if(th)document.documentElement.setAttribute('data-theme',th)}catch(e){}
(function(){try{
  /* حفظ/استرجاع تسجيل الدخول: التطبيق المثبّت نافذة مستقلة ومعندوش sessionStorage بتاع المنصة */
  try{if(sessionStorage.getItem('meezan_logged_in')==='true'){var _o={};for(var _i=0;_i<sessionStorage.length;_i++){var _k=sessionStorage.key(_i);if(_k&&_k.indexOf('meezan_')===0)_o[_k]=sessionStorage.getItem(_k)}localStorage.setItem('rsl_auth',JSON.stringify(_o))}
  else{var _a=JSON.parse(localStorage.getItem('rsl_auth')||'null');if(_a&&_a.meezan_logged_in==='true'&&_a.meezan_user_id){for(var _j in _a)sessionStorage.setItem(_j,_a[_j])}}}catch(e){}
  if(sessionStorage.getItem('meezan_logged_in')!=='true'){window.__kick=1;location.replace('login.html');return}
  var me=sessionStorage.getItem('meezan_user_id'),c=JSON.parse(localStorage.getItem('rsl_cfg')||'null');
  if(c){var ov=c.overrides||{},ok=(me in ov)?!!ov[me]:!!c.allowAll;if(ok)window.__ready=1}
}catch(e){}})();

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#0B3D2E;--primary-light:#145A43;--accent:#C9A961;--bg-page:#F5F1E8;--bg-card:#fff;--bg-input:#F8FBF9;--text-main:#0B3D2E;--text-sub:#5A6B66;--border:#E0E5E1;--shadow:rgba(11,61,46,.15);--error:#C0392B;--success:#1E7A5A;--mine:#DCF1E6}

html,body{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg-page);color:var(--text-main);min-height:100%;overflow-x:hidden;overscroll-behavior-y:none}

.header{background:var(--bg-card);border-bottom:1px solid var(--border);box-shadow:0 4px 20px var(--shadow);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:50}
.header h1{font-size:19px;font-weight:900;flex:1}

.ib:active{transform:scale(.92)}.ib.mini{width:34px;height:34px;border-radius:10px;font-size:14px}

async function startRec(done){

  const mt=['audio/webm;codecs=opus','audio/webm','audio/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';

  let ac=null,an=null,buf=null;try{ac=new (window.AudioContext||window.webkitAudioContext)();an=ac.createAnalyser();an.fftSize=256;ac.createMediaStreamSource(s).connect(an);buf=new Uint8Array(an.fftSize)}catch(e){}
  $('wv').innerHTML=Array(BARS).fill('<i></i>').join('');const bars=[...$('wv').children];
  R.tick=setInterval(()=>{$('recT').textContent=mmss((Date.now()-R.t0)/1000)},250);
  R.wave=setInterval(()=>{let l=.08+Math.random()*.06;if(an){an.getByteTimeDomainData(buf);let sum=0;for(let i=0;i<buf.length;i++){const v=(buf[i]-128)/128;sum+=v*v}l=Math.min(1,Math.sqrt(sum/buf.length)*4.5)}

    const type=(rec.mimeType||mt||'audio/webm').split(';')[0];done(new Blob(ch,{type}),dur,type.includes('mp4')?'m4a':'webm')};

const ICE={iceServers:[{urls:['stun:stun.l.google.com:19302','stun:stun1.l.google.com:19302','stun:stun.cloudflare.com:3478']},{urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}],iceCandidatePoolSize:4,bundlePolicy:'max-bundle'};

    $('ctl').innerHTML=(kind==='video'?cbtn('cCam','fa-video'):'')+cbtn('cMic','fa-microphone')+cbtn('cSpk',kind==='video'?'fa-volume-high':'fa-volume-low',kind==='video'?'off':'')+cbtn('cEnd','fa-phone-slash','end')}}
function bindCtl(){const c=call;if(!c)return;

  const m=$('cMic');if(m)m.onclick=()=>{const t=c.stream.getAudioTracks()[0];if(t){t.enabled=!t.enabled;m.classList.toggle('off',!t.enabled);m.innerHTML=`<i class="fas ${t.enabled?'fa-microphone':'fa-microphone-slash'}"></i>`}};

  const route=async on=>{let real=false;try{if(AS){AS.type=on?'playback':'play-and-record';real=true}}catch(e){}
    try{const el=outEls()[0];if(el&&el.setSinkId){const devs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='audiooutput');const pick=on?devs.find(d=>/speaker|مكبر|خارجية/i.test(d.label)&&!/earpiece|receiver/i.test(d.label)):devs.find(d=>/earpiece|receiver|الأذن|الداخلية|communications/i.test(d.label));if(pick){await Promise.all(outEls().map(x=>x.setSinkId(pick.deviceId)));real=true}else if(!on){await Promise.all(outEls().map(x=>x.setSinkId('communications')));real=true}}}catch(e){}

function setupCall(id,isCaller,o,kind,stream){
  const pc=new RTCPeerConnection(ICE);call={id,pc,stream,isCaller,o,kind,connected:false,pend:[],unsubs:[]};
  stream.getTracks().forEach(t=>pc.addTrack(t,stream));
  pc.ontrack=e=>{const v=$('rv');v.srcObject=e.streams[0];if(kind==='video')v.style.display='block';v.muted=false;v.play().catch(()=>{});call.paint&&call.paint()};

  if(!cur||call)return;if(!allowed())return toast(cfgOk?'المراسلة غير متاحة لحسابك':'جاري تحميل الإعدادات... حاول بعد ثوانٍ');let stream;

(function(){const f=$('cFab');let P={x:innerWidth-76,y:110},d=null;const put=()=>{P.x=Math.min(Math.max(6,P.x),innerWidth-66);P.y=Math.min(Math.max(6,P.y),innerHeight-66);f.style.transform=`translate(${P.x}px,${P.y}px)`};
