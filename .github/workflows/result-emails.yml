name: result-emails
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'process sends normal approved work; health only reads data'
        type: choice
        options: [health, process]
        default: health
concurrency:
  group: result-emails
  cancel-in-progress: false
permissions: {}
jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/result-emails-poller.mjs
        env:
          BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
          MEEZAN_ADMIN_EMAIL: ${{ secrets.MEEZAN_ADMIN_EMAIL }}
          MEEZAN_ADMIN_PASSWORD: ${{ secrets.MEEZAN_ADMIN_PASSWORD }}
          MEEZAN_ADMIN_UID: ${{ secrets.MEEZAN_ADMIN_UID }}
          MAILER_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'process' }}
          MAILER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
