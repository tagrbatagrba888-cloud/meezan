<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#0B3D2E;--primary-light:#145A43;--primary-lighter:#1E7A5A;
  --accent:#C9A961;--accent-light:#E0C888;
  --bg-page:#F3F0E8;--bg-card:#FFFFFF;--bg-input:#EEF2F0;
  --text-main:#10261F;--text-sub:#66776F;--border:#E4E8E5;
  --shadow:rgba(11,61,46,.10);
  --error:#C0392B;--success:#1E7A5A;--warning:#E67E22;--info:#2980B9;
  --brand:var(--primary);--on-brand:#fff;--hl:var(--accent);
  --unread-bg:rgba(201,169,97,.10);
  --r:18px;
}
[data-theme="dark"]{
  --primary:#C9A961;--primary-light:#E0C888;--primary-lighter:#F0DBA8;
  --accent:#0B3D2E;--accent-light:#145A43;
  --bg-page:#0A1310;--bg-card:#121F1A;--bg-input:#1A2B24;
  --text-main:#F2EFE6;--text-sub:#97AAA1;--border:#1F342C;
  --shadow:rgba(0,0,0,.45);
  --error:#E74C3C;--success:#2ECC71;--warning:#F39C12;--info:#3498DB;
  --brand:var(--primary);--on-brand:#0A1310;--hl:var(--primary);
  --unread-bg:rgba(201,169,97,.10);
}
html{scroll-behavior:smooth;background:var(--bg-page)}
body{font-family:'Cairo',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;background:var(--bg-page);color:var(--text-main);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font-family:inherit}
a{color:inherit}

/* ===== الهيدر ===== */
.topbar{position:sticky;top:0;z-index:50;background:var(--bg-card);border-bottom:1px solid var(--border);box-shadow:0 2px 14px var(--shadow)}
.topbar-inner{max-width:820px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.topbar-brand{display:flex;align-items:center;gap:10px;min-width:0}
.back-btn,.icon-btn,.menu-btn{width:40px;height:40px;border-radius:13px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-main);display:flex;align-items:center;justify-content:center;font-size:15px;cursor:pointer;text-decoration:none;flex-shrink:0;transition:transform .15s,background .2s}
.back-btn:active,.icon-btn:active,.menu-btn:active{transform:scale(.92)}
.topbar-title{display:flex;align-items:center;gap:10px;min-width:0}
.topbar-title i.header-icon{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--primary-light));color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.topbar-title-text h1{font-size:17px;font-weight:900;line-height:1.2;color:var(--text-main)}
.topbar-title-text small{display:block;font-size:10px;font-weight:700;letter-spacing:1.6px;color:var(--text-sub)}
.topbar-actions{display:flex;align-items:center;gap:8px}
.avatar-btn{width:40px;height:40px;border-radius:50%;border:2px solid var(--hl);background:linear-gradient(135deg,var(--brand),var(--primary-light));color:var(--on-brand);display:flex;align-items:center;justify-content:center;font-weight:800;text-decoration:none;overflow:hidden;flex-shrink:0}
.avatar-btn img{width:100%;height:100%;object-fit:cover;display:block}
.menu-btn{display:none}

/* ===== الحاوية ===== */
.container{max-width:820px;margin:0 auto;padding:16px 14px 90px}

/* ===== بطاقة الملخص ===== */
.toolbar{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:18px;border-radius:22px;margin-bottom:14px;color:var(--on-brand);background:linear-gradient(135deg,var(--brand) 0%,var(--primary-light) 100%);box-shadow:0 10px 26px var(--shadow)}
.toolbar::after{content:"";position:absolute;inset-inline-end:-40px;top:-50px;width:150px;height:150px;border-radius:50%;background:rgba(255,255,255,.10);pointer-events:none}
.notif-count{position:relative;font-size:13px;font-weight:700;opacity:.92}
.notif-count strong{font-size:26px;font-weight:900;margin:0 4px;vertical-align:middle}
.toolbar-actions{position:relative;display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:12px;border:1px solid transparent;font-size:12.5px;font-weight:800;cursor:pointer;transition:transform .15s,opacity .2s,background .2s}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.toolbar .btn-primary{background:rgba(255,255,255,.20);color:var(--on-brand);border-color:rgba(255,255,255,.28)}
.toolbar .btn-cancel{background:rgba(0,0,0,.18);color:var(--on-brand);border-color:rgba(255,255,255,.16)}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--primary-light));color:var(--on-brand)}
.btn-cancel{background:var(--bg-input);color:var(--text-main);border-color:var(--border)}
.btn-danger{background:var(--error);color:#fff}

/* ===== التبويبات ===== */
.tabs{display:flex;gap:4px;padding:5px;margin-bottom:14px;background:var(--bg-input);border-radius:16px;border:1px solid var(--border)}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 6px;border:none;border-radius:12px;background:transparent;color:var(--text-sub);font-size:13px;font-weight:800;cursor:pointer;transition:background .2s,color .2s,box-shadow .2s;white-space:nowrap}
.tab i{font-size:13px}
.tab.active{background:var(--bg-card);color:var(--text-main);box-shadow:0 3px 10px var(--shadow)}
.tab .tab-badge{min-width:20px;padding:1px 6px;border-radius:99px;font-size:10.5px;font-weight:900;background:var(--hl);color:#fff;line-height:1.6}
[data-theme="dark"] .tab .tab-badge{color:#0A1310}
.tab:not(.active) .tab-badge{background:var(--border);color:var(--text-sub)}

/* ===== البطاقات ===== */
.notif-list{display:flex;flex-direction:column;gap:10px}
.notif-card{position:relative;display:flex;gap:12px;padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);cursor:pointer;transition:transform .15s,box-shadow .2s,border-color .2s;content-visibility:auto;contain-intrinsic-size:auto 100px}
.notif-card:active{transform:scale(.985)}
@media (hover:hover){.notif-card:hover{box-shadow:0 8px 22px var(--shadow);transform:translateY(-2px)}}
.notif-card.unread{background:linear-gradient(90deg,var(--bg-card),var(--unread-bg));border-color:color-mix(in srgb,var(--hl) 38%,var(--border))}
.notif-card.unread::before{content:"";position:absolute;inset-inline-start:0;top:16px;bottom:16px;width:4px;border-radius:0 4px 4px 0;background:var(--hl)}
.notif-card.enter{animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.notif-icon{--c:var(--brand);width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.notif-icon.image{--c:#8E44AD}.notif-icon.video{--c:#E74C3C}.notif-icon.link{--c:var(--info)}.notif-icon.page{--c:var(--warning)}
.notif-content{flex:1;min-width:0}
.notif-header{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.notif-title {
    font-size: 14.5px;
    font-weight: 800;
    line-height: 1.5;
    color: var(--text-main);
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    line-clamp: 1;
    -webkit-line-clamp: 1;
    -webkit-box-orient: vertical;
}.notif-time{display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:11px;font-weight:700;color:var(--text-sub);padding-top:2px}
.notif-dot{width:9px;height:9px;border-radius:50%;background:var(--hl);box-shadow:0 0 0 0 var(--hl);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--hl) 55%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.sent-body {
    font-size: 13px;
    color: var(--text-sub);
    margin-top: 3px;
    display: -webkit-box;
    line-clamp: 2;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    word-break: break-word;
}.notif-meta{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:8px;font-size:11px;font-weight:700;color:var(--text-sub)}
.notif-meta i{font-size:10px;opacity:.8}
.notif-type-tag{--c:var(--brand);display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:10.5px;font-weight:800;color:var(--c);background:color-mix(in srgb,var(--c) 12%,transparent)}
.notif-type-tag.image{--c:#8E44AD}.notif-type-tag.video{--c:#E74C3C}.notif-type-tag.link{--c:var(--info)}.notif-type-tag.page{--c:var(--warning)}
.more-btn{display:none;width:100%;margin-top:12px;padding:13px}
.more-btn.show{display:flex}

/* ===== حالة فارغة ===== */
.empty-state{text-align:center;padding:60px 20px;background:var(--bg-card);border:1px dashed var(--border);border-radius:var(--r);animation:rise .35s ease both}
.empty-state i{font-size:46px;color:var(--hl);opacity:.75;margin-bottom:14px}
.empty-state h3{font-size:16px;font-weight:900;margin-bottom:6px}
.empty-state p{font-size:13px;color:var(--text-sub)}

/* ===== هيكل التحميل ===== */
.skeleton-card{display:flex;gap:12px;padding:14px;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r)}
.skeleton-icon-box,.skeleton-line{background:linear-gradient(90deg,var(--bg-input) 25%,var(--border) 50%,var(--bg-input) 75%);background-size:200% 100%;animation:shine 1.3s infinite linear}
.skeleton-icon-box{width:46px;height:46px;border-radius:14px;flex-shrink:0}
.skeleton-content{flex:1;display:flex;flex-direction:column;gap:9px;padding-top:4px}
.skeleton-line{height:11px;border-radius:6px}
.skeleton-line.w-60{width:60%}.skeleton-line.w-90{width:90%}.skeleton-line.w-40{width:40%}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}

/* ===== النوافذ ===== */
.modal-overlay,.confirm-modal{position:fixed;inset:0;z-index:200;display:none;align-items:flex-end;justify-content:center;background:rgba(5,12,9,.55);padding:0}
.modal-overlay.show,.confirm-modal.show{display:flex;animation:fade .2s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-box,.confirm-box{width:100%;max-width:520px;max-height:90vh;max-height:90dvh;overflow-y:auto;background:var(--bg-card);border-radius:26px 26px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3);animation:sheet .28s cubic-bezier(.2,.8,.2,1)}
.modal-box::before,.confirm-box::before{content:"";display:block;width:42px;height:5px;border-radius:5px;background:var(--border);margin:0 auto 14px}
@keyframes sheet{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:640px){.modal-overlay,.confirm-modal{align-items:center;padding:20px}.modal-box,.confirm-box{border-radius:24px;padding:22px}.modal-box::before,.confirm-box::before{display:none}}
.modal-header{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.modal-header-icon{--c:var(--brand);width:46px;height:46px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent)}
.modal-header-icon.image{--c:#8E44AD}.modal-header-icon.video{--c:#E74C3C}.modal-header-icon.link{--c:var(--info)}.modal-header-icon.page{--c:var(--warning)}
.modal-header-text{flex:1;min-width:0}
.modal-header-text h2{font-size:16.5px;font-weight:900;line-height:1.5;word-break:break-word}
.modal-header-text small{display:flex;flex-wrap:wrap;gap:10px;margin-top:3px;font-size:11.5px;font-weight:700;color:var(--text-sub)}
.modal-header-text small i{color:var(--hl);margin-inline-end:3px}
.modal-close{width:34px;height:34px;border-radius:50%;border:none;background:var(--bg-input);color:var(--text-sub);cursor:pointer;flex-shrink:0}
.modal-close:hover{background:var(--error);color:#fff}
.modal-body{font-size:14px;line-height:1.95;white-space:pre-wrap;word-break:break-word;padding:14px;background:var(--bg-input);border-radius:14px;margin-bottom:12px}
.modal-media{margin-bottom:12px;border-radius:14px;overflow:hidden;background:var(--bg-input)}
.modal-media img,.modal-media video{display:block;width:100%;max-height:340px;object-fit:contain}
.modal-info-box{display:flex;align-items:center;gap:7px;padding:9px 12px;margin-bottom:14px;border-radius:12px;font-size:12px;font-weight:700;color:var(--text-sub);background:var(--bg-input)}
.modal-info-box i{color:var(--hl)}
.modal-actions{display:flex;gap:10px}
.modal-actions .btn{flex:1;padding:13px}

.confirm-box{text-align:center;max-width:420px}
.confirm-icon{width:60px;height:60px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--on-brand);background:linear-gradient(135deg,var(--brand),var(--primary-light))}
.confirm-icon.danger{background:var(--error);color:#fff}.confirm-icon.warning{background:var(--warning);color:#fff}
.confirm-title{font-size:17px;font-weight:900;margin-bottom:6px}
.confirm-message{font-size:13.5px;line-height:1.8;color:var(--text-sub);margin-bottom:18px}
.confirm-actions{display:flex;gap:10px}
.confirm-actions .btn{flex:1;padding:13px}

/* ===== شاشة الحظر ===== */
.block-overlay{position:fixed;inset:0;z-index:999;display:none;align-items:center;justify-content:center;padding:20px;background:var(--bg-page)}
.block-overlay.show{display:flex}
.block-box{width:100%;max-width:420px;text-align:center;background:var(--bg-card);border:1px solid var(--border);border-radius:24px;padding:30px 22px;box-shadow:0 18px 50px var(--shadow)}
.block-icon{width:74px;height:74px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff;background:var(--error)}
.block-title{font-size:20px;font-weight:900;margin-bottom:6px;color:var(--error)}
.block-subtitle{font-size:13.5px;color:var(--text-sub);margin-bottom:16px}
.block-details{background:var(--bg-input);border-radius:14px;padding:4px 14px;margin-bottom:18px;text-align:right}
.block-detail-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px;font-weight:700}
.block-detail-row:last-child{border-bottom:none}
.block-detail-row i{color:var(--error);width:20px;text-align:center}
.block-detail-row strong{color:var(--error);font-weight:800}
.block-btn{width:100%;padding:13px;border:none;border-radius:13px;font-size:14px;font-weight:800;cursor:pointer;color:var(--on-brand);background:linear-gradient(135deg,var(--brand),var(--primary-light))}

/* ===== القائمة الجانبية ===== */
.drawer-overlay{position:fixed;inset:0;z-index:300;background:rgba(5,12,9,.55);opacity:0;pointer-events:none;transition:opacity .25s}
.drawer-overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:301;width:min(320px,86vw);background:var(--bg-card);display:flex;flex-direction:column;transform:translateX(110%);transition:transform .3s cubic-bezier(.2,.8,.2,1);box-shadow:-10px 0 40px rgba(0,0,0,.3)}
.drawer.open{transform:translateX(0)}
.drawer-header{padding:18px 16px;color:var(--on-brand);background:linear-gradient(135deg,var(--brand),var(--primary-light))}
.drawer-header-content{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.drawer-logo{width:42px;height:42px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.2)}
.drawer-brand{flex:1;min-width:0}
.drawer-brand-name{display:flex;gap:6px;align-items:center;font-size:15px;font-weight:900}
.drawer-brand-name .divider{opacity:.5}
.drawer-brand-sub{font-size:11px;opacity:.8;font-weight:600}
.drawer-close{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.18);color:inherit;cursor:pointer}
.drawer-user-info{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.14);text-decoration:none;color:inherit}
.drawer-user-info:hover{background:rgba(255,255,255,.2)}
.drawer-user-avatar{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-weight:900;overflow:hidden;flex-shrink:0}
.drawer-user-avatar img{width:100%;height:100%;object-fit:cover}
.drawer-user-text{flex:1;min-width:0}
.drawer-user-name{font-size:14px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.drawer-user-role{display:flex;gap:6px;align-items:center;font-size:11px;opacity:.85;font-weight:700}
.drawer-content{flex:1;overflow-y:auto;padding:16px}
.drawer-section{margin-bottom:18px}
.drawer-section-title{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:800;color:var(--text-sub);margin-bottom:8px}
.drawer-section-title i{color:var(--hl)}
.drawer-btn{width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;margin-bottom:6px;border-radius:14px;border:1px solid var(--border);background:var(--bg-input);color:var(--text-main);font-size:13.5px;font-weight:800;cursor:pointer;text-decoration:none;transition:transform .15s}
.drawer-btn:active{transform:scale(.97)}
.drawer-btn-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--on-brand);background:linear-gradient(135deg,var(--brand),var(--primary-light))}
.drawer-btn-label{flex:1;text-align:start}
.drawer-btn.logout-btn{color:var(--error);border-color:color-mix(in srgb,var(--error) 30%,transparent)}
.drawer-btn.logout-btn .drawer-btn-icon{background:var(--error);color:#fff}
.drawer-badge{display:none;min-width:20px;height:20px;padding:0 6px;border-radius:99px;align-items:center;justify-content:center;font-size:11px;font-weight:900;background:var(--error);color:#fff}
.drawer-badge.show{display:flex}

/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:24px;z-index:500;display:flex;align-items:center;gap:9px;max-width:92vw;padding:12px 18px;border-radius:14px;background:var(--bg-card);color:var(--text-main);border:1.5px solid var(--border);box-shadow:0 12px 32px var(--shadow);font-size:13px;font-weight:800;transform:translate(-50%,30px);opacity:0;pointer-events:none;transition:transform .3s,opacity .3s}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast.success{border-color:var(--success)}.toast.success i{color:var(--success)}
.toast.error{border-color:var(--error)}.toast.error i{color:var(--error)}
.toast.warning{border-color:var(--warning)}.toast.warning i{color:var(--warning)}

<script type="module">

// ============================================================
// 🔒 الحماية

// ============================================================
// 🧹 التنظيف
// ============================================================
function cleanInput(value) {
  if (typeof value !== 'string') return '';
  return value
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/[\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]/g, ' ')
    .replace(/^\s+|\s+$/g, '')
    .trim();
}

function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = String(text);
  return div.innerHTML;
}

// ============================================================
// 💬 Toast
// ============================================================
let toastTimeout;
function showToast(text, type = 'success') {
  const toast = $('toast');
  const icon = $('toastIcon');
  $('toastText').textContent = text;
  toast.className = 'toast show ' + type;
  const icons = {
    success: 'fa-check-circle',
    error: 'fa-times-circle',
    warning: 'fa-exclamation-triangle',
    info: 'fa-info-circle'
  };
  icon.className = `fas ${icons[type] || icons.success}`;
  clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ============================================================
// 🔔 نافذة تأكيد
// ============================================================
let confirmResolve = null;
function showConfirm(options = {}) {
  return new Promise((resolve) => {
    const {
      title = 'تأكيد',
      message = 'هل أنت متأكد؟',
      icon = 'fa-question-circle',
      iconType = 'default',
      okText = 'تأكيد',
      cancelText = 'إلغاء'
    } = options;

    const iconEl = $('confirmIcon');
    iconEl.className = 'confirm-icon';
    if (iconType === 'danger') iconEl.classList.add('danger');
    if (iconType === 'warning') iconEl.classList.add('warning');

    iconEl.innerHTML = `<i class="fas ${icon}"></i>`;
    $('confirmTitle').textContent = title;
    $('confirmMessage').innerHTML = message;
    $('confirmOk').innerHTML = `<i class="fas fa-check"></i> <span>${okText}</span>`;
    $('confirmCancel').innerHTML = `<i class="fas fa-times"></i> <span>${cancelText}</span>`;

    confirmResolve = resolve;
    $('confirmModal').classList.add('show');
  });
}

function closeConfirm(result) {
  $('confirmModal').classList.remove('show');
  if (confirmResolve) {
    confirmResolve(result);
    confirmResolve = null;
  }
}

$('confirmOk').addEventListener('click', () => closeConfirm(true));
$('confirmCancel').addEventListener('click', () => closeConfirm(false));
$('confirmModal').addEventListener('click', (e) => {
  if (e.target === $('confirmModal')) closeConfirm(false);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('confirmModal').classList.contains('show')) closeConfirm(false);
    if ($('notifModal').classList.contains('show')) closeNotifModal();
    if ($('drawer').classList.contains('open')) closeDrawer();

// ============================================================

updateThemeIcon(savedTheme);

// ============================================================
// 📦 كاش عام
// ============================================================
const CACHE_SETTINGS = 'meezan_user_login_settings_cache';
const CACHE_NOTIFS = 'meezan_notifs_cache';
const CACHE_MAX_AGE = 1000 * 60 * 60 * 24 * 7; // 7 أيام

function loadCache(key) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
}

function saveCache(key, data) {
  try {
    localStorage.setItem(key, JSON.stringify({ ...data, _cachedAt: Date.now() }));
  } catch (e) {}
}

// ============================================================
// 📊 الحالة
// ============================================================
let currentUser = null;
let currentRole = 'student';
let currentUserId = null;
let currentSettings = null;
let blockTriggered = false;

let allNotifications = [];
let unreadIds = new Set();
let notifIdsSet = [];
let readIdsSet = [];
let deletedIdsSet = [];
let currentTab = 'all';

// كاش تفاصيل الإشعارات (في الذاكرة)
const notifCache = new Map(); // notifId -> {title, body, type, url, senderName, createdAt}

// ============================================================
// 💾 كاش الإشعارات الدائم
// ============================================================
function saveNotifsCache() {
  try {
    const data = {
      notifications: allNotifications,
      notifIds: notifIdsSet,
      readIds: readIdsSet,
      deletedIds: deletedIdsSet,
      visibleIds: allVisibleIds,
      cachedAt: Date.now()
    };
    localStorage.setItem(CACHE_NOTIFS, JSON.stringify(data));
  } catch (e) {
    console.log('cache save error:', e.message);
  }
}

function loadNotifsCache() {
  try {
    const raw = localStorage.getItem(CACHE_NOTIFS);
    if (!raw) return false;
    const data = JSON.parse(raw);

    if (Date.now() - (data.cachedAt || 0) > CACHE_MAX_AGE) {
      localStorage.removeItem(CACHE_NOTIFS);
      return false;
    }

    allNotifications = data.notifications || [];
    notifIdsSet = data.notifIds || [];
    readIdsSet = data.readIds || [];
    deletedIdsSet = data.deletedIds || [];
    allVisibleIds = data.visibleIds || (data.notifications || []).map(n => n.id);

    // املأ كاش التفاصيل في الذاكرة
    allNotifications.forEach(n => {
      notifCache.set(n.id, {
        title: n.title,
        body: n.body,
        type: n.type,
        url: n.url,
        senderName: n.senderName,
        createdAt: n.createdAt
      });
    });

    unreadIds = new Set(allNotifications.filter(n => !n.read).map(n => n.id));
    return true;
  } catch (e) {
    console.log('cache load error:', e.message);
    return false;
  }
}

// ============================================================
// 🧭 تنقّل آمن للصفحات الداخلية (يمنع الشاشة السوداء 404)
// ============================================================
const PAGE_ALIASES = { 'ashara.html': 'asharat.html', 'ashara': 'asharat.html', 'asharat': 'asharat.html', 'store.html': 'stor.html', 'stor': 'stor.html', 'matgar': 'stor.html' };

function normalizePage(u) {
  let x = cleanInput(String(u || ''));
  if (!x) return '';
  if (/^https?:\/\//i.test(x)) {
    try { const o = new URL(x); if (o.host === location.host) x = o.pathname.replace(/^\/+/, '') + o.search + o.hash; else return x; } catch (e) { return x; }
  }
  x = x.replace(/^\.?\/+/, '');
  const m = x.match(/^([^?#]*)(.*)$/);
  let path = m[1].toLowerCase(), rest = m[2] || '';
  if (PAGE_ALIASES[path]) path = PAGE_ALIASES[path];
  else if (path && !/\.[a-z0-9]+$/.test(path)) path += '.html';
  return path + rest;
}

async function pageExists(u) {
  try {
    const ctrl = new AbortController();
    const t = setTimeout(() => ctrl.abort(), 4000);
    const r = await fetch(u, { method: 'HEAD', cache: 'no-store', signal: ctrl.signal });
    clearTimeout(t);
    return r.status !== 404;
  } catch (e) { return true; } // لو الفحص فشل (أوفلاين) لا نمنع التنقل
}

async function goInternal(url) {
  const target = normalizePage(url);
  if (!target) return;
  if (!(await pageExists(target))) {
    showToast('هذه الصفحة غير متاحة حالياً', 'warning');
    return;
  }
  window.location.href = target;
}

// ============================================================
// 🔗 تصنيف الروابط (داخلي / خارجي)
// ============================================================
function getLinkType(url) {
  if (!url) return 'none';
  const trimmed = url.trim();

  // لو بيبدأ بـ http/https → خارجي، لكن لو نفس النطاق → داخلي
  if (/^https?:\/\//i.test(trimmed)) {
    try {
      const urlObj = new URL(trimmed);
      if (urlObj.hostname === location.hostname) return 'internal';
    } catch (e) {}
    return 'external';
  }

  // مسار نسبي أو ملف → داخلي
  if (/^(\.{0,2}\/|\/)/.test(trimmed) || /\.html?($|\?|#)/i.test(trimmed)) {
    return 'internal';
  }

  return 'external';
}

// قائمة صفحات داخلية معروفة
const INTERNAL_PAGES = [
  'exam', 'exams', 'quiz', 'quizzes',
  'homework', 'homeworks', 'assignment', 'assignments', 'tasks', 'task',
  'lesson', 'lessons', 'course', 'courses',
  'unit', 'units',
  'profile', 'sora', 'settings',
  'library', 'books', 'book',
  'result', 'results', 'degree', 'degrees',
  'video', 'videos', 'play',
  'subject', 'subjects', 'class', 'classes'
];

function detectInternalPage(url) {
  if (!url) return null;
  const lower = url.toLowerCase();
  for (const page of INTERNAL_PAGES) {
    if (lower.includes(page)) return page;
  }
  return null;
}

// ============================================================
// 🎨 تطبيق الإعدادات
// ============================================================
function applySettings(data) {
  if (!data) return;

  if (data.logoUrl) {
    const drawerLogo = $('drawerLogo');
    if (drawerLogo) drawerLogo.src = data.logoUrl;
    const iconLink = document.querySelector('link[rel="icon"]');
    if (iconLink) iconLink.href = data.logoUrl;
  }

  if (data.siteNameAr) $('drawerNameAr').textContent = data.siteNameAr;
  if (data.siteNameEn) $('drawerNameEn').textContent = data.siteNameEn;
  if (data.tagline) $('drawerSubtitle').textContent = data.tagline;

  const nameAr = data.siteNameAr || 'ميزان';
  const nameEn = data.siteNameEn || 'MEEZAN';
  document.title = `الإشعارات | ${nameAr} ${nameEn}`;

  applyColors(data);
}

function applyColors(data) {
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  const rootStyle = document.documentElement.style;

  rootStyle.removeProperty('--primary');
  rootStyle.removeProperty('--accent');

  if (currentTheme === 'light' && data.lightColorsEnabled === true) {
    if (data.lightPrimary && /^#[0-9A-Fa-f]{6}$/.test(data.lightPrimary)) {
      rootStyle.setProperty('--primary', data.lightPrimary);
    }
    if (data.lightAccent && /^#[0-9A-Fa-f]{6}$/.test(data.lightAccent)) {
      rootStyle.setProperty('--accent', data.lightAccent);
    }
  } else if (currentTheme === 'dark' && data.darkColorsEnabled === true) {
    if (data.darkPrimary && /^#[0-9A-Fa-f]{6}$/.test(data.darkPrimary)) {
      rootStyle.setProperty('--primary', data.darkPrimary);
    }
    if (data.darkAccent && /^#[0-9A-Fa-f]{6}$/.test(data.darkAccent)) {
      rootStyle.setProperty('--accent', data.darkAccent);
    }
  }
}

// ============================================================
// 👤 تحميل بيانات المستخدم
// ============================================================
async function loadUserData() {
  const userId = sessionStorage.getItem('meezan_user_id');
  const username = cleanInput(sessionStorage.getItem('meezan_username') || '');
  const role = sessionStorage.getItem('meezan_role') || 'student';

  currentRole = role;
  currentUserId = userId;

  if (!userId && !username) return;

  try {
    const collectionName = role === 'teacher' ? 'teachers' : 'users';

    const userSnap = await getDoc(doc(db, collectionName, 'all'));
    if (!userSnap.exists()) return;

    const items = userSnap.data().items || [];
    let user = null;

    if (userId) user = items.find(u => u.id === userId);
    if (!user && username) {
      user = items.find(u => (u.username || '').toLowerCase() === username.toLowerCase());
    }

    if (!user) return;

    currentUser = user;
    currentUserId = user.id;
    renderUserInfo(user);
  } catch (e) {
    console.error('load user error:', e);
  }
}

function renderUserInfo(user) {
  const fullName = user.fullName || user.username || 'مستخدم';
  const isTeacher = currentRole === 'teacher';

  const avatarBtn = $('userAvatarBtn');
  if (user.avatarUrl) {
    avatarBtn.classList.add('has-photo');
    avatarBtn.innerHTML = `<img src="${user.avatarUrl}" alt="${escapeHtml(fullName)}" onerror="this.parentNode.innerHTML='<i class=\\'fas fa-user\\'></i>'; this.parentNode.classList.remove('has-photo');">`;
  } else {
    avatarBtn.classList.remove('has-photo');
    const firstChar = (fullName || '؟').charAt(0).toUpperCase();
    avatarBtn.innerHTML = `<span style="font-weight:900; font-size:16px;">${firstChar}</span>`;
  }

  $('drawerUserName').textContent = fullName;
  $('drawerUserRole').innerHTML = isTeacher
    ? '<i class="fas fa-chalkboard-user"></i><span>حساب معلم</span>'
    : '<i class="fas fa-user-graduate"></i><span>حساب طالب</span>';

  const drawerAvatar = $('drawerUserAvatar');
  if (user.avatarUrl) {
    drawerAvatar.innerHTML = `<img src="${user.avatarUrl}" alt="${escapeHtml(fullName)}" onerror="this.parentNode.innerHTML='<i class=\\'fas fa-user\\'></i>'">`;
  } else {
    const firstChar = (fullName || '؟').charAt(0).toUpperCase();
    drawerAvatar.innerHTML = `<span>${firstChar}</span>`;
  }
}

// ============================================================
// ⚡ جلب تفاصيل الإشعارات (متوازي + كاش + تحميل تدريجي)
// ============================================================
const PAGE_SIZE = 25;
let shownLimit = PAGE_SIZE;
let allVisibleIds = [];   // كل الإشعارات الظاهرة (الأحدث أولاً)
let totalVisible = 0;
let unreadTotal = 0;
let loadSeq = 0;
let deepLinkHandled = false;

async function fetchNotifDetails(ids) {
  const result = [];
  const missing = [];

  for (const id of ids) {
    if (notifCache.has(id)) result.push({ id, ...notifCache.get(id) });
    else missing.push(id);
  }

  if (missing.length) {
    const got = await Promise.all(missing.map(async (id) => {
      try {
        const snap = await getDoc(doc(db, 'notifications', id));
        if (!snap.exists()) return null;
        const d = snap.data();
        const info = {
          title: d.title || 'بدون عنوان',
          body: d.body || '',
          type: d.type || 'none',
          url: d.url || '',
          senderName: d.senderName || 'الإدارة',
          createdAt: d.createdAt || ''
        };
        notifCache.set(id, info);
        return { id, ...info };
      } catch (e) {
        console.log('fetch notif error:', e.message);
        return null;
      }
    }));
    got.forEach(g => { if (g) result.push(g); });
  }
  return result;
}

function applyDetails(details) {
  details.sort((a, b) => (new Date(b.createdAt).getTime() || 0) - (new Date(a.createdAt).getTime() || 0));
  details.forEach(n => { n.read = readIdsSet.includes(n.id); });
  allNotifications = details;
  unreadIds = new Set(details.filter(n => !n.read).map(n => n.id));
  renderNotifications();
  updateBadges();
}

// يحمّل أول shownLimit إشعار فقط (الباقي عند الضغط على "عرض المزيد")
async function loadVisible() {
  const seq = ++loadSeq;
  const ids = allVisibleIds.slice(0, shownLimit);

  // ارسم فوراً اللي موجود في الكاش، وبعدها كمّل الناقص
  const cached = ids.filter(id => notifCache.has(id));
  if (cached.length && cached.length < ids.length) {
    applyDetails(cached.map(id => ({ id, ...notifCache.get(id) })));
  }

  const details = await fetchNotifDetails(ids);
  if (seq !== loadSeq) return;
  applyDetails(details);
}

function startNotificationsListener() {
  if (!currentUserId) return;

  // ⚡ 1) اعرض الكاش المحلي فوراً
  const hasCache = loadNotifsCache();
  if (hasCache && allNotifications.length > 0) {
    renderNotifications();
    updateBadges();
    maybeOpenDeepLink();
  }

  // ⚡ 2) اشترك في التحديثات الحية
  onSnapshot(doc(db, 'user_notifications', currentUserId), async (snap) => {
    const data = snap.exists() ? snap.data() : {};
    notifIdsSet = data.notifIds || [];
    readIdsSet = data.readIds || [];
    deletedIdsSet = data.deletedIds || [];
    allVisibleIds = notifIdsSet.filter(id => !deletedIdsSet.includes(id));

    await loadVisible();
    saveNotifsCache();
    maybeOpenDeepLink();
  }, (err) => {
    console.log('notifs listener error:', err.message);
    if (!hasCache) {
      allNotifications = [];
      renderNotifications();
    }
  });
}

// فتح إشعار محدد من رابط ?n=ID (يستخدمه ضغط إشعار Push)
function maybeOpenDeepLink() {
  if (deepLinkHandled) return;
  const id = new URLSearchParams(location.search).get('n');
  if (!id) { deepLinkHandled = true; return; }
  const n = allNotifications.find(x => x.id === id);
  if (n) {
    deepLinkHandled = true;
    openNotifModal(n);
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }
}

// ============================================================
// 🎨 عرض الإشعارات
// ============================================================
function renderNotifications() {
  const list = $('notifList');
  const frag = document.createDocumentFragment();

  let filtered = allNotifications;
  if (currentTab === 'unread') filtered = allNotifications.filter(n => !n.read);
  if (currentTab === 'read') filtered = allNotifications.filter(n => n.read);

  updateBadges();

  if (filtered.length === 0) {
    let title = 'لا توجد إشعارات';
    let desc = 'ستظهر هنا الإشعارات التي تصلك من الإدارة.';
    let icon = 'fa-bell-slash';

    if (currentTab === 'unread') {
      title = 'لا توجد إشعارات غير مقروءة';
      desc = 'لقد اطلعت على جميع الإشعارات ✅';
      icon = 'fa-check-circle';
    } else if (currentTab === 'read') {
      title = 'لا توجد إشعارات مقروءة';
      desc = 'لم تفتح أي إشعار بعد.';
      icon = 'fa-envelope-open';
    }

    list.innerHTML = `
      <div class="empty-state">
        <i class="fas ${icon}"></i>
        <h3>${title}</h3>
        <p>${desc}</p>
      </div>
    `;
    return;
  }

  filtered.forEach((n, i) => frag.appendChild(createNotifCard(n, i < 8)));
  list.replaceChildren(frag);
}

function createNotifCard(notif, animate) {
  const card = document.createElement('div');
  card.className = 'notif-card' + (notif.read ? '' : ' unread') + (animate ? ' enter' : '');

  let typeInfo = getTypeInfo(notif.type);
  let displayType = notif.type;

  if (notif.url) {
    const linkType = getLinkType(notif.url);
    if (linkType === 'internal' && (!notif.type || notif.type === 'none' || notif.type === 'link')) {
      typeInfo = { icon: 'fa-arrow-left', label: 'صفحة داخلية' };
      displayType = 'page';
    }
  }

  card.innerHTML = `
    <div class="notif-icon ${displayType || 'none'}">
      <i class="fas ${typeInfo.icon}"></i>
    </div>
    <div class="notif-content">
      <div class="notif-header">
        <div class="notif-title">${escapeHtml(notif.title)}</div>
        <div class="notif-time">${!notif.read ? '<span class="notif-dot"></span>' : ''}${formatDate(notif.createdAt)}</div>
      </div>
      <div class="notif-body">${escapeHtml(notif.body)}</div>
      <div class="notif-meta">
        <span><i class="fas fa-user"></i> ${escapeHtml(notif.senderName)}</span>
        ${displayType && displayType !== 'none' ? `<span class="notif-type-tag ${displayType}"><i class="fas ${typeInfo.icon}"></i> ${typeInfo.label}</span>` : ''}
      </div>
    </div>
  `;

  card.addEventListener('click', () => openNotifModal(notif));
  return card;
}

function getTypeInfo(type) {
  const map = {
    none: { icon: 'fa-comment', label: 'نصي' },
    image: { icon: 'fa-image', label: 'صورة' },
    video: { icon: 'fa-video', label: 'فيديو' },
    link: { icon: 'fa-link', label: 'رابط' },
    page: { icon: 'fa-file-alt', label: 'صفحة' }
  };
  return map[type] || map.none;
}

function formatDate(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    const diff = (Date.now() - d) / 1000;

    if (diff < 60) return 'الآن';
    if (diff < 3600) return `قبل ${Math.floor(diff / 60)} دقيقة`;
    if (diff < 86400) return `قبل ${Math.floor(diff / 3600)} ساعة`;
    if (diff < 604800) return `قبل ${Math.floor(diff / 86400)} يوم`;

    return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long', day: 'numeric' });
  } catch (e) { return '—'; }
}

// ============================================================
// 🔢 تحديث الشارات والعدّادات
// ============================================================
function updateBadges() {
  const hidden = allVisibleIds.slice(shownLimit);
  totalVisible = allNotifications.length + hidden.length;
  unreadTotal = unreadIds.size + hidden.filter(id => !readIdsSet.includes(id)).length;

  $('totalCount').textContent = totalVisible;
  $('allCountBadge').textContent = totalVisible;
  $('unreadCountBadge').textContent = unreadTotal;

  const more = $('moreBtn');
  if (more) more.classList.toggle('show', allVisibleIds.length > shownLimit);
}

// ============================================================
// 🪟 فتح modal تفاصيل الإشعار
// ============================================================
let currentOpenNotif = null;

async function openNotifModal(notif) {
  currentOpenNotif = notif;

  const typeInfo = getTypeInfo(notif.type);

  $('modalHeaderIcon').className = 'modal-header-icon' + (notif.type && notif.type !== 'none' ? ' ' + notif.type : '');
  $('modalHeaderIcon').innerHTML = `<i class="fas ${typeInfo.icon}"></i>`;
  $('modalTitle').textContent = notif.title;
  $('modalSender').textContent = notif.senderName;
  $('modalDate').textContent = formatDate(notif.createdAt);
  $('modalBody').textContent = notif.body;
  $('modalType').textContent = typeInfo.label;

  const mediaWrapper = $('modalMediaWrapper');
  mediaWrapper.innerHTML = '';

  if (notif.type === 'image' && notif.url) {
    mediaWrapper.innerHTML = `
      <div class="modal-media">
        <img src="${escapeHtml(notif.url)}" alt=""
             onerror="this.parentNode.innerHTML='<div style=\\'padding:20px;text-align:center;color:var(--error);font-weight:700;\\'>⚠️ تعذّر تحميل الصورة</div>'">
      </div>
    `;
  } else if (notif.type === 'video' && notif.url) {
    mediaWrapper.innerHTML = `
      <div class="modal-media">
        <video src="${escapeHtml(notif.url)}" controls preload="metadata"></video>
      </div>
    `;
  }

  // ============================================================
  // 🔗 تحديد زر التحويل (داخلي vs خارجي)
  // ============================================================
  const actionBtn = $('modalActionBtn');
  const url = notif.url || '';
  const linkType = getLinkType(url);
  const internalPage = detectInternalPage(url);

  actionBtn.style.display = 'none';
  actionBtn.onclick = null;

  if (url) {
    if (linkType === 'internal' || (notif.type === 'page' && internalPage)) {
      // 🏠 صفحة داخلية → تحويل مباشر بدون تاب جديد
      actionBtn.style.display = 'flex';
      actionBtn.innerHTML = '<i class="fas fa-arrow-left"></i><span>الانتقال للصفحة</span>';
      actionBtn.onclick = () => goInternal(url);
    } else if (linkType === 'external' || notif.type === 'link') {
      // 🌐 رابط خارجي → افتح في تاب جديد
      actionBtn.style.display = 'flex';
      actionBtn.innerHTML = '<i class="fas fa-external-link-alt"></i><span>فتح الرابط</span>';
      actionBtn.onclick = () => {
        window.open(url, '_blank', 'noopener,noreferrer');
      };
    }
  }

  $('notifModal').classList.add('show');

  if (!notif.read) {
    await markAsRead(notif.id);
  }
}

function closeNotifModal() {
  $('notifModal').classList.remove('show');
  currentOpenNotif = null;
}

$('modalClose').addEventListener('click', closeNotifModal);
$('notifModal').addEventListener('click', (e) => {
  if (e.target === $('notifModal')) closeNotifModal();
});

// ============================================================
// ✅ علّم كمقروء
// ============================================================
async function markAsRead(notifId) {
  if (!currentUserId) return;
  if (readIdsSet.includes(notifId)) return;

  try {
    const ref = doc(db, 'user_notifications', currentUserId);
    await setDoc(ref, {
      readIds: arrayUnion(notifId),
      updatedAt: serverTimestamp()
    }, { merge: true });

    const n = allNotifications.find(x => x.id === notifId);
    if (n) n.read = true;
    unreadIds.delete(notifId);
    if (!readIdsSet.includes(notifId)) readIdsSet.push(notifId);

    updateBadges();
    renderNotifications();
    saveNotifsCache(); // 💾
  } catch (e) {
    console.log('mark read error:', e.message);
  }
}

// ============================================================
// ✅ تحديد الكل كمقروء
// ============================================================
$('markAllReadBtn').addEventListener('click', async () => {
  if (unreadTotal === 0) {
    return showToast('لا توجد إشعارات غير مقروءة', 'info');
  }

  const confirmed = await showConfirm({
    title: 'تحديد الكل كمقروء',
    message: `هل تريد تعليم جميع الإشعارات (${unreadTotal}) كمقروءة؟`,
    icon: 'fa-check-double',
    okText: 'نعم'
  });
  if (!confirmed) return;

  try {
    const ref = doc(db, 'user_notifications', currentUserId);
    const allIds = [...allVisibleIds];

    await setDoc(ref, {
      readIds: arrayUnion(...allIds),
      updatedAt: serverTimestamp()
    }, { merge: true });

    allNotifications.forEach(n => n.read = true);
    readIdsSet = [...new Set([...readIdsSet, ...allIds])];
    unreadIds.clear();

    renderNotifications();
    updateBadges();
    saveNotifsCache(); // 💾
    showToast('تم تحديد الكل كمقروء', 'success');
  } catch (e) {
    console.log('mark all error:', e.message);
    showToast('حدث خطأ', 'error');
  }
});

// ============================================================
// 🗑️ حذف الكل
// ============================================================
$('deleteAllBtn').addEventListener('click', async () => {
  if (allVisibleIds.length === 0) {
    return showToast('لا توجد إشعارات', 'info');
  }

  const confirmed = await showConfirm({
    title: 'حذف كل الإشعارات',
    message: 'هل تريد حذف جميع الإشعارات نهائياً؟ لا يمكن التراجع.',
    icon: 'fa-trash',
    iconType: 'danger',
    okText: 'حذف الكل'
  });
  if (!confirmed) return;

  try {
    const ref = doc(db, 'user_notifications', currentUserId);

    const allIds = [...allVisibleIds];
    const newDeleted = [...new Set([...deletedIdsSet, ...allIds])];

    await setDoc(ref, {
      notifIds: [],
      deletedIds: newDeleted,
      readIds: [],
      updatedAt: serverTimestamp()
    }, { merge: true });

    allNotifications = [];
    allVisibleIds = [];
    unreadIds.clear();
    notifIdsSet = [];
    readIdsSet = [];
    deletedIdsSet = newDeleted;

    renderNotifications();
    updateBadges();
    saveNotifsCache(); // 💾
    showToast('تم حذف كل الإشعارات', 'success');
  } catch (e) {
    console.log('delete all error:', e.message);
    showToast('حدث خطأ', 'error');
  }
});

// ============================================================
// 🗑️ حذف إشعار واحد
// ============================================================
$('modalDeleteBtn').addEventListener('click', async () => {
  if (!currentOpenNotif) return;
  const notif = currentOpenNotif;

  const confirmed = await showConfirm({
    title: 'حذف الإشعار',
    message: 'هل تريد حذف هذا الإشعار؟',
    icon: 'fa-trash',
    iconType: 'danger',
    okText: 'حذف'
  });
  if (!confirmed) return;

  try {
    const ref = doc(db, 'user_notifications', currentUserId);
    const newNotifIds = notifIdsSet.filter(id => id !== notif.id);
    const newDeleted = [...new Set([...deletedIdsSet, notif.id])];
    const newReadIds = readIdsSet.filter(id => id !== notif.id);

    await setDoc(ref, {
      notifIds: newNotifIds,
      deletedIds: newDeleted,
      readIds: newReadIds,
      updatedAt: serverTimestamp()
    }, { merge: true });

    allNotifications = allNotifications.filter(n => n.id !== notif.id);
    allVisibleIds = allVisibleIds.filter(id => id !== notif.id);
    unreadIds.delete(notif.id);
    notifIdsSet = newNotifIds;
    readIdsSet = newReadIds;
    deletedIdsSet = newDeleted;

    closeNotifModal();
    renderNotifications();
    updateBadges();
    saveNotifsCache(); // 💾
    showToast('تم حذف الإشعار', 'success');
  } catch (e) {
    console.log('delete one error:', e.message);
    showToast('حدث خطأ', 'error');
  }
});

// ============================================================
// 🚪 تسجيل الخروج
// ============================================================
async function handleLogout() {
  const confirmed = await showConfirm({
    title: 'تسجيل الخروج',
    message: 'هل تريد تسجيل الخروج من حسابك؟',
    icon: 'fa-sign-out-alt',
    iconType: 'warning',
    okText: 'خروج'
  });
  if (!confirmed) return;
  forceLogout();
}

$('logoutBtn').addEventListener('click', handleLogout);
$('drawerLogoutBtn').addEventListener('click', () => {
  closeDrawer();
  setTimeout(handleLogout, 300);
});

function forceLogout() {
  sessionStorage.removeItem('meezan_logged_in');
  sessionStorage.removeItem('meezan_username');
  sessionStorage.removeItem('meezan_role');
  sessionStorage.removeItem('meezan_user_id');
  sessionStorage.removeItem('meezan_user_data');
  localStorage.removeItem(CACHE_NOTIFS); // 🧹 امسح كاش الإشعارات
  window.location.replace('login.html');
}

// ============================================================
// 🚫 شاشة الحظر
// ============================================================
function showBlockScreen(type, user) {
  if (blockTriggered) return;
  blockTriggered = true;

  const overlay = $('blockOverlay');

  if (type === 'disabled') {
    $('blockIcon').className = 'fas fa-ban';
    $('blockTitle').textContent = 'حسابك معطّل حالياً';
    $('blockSubtitle').textContent = 'تم تعطيل حسابك من قبل الإدارة.';

    if (user && user.disableUntil) {
      $('blockUntilRow').style.display = 'flex';
      $('blockUntilText').textContent = formatDateTime(user.disableUntil);
      $('blockRemainingRow').style.display = 'flex';
      $('blockRemainingText').textContent = getRemainingTime(user.disableUntil);
    } else {
      $('blockUntilRow').style.display = 'none';
      $('blockRemainingRow').style.display = 'none';
    }

    if (user && user.disableReason) {
      $('blockReasonRow').style.display = 'flex';
      $('blockReasonText').textContent = user.disableReason;
    } else {
      $('blockReasonRow').style.display = 'none';
    }
  } else if (type === 'deleted') {
    $('blockIcon').className = 'fas fa-user-slash';
    $('blockTitle').textContent = 'تم حذف حسابك';
    $('blockSubtitle').textContent = 'حسابك لم يعد موجوداً في المنصة.';
    $('blockUntilRow').style.display = 'none';
    $('blockRemainingRow').style.display = 'none';
    $('blockReasonRow').style.display = 'none';
    setTimeout(forceLogout, 3000);
  }

  overlay.classList.add('show');
}

function formatDateTime(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleString('ar-EG', {
      year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  } catch (e) { return '—'; }
}

function getRemainingTime(iso) {
  if (!iso) return '—';
  const diff = new Date(iso).getTime() - Date.now();
  if (diff <= 0) return 'انتهى التعطيل';

  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const minutes = Math.floor((diff % 3600000) / 60000);

  const parts = [];
  if (days > 0) parts.push(`${days} يوم`);
  if (hours > 0) parts.push(`${hours} ساعة`);
  if (minutes > 0) parts.push(`${minutes} دقيقة`);

  return parts.join(' و ') || 'ثواني';
}

$('blockLogoutBtn').addEventListener('click', forceLogout);

// ============================================================
// 📡 مراقبة المستخدم
// ============================================================
function startUserMonitoring() {
  const collectionName = currentRole === 'teacher' ? 'teachers' : 'users';

  onSnapshot(doc(db, collectionName, 'all'), (snap) => {
    if (!snap.exists()) return;
    const items = snap.data().items || [];
    const user = items.find(u => u.id === currentUserId);

    if (!user) {
      showBlockScreen('deleted', null);
      return;
    }

    if (user.isDisabled === true) {
      const expired = user.disableUntil && new Date(user.disableUntil) < new Date();
      if (!expired) {
        showBlockScreen('disabled', user);
        return;
      }
    }

    currentUser = user;
    renderUserInfo(user);
  }, (err) => console.log('user monitor error:', err.message));
}

// ============================================================
// 📱 قائمة الطعام
// ============================================================
const drawer = $('drawer');
const drawerOverlay = $('drawerOverlay');

function openDrawer() {
  drawer.classList.add('open');
  drawerOverlay.classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDrawer() {
  drawer.classList.remove('open');
  drawerOverlay.classList.remove('show');
  document.body.style.overflow = '';
}

$('menuBtn').addEventListener('click', openDrawer);
$('drawerClose').addEventListener('click', closeDrawer);
drawerOverlay.addEventListener('click', closeDrawer);

// ============================================================
// 📡 Settings
// ============================================================
const cachedSettings = loadCache(CACHE_SETTINGS);
if (cachedSettings) {
  currentSettings = cachedSettings;
  applySettings(cachedSettings);
}

requestAnimationFrame(() => document.body.classList.add('ready'));

onSnapshot(doc(db, 'settings', 'login_user'), (snap) => {
  if (!snap.exists()) return;
  const data = snap.data();
  currentSettings = data;
  applySettings(data);
  saveCache(CACHE_SETTINGS, data);
}, (err) => console.log('settings error:', err.message));

new MutationObserver(() => {
  if (currentSettings) applyColors(currentSettings);
}).observe(document.documentElement, { attributes: ['data-theme'] });

// ============================================================
// 🚀 Init
// ============================================================
async function init() {
  const userId = sessionStorage.getItem('meezan_user_id');
  currentRole = sessionStorage.getItem('meezan_role') || 'student';
  currentUserId = userId;

  // 1) ارسم بيانات المستخدم فوراً من الجلسة (بدون انتظار الشبكة)
  try {
    const cachedUser = JSON.parse(sessionStorage.getItem('meezan_user_data') || 'null');
    if (cachedUser && typeof cachedUser === 'object') {
      currentUser = cachedUser;
      renderUserInfo(cachedUser);
    }
  } catch (e) {}

  if (userId) {
    // 2) ابدأ الإشعارات والمراقبة فوراً بالتوازي
    startNotificationsListener();
    startUserMonitoring();
    return;
  }

  // لو مفيش userId (دخول بالاسم فقط) → ابحث عن المستخدم أولاً
  await loadUserData();
  if (currentUserId && currentUser) {
    startNotificationsListener();
    startUserMonitoring();
  }
}

init();

// ============================================================
// 🚀 PWA
// ============================================================
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
