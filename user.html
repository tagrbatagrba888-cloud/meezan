/* صور/وسائط مخزنة داخل Firestore (fsav: / fsm:) */
/* كاش وسائط مشترك مع صفحة المنشورات (IndexedDB) */
const IDB=(()=>{let p;const open=()=>p||(p=new Promise((res,rej)=>{try{const r=indexedDB.open('meezan_posts_cache',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('media');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e);}}).catch(()=>null));
 return{get:(st,k)=>open().then(d=>d?new Promise(res=>{try{const q=d.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined);}catch(e){res(undefined);}}):undefined),
 set:(st,k,v)=>open().then(d=>{if(d)try{d.transaction(st,'readwrite').objectStore(st).put(v,k);}catch(e){}})};})();
const cache=new Map();
const mLoad=p=>{ if(cache.has(p))return cache.get(p);
  const r=(async()=>{
    const hit=await IDB.get('media','m:'+p); if(hit&&(hit.b||hit.d))return hit.b?URL.createObjectURL(hit.b):hit.d;
    const a=p.split(':'), m=a[0]==='fsm', n=+(m?a[2]:a[4])||1;
    const x=await Promise.all(Array.from({length:n},(_,i)=>getDoc(m?doc(db,'post_media',`${a[1]}_${i}`):doc(db,a[1],`avatar_${a[2]}_${a[3]}_${i}`)).then(s=>s.exists()?s.data().data:null)));
    if(x.some(v=>v==null))return ''; const d=x.join(''); let blob=null; try{blob=await (await fetch(d)).blob();}catch(e){}
    IDB.set('media','m:'+p,blob?{b:blob,t:Date.now()}:{d,t:Date.now()}); return blob?URL.createObjectURL(blob):d;
  })().catch(()=>'').then(u=>{if(!u)cache.delete(p);return u;});
  cache.set(p,r); return r; };
const fix=el=>{const s=el.getAttribute('src')||'';if(!/^fs(m|av):/.test(s)||el._b===s)return;el._b=s;el.removeAttribute('src');mLoad(s).then(d=>{if(d)el.src=d;});};

/* نسبة التفوق (نفس معادلة الملف الشخصي) */
async function calcExcellence(){
  try{
    const g=async n=>{const s=await getDoc(doc(db,n,'all'));return s.exists()?(s.data().items||[]):[]};
    const [ex,es,hw,hs]=await Promise.all([g('exams'),g('exam_subs'),g('homeworks'),g('homework_subs')]);
    const gr=U.grade||'';
    const aEx=ex.filter(e=>e.status==='published'&&(!e.grade||e.grade===gr)), aHw=hw.filter(h=>h.status==='published'&&(!h.grade||h.grade===gr));
    const exIds=new Set(aEx.map(e=>e.id)), hwIds=new Set(aHw.map(h=>h.id));
    const cEx=es.filter(s=>String(s.userId)===id&&s.submitted===true&&exIds.has(s.examId)).length;
    const cHw=hs.filter(s=>String(s.userId)===id&&s.submitted===true&&hwIds.has(s.homeworkId)).length;
    const total=aEx.length+aHw.length, rate=total?Math.round((cEx+cHw)/total*100):0;
    exc={rate,total}; drawExc(); saveP();
  }catch(e){ console.log('excellence',e.message); }
}

      m[k]={name:u.fullName||u.name||u.username||'مستخدم',avatar:u.avatarUrl||u.avatar||'',sub:c==='teachers'?'معلم':(u.grade||'طالب')}; }));
    flUM=m; return m; });
  return flUMp; }
function flIds(){
  const t=String(FL_TARGET()), s=flTargetSoc()||{}, out=new Set(FL.A);
  FL.B.forEach(x=>out.add(x));
  if(FL.kind==='following') Object.keys(s.following||{}).forEach(k=>{ if(s.following[k]) out.add(String(k)); });
  out.delete(t); out.delete('meezan');
  return [...out]; }
function flRow(r){
  const id=r.id, u=r.u, name=r.name, mine=String(id)===String(FL_ME);
  const av=u&&u.avatar?`<img src="${flEsc(u.avatar)}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';
  const inner=`<span class="fl-av"><b>${flEsc((name.trim().charAt(0))||'م')}</b>${av}</span><span class="fl-n"><b>${flEsc(name)}</b><small>${flEsc(u?u.sub:'')}</small></span>`;
  const link=u?`<a class="fl-i" href="${flEsc(flHref(id))}">${inner}</a>`:`<div class="fl-i">${inner}</div>`;
  let btn='';
  if(mine) btn='<span class="fl-me">أنت</span>';
  else{
    const on=flIsFol(id), own=flOwnList()&&FL.kind==='following';
    btn=`<button type="button" class="fl-b ${on?'on':''}" data-rid="${flEsc(id)}" data-on="${on?1:0}">${on?(own?'<i class="fas fa-user-minus"></i> إلغاء المتابعة':'<i class="fas fa-check"></i> متابَع'):'<i class="fas fa-plus"></i> متابعة'}</button>`; }
  return `<div class="fl-r">${link}${btn}</div>`; }
function flRender(){
  const ov=document.getElementById('flOv'); if(!ov||!ov.classList.contains('show')||!FL.kind) return;
  const L=ov.querySelector('#flL'), T=ov.querySelector('#flT');
  const loaded=FL.f.u&&FL.f.a&&(FL.kind==='following'||FL.f.b);
  const ids=flIds();
  T.textContent=(FL.kind==='following'?'يتابع':'المتابِعون')+(loaded?' ('+flAr(ids.length)+')':'');
  if(!loaded){ L.innerHTML='<div class="fl-e"><i class="fas fa-spinner fa-spin"></i> جارٍ التحميل…</div>'; return; }
  const um=flUM||{};
  let rows=ids.map(id=>{ const u=um[id]||null; return {id,u,name:u?u.name:'مستخدم غير متاح'}; });
  rows.sort((a,b)=>a.name.localeCompare(b.name,'ar'));
  const q=flNorm(FL.q).trim(); if(q) rows=rows.filter(r=>flNorm(r.name).includes(q));
  ov.querySelector('.fl-s').style.display=ids.length>6?'':'none';
  if(!rows.length){ L.innerHTML='<div class="fl-e">'+(ids.length?'لا توجد نتائج مطابقة':(FL.kind==='following'?(flOwnList()?'أنت لا تتابع أحداً بعد':'لا يتابع أحداً بعد'):'لا يوجد متابِعون بعد'))+'</div>'; return; }
  L.innerHTML=rows.map(flRow).join(''); }
function flClose(){
  const ov=document.getElementById('flOv'); if(ov) ov.classList.remove('show');
  FL.un.forEach(f=>{ try{f()}catch(e){} }); FL.un=[]; FL.kind=null; document.body.style.overflow=''; }
function flOpen(kind){
  FL.un.forEach(f=>{ try{f()}catch(e){} }); FL.un=[];
  FL.kind=kind; FL.A=new Set(); FL.B=new Set(); FL.q=''; FL.f={u:false,a:false,b:kind==='following'};
  const t=String(FL_TARGET());
  let ov=document.getElementById('flOv');
  if(!ov){
    ov=document.createElement('div'); ov.id='flOv'; ov.className='fl-ov';
    ov.innerHTML='<div class="fl-box" role="dialog" aria-modal="true"><div class="fl-h"><b id="flT"></b><button type="button" class="fl-x" id="flX" aria-label="إغلاق"><i class="fas fa-xmark"></i></button></div><div class="fl-s"><i class="fas fa-magnifying-glass"></i><input id="flQ" type="search" placeholder="ابحث بالاسم…" autocomplete="off"></div><div class="fl-l" id="flL"></div></div>';
    document.body.appendChild(ov);
    ov.addEventListener('click',e=>{ if(e.target===ov||e.target.closest('#flX')){ flClose(); return; } const b=e.target.closest('[data-rid]'); if(b) flToggle(b); });
    ov.querySelector('#flQ').addEventListener('input',e=>{ FL.q=e.target.value; flRender(); });
    document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&ov.classList.contains('show')) flClose(); });
  }
  ov.querySelector('#flQ').value='';
  ov.classList.add('show'); document.body.style.overflow='hidden';
  flRender();
  flLoadUsers().then(()=>{ FL.f.u=true; flRender(); });
  const bad=k=>()=>{ FL.f[k]=true; flRender(); };
  if(kind==='following'){
    FL.un.push(onSnapshot(query(collection(db,'follows'),where('followerId','==',t)),s=>{ FL.A=new Set(); s.forEach(d=>{ const x=d.data(); if(x.followedId) FL.A.add(String(x.followedId)); }); FL.f.a=true; flRender(); },bad('a')));
  }else{
    FL.un.push(onSnapshot(query(collection(db,'follows'),where('followedId','==',t)),s=>{ FL.A=new Set(); s.forEach(d=>{ const x=d.data(); if(x.followerId) FL.A.add(String(x.followerId)); }); FL.f.a=true; flRender(); },bad('a')));
    FL.un.push(onSnapshot(query(collection(db,'user_social'),where(new FieldPath('following',t),'==',true)),s=>{ FL.B=new Set(); s.forEach(d=>FL.B.add(String(d.id))); FL.f.b=true; flRender(); },bad('b')));
  } }
async function flToggle(b){
  const rid=b.dataset.rid, on=b.dataset.on==='1'; if(b.disabled) return;
  if(on){ const nm=(flUM&&flUM[rid]&&flUM[rid].name)||'هذا المستخدم';
    if(!(await flConfirm('هل تريد إلغاء متابعة «'+nm+'»؟','إلغاء المتابعة'))) return; }
  b.disabled=true;
  try{ await flSetFollow(rid,!on); }
  catch(e){ console.error(e); flToast('تعذّر تنفيذ العملية','error'); }
  b.disabled=false; flRender(); }

const FL_ME=String(me), FL_TARGET=()=>id, flTargetSoc=()=>soc, flIsFol=isFol, flOwnList=()=>false, flToast=toast;
const flHref=r=>String(r)===String(me)?'sora.html':'user.html?id='+encodeURIComponent(r);
const flSetFollow=(t,want)=>followBatch(t,want);
function flConfirm(msg,ok){ return new Promise(res=>{
  const d=document.createElement('div'); d.className='fl-ov fl-cf show'; d.style.zIndex=950;
  d.innerHTML=`<div class="fl-box fl-sm"><p>${flEsc(msg)}</p><div class="fl-ca"><button type="button" class="fl-b on" data-v="0">تراجع</button><button type="button" class="fl-b dg" data-v="1">${flEsc(ok)}</button></div></div>`;
  d.addEventListener('click',e=>{ const v=e.target.closest('[data-v]'); if(v||e.target===d){ d.remove(); res(!!v&&v.dataset.v==='1'); } });
  document.body.appendChild(d); }); }
/* مزامنة حالة متابعتي مع مجموعة follows (نفس صفحة المنشورات) */
if(me) onSnapshot(query(collection(db,'follows'),where('followerId','==',me)),s=>{ fol={}; s.forEach(d=>{ const x=d.data(); if(x.followedId) fol[String(x.followedId)]=true; }); drawFollow(); if(FL.kind) flRender(); },()=>{});

if(!id){R.innerHTML='<div class="empty">لم يتم تحديد مستخدم</div>';}else if(id!==me){
  try{ const c=JSON.parse(localStorage.getItem(PK)||'null'); if(c&&c.U){ U=c.U; soc=c.soc||{}; posts=c.posts||[]; exc=c.exc||null; draw(); if(!U._teacher&&!U._official)startExc(); } }catch(e){}
  load();
  onSnapshot(doc(db,'user_social',id),s=>{soc=s.exists()?s.data():{};drawStats();if(U)drawPosts();saveP();},()=>{});
  onSnapshot(doc(db,'user_social',me),s=>{mySoc=s.exists()?s.data():{};drawFollow();},()=>{});
  onSnapshot(query(collection(db,'posts'),where('authorId','==',id)),s=>{posts=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));drawStats();drawPosts();saveP();},()=>{});
}
</script>
