.pm button svg{width:42px;height:42px}
</style>

 case'csend':sendChat();break;
 case'snd':CH.setMute(!CH.muted());t.textContent=CH.muted()?'🔇 الصوت مقفول':'🔊 الصوت شغال';CH.snd('move');break;
 case'tko':if(ctx.g&&ctx.g.status==='active'&&ctx.me&&ctx.mv.length)updateDoc(doc(db,'chess_games',ctx.id),{tk:{by:ctx.me,n:ctx.mv.length}});break;
 case'wd':if(await ask('تنسحب من المباراة وتخسرها؟')){const x=mine.find(v=>v.id===id);if(x&&x.status==='active')updateDoc(doc(db,'chess_games',id),{status:'ended',res:x.w.id===uid?'b':'w',why:'انسحاب'})}break;
 case'nextL':{const i=LES.findIndex(l=>l.id===ctx.L.id),n=LES[i+1];n?openLes(n.id):show('tr')}break;
 case'copy':if(navigator.clipboard)navigator.clipboard.writeText(uid);t.textContent='تم ✓';break}});

/* ===== التدريب ===== */
function tTr(){const n=LES.filter(l=>LP[l.id]).length;
 $('v').innerHTML=`<div class="card"><h3>📚 تعلّم الشطرنج</h3><div class="pr"><i style="width:${n/LES.length*100}%"></i></div><small style="color:var(--text-sub);font-weight:700">خلصت ${n} من ${LES.length} درس</small></div>`+LES.map(l=>`<div class="les" data-a="les" data-id="${l.id}"><div class="e">${l.i}</div><b>${l.t}</b>${LP[l.id]?'<i class="fas fa-circle-check ok"></i>':'<i class="fas fa-chevron-left" style="color:var(--text-sub)"></i>'}</div>`).join('')}
function openLes(id){const L=LES.find(x=>x.id===id);S=CH.fromFEN(L.fen);
 const c={k:'les',L,me:'w',mv:[]};shell(L.t,`<button class="sm gray" data-a="resetL">إعادة</button>${prov(cfg.aiTrain)?'<button class="sm gray" data-a="coachL">اسأل المدرب</button>':''}`,c);
 c.can=p=>CH.isW(p);hint=-1;
 c.move=m=>{const ns=CH.apply(S,m);
  if(L.type==='sq'){S={...ns,turn:'w',ep:-1};last=[m.f,m.t];draw();if(L.goal.includes(CH.sq(m.t))&&L.pc.test(ns.b[m.t]))fin();else say('كمّل… وصّل للمربع الأخضر 🟩')}
  else{const st=CH.status(ns),ok=L.type==='check'?st.check:(st.over&&st.res==='w');
   if(ok){S=ns;last=[m.f,m.t];draw();fin()}else{say(L.type==='check'?'النقلة دي مش بتعمل كش، جرّب تاني':'دي مش كش مات، فكّر تاني');draw()}}};
 const fin=()=>{c.over=1;say('🎉 أحسنت! خلصت الدرس');$('mv').innerHTML='<button class="go" data-a="nextL">الدرس التالي ⏭</button>';setDoc(doc(db,'chess_learn',uid),{name,done:{[L.id]:true},ts:Date.now()},{merge:true}).catch(()=>{})};
 c.fin=fin;$('stt').innerHTML=`<span style="font-weight:600;line-height:1.8">${esc(L.d)}</span>`;
 draw()}

/* ===== الألغاز ===== */
const allPz=()=>PZ.concat(CP);
const pzSolved=l=>allPz().filter(p=>p.lv===l&&PS[p.id]).length;
function tPz(){const A=allPz(),lvs=[...new Set(A.map(p=>p.lv))].sort((a,b)=>a-b),need=cfg.pzNeed||3,tot=Object.keys(PS).length;
 const un=l=>{const i=lvs.indexOf(l);if(i<=0)return true;const pl=lvs[i-1];return pzSolved(pl)>=Math.min(need,A.filter(p=>p.lv===pl).length)};
 if(pzL){const L=A.filter(p=>p.lv===pzL);
  $('v').innerHTML=`<div class="gh"><button class="icon-btn" data-a="pzback"><i class="fas fa-arrow-right"></i></button><b>${LVN(pzL)}</b></div><div class="card"><div class="lv">${L.map((p,i)=>`<button class="chip ${PS[p.id]?'on':''}" data-a="pz" data-id="${esc(p.id)}">${i+1}${PS[p.id]?' ✓':''}</button>`).join('')}</div></div>`;return}
 $('v').innerHTML=`<div class="card"><h3>🧩 ألغاز الشطرنج</h3><div style="color:var(--text-sub);font-weight:700;font-size:13px;line-height:1.8">حليت ${tot} لغز. كل لغز كش مات، وبتبدأ سهل وتتصاعد. حل ${need} ألغاز من كل مستوى عشان تفتح اللي بعده.</div></div>`+
 lvs.map(l=>{const t=A.filter(p=>p.lv===l).length,s=pzSolved(l),u=un(l);return`<div class="les" ${u?`data-a="pzl" data-id="${l}"`:'style="opacity:.55"'}><div class="e">${u?l:'🔒'}</div><b>${LVN(l)}<span style="display:block;font-size:12px;color:var(--text-sub);font-weight:600">${u?`${s} / ${t} محلول`:`حل ${need} ألغاز من المستوى السابق`}</span></b>${s===t?'<i class="fas fa-circle-check ok"></i>':''}</div>`}).join('')}
function openPz(id){const P=allPz().find(p=>p.id===id);if(!P)return;S=CH.fromFEN(P.fen);const me=S.turn;
 const c={k:'pz',P,me,left:P.n,ck:!!P.ck,flip:me==='b',mv:[]};
 shell(LVN(P.lv),`<button class="sm gray" data-a="pzhint">تلميح 💡</button><button class="sm gray" data-a="pz" data-id="${esc(id)}">إعادة</button><button class="sm" data-a="pznext">التالي ⏭</button>`,c);
 c.can=p=>CH.isW(p)===(c.me==='w')&&S.turn===c.me&&!c.over&&!c.lock;
 c.move=m=>{const ns=CH.apply(S,m),st=CH.status(ns),win=st.over&&st.res===c.me;let ok=win;
  if(!ok&&c.left>1&&!st.over&&(!c.ck||CH.inCheck(ns)))ok=CH.legal(ns).every(r=>CH.mateIn(CH.apply(ns,r),c.left-1,c.ck));
  if(!ok){say('❌ مش دي النقلة الصح، جرّب تاني');draw();return}
  S=ns;last=[m.f,m.t];
  if(win){c.over=1;draw();say('🏆 كش مات! حليت اللغز');setDoc(doc(db,'chess_puz',uid),{name,solved:{[P.id]:P.lv},ts:Date.now()},{merge:true}).catch(()=>{});return}
  draw();c.lock=1;say('الخصم بيرد…');
  setTimeout(()=>{if(ctx!==c)return;const rs=CH.legal(S);let r=rs[0];
   if(c.left>2){const w=rs.find(x=>!CH.mateIn(CH.apply(S,x),c.left-2,c.ck));if(w)r=w}
   S=CH.apply(S,r);last=[r.f,r.t];c.left--;c.lock=0;draw();say('صح! كمّل — كش مات في '+c.left)},500)};
 say(`${me==='w'?'الأبيض':'الأسود'} يلعب`);$('stt').insertAdjacentHTML('afterend','<div class="xgoal" id="xgoal"></div>');draw()}
function nextPz(){const P=ctx.P,L=allPz().filter(p=>p.lv===P.lv),i=L.findIndex(p=>p.id===P.id),n=L.slice(i+1).concat(L.slice(0,i)).find(p=>!PS[p.id]);
 if(n)openPz(n.id);else{pzL=P.lv;show('pz')}}

/* ===== نتائجي ===== */
function tMe(){const f=mine.filter(g=>g.status==='ended');let w=0,l=0,d=0;
 f.forEach(g=>{const m=g.w.id===uid?'w':'b';if(g.res==='d')d++;else if(g.res===m)w++;else l++});
 $('v').innerHTML=`<div class="stats"><div style="color:#27ae60">${w}<small>فوز</small></div><div style="color:var(--error)">${l}<small>خسارة</small></div><div>${d}<small>تعادل</small></div></div>
 <div class="card"><h3>آخر المباريات</h3>${f.slice(0,25).map(g=>{const m=g.w.id===uid?'w':'b',r=g.res==='d'?'🤝 تعادل':g.res===m?'🏆 فوز':'❌ خسارة';return`<div class="row"><b>${esc(g.w.name)} ⚔ ${esc(g.b.name)}<small>${esc(g.why||'')}</small></b><span style="font-weight:800">${r}</span></div>`}).join('')||'<div class="empty">لسه ماليش مباريات</div>'}</div>`}

/* ===== الأحداث ===== */
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-t]');if(t){pzL=0;if(unsub){unsub();unsub=null}return show(t.dataset.t)}
 const lv=e.target.closest('[data-lv]');if(lv){aiLv=+lv.dataset.lv;return tAI()}
 const cl=e.target.closest('[data-cl]');if(cl){aiCl=cl.dataset.cl;return tAI()}
 const a=e.target.closest('[data-a]');if(!a)return;const id=a.dataset.id;
 switch(a.dataset.a){
 case'startAI':case'newAI':if(a.dataset.a==='newAI'){ctx=null;return show('ai')}startAI();break;
 case'back':back();break;
 case'pzl':pzL=+id;tPz();break;
 case'pzback':pzL=0;tPz();break;
 case'pz':openPz(id);break;
 case'pznext':nextPz();break;
 case'pzhint':if(ctx.k==='pz'&&!ctx.over&&!ctx.lock){say('بفكر…');setTimeout(()=>{const g=CH.goodMoves(S,ctx.left,ctx.ck);if(g[0]){hint=g[0].f;sel=-1;tgs=[];draw();say('💡 حرّك القطعة المميزة')}},30)}break;
 case'flip':ctx.flip=!ctx.flip;draw();break;
 case'undo':if(ctx.k==='ai'&&ctx.hist.length&&!ctx.lock){const n=ctx.hist.length>=2&&S.turn===ctx.me?2:1;for(let k=0;k<n&&ctx.hist.length;k++){S=ctx.hist.pop();ctx.mv.pop()}if(ctx.me!==S.turn&&ctx.hist.length===0&&ctx.me==='b'){}ctx.over=0;last=[];draw();say('دورك')}break;
 case'hint':if(ctx.k==='ai'&&S.turn===ctx.me&&!ctx.over){const m=CH.best(S,3);if(m){hint=m.f;sel=-1;tgs=[];draw();say('جرّب تحرّك القطعة المميزة 💡')}}break;
 case'coach':coach(`أنا ألعب ${ctx.me==='w'?'الأبيض':'الأسود'} والدور على ${S.turn==='w'?'الأبيض':'الأسود'}. اقترح خطة أو نقلة مناسبة واشرح السبب.`);break;
 case'coachL':coach(`درس: ${ctx.L.t}. ${ctx.L.d} اشرح الفكرة ببساطة وأعطني مثال.`);break;
 case'les':openLes(id);break;
 case'resetL':openLes(ctx.L.id);break;
 case'mk':{const r=await addDoc(collection(db,'chess_games'),{type:'pvp',w:{id:uid,name},b:null,ps:[uid],fen:CH.START,moves:[],status:'waiting',ts:Date.now()});openGame(r.id)}break;
 case'open':openGame(id);break;
 case'join':{const g=lobby.find(x=>x.id===id);if(g&&g.status==='waiting'){await updateDoc(doc(db,'chess_games',id),{b:{id:uid,name},ps:[g.w.id,uid],status:'active'});openGame(id)}}break;
 case'cancel':await deleteDoc(doc(db,'chess_games',id));break;
 case'reqAdmin':if(!reqs.some(r=>r.status==='pending'))await addDoc(collection(db,'chess_reqs'),{uid,name,status:'pending',ts:Date.now()});break;
 case'delReq':await deleteDoc(doc(db,'chess_reqs',id));break;
 case'resign':if(await ask('متأكد إنك عايز تستسلم؟')&&ctx&&ctx.g&&ctx.g.status==='active')updateDoc(doc(db,'chess_games',ctx.id),{status:'ended',res:ctx.me==='w'?'b':'w',why:'استسلام'});break}});
</script>
