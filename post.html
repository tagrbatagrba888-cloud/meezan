.pv{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pv span{background:var(--in);border:1px solid var(--bd);border-radius:10px;padding:5px 10px;font-size:12px;font-weight:700}
.bgs{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}.bgs button{width:32px;height:32px;border-radius:10px;border:3px solid transparent}.bgs .on{border-color:var(--tx)}
.link{border:2px dashed var(--g);border-radius:16px;padding:14px;background:rgba(201,169,97,.07);margin:10px 0}.link .u{direction:ltr;text-align:left;font-size:12.5px;font-weight:700;word-break:break-all;color:var(--sub);margin-top:6px}
.empty{text-align:center;padding:50px 20px;border:2px dashed var(--bd);border-radius:20px;color:var(--sub);font-weight:700}

const ar=n=>Number(n||0).toLocaleString('ar-EG'), safe=u=>/^https?:\/\//i.test(u||'')?u:'';

const yt=id=>`<iframe class="yt" src="https://www.youtube.com/embed/${id}" allowfullscreen loading="lazy"></iframe>`;
let tt;const toast=t=>{const e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2800);};
const postUrl=id=>new URL(`${SELF}?id=${encodeURIComponent(id)}`,location.href).href;
/* ---- وسائط Base64 في مستندات ---- */
const CH=600000,cache=new Map();
const b2d=b=>new Promise((r,j)=>{const f=new FileReader();f.onload=()=>r(f.result);f.onerror=j;f.readAsDataURL(b);});
const shrink=f=>new Promise((res,rej)=>{const im=new Image(),u=URL.createObjectURL(f);im.onload=()=>{const k=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL('image/jpeg',.78));};im.onerror=rej;im.src=u;});
async function saveMedia(d){const id='m'+Date.now()+Math.random().toString(36).slice(2,7),ps=[];for(let i=0;i<d.length;i+=CH)ps.push(d.slice(i,i+CH));await Promise.all(ps.map((p,i)=>setDoc(doc(db,'post_media',`${id}_${i}`),{data:p,i,mid:id,createdAt:serverTimestamp()})));return `fsm:${id}:${ps.length}`;}
const delM=ms=>(ms||[]).forEach(m=>{const a=String(m.url||'').split(':');if(a[0]==='fsm')for(let i=0;i<(+a[2]||1);i++)deleteDoc(doc(db,'post_media',`${a[1]}_${i}`)).catch(()=>{});});
const mLoad=p=>{if(cache.has(p))return cache.get(p);const a=p.split(':'),m=p.startsWith('fsm:');const r=Promise.all(Array.from({length:+(m?a[2]:a[4])||1},(_,i)=>getDoc(m?doc(db,'post_media',`${a[1]}_${i}`):doc(db,a[1],`avatar_${a[2]}_${a[3]}_${i}`)).then(s=>s.exists()?s.data().data:''))).then(x=>x.join('')).catch(()=>'');cache.set(p,r);return r;};
const fix=el=>{const s=el.getAttribute('src')||'';if(!/^fs(m|av):/.test(s)||el._b===s)return;el._b=s;el.removeAttribute('src');mLoad(s).then(d=>{if(d)el.src=d;});};
new MutationObserver(ms=>ms.forEach(m=>{if(m.type==='attributes'){if(/^(IMG|VIDEO|AUDIO)$/.test(m.target.tagName))fix(m.target);return;}m.addedNodes.forEach(n=>{if(n.nodeType!==1)return;if(/^(IMG|VIDEO|AUDIO)$/.test(n.tagName))fix(n);else n.querySelectorAll?.('[src^="fsm:"],[src^="fsav:"]').forEach(fix);});})).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});
/* ---- الإشعارات (نفس منظومة صفحة الإشعارات) ---- */
const chunk=(a,n)=>{const o=[];for(let i=0;i<a.length;i+=n)o.push(a.slice(i,i+n));return o;};
async function notify(to,title,body,postId){ if(!to||to===uid||to===ADMIN)return;
  const id='notif_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),now=new Date().toISOString();
  try{await setDoc(doc(db,'notifications',id),{id,title,body,type:'page',url:`${SELF}?id=${postId}`,kind:'posts',mediaType:'page',senderId:uid,senderName:uName(uid),createdAt:now,target:'custom',targetLabel:'المنشورات',recipients:[to]});
    const s=await getDoc(doc(db,'user_notifications',to)),d=s.exists()?s.data():{};let n=d.notifIds||[],u=d.unreadCount||0;if(!n.includes(id)){n=[id,...n].slice(0,100);u++;}
    await setDoc(doc(db,'user_notifications',to),{userId:to,notifIds:n,unreadCount:u,updatedAt:serverTimestamp()},{merge:true});
    fetch('https://vercel-server-nine-tau.vercel.app/api/send',{method:'POST',headers:{'Content-Type':'application/json','x-admin-key':'Meezan2026Secret'},body:JSON.stringify({notifId:id,resend:false})}).catch(()=>{});}catch(e){}}
/* ---- المستخدمون: الاسم الكامل من users/all و teachers/all ---- */

/* ---- عرض ---- */
function media(p){const m=p.media||[],im=m.filter(x=>x.type==='image');let h='';
  if(im.length)h+=`<div class="gr ${im.length===1?'one':''}">${im.slice(0,4).map(x=>`<img src="${esc(x.url)}" data-a="zoom" loading="lazy" alt="">`).join('')}</div>`;

function card(p){const id=p.id,rs=Object.values(p.reactions||{}),mine=p.reactions?.[uid],own=p.authorId===uid,open=S.open.has(id),bg=!(p.media||[]).length&&p.bg&&(p.text||'').length<140?p.bg:'';
 return `<article class="card" data-p="${id}">${p.status==='pending'?'<div style="padding:6px 16px;background:rgba(214,137,16,.12);color:#D68910;font-weight:800;font-size:12.5px">بانتظار موافقة الإدارة</div>':''}

 const ps=S.posts.filter(p=>!p.isAd).sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0)||(tsd(b.createdAt)||0)-(tsd(a.createdAt)||0)),ads=S.posts.filter(p=>p.isAd&&p.status==='published'&&adOn(p)),out=[];let k=0;

 const ban=banned(),cfg=S.cfg;
 R.innerHTML=`<div class="card trig">${av(uid)}<button class="t" data-a="new">${ban?'أنت ممنوع من النشر حالياً':'بم تفكر؟'}</button></div>${out.map(card).join('')||'<div class="empty">لا توجد منشورات بعد</div>'}`;}
let rt;const draw=()=>{clearTimeout(rt);rt=setTimeout(()=>{const ae=document.activeElement,id=ae?.id,v=ae?.value;list();if(id&&$(id)){$(id).value=v;$(id).focus();}},60);};
/* ---- نوافذ ---- */
function modal(h){const o=document.createElement('div');o.className='mo';o.innerHTML=`<div class="md">${h}</div>`;o.onmousedown=e=>{if(e.target===o)o.remove();};document.body.appendChild(o);return o;}
function composer(){
 const ban=banned();if(ban)return toast('أنت ممنوع من النشر'+(ban.reason?` — ${ban.reason}`:''));
 const c=S.cfg,F={files:[],link:'',bg:''},o=modal(`<h3>إنشاء منشور</h3><textarea class="inp" id="cx" rows="4" placeholder="بم تفكر؟"></textarea><div class="bgs" id="cbg"></div><div class="pv" id="cpv"></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">${c.allowImages!==false?'<button class="btn xs" data-k="image">🖼️ صور</button>':''}${c.allowVideo!==false?'<button class="btn xs" data-k="video">🎬 فيديو قصير</button>':''}${c.allowVideoLink!==false?'<button class="btn xs" data-k="link">🔗 رابط فيديو</button>':''}${c.allowAudio!==false?'<button class="btn xs" data-k="audio">🎙️ صوت</button>':''}</div>
  <input type="file" id="fi" hidden><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" data-k="x" style="flex:1">إلغاء</button><button class="btn pr" id="go" style="flex:2"><i class="fas fa-paper-plane"></i> نشر</button></div><div class="cx" id="pg"></div>`);
 const mx=c.maxVideoSec||60,LIM={image:10,video:8,audio:3},pv=()=>{o.querySelector('#cpv').innerHTML=F.files.map(f=>`<span>${f.type==='image'?'🖼️':f.type==='video'?'🎬':'🎙️'} ${esc(f.file.name.slice(0,18))}</span>`).join('')+(F.link?`<span>🔗 ${esc(F.link.slice(0,24))}</span>`:'');
  o.querySelector('#cbg').innerHTML=(!F.files.length&&!F.link)?BGS.map(b=>`<button data-bg="${b}" class="${F.bg===b?'on':''}" style="background:${b}"></button>`).join(''):'';};pv();let kind='';
 o.onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.bg!==undefined){F.bg=b.dataset.bg;pv();return;}const k=b.dataset.k;if(k==='x')o.remove();
  else if(k==='link'){const u=prompt('ألصق رابط يوتيوب أو فيديو مباشر');if(u&&safe(u)){F.link=u;pv();}else if(u)toast('الرابط غير صالح');}
  else if(['image','video','audio'].includes(k)){kind=k;const fi=o.querySelector('#fi');fi.accept=k+'/*';fi.multiple=k==='image';fi.click();}
  else if(b.id==='go')go();};
 o.querySelector('#fi').onchange=async e=>{for(const f of e.target.files){if(f.size>LIM[kind]*1048576){toast(`الحجم أكبر من ${LIM[kind]}MB`);continue;}
   if(kind==='video'){const u=URL.createObjectURL(f),d=await new Promise(r=>{const v=document.createElement('video');v.preload='metadata';v.onloadedmetadata=()=>r(v.duration);v.onerror=()=>r(0);v.src=u;});if(d>mx+.5){toast(`الفيديو أطول من ${mx} ثانية`);continue;}}
   if(kind!=='image')F.files=F.files.filter(x=>x.type!==kind);else if(F.files.filter(x=>x.type==='image').length>=(c.maxImages||10)){toast('وصلت للحد الأقصى للصور');continue;}
   F.files.push({type:kind,file:f});}e.target.value='';pv();};
 async function go(){const text=o.querySelector('#cx').value.trim();if(!text&&!F.files.length&&!F.link)return toast('اكتب نصاً أو أضف وسائط');const b=o.querySelector('#go');b.disabled=true;
  try{const ms=[];for(let i=0;i<F.files.length;i++){o.querySelector('#pg').textContent=`حفظ ${i+1} من ${F.files.length}…`;const f=F.files[i],d=f.type==='image'?await shrink(f.file):await b2d(f.file);ms.push({type:f.type,url:await saveMedia(d)});}
   if(F.link)ms.push({type:'link',url:F.link});
   await addDoc(collection(db,'posts'),{text,category:'general',bg:ms.length?'':F.bg,media:ms,authorId:uid,authorName:uName(uid),status:c.requireApproval?'pending':'published',reactions:{},commentsCount:0,sharesCount:0,pinned:false,createdAt:serverTimestamp()});
   toast(c.requireApproval?'تم الإرسال وبانتظار موافقة الإدارة':'تم النشر');o.remove();}catch(e){console.error(e);toast('فشل النشر');b.disabled=false;}}
}
/* ---- إعلان ممول: الميزانية تُخصم من المحفظة ---- */
function boost(p){if(S.cfg.adsEnabled===false)return toast('الإعلانات الممولة متوقفة حالياً');
 const o=modal(`<h3>ترويج كإعلان ممول</h3><div class="link" style="margin-top:0"><i class="fas fa-wallet" style="color:var(--g)"></i> رصيدك الحالي: <b>${ar(S.wal)} ج.م</b></div>
  <label>الميزانية (تُخصم من محفظتك)</label><input class="inp" type="number" min="1" id="bu"><label>تاريخ الانتهاء</label><input class="inp" type="date" id="en" value="${new Date(Date.now()+7*864e5).toISOString().slice(0,10)}">
  <label>رابط الوجهة (https://)</label><input class="inp" id="ur" dir="ltr" placeholder="https://"><label>نص الزر</label><input class="inp" id="lb" value="اعرف المزيد">
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" data-k="x" style="flex:1">إلغاء</button><button class="btn gd" id="ok" style="flex:2">دفع وتفعيل</button></div>`);
 o.onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.k==='x')return o.remove();if(b.id!=='ok')return;
  const amt=Math.round((+o.querySelector('#bu').value||0)*100)/100,url=o.querySelector('#ur').value.trim();if(!(amt>0))return toast('أدخل ميزانية صحيحة');if(url&&!safe(url))return toast('الرابط يجب أن يبدأ بـ https://');
  b.disabled=true;try{const w=doc(db,'wallets',uid),tr=doc(db,'wallet_transactions','tx_'+Date.now()+'_'+Math.random().toString(36).slice(2,7));
   await runTransaction(db,async tx=>{const s=await tx.get(w),bal=s.exists()?Number(s.data().balance||0):0,nb=Math.round((bal-amt)*100)/100;if(nb<0)throw new Error(`رصيدك (${bal}) لا يكفي`);const now=new Date().toISOString(),rl=s.exists()&&s.data().role||role;
    tx.set(w,{userId:uid,userName:uName(uid),role:rl,balance:nb,updatedAt:now},{merge:true});tx.set(tr,{userId:uid,userName:uName(uid),role:rl,type:'debit',amount:amt,balanceAfter:nb,label:'دفع إعلان ممول',note:'',source:'ad',postId:p.id,by:uName(uid),createdAt:now});});
   await updateDoc(doc(db,'posts',p.id),{isAd:true,ad:{sponsor:uName(uid),ctaLabel:o.querySelector('#lb').value||'اعرف المزيد',ctaUrl:url,start:new Date().toISOString().slice(0,10),end:o.querySelector('#en').value,budget:amt,paid:amt,active:S.cfg.requireApproval?false:true,groups:[],impressions:0,clicks:0}});
   toast(`تم خصم ${ar(amt)} ج.م من محفظتك`);o.remove();}catch(er){toast(er.message||'فشل');b.disabled=false;}};}
/* ---- مشاركة (رابط جميل) ---- */
function share(p){const u=postUrl(p.id),im=(p.media||[]).find(m=>m.type==='image');
 const o=modal(`<h3>مشاركة المنشور</h3><div class="link"><div style="display:flex;align-items:center;gap:10px">${av(p.authorId)}<div><b>${esc(uName(p.authorId))}</b><div class="cx" style="padding:0">${ago(p.createdAt)} · ميزان</div></div></div>
  <div style="margin:10px 0;font-weight:600;line-height:1.7">${esc((p.text||'منشور على ميزان').slice(0,140))}</div>${im?`<img src="${esc(im.url)}" style="width:100%;max-height:200px;object-fit:cover;border-radius:12px" alt="">`:''}<div class="u">${esc(u)}</div></div>
  <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pr" data-k="c"><i class="fas fa-copy"></i> نسخ الرابط</button>${navigator.share?'<button class="btn" data-k="n"><i class="fas fa-share-nodes"></i> مشاركة عبر…</button>':''}<a class="btn" style="text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent((p.text||'').slice(0,80)+' '+u)}"><i class="fab fa-whatsapp"></i> واتساب</a></div>`);
 o.onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.k==='c'){await navigator.clipboard.writeText(u).catch(()=>{});toast('تم نسخ الرابط');}if(b.dataset.k==='n'){try{await navigator.share({title:'ميزان',text:(p.text||'').slice(0,100),url:u});}catch(_){}}updateDoc(doc(db,'posts',p.id),{sharesCount:increment(1)}).catch(()=>{});};}
/* ---- أحداث ---- */
const P=id=>S.posts.find(p=>p.id===id);
function openC(id){S.open.add(id);if(!S.unsub[id])S.unsub[id]=onSnapshot(query(collection(db,'posts',id,'comments'),orderBy('createdAt','asc')),s=>{S.comments[id]=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})}));draw();},()=>{S.comments[id]=[];draw();});draw();}
const A={
 new:composer,
 like:async t=>{const p=P(t.dataset.id),m=p.reactions?.[uid];await updateDoc(doc(db,'posts',p.id),{[`reactions.${uid}`]:m?deleteField():'like'});if(!m)notify(p.authorId,'إعجاب جديد',`${uName(uid)} أعجبه منشورك`,p.id);},
 cm:t=>{const id=t.dataset.id;if(S.open.has(id)){S.open.delete(id);draw();}else openC(id);},
 send:async t=>{const id=t.dataset.id,p=P(id),i=$('ci-'+id),text=i.value.trim(),im=S.cimg[id];if(!text&&!im)return;if(banned()?.active&&false)return;
  try{const x={};if(im)x.imageUrl=await saveMedia(im);const y=(text.match(/https?:\/\/\S+/g)||[]).find(ytId);if(y)x.videoLink=y;
   await addDoc(collection(db,'posts',id,'comments'),{authorId:uid,authorName:uName(uid),text,hidden:false,createdAt:serverTimestamp(),...x});await updateDoc(doc(db,'posts',id),{commentsCount:increment(1)});
   delete S.cimg[id];i.value='';notify(p.authorId,'تعليق جديد',`${uName(uid)} علّق على منشورك${text?`: «${text.slice(0,60)}»`:''}`,id);}catch(e){toast('فشل إرسال التعليق');}},
 cimg:t=>{S.cT=t.dataset.id;$('cmFile').click();},
 delc:async t=>{if(!confirm('حذف التعليق؟'))return;const c=S.comments[t.dataset.id]?.find(x=>x.id===t.dataset.c);await deleteDoc(doc(db,'posts',t.dataset.id,'comments',t.dataset.c));await updateDoc(doc(db,'posts',t.dataset.id),{commentsCount:increment(-1)});delM([{url:c?.imageUrl}]);},
 del:async t=>{const p=P(t.dataset.id);if(!confirm('حذف المنشور نهائياً؟'))return;const cs=await getDocs(collection(db,'posts',p.id,'comments'));await Promise.all(cs.docs.map(d=>deleteDoc(d.ref)));delM(p.media);await deleteDoc(doc(db,'posts',p.id));toast('تم الحذف');if(S.one)location.replace(SELF);},
 share:t=>share(P(t.dataset.id)),boost:t=>boost(P(t.dataset.id)),
 zoom:t=>modal(`<img src="${esc(t.getAttribute('src')||t.src)}" style="width:100%;border-radius:14px" alt="">`),
 cta:t=>{updateDoc(doc(db,'posts',t.dataset.id),{'ad.clicks':increment(1)}).catch(()=>{});}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||!A[t.dataset.a])return;if(t.dataset.a==='zoom'&&t.src?.startsWith('data:')===false&&!t.src)return;Promise.resolve(A[t.dataset.a](t)).catch(er=>{console.error(er);toast('حدث خطأ');});});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id?.startsWith('ci-')){e.preventDefault();document.querySelector(`[data-a=send][data-id="${e.target.id.slice(3)}"]`)?.click();}});
$('cmFile').onchange=async e=>{const f=e.target.files[0],id=S.cT;e.target.value='';if(f&&id){try{S.cimg[id]=await shrink(f);toast('تمت إضافة الصورة — اضغط إرسال');draw();}catch(_){toast('تعذّر قراءة الصورة');}}};
const th=localStorage.getItem('meezan_theme')||'light';document.documentElement.dataset.theme=th;
$('th').onclick=()=>{const n=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=n;localStorage.setItem('meezan_theme',n);};
/* ---- البيانات ---- */
const addU=s=>{(s.exists()?s.data().items||[]:[]).forEach(u=>S.users[u.id]=u);draw();};
onSnapshot(doc(db,'users','all'),addU);onSnapshot(doc(db,'teachers','all'),addU);
onSnapshot(collection(db,'user_social'),s=>{S.soc={};s.forEach(d=>S.soc[d.id]=d.data());draw();});
onSnapshot(doc(db,'settings','postsConfig'),s=>{S.cfg=s.exists()?s.data():{};draw();});
onSnapshot(doc(db,'wallets',uid),s=>{S.wal=s.exists()?Number(s.data().balance||0):0;$('bal').textContent=ar(S.wal);});
const ok=p=>(p.status||'published')==='published'||p.authorId===uid;
if(S.one){document.title='ميزان | منشور';onSnapshot(doc(db,'posts',S.one),s=>{S.posts=s.exists()&&ok({id:s.id,...s.data()})?[{id:s.id,...s.data({serverTimestamps:'estimate'})}]:[];if(S.posts.length&&!S.open.has(S.one))openC(S.one);else draw();},()=>{S.posts=[];draw();});}
else onSnapshot(query(collection(db,'posts'),orderBy('createdAt','desc'),limit(100)),s=>{S.posts=s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'})})).filter(ok);draw();},()=>toast('تعذّر تحميل المنشورات'));
list();
</script>
</body>
</html>
