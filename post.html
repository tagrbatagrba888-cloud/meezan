<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B3D2E">
<title>ميزان | المنشورات</title>
<meta property="og:title" content="ميزان | منشور"><meta property="og:description" content="شاهد المنشور على منصة ميزان">
<link rel="icon" href="https://i.ibb.co/ymXPqr46/file-00000000af0c820aa687a3c3181a6a24.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--primary:#0B3D2E;--primary-light:#145A43;--primary-lighter:#1E7A5A;--accent:#C9A961;--accent-light:#E0C888;--bg-page:#F5F1E8;--bg-card:#FFFFFF;--bg-input:#F8FBF9;--text-main:#0B3D2E;--text-sub:#5A6B66;--border:#E0E5E1;--shadow:rgba(11,61,46,.15);--error:#C0392B;--success:#1E7A5A;--warn:#D68910;--gold:#C9A961;--gold2:#F3E2B0}
[data-theme="dark"]{--primary:#C9A961;--primary-light:#E0C888;--primary-lighter:#F0DBA8;--accent:#0B3D2E;--accent-light:#145A43;--bg-page:#0A1612;--bg-card:#11201B;--bg-input:#1A2C25;--text-main:#F5F1E8;--text-sub:#9BAEA6;--border:#1E3A31;--shadow:rgba(0,0,0,.5);--error:#E74C3C;--success:#2ECC71;--warn:#F5B041}
html,body{font-family:'Cairo',sans-serif;overflow-x:hidden}
body{background:var(--bg-page);color:var(--text-main);min-height:100dvh;transition:background .4s}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary-lighter)}
[data-theme="dark"] a{color:var(--accent-light)}
/* topbar */
.topbar{position:sticky;top:0;z-index:100;background:var(--bg-card);border-bottom:1px solid var(--border);box-shadow:0 4px 20px var(--shadow)}
.tb-in{max-width:760px;margin:auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.tb-brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.tb-logo{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);background:#fff;padding:0;display:block;flex-shrink:0}
.tb-title{font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-title small{font-weight:700;color:var(--text-sub);font-size:13px;margin-right:6px}
.ib{width:40px;height:40px;border-radius:12px;background:var(--bg-input);border:2px solid var(--border);color:var(--primary);font-size:16px;display:inline-flex;align-items:center;justify-content:center;transition:.25s;text-decoration:none;flex-shrink:0}
.ib:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
[data-theme="dark"] .ib:hover{color:var(--bg-page)}
.wal{display:flex;align-items:center;gap:6px;background:linear-gradient(135deg,#0B3D2E,#145A43);color:#F3E2B0;border-radius:12px;padding:8px 12px;font-weight:900;font-size:13px;text-decoration:none;white-space:nowrap;flex-shrink:0}
[data-theme="dark"] .wal{color:#F3E2B0}
.col{max-width:740px;margin:auto;padding:16px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;box-shadow:0 4px 16px var(--shadow)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:800;font-size:14px;background:var(--bg-input);border:2px solid var(--border);transition:.2s;text-decoration:none;color:var(--text-main)}
.btn:hover{border-color:var(--gold);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary-lighter));border-color:transparent;color:#fff}
[data-theme="dark"] .btn.primary{color:#0A1612}
.btn.gold{background:linear-gradient(135deg,#C9A961,#E8D190);border-color:transparent;color:#2b2208}
.btn.danger{background:var(--error);border-color:transparent;color:#fff}
.btn.ok{background:var(--success);border-color:transparent;color:#fff}
.btn.ghost{background:transparent}
.btn.xs{padding:6px 12px;font-size:12.5px;border-radius:10px}
.btn.big{padding:13px 22px;font-size:15.5px;width:100%}
.btn:disabled{opacity:.55;pointer-events:none}
.ic{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--text-sub);transition:.2s;font-size:15px;flex-shrink:0}
.ic:hover{background:var(--bg-input);color:var(--primary)}
.ic.xs{width:28px;height:28px;font-size:12px}
.ic.recording{background:var(--error);color:#fff;animation:pls 1.2s infinite}
.ic.send{color:var(--primary-lighter)}
@keyframes pls{50%{opacity:.6}}
.inp,.sel{width:100%;padding:11px 14px;border-radius:12px;border:2px solid var(--border);background:var(--bg-input);font-size:14px;font-weight:600;outline:none;transition:.2s}
.inp:focus,.sel:focus{border-color:var(--gold)}
textarea.inp{resize:vertical;line-height:1.7}
.tg{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:800;background:var(--bg-input);border:1px solid var(--border);color:var(--text-sub)}
.tg.g{background:rgba(30,122,90,.12);color:var(--success);border-color:rgba(30,122,90,.3)}
.tg.r{background:rgba(192,57,43,.1);color:var(--error);border-color:rgba(192,57,43,.3)}
.tg.y{background:rgba(214,137,16,.12);color:var(--warn);border-color:rgba(214,137,16,.35)}
.tg.o{background:rgba(201,169,97,.18);color:#9a7a2c;border-color:rgba(201,169,97,.5)}
/* avatar */
.av{position:relative;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:linear-gradient(135deg,var(--primary-light),var(--primary-lighter));color:#fff;font-weight:900;overflow:hidden;flex-shrink:0}
[data-theme="dark"] .av{color:#0A1612}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--bg-card)}
.av.logo{background:#fff;border:2px solid var(--gold)}
.av.logo img{object-fit:cover;padding:0;border-radius:50%}
.av34{width:34px;height:34px;font-size:14px}.av40{width:40px;height:40px;font-size:16px}.av44{width:44px;height:44px;font-size:17px}.av48{width:48px;height:48px;font-size:19px}.av72{width:72px;height:72px;font-size:28px}
.vb{color:#1d9bf0;font-size:.95em;margin:0 3px}
.vb.gold{color:var(--gold);filter:drop-shadow(0 0 4px rgba(201,169,97,.6))}
.tag-off{display:inline-block;background:linear-gradient(135deg,#C9A961,#E8D190);color:#2b2208;font-size:10.5px;font-weight:900;padding:1px 8px;border-radius:10px;margin-right:4px;vertical-align:middle}
/* composer trigger */
.trig{display:flex;align-items:center;gap:12px;padding:14px;margin-bottom:14px;flex-wrap:wrap}
.trig-in{flex:1;min-width:160px;text-align:right;padding:12px 18px;background:var(--bg-input);border:2px solid var(--border);border-radius:30px;font-weight:700;color:var(--text-sub);font-size:14.5px}
.trig-in:hover{border-color:var(--gold)}
.trig-btns{display:flex;gap:4px;width:100%;border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
.trig-btns button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border-radius:12px;font-weight:800;font-size:13.5px;color:var(--text-sub)}
.trig-btns button:hover{background:var(--bg-input)}
/* post card */
.post{background:var(--bg-card);border:1px solid var(--border);border-radius:18px;margin-bottom:16px;box-shadow:0 4px 16px var(--shadow);position:relative}
.post.official{border:2px solid transparent;background:linear-gradient(var(--bg-card),var(--bg-card)) padding-box,linear-gradient(135deg,#C9A961,#F3E2B0 50%,#C9A961) border-box;box-shadow:0 8px 30px rgba(201,169,97,.25)}
.post>*:first-child{border-radius:16px 16px 0 0}
.off-bar{background:linear-gradient(135deg,#0B3D2E,#145A43);color:var(--gold2);font-size:12.5px;font-weight:800;padding:7px 16px;display:flex;align-items:center;gap:8px;letter-spacing:.3px}
.pin-bar,.st-bar{font-size:12.5px;font-weight:800;padding:6px 16px;display:flex;align-items:center;gap:8px;background:var(--bg-input);color:var(--text-sub);border-bottom:1px solid var(--border)}
.st-bar.y{background:rgba(214,137,16,.12);color:var(--warn)}.st-bar.r{background:rgba(192,57,43,.1);color:var(--error)}
.p-head{display:flex;align-items:center;gap:12px;padding:14px 16px 8px;border-radius:0!important}
.p-meta{flex:1;min-width:0}
.p-name{font-weight:900;font-size:15.5px;display:flex;align-items:center;flex-wrap:wrap;gap:2px}
.p-name a{color:inherit;text-decoration:none}
.p-sub{font-size:12px;color:var(--text-sub);font-weight:600;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.spons{font-weight:900;color:var(--text-main)}
.fbtn{margin-right:8px;display:inline-flex;align-items:center;gap:5px;padding:2px 11px;border-radius:20px;font-size:12px;font-weight:800;border:1.5px solid var(--primary-lighter);color:var(--primary-lighter);background:transparent;transition:.2s;white-space:nowrap}
.fbtn:hover{background:var(--primary-lighter);color:#fff}
[data-theme="dark"] .fbtn:hover{color:var(--bg-page)}
.fbtn.on{background:var(--bg-input);color:var(--text-sub);border-color:var(--border)}
.menu-wrap{position:relative}
.menu{position:absolute;left:0;top:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:14px;box-shadow:0 12px 36px rgba(0,0,0,.25);min-width:210px;padding:6px;z-index:30;display:none}
.menu-wrap.open .menu{display:block}
.menu button{width:100%;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;font-weight:700;font-size:13.5px;text-align:right}
.menu button:hover{background:var(--bg-input)}
.menu button.d{color:var(--error)}
.menu i{width:18px;text-align:center;color:var(--text-sub)}
.p-text{padding:4px 16px 12px;font-size:15.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
.p-text.bgd{margin:6px 16px 12px;padding:34px 22px;min-height:210px;border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:25px;font-weight:900;color:#fff;line-height:1.6}
.tag{color:var(--primary-lighter);font-weight:800}
[data-theme="dark"] .tag{color:var(--accent-light)}
.grid{display:grid;gap:3px;margin-top:4px}
.gi{position:relative;overflow:hidden;cursor:zoom-in;background:var(--bg-input);aspect-ratio:1/1}
.gi img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.gi:hover img{transform:scale(1.04)}
.g1 .gi{aspect-ratio:auto;max-height:560px}.g1 .gi img{max-height:560px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:2fr 1fr;grid-template-rows:1fr 1fr}.g3 .gi:first-child{grid-row:span 2;aspect-ratio:auto}
.g4{grid-template-columns:1fr 1fr}
.g5{grid-template-columns:repeat(6,1fr)}.g5 .gi:nth-child(-n+2){grid-column:span 3}.g5 .gi:nth-child(n+3){grid-column:span 2}
.more{position:absolute;inset:0;background:rgba(0,0,0,.55);color:#fff;font-size:32px;font-weight:900;display:flex;align-items:center;justify-content:center}
.vid{width:100%;max-height:560px;background:#000;display:block;margin-top:4px}
.aud{margin:6px 16px 12px;display:flex;align-items:center;gap:12px;background:var(--bg-input);border:1px solid var(--border);border-radius:30px;padding:8px 16px}
.aud i{color:var(--primary-lighter);font-size:18px}.aud audio{flex:1;height:36px;min-width:0}
.shared{display:block;margin:4px 16px 12px;border:1px solid var(--border);border-radius:14px;overflow:hidden;color:inherit;text-decoration:none}
.shared .sh-b{padding:10px 14px;font-size:14px}.shared img{width:100%;max-height:320px;object-fit:cover;display:block}
.shared .sh-n{font-weight:900;font-size:13.5px;margin-bottom:4px}
.ad-cta{display:flex;align-items:center;gap:12px;background:var(--bg-input);border-top:1px solid var(--border);padding:11px 16px}
.ad-cta .u{flex:1;min-width:0;font-size:12px;color:var(--text-sub);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ad-cta b{display:block;font-size:14px;color:var(--text-main)}
.stats{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:13px;color:var(--text-sub);font-weight:700}
.stats button{color:inherit;font-weight:700;font-size:13px}.stats button:hover{text-decoration:underline}
.emo{display:inline-flex;margin-left:4px}.emo span{font-size:16px;margin-left:-5px;background:var(--bg-card);border-radius:50%;line-height:1}
.acts{display:flex;border-top:1px solid var(--border);margin:0 12px;padding:4px 0}
.acts>*{flex:1}
.act{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;padding:9px;border-radius:10px;font-weight:800;font-size:14px;color:var(--text-sub);transition:.2s}
.act:hover{background:var(--bg-input)}
.act.on{color:var(--primary-lighter)}
.react-wrap{position:relative}
.picker{position:absolute;bottom:100%;right:0;background:var(--bg-card);border:1px solid var(--border);border-radius:40px;padding:6px 10px;box-shadow:0 10px 30px rgba(0,0,0,.28);display:none;gap:2px;z-index:20}
.picker::after{content:'';position:absolute;left:0;right:0;top:100%;height:14px}
.react-wrap:hover .picker,.react-wrap.pk .picker{display:flex}
.picker button{font-size:26px;width:44px;height:44px;border-radius:50%;transition:.18s;line-height:1}
.picker button:hover{transform:scale(1.45) translateY(-6px)}
/* comments */
.cm-wrap{padding:6px 16px 14px;border-top:1px solid var(--border);margin-top:4px}
.cm-empty,.cm-loading{text-align:center;color:var(--text-sub);font-size:13px;font-weight:600;padding:12px}
.cm{display:flex;gap:10px;margin:10px 0}
.cm.hid{opacity:.55}
.cm-body{flex:1;min-width:0}
.cm-bub{background:var(--bg-input);border-radius:18px;padding:8px 14px;display:inline-block;max-width:100%}
.cm-name{font-weight:900;font-size:13px}
.cm-name a{color:inherit;text-decoration:none}
.cm-text{font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.cm-bub audio{height:34px;max-width:100%;margin-top:4px;display:block}
.cm-acts{display:flex;gap:12px;font-size:12px;color:var(--text-sub);font-weight:700;padding:3px 10px;flex-wrap:wrap}
.cm-acts button{font-size:12px;font-weight:800;color:var(--text-sub)}.cm-acts button:hover{color:var(--primary-lighter);text-decoration:underline}
.cm-acts button.d:hover{color:var(--error)}
.hid-tag{font-size:11px;color:var(--warn);margin-right:8px}
.cm-edit{display:flex;gap:6px;align-items:center;margin-top:4px;flex-wrap:wrap}
.cm-box{display:flex;gap:10px;align-items:center;margin-top:10px}
.cm-in{flex:1;display:flex;align-items:center;gap:4px;background:var(--bg-input);border:2px solid var(--border);border-radius:30px;padding:3px 8px;min-width:0}
.cm-in .c-input{flex:1;border:none;background:none;outline:none;padding:7px 8px;font-size:14px;font-weight:600;min-width:0}
.rec-bar{flex:1;display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:13px;font-weight:800;color:var(--error);min-width:0}
.rec-bar .dot{width:10px;height:10px;border-radius:50%;background:var(--error);animation:pls 1s infinite}
.rec-bar audio{height:32px;flex:1;min-width:0}
.cm-img{max-width:240px;max-height:240px;border-radius:12px;display:block;margin-top:6px;cursor:zoom-in}
.yt{width:100%;aspect-ratio:16/9;border:0;display:block;background:#000;margin-top:4px}.cm-bub .yt{width:min(320px,100%)}
.empty{text-align:center;padding:56px 20px;border:2px dashed var(--border);border-radius:20px;color:var(--text-sub);font-weight:700;margin-bottom:16px}
.empty i{font-size:46px;color:var(--gold);opacity:.65;display:block;margin-bottom:14px}
.more-b{display:block;margin:10px auto 30px}
.sk{height:200px;margin-bottom:16px;animation:pls 1.4s infinite}
/* modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.62);backdrop-filter:blur(5px);z-index:500;display:flex;align-items:center;justify-content:center;padding:14px;opacity:0;transition:opacity .2s}
.modal-ov.show{opacity:1}
.modal{background:var(--bg-card);border-radius:22px;width:min(560px,100%);max-height:92dvh;display:flex;flex-direction:column;box-shadow:0 30px 80px rgba(0,0,0,.45);border:1px solid var(--border);transform:translateY(16px) scale(.98);transition:.25s}
.modal-ov.show .modal{transform:none}
.modal.wide{width:min(700px,100%)}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
.mh h3{font-size:18px;font-weight:900}
.mb{padding:18px 20px;overflow:auto;flex:1}
.mf{padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:10px;justify-content:flex-end}
.dl-p{font-size:14.5px;line-height:1.8;font-weight:600;margin-bottom:10px}
.who{display:flex;align-items:center;gap:12px;margin-bottom:12px}.who b{display:block;font-weight:900}.who .sel{width:auto;padding:4px 10px;font-size:12.5px;margin-top:2px}
#cText{border:none;background:none;font-size:18px;min-height:120px;padding:4px;border-radius:0}
.bgs{display:flex;gap:8px;margin:6px 0 12px;flex-wrap:wrap}.bgs button{width:34px;height:34px;border-radius:10px;border:3px solid transparent}.bgs button.on{border-color:var(--text-main)}
.prev{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-bottom:12px}
.pv{position:relative;border-radius:12px;overflow:hidden;background:var(--bg-input);aspect-ratio:1;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:11px;font-weight:800;color:var(--text-sub);text-align:center;padding:6px}
.pv img,.pv video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pv i.big{font-size:28px;color:var(--primary-lighter)}
.pv .x{position:absolute;top:5px;left:5px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;font-size:11px;z-index:2}
.addbar{display:flex;align-items:center;gap:6px;border:2px solid var(--border);border-radius:14px;padding:6px 12px;margin-bottom:14px;flex-wrap:wrap}
.addbar>span{flex:1;font-weight:800;font-size:13.5px;min-width:100px}
.addbar button{width:40px;height:40px;border-radius:50%;font-size:19px}.addbar button:hover{background:var(--bg-input)}
.emorow{display:none;flex-wrap:wrap;gap:4px;margin-bottom:12px;background:var(--bg-input);border-radius:12px;padding:8px}.emorow.show{display:flex}.emorow button{font-size:22px;width:38px;height:38px;border-radius:10px}.emorow button:hover{background:var(--bg-card)}
.prog{height:34px;background:var(--bg-input);border-radius:10px;overflow:hidden;position:relative;margin-top:12px}.prog div{height:100%;background:linear-gradient(90deg,var(--primary-lighter),var(--gold));width:0;transition:width .2s}.prog span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900}
.adf{border:2px dashed var(--gold);border-radius:16px;padding:14px;margin:6px 0 12px;background:rgba(201,169,97,.06)}
.adf h4{font-weight:900;margin-bottom:10px;display:flex;gap:8px;align-items:center}.adf h4 i{color:var(--gold)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.fr label,.adf>label,.lbl{font-size:12.5px;font-weight:800;color:var(--text-sub);display:block;margin-bottom:4px}
.est{background:var(--bg-input);border-radius:12px;padding:10px 12px;font-size:13.5px;font-weight:800;margin:8px 0 10px;border:1px solid var(--border)}
.est b{color:var(--primary-lighter)}
.lbx{background:none;box-shadow:none;border:none;width:auto;max-width:96vw}.lbx img{max-width:96vw;max-height:90dvh;border-radius:14px;display:block}
.dli{display:flex;gap:10px;align-items:center;padding:9px 12px;background:var(--bg-input);border-radius:12px;margin-bottom:6px;font-size:13px;font-weight:700}.dli span{flex:1;min-width:0}.dli small{color:var(--text-sub)}

    const s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain(); s.buffer = b; f.type = type; f.Q.value = q; f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + d); env(g, t, Math.min(.06, d/3), d, pk); s.connect(f); f.connect(g); g.connect(c.destination); s.start(t); s.stop(t + d + .05); };

/* ترتيب الخلاصة (مثل فيسبوك): المتابَعون ← الأكثر مشاهدة/تفاعلاً ← الاهتمامات ← الأحدث، وغير المشاهَد قبل المشاهَد، مع لمسة عشوائية تتغير مع كل تحديث */
function rankIds(posts){ const u = S.soc[uid]||{}, ints = u.interests||{}, types = u.interestTypes||{}, auth = u.authorInterests||{}, fol = u.following||{};
  const tot = Object.values(ints).reduce((a,b) => a+b,0)||1, ttot = Object.values(types).reduce((a,b) => a+b,0)||1, amax = Math.max(1, ...Object.values(auth).map(Number)), now = Date.now();
  const sc = posts.map(p => { const age = (now-(tsd(p.createdAt)?.getTime()||now))/36e5, eng = Object.keys(p.reactions||{}).length + 2*(p.commentsCount||0) + 3*(p.sharesCount||0), a = p.authorId, own = a === uid;
    let s = 0;
    if (!isOff(p) && fol[a]) s += 55;                                   // 1) من أتابعهم
    s += 32 * Math.min(1, (Number(auth[fk(a||'')])||0) / amax);          // 2) من أشاهد وأتفاعل معهم دائماً
    s += 28 * ((ints[p.category||'general']||0)/tot) + 10 * ((types[mediaType(p)]||0)/ttot); // 3) اهتماماتي
    s += 44 * Math.exp(-age/24) + 6 * Math.log1p(eng);                   // 4) الأحدث والأكثر تفاعلاً
    if (!isOff(p)) s += 22 * Math.min(1, Math.log10(1 + followersOf(a)) / 4); // 5) المشاهير (كثيرو المتابعين)
    if (isOff(p)) s += 10; if (p.pinned) s += 15; if (own && age < 1) s += 20;
    if (seenMap[p.id] && now - seenMap[p.id] < 3*864e5) s -= 45;         // شاهدته من قبل
    s += Math.random() * 12;                                             // تنويع عند كل تحديث
    return {p, s}; }).sort((x,y) => y.s - x.s).map(x => x.p);
  const out = []; while (sc.length){ const last = out[out.length-1]?.authorId, i = sc.findIndex(p => p.authorId !== last); out.push(sc.splice(i < 0 ? 0 : i, 1)[0]); } // لا منشورين متتاليين لنفس الشخص
  return out.map(p => p.id); }

          else if (lag > 4){ v.currentTime = e - 1; v.playbackRate = 1; }
          else v.playbackRate = lag > 2 ? 1.12 : 1; }
        if (v.currentTime > 45) await trimBuf(); }
    } catch(e){ console.error(e); }
    busy = false; if (got.has(nxt)) pump(); else if (ended && mse.readyState === 'open'){ try { mse.endOfStream(); } catch(_){} } };
  mse.addEventListener('sourceopen', () => { if (sb) return;
    try { sb = mse.addSourceBuffer(mt); } catch(e){ ST.textContent = 'تعذر تشغيل البث اللحظي'; return; }
    unsub = onSnapshot(chunkQ(id), s => { s.docChanges().forEach(c => { if (c.type === 'added'){ const x = c.doc.data(); got.set(x.i, x.data); } }); pump(); if (!ended) ST.textContent = `مباشر — ${ar(got.size + nxt)} جزء`; });
    watchEnd(() => setTimeout(() => { ended = true; pump(); }, 4000)); });
}

/* ---------- 🖱️ الأحداث الجديدة ---------- */
Object.assign(H, {
  tab:t => { S.tab = t.dataset.t; S.q = ''; S.limit = 20; draw(); scrollTo({top:0}); },
  sqClear:() => { const i = $('sq'); if (i){ i.value = ''; i.focus(); } S.q = ''; const x = $('sqx'); if (x) x.hidden = true; draw(); },
  stNew:storyForm, stOpen:t => openStories(t.dataset.k), newPoll:pollForm,
  liveOpen:t => liveView(t.dataset.id),
  pvote:async t => { const p = S.polls.find(x => x.id === t.dataset.id); if (!p || !pOpen(p)) return; if (!uid) return toast('سجّل الدخول أولاً','error');
    const o = t.dataset.o, cur = p.votes?.[uid] || []; let nv = p.multi ? (cur.includes(o) ? cur.filter(x => x !== o) : [...cur, o]) : (cur.includes(o) ? [] : [o]);
    p.votes = {...(p.votes||{})}; if (nv.length) p.votes[uid] = nv; else delete p.votes[uid]; draw();
    try { await updateDoc(doc(db,'polls',p.id),{[`votes.${uid}`]: nv.length ? nv : deleteField()}); snd('like'); } catch(_){ toast('تعذر تسجيل صوتك','error'); } },
  pclose:async t => { const p = S.polls.find(x => x.id === t.dataset.id); if (!p || p.authorId !== uid) return; await updateDoc(doc(db,'polls',p.id), pOpen(p) ? {status:'closed'} : {status:'open', expiresAt:null}); toast(pOpen(p) ? 'تم إغلاق الاستطلاع' : 'تم فتح الاستطلاع'); },
  pdel:async t => { const p = S.polls.find(x => x.id === t.dataset.id); if (!p || p.authorId !== uid) return; if (!(await dialog({title:'حذف الاستطلاع', body:'سيُحذف الاستطلاع مع كل الأصوات.', confirm:'حذف', danger:true}))) return; await deleteDoc(doc(db,'polls',p.id)); toast('تم الحذف'); }
});
document.addEventListener('input', e => { if (e.target.id === 'sq'){ S.q = e.target.value; const x = $('sqx'); if (x) x.hidden = !S.q; S.limit = 20; draw(); } });

paint();
</script>
