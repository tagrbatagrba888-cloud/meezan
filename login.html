<!-- 🔐 جلسة دائمة: تبقى مسجل دخول 10 أيام حتى بعد قفل المتصفح (تنتهي بتسجيل الخروج) -->
<script>
(function () {
  try {
    var ss = window.sessionStorage, ls = window.localStorage;
    var P = 'meezan_', K = 'meezan_persist_v1', TTL = 10 * 24 * 60 * 60 * 1000;
    var rec = null;
    try { rec = JSON.parse(ls.getItem(K) || 'null'); } catch (e) {}
    if (rec && (!rec.exp || rec.exp <= Date.now() || !rec.d || rec.d.meezan_logged_in !== 'true')) { ls.removeItem(K); rec = null; }
    if (rec && ss.getItem('meezan_logged_in') !== 'true') { for (var k in rec.d) ss.setItem(k, rec.d[k]); }

    function save(renew) {
      try {
        var d = {};
        for (var i = 0; i < ss.length; i++) { var key = ss.key(i); if (key.indexOf(P) === 0) d[key] = ss.getItem(key); }
        if (d.meezan_logged_in !== 'true') { ls.removeItem(K); return; }
        var cur = null; try { cur = JSON.parse(ls.getItem(K) || 'null'); } catch (e) {}
        var exp = (!renew && cur && cur.exp > Date.now()) ? cur.exp : Date.now() + TTL;
        ls.setItem(K, JSON.stringify({ exp: exp, d: d }));
      } catch (e) {}
    }
    var proto = Storage.prototype, _s = proto.setItem, _r = proto.removeItem, _c = proto.clear;
    proto.setItem = function (k, v) { _s.call(this, k, v); if (this === ss && String(k).indexOf(P) === 0) save(k === 'meezan_logged_in'); };
    proto.removeItem = function (k) { _r.call(this, k); if (this === ss) save(false); };
    proto.clear = function () { _c.call(this); if (this === ss) save(false); };
    save(false);

    // صفحة الدخول: لو أنت مسجل بالفعل ادخل مباشرة للرئيسية
    if (/login(\.html)?$/i.test(location.pathname) && ss.getItem('meezan_logged_in') === 'true') { location.replace('index.html'); }
  } catch (e) {}
})();
</script>

<style>

  :root {
    --primary: #0B3D2E;
    --primary-light: #145A43;

  [data-theme="dark"] .form-footer strong { color: var(--accent); }

Object.keys(ADDR_DEFAULTS).forEach(g => {
  ADDR_DEFAULTS[g] = Array.from(new Set(ADDR_DEFAULTS[g].split('،').map(s => s.trim()).filter(Boolean)));

const __arNorm = (s) => String(s == null ? '' : s)
  .replace(/[\u064B-\u065F\u0670\u0640]/g, '')
  .replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
  .replace(/\s+/g, ' ').trim().toLowerCase();
const __cleanName = (s) => String(s == null ? '' : s).replace(/[<>"`]/g, '').replace(/\s+/g, ' ').trim().slice(0, 80);
const __cleanText = (s) => String(s == null ? '' : s).replace(/[<>`]/g, '').replace(/\s+/g, ' ').trim().slice(0, 250);
const __escA = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const __addrUid = () => 'x' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

const __addrEmpty = () => ({ govs: [], centers: [], villages: [], hidden: [], renames: {}, parents: {} });
let ADDR_CUSTOM = __addrEmpty();
let ADDR = { govs: [], centers: [], villages: [] };
const __addrSubs = new Set();

function __addrMerge(d) {
  const hidden = new Set(d.hidden || []);
  const rn = d.renames || {};
  const pr = d.parents || {};
  const govs = [], centers = [], villages = [];
  Object.keys(ADDR_DEFAULTS).forEach(g => {
    const gid = 'g:' + g;
    if (!hidden.has(gid)) govs.push({ id: gid, name: rn[gid] || g, def: true });
  });
  (d.govs || []).forEach(g => { if (g && g.id && g.name) govs.push({ id: g.id, name: g.name, def: false }); });
  const govIds = new Set(govs.map(g => g.id));
  Object.keys(ADDR_DEFAULTS).forEach(g => {
    ADDR_DEFAULTS[g].forEach(c => {
      const cid = 'c:' + g + '|' + c;
      if (hidden.has(cid)) return;
      const gid = pr[cid] || ('g:' + g);
      if (govIds.has(gid)) centers.push({ id: cid, name: rn[cid] || c, govId: gid, def: true });
    });
  });
  (d.centers || []).forEach(c => {
    if (c && c.id && c.name && govIds.has(c.govId)) centers.push({ id: c.id, name: c.name, govId: c.govId, def: false });
  });
  const centerIds = new Set(centers.map(c => c.id));
  (d.villages || []).forEach(v => {
    if (v && v.id && v.name && centerIds.has(v.centerId)) villages.push({ id: v.id, name: v.name, centerId: v.centerId });
  });
  const ar = (a, b) => a.name.localeCompare(b.name, 'ar');
  govs.sort(ar); centers.sort(ar); villages.sort(ar);
  return { govs, centers, villages };
}

function __addrBuild() {
  ADDR = __addrMerge(ADDR_CUSTOM);
  __addrSubs.forEach(fn => { try { fn(); } catch (e) {} });
}

const addrFindGov = (name) => { const n = __arNorm(name); return n ? ADDR.govs.find(g => __arNorm(g.name) === n) || null : null; };
const addrCentersOf = (govId) => ADDR.centers.filter(c => c.govId === govId);
const addrFindCenter = (govId, name) => { const n = __arNorm(name); return n ? addrCentersOf(govId).find(c => __arNorm(c.name) === n) || null : null; };
const addrVillagesOf = (centerId) => ADDR.villages.filter(v => v.centerId === centerId);

(function __addrLoad() {
  __addrBuild();
  try {
    onSnapshot(doc(db, 'settings', 'addresses'), (snap) => {
      ADDR_CUSTOM = Object.assign(__addrEmpty(), snap.exists() ? snap.data() : {});
      __addrBuild();
    }, () => {});
  } catch (e) {}
})();

async function addrMutate(fn) {
  const ref = doc(db, 'settings', 'addresses');
  let data = {};
  try { const s = await getDoc(ref); if (s.exists()) data = s.data(); } catch (e) {}
  const d = Object.assign(__addrEmpty(), data);
  d.govs = [...(d.govs || [])]; d.centers = [...(d.centers || [])]; d.villages = [...(d.villages || [])];
  d.hidden = [...(d.hidden || [])]; d.renames = { ...(d.renames || {}) }; d.parents = { ...(d.parents || {}) };
  const res = fn(d, __addrMerge(d));
  if (res === false) return false;
  await setDoc(ref, {
    govs: d.govs, centers: d.centers, villages: d.villages,
    hidden: d.hidden, renames: d.renames, parents: d.parents,
    updatedAt: serverTimestamp()
  });
  ADDR_CUSTOM = d;
  __addrBuild();
  return true;
}

// يحفظ القيم المكتوبة يدوياً (محافظة/مركز/قرية جديدة) لتظهر في القوائم لاحقاً
async function addrCommit(v) {
  const gName = __cleanName(v.governorate), cName = __cleanName(v.center), vName = __cleanName(v.village);
  if (!gName || !cName || !vName) return;
  const g0 = addrFindGov(gName);
  const c0 = g0 ? addrFindCenter(g0.id, cName) : null;
  const v0 = c0 ? addrVillagesOf(c0.id).find(x => __arNorm(x.name) === __arNorm(vName)) : null;
  if (g0 && c0 && v0) return;
  await addrMutate((d, m) => {
    let g = m.govs.find(x => __arNorm(x.name) === __arNorm(gName));
    if (!g) { g = { id: __addrUid(), name: gName }; d.govs.push(g); }
    let c = m.centers.find(x => x.govId === g.id && __arNorm(x.name) === __arNorm(cName));
    if (!c) { c = { id: __addrUid(), name: cName, govId: g.id }; d.centers.push(c); }
    const vv = m.villages.find(x => x.centerId === c.id && __arNorm(x.name) === __arNorm(vName));
    if (!vv) d.villages.push({ id: __addrUid(), name: vName, centerId: c.id });
  });
}

function formatAddress(u) {
  if (!u) return '';
  const parts = [u.addressDetails, u.village, u.center, u.governorate].map(s => String(s || '').trim()).filter(Boolean);
  return parts.join('، ');
}
const hasFullAddress = (u) => !!(u && u.governorate && u.center && u.village && u.addressDetails);

// ---------------- Combobox ----------------
function __addrCombo(cfg) {
  const wrap = document.createElement('div');
  wrap.className = 'adw-combo';
  wrap.innerHTML = `<i class="fas ${cfg.icon} adw-ico"></i><input type="text" class="adw-input" autocomplete="off" maxlength="80"><i class="fas fa-chevron-down adw-arrow"></i><span class="adw-tag">يدوي</span><div class="adw-list"></div>`;
  const input = wrap.querySelector('input');
  const list = wrap.querySelector('.adw-list');
  input.placeholder = cfg.placeholder || '';
  let hl = -1, last = '';
  const LIMIT = 200;

  const opts = () => { try { return cfg.getOptions() || []; } catch (e) { return []; } };
  const findExact = (v) => { const n = __arNorm(v); return n ? opts().find(o => __arNorm(o) === n) : undefined; };

  function updateTag() {
    const v = input.value.trim();
    wrap.classList.toggle('manual', !!v && !findExact(v));
  }

  function render() {
    const q = __arNorm(input.value);
    const all = opts();
    const matched = q ? all.filter(o => __arNorm(o).includes(q)) : all;
    const shown = matched.slice(0, LIMIT);
    let html = '';
    shown.forEach((o, i) => { html += `<div class="adw-item" data-i="${i}" data-v="${__escA(o)}"><i class="fas fa-location-dot" style="font-size:11px;opacity:.5"></i>${__escA(o)}</div>`; });
    if (matched.length > LIMIT) html += `<div class="adw-more">يوجد ${matched.length - LIMIT} نتيجة أخرى — اكتب للتصفية</div>`;
    if (!matched.length && !input.value.trim()) html += `<div class="adw-empty">${cfg.emptyText || 'لا توجد خيارات — اكتب القيمة يدوياً'}</div>`;
    const typed = input.value.trim();
    if (typed && !findExact(typed)) html += `<div class="adw-item add" data-manual="1"><i class="fas fa-plus-circle"></i>إضافة «${__escA(typed)}» يدوياً</div>`;
    list.innerHTML = html;
    hl = -1;
  }

  function open() { if (input.disabled) return; render(); wrap.classList.add('open'); }
  function close() {
    wrap.classList.remove('open');
    const ex = findExact(input.value);
    if (ex) input.value = ex;
    updateTag();
  }
  function fire() {
    const cur = __arNorm(input.value);
    if (cur === last) return;
    last = cur;
    updateTag();
    if (cfg.onUserChange) cfg.onUserChange();
  }
  function pick(v) { input.value = v; close(); fire(); }

  input.addEventListener('focus', open);
  input.addEventListener('click', () => { if (!wrap.classList.contains('open')) open(); });
  input.addEventListener('input', () => { if (!wrap.classList.contains('open')) wrap.classList.add('open'); render(); fire(); });
  list.addEventListener('mousedown', (e) => {
    e.preventDefault();
    const it = e.target.closest('.adw-item');
    if (!it) return;
    if (it.dataset.manual) { close(); input.blur(); return; }
    pick(it.dataset.v);
  });
  input.addEventListener('keydown', (e) => {
    const items = [...list.querySelectorAll('.adw-item:not(.add)')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!wrap.classList.contains('open')) open();
      if (!items.length) return;
      hl = e.key === 'ArrowDown' ? (hl + 1) % items.length : (hl <= 0 ? items.length - 1 : hl - 1);
      items.forEach((x, i) => x.classList.toggle('hl', i === hl));
      items[hl].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (hl >= 0 && items[hl]) pick(items[hl].dataset.v); else { close(); }
    } else if (e.key === 'Escape') { close(); }
  });
  input.addEventListener('blur', () => setTimeout(close, 120));
  document.addEventListener('mousedown', (e) => { if (!wrap.contains(e.target) && wrap.classList.contains('open')) close(); });

  return {
    el: wrap,
    get value() { return __cleanName(input.value); },
    set(v) { input.value = v || ''; last = __arNorm(input.value); updateTag(); },
    setDisabled(b) { input.disabled = !!b; if (b) wrap.classList.remove('open'); },
    refresh() { updateTag(); if (wrap.classList.contains('open')) render(); },
    isManual() { const v = input.value.trim(); return !!v && !findExact(v); },
    focus() { input.focus(); }
  };
}

function createAddressWidget(mount, opts) {
  opts = opts || {};
  const root = document.createElement('div');
  root.className = 'adw';
  root.innerHTML = `
    <div class="adw-head"><i class="fas fa-map-location-dot"></i> العنوان <span style="color:var(--error,#C0392B)">*</span></div>
    <div class="adw-note">اختر من القائمة أو اكتب يدوياً إن لم تجده — كل الحقول إجبارية</div>
    <div class="adw-grid">
      <div><label class="adw-lbl">المحافظة <b>*</b></label><div data-slot="gov"></div></div>
      <div><label class="adw-lbl">المركز <b>*</b></label><div data-slot="center"></div></div>
      <div><label class="adw-lbl">القرية / المنطقة <b>*</b></label><div data-slot="village"></div></div>
      <div><label class="adw-lbl">العنوان تفصيلياً <b>*</b></label><textarea class="adw-ta" maxlength="250" placeholder="مثال: شارع المدرسة، بجوار مسجد الرحمن، عمارة 5، الدور الثالث"></textarea></div>
    </div>`;
  mount.innerHTML = '';
  mount.appendChild(root);

  const centersNames = (gName) => { const g = addrFindGov(gName); return g ? addrCentersOf(g.id).map(c => c.name) : []; };
  const villagesNames = (gName, cName) => {
    const g = addrFindGov(gName); if (!g) return [];
    const c = addrFindCenter(g.id, cName); return c ? addrVillagesOf(c.id).map(v => v.name) : [];
  };
  const has = (arr, v) => { const n = __arNorm(v); return !!n && arr.some(x => __arNorm(x) === n); };

  let lastGov = '', lastCenter = '';
  const gov = __addrCombo({ icon: 'fa-map', placeholder: 'اختر المحافظة أو اكتبها', getOptions: () => ADDR.govs.map(g => g.name),
    onUserChange: () => {
      const prev = lastGov; lastGov = gov.value;
      if (center.value) {
        const was = has(centersNames(prev), center.value), now = has(centersNames(lastGov), center.value);
        if (was && !now) { center.set(''); village.set(''); lastCenter = ''; }
      }
      sync();
    } });
  const center = __addrCombo({ icon: 'fa-city', placeholder: 'اختر المركز أو اكتبه', emptyText: 'لا توجد مراكز مسجلة لهذه المحافظة — اكتب اسم المركز يدوياً',
    getOptions: () => centersNames(gov.value),
    onUserChange: () => {
      const prev = lastCenter; lastCenter = center.value;
      if (village.value) {
        const was = has(villagesNames(gov.value, prev), village.value), now = has(villagesNames(gov.value, lastCenter), village.value);
        if (was && !now) village.set('');
      }
      sync();
    } });
  const village = __addrCombo({ icon: 'fa-house-chimney', placeholder: 'اختر القرية أو اكتبها', emptyText: 'لا توجد قرى مسجلة لهذا المركز — اكتب اسم القرية يدوياً',
    getOptions: () => villagesNames(gov.value, center.value), onUserChange: () => sync() });
  root.querySelector('[data-slot="gov"]').appendChild(gov.el);
  root.querySelector('[data-slot="center"]').appendChild(center.el);
  root.querySelector('[data-slot="village"]').appendChild(village.el);
  const ta = root.querySelector('textarea');

  function sync() {
    center.setDisabled(!gov.value);
    village.setDisabled(!center.value);
    center.refresh(); village.refresh();
  }
  const sub = () => { gov.refresh(); center.refresh(); village.refresh(); };
  __addrSubs.add(sub);

  const api = {
    root,
    getValue() {
      return { governorate: gov.value, center: center.value, village: village.value, addressDetails: __cleanText(ta.value) };
    },
    setValue(v) {
      v = v || {};
      gov.set(v.governorate || ''); center.set(v.center || ''); village.set(v.village || '');
      lastGov = gov.value; lastCenter = center.value;
      ta.value = v.addressDetails || '';
      sync();
    },
    reset() { api.setValue({}); },
    validate() {
      const v = api.getValue();
      if (!v.governorate) return 'الرجاء اختيار المحافظة أو كتابتها';
      if (v.governorate.length < 2) return 'اسم المحافظة قصير جداً';
      if (!v.center) return 'الرجاء اختيار المركز أو كتابته';
      if (v.center.length < 2) return 'اسم المركز قصير جداً';
      if (!v.village) return 'الرجاء اختيار القرية أو كتابتها';
      if (v.village.length < 2) return 'اسم القرية قصير جداً';
      if (!v.addressDetails) return 'الرجاء كتابة العنوان تفصيلياً';
      if (v.addressDetails.length < 5) return 'العنوان التفصيلي قصير جداً (5 أحرف على الأقل)';
      return '';
    },
    async commit() { try { await addrCommit(api.getValue()); } catch (e) { console.log('addr commit:', e && e.message); } }
  };
  api.reset();
  return api;
}

function withTimeout(promise, ms = 8000, msg = 'انتهت المهلة، تحقق من الإنترنت') {
  return Promise.race([
    promise,
    new Promise((_, reject) => setTimeout(() => reject(new Error(msg)), ms))
  ]);
}

function cleanInput(value) {
  if (typeof value !== 'string') return '';
  return value
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .replace(/[\u00A0\u1680\u2000-\u200A\u2028\u2029\u202F\u205F\u3000]/g, ' ')
    .replace(/^\s+|\s+$/g, '')
    .trim();
}

// ============================================================
const SECRET_KEY = 'MEEZAN_2026_SECRET_KEY_v1';

function xorEncrypt(text, key) {
  let result = '';
  for (let i = 0; i < text.length; i++) {
    result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
  }
  return result;
}

function encryptPassword(password) {
  try {
    const xorResult = xorEncrypt(password, SECRET_KEY);
    return btoa(unescape(encodeURIComponent(xorResult)));
  } catch (e) { return ''; }
}

// ============================================================
// 🇪🇬 التحقق من الرقم القومي المصري
// ============================================================
function validateEgyptianNationalId(nid, birthDate) {
  if (!nid || !/^\d{14}$/.test(nid)) {
    return { valid: false, message: 'الرقم القومي يجب أن يكون 14 رقم' };
  }

  const center = parseInt(nid[0]);
  if (center < 2 || center > 4) {
    return { valid: false, message: 'الرقم الأول غير صحيح' };
  }

  const yearShort = parseInt(nid.substring(1, 3));
  const month = parseInt(nid.substring(3, 5));
  const day = parseInt(nid.substring(5, 7));

  if (month < 1 || month > 12) return { valid: false, message: 'الشهر غير صحيح' };
  if (day < 1 || day > 31) return { valid: false, message: 'اليوم غير صحيح' };

  let century = 1900;
  if (center === 3) century = 2000;
  if (center === 4) century = 2100;

  const year = century + yearShort;
  const nidDate = new Date(year, month - 1, day);

  if (nidDate.getFullYear() !== year || nidDate.getMonth() !== month - 1 || nidDate.getDate() !== day) {
    return { valid: false, message: 'التاريخ داخل الرقم القومي غير صحيح' };
  }

  if (nidDate > new Date()) {
    return { valid: false, message: 'تاريخ الميلاد في المستقبل' };
  }

  if (birthDate) {
    const bd = new Date(birthDate);
    if (bd.getFullYear() !== year || bd.getMonth() !== month - 1 || bd.getDate() !== day) {
      return { valid: false, message: 'تاريخ الميلاد لا يطابق الرقم القومي' };
    }
  }

  const governorate = parseInt(nid.substring(7, 9));
  const validGovs = [1, 2, 3, 4, 11, 12, 13, 14, 15, 16, 17, 18, 19, 21, 22, 23, 24, 25, 26, 27, 28, 29, 31, 32, 33, 34, 35];
  if (!validGovs.includes(governorate)) {
    return { valid: false, message: 'كود المحافظة غير صحيح' };
  }

  return { 
    valid: true, 
    message: 'صحيح ✓', 
    birthDate: `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}` 
  };
}

function buildCopyright(data) {
  const year = new Date().getFullYear();
  const nameAr = data.siteNameAr || 'ميزان';
  const nameEn = data.siteNameEn || 'MEEZAN';
  if (data.copyright) {
    return data.copyright.replace(/©\s*\d{4}/g, `© ${year}`).replace(/\b20\d{2}\b/g, year);
  }
  return `<strong>${nameAr} | ${nameEn}</strong> © ${year}`;
}

// ============================================================
const usersMemoryCache = {
  users: { items: [], fetchedAt: 0 },
  teachers: { items: [], fetchedAt: 0 }
};

const MEMORY_TTL = 60 * 1000; // 60 ثانية

function getUsersFromMemory(collectionName) {
  const c = usersMemoryCache[collectionName];
  if (!c) return null;
  if (Date.now() - c.fetchedAt > MEMORY_TTL) return null;
  return c.items;
}

function setUsersToMemory(collectionName, items) {
  const c = usersMemoryCache[collectionName];
  if (!c) return;
  c.items = items;
  c.fetchedAt = Date.now();
}

function invalidateUsersMemory(collectionName) {
  const c = usersMemoryCache[collectionName];
  if (!c) return;
  c.items = [];
  c.fetchedAt = 0;
}

// ============================================================
// ⚡ قراءة سريعة للمستخدمين (مع كاش + getDoc)
// ============================================================
async function fetchUsersFast(collectionName, useCache = true) {
  if (useCache) {
    const mem = getUsersFromMemory(collectionName);
    if (mem && mem.length > 0) return mem;
  }

  const snap = await withTimeout(
    getDoc(doc(db, collectionName, 'all')),
    8000,
    'تعذّر تحميل البيانات — تحقق من الإنترنت'
  );

  const items = snap.exists() ? (snap.data().items || []) : [];
  setUsersToMemory(collectionName, items);
  return items;
}

function applySettings(data) {
  if (!data) return;

  if (data.logoUrl) {
    const logo = $('logoImg');
    if (logo.src !== data.logoUrl) logo.src = data.logoUrl;
    const iconLink = document.querySelector('link[rel="icon"]');
    if (iconLink && iconLink.href !== data.logoUrl) iconLink.href = data.logoUrl;
  }

  if (data.siteNameAr) {
    $('siteNameAr').textContent = data.siteNameAr;
    const fa = $('footerNameAr'); if (fa) fa.textContent = data.siteNameAr;
  }
  if (data.siteNameEn) {
    $('siteNameEn').textContent = data.siteNameEn;
    const fe = $('footerNameEn'); if (fe) fe.textContent = data.siteNameEn;
  }

  const nameAr = data.siteNameAr || 'ميزان';
  const nameEn = data.siteNameEn || 'MEEZAN';
  document.title = `${nameAr} | ${nameEn} - تسجيل الدخول`;

  if (data.tagline) $('tagline').textContent = data.tagline;
  if (data.formSubtitle) $('formSubtitle').textContent = data.formSubtitle;

  $('copyrightText').innerHTML = buildCopyright(data);

  studentLoginEnabled = data.studentLoginEnabled !== false;
  teacherLoginEnabled = data.teacherLoginEnabled !== false;
  studentRegisterEnabled = data.studentRegisterEnabled !== false;
  teacherRegisterEnabled = data.teacherRegisterEnabled !== false;

  nationalIdEnabled = data.nationalIdEnabled === true;
  if (nationalIdEnabled) {
    $('regNidGroup').style.display = '';
    $('birthDateHint').textContent = '(يُحدد تلقائياً من الرقم القومي)';
    $('gNidGroup').style.display = '';
    $('gBirthHint').textContent = '(يُحدد تلقائياً)';
  } else {
    $('regNidGroup').style.display = 'none';
    $('birthDateHint').textContent = '';
    $('gNidGroup').style.display = 'none';
    $('gBirthHint').textContent = '';
  }

  applyRoleStates();
  applyColors(data);
}

function applyRoleStates() {
  document.querySelectorAll('[data-role]').forEach(btn => {
    const role = btn.dataset.role;
    const enabled = role === 'teacher' ? teacherLoginEnabled : studentLoginEnabled;
    if (enabled) {
      btn.classList.remove('disabled-role');
      btn.disabled = false;
    } else {
      btn.classList.add('disabled-role');
      btn.disabled = true;
      if (btn.classList.contains('selected')) {
        btn.classList.remove('selected');
        const otherRole = role === 'teacher' ? 'student' : 'teacher';
        const otherBtn = document.querySelector(`[data-role="${otherRole}"]`);
        if (otherBtn && !otherBtn.disabled) {
          otherBtn.classList.add('selected');
          currentLoginRole = otherRole;
        }
      }
    }
  });

  document.querySelectorAll('[data-reg-role]').forEach(btn => {
    const role = btn.dataset.regRole;
    const enabled = role === 'teacher' ? teacherRegisterEnabled : studentRegisterEnabled;
    if (enabled) {
      btn.classList.remove('disabled-role');
      btn.disabled = false;
    } else {
      btn.classList.add('disabled-role');
      btn.disabled = true;
      if (btn.classList.contains('selected')) {
        btn.classList.remove('selected');
        const otherRole = role === 'teacher' ? 'student' : 'teacher';
        const otherBtn = document.querySelector(`[data-reg-role="${otherRole}"]`);
        if (otherBtn && !otherBtn.disabled) {
          otherBtn.classList.add('selected');
          currentRegRole = otherRole;
        }
      }
    }
  });

  const bothRegistersClosed = !studentRegisterEnabled && !teacherRegisterEnabled;
  const regTab = document.querySelector('.auth-tab[data-tab="register"]');
  if (regTab) {
    regTab.style.display = bothRegistersClosed ? 'none' : 'flex';
    if (bothRegistersClosed) {
      const activeContent = document.querySelector('.auth-content.active');
      if (activeContent?.id === 'content-register') {
        document.querySelector('.auth-tab[data-tab="login"]').click();
      }
    }
  }
}

function applyColors(data) {
  const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  const rootStyle = document.documentElement.style;

  rootStyle.removeProperty('--primary');
  rootStyle.removeProperty('--accent');

  if (currentTheme === 'light' && data.lightColorsEnabled === true) {
    if (data.lightPrimary && /^#[0-9A-Fa-f]{6}$/.test(data.lightPrimary)) rootStyle.setProperty('--primary', data.lightPrimary);
    if (data.lightAccent && /^#[0-9A-Fa-f]{6}$/.test(data.lightAccent)) rootStyle.setProperty('--accent', data.lightAccent);
  } else if (currentTheme === 'dark' && data.darkColorsEnabled === true) {
    if (data.darkPrimary && /^#[0-9A-Fa-f]{6}$/.test(data.darkPrimary)) rootStyle.setProperty('--primary', data.darkPrimary);
    if (data.darkAccent && /^#[0-9A-Fa-f]{6}$/.test(data.darkAccent)) rootStyle.setProperty('--accent', data.darkAccent);
  }
}

const SIGNUP_COL = 'signup_requests';
let signupApprovalEnabled = false;

onSnapshot(doc(db, 'users', 'settings'), (snap) => {
  if (!snap.exists()) return;
  const v = snap.data().signupApprovalEnabled;
  if (typeof v === 'boolean') signupApprovalEnabled = v;
}, () => {});

async function isApprovalOn() {
  try {
    const s = await withTimeout(getDoc(doc(db, 'users', 'settings')), 5000);
    if (s.exists() && typeof s.data().signupApprovalEnabled === 'boolean') signupApprovalEnabled = s.data().signupApprovalEnabled;
  } catch (e) {}
  return signupApprovalEnabled;
}

const reqId = (role, username) => 'req_' + role + '_' + String(username).toLowerCase().replace(/[^a-z0-9_.\u0600-\u06FF-]/gi, '_');

async function getRequest(role, username) {
  try {
    const s = await withTimeout(getDoc(doc(db, SIGNUP_COL, reqId(role, username))), 6000);
    return s.exists() ? { ...s.data(), id: s.id } : null;
  } catch (e) { return null; }
}

// هل لهذا الحساب طلب معلّق/مرفوض؟ (يُستدعى عند فشل الدخول العادي)
async function checkRequestOnLogin(username, password) {
  for (const role of ['student', 'teacher']) {
    const r = await getRequest(role, username);
    if (!r || r.status === 'approved') continue;
    if (r.passwordEncrypted !== encryptPassword(password)) return 'wrongpass';
    if (r.status === 'rejected') return 'rejected';
    return 'pending';
  }
  return null;
}

const PENDING_LOGIN_MSG = 'عذراً، حسابك الآن قيد المراجعة. عند الانتهاء من مراجعته يمكنك تسجيل الدخول إذا وافقنا عليه.';
const PENDING_REGISTER_MSG = 'تم إرسال طلبك بنجاح — جاري مراجعة حسابك. سنتيح لك تسجيل الدخول فور الموافقة.';

async function submitSignupRequest(role, user) {
  const id = reqId(role, user.username);
  const old = await getRequest(role, user.username);
  if (old && old.status === 'pending') throw new Error('يوجد طلب بنفس اسم المستخدم قيد المراجعة بالفعل');
  const now = new Date().toISOString();
  await withTimeout(setDoc(doc(db, SIGNUP_COL, id), {
    ...user,
    role,
    status: 'pending',
    createdAt: now,
    requestedAt: now
  }), 10000, 'تأخّر الاتصال أثناء إرسال الطلب');
}

function showDisabledAccount(user) {
  hideAllMessages();
  const dm = $('disabledMsg');

  if (user.disableUntil) {
    $('dmUntilText').textContent = `التعطيل حتى: ${formatDateTime(user.disableUntil)}`;
    $('dmUntilRow').style.display = 'flex';
    $('dmRemainingText').textContent = `متبقي: ${getRemainingTime(user.disableUntil)}`;
    $('dmRemainingRow').style.display = 'flex';
  } else {
    $('dmUntilRow').style.display = 'none';
    $('dmRemainingRow').style.display = 'none';
  }

  if (user.disableReason) {
    $('dmReasonText').textContent = `السبب: ${user.disableReason}`;
    $('dmReasonRow').style.display = 'flex';
  } else {
    $('dmReasonRow').style.display = 'none';
  }

  dm.classList.add('show');
  startDisabledTimer(user);
}

function formatDateTime(iso) {
  if (!iso) return '—';
  try {
    const d = new Date(iso);
    return d.toLocaleString('ar-EG', {
      year: 'numeric', month: 'long', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  } catch (e) { return '—'; }
}

function getRemainingTime(untilIso) {
  if (!untilIso) return '—';
  const diff = new Date(untilIso).getTime() - Date.now();
  if (diff <= 0) return 'انتهى التعطيل';

  const days = Math.floor(diff / 86400000);
  const hours = Math.floor((diff % 86400000) / 3600000);
  const minutes = Math.floor((diff % 3600000) / 60000);
  const seconds = Math.floor((diff % 60000) / 1000);

  const parts = [];
  if (days > 0) parts.push(`${days} يوم`);
  if (hours > 0) parts.push(`${hours} ساعة`);
  if (minutes > 0) parts.push(`${minutes} دقيقة`);
  if (seconds > 0 && parts.length < 3) parts.push(`${seconds} ثانية`);

  return parts.length > 0 ? parts.join(' و ') : 'ثواني';
}

let disabledCheckInterval = null;
function startDisabledTimer(user) {
  if (disabledCheckInterval) clearInterval(disabledCheckInterval);
  disabledCheckInterval = setInterval(() => {
    if (!user.disableUntil) return;
    const remaining = getRemainingTime(user.disableUntil);
    $('dmRemainingText').textContent = `متبقي: ${remaining}`;
    if (new Date(user.disableUntil) < new Date()) {
      clearInterval(disabledCheckInterval);
      $('dmRemainingText').textContent = 'انتهى التعطيل — حاول الدخول مرة أخرى';
    }
  }, 1000);
}

function setupPasswordToggle(btnId, inputId, iconId) {
  const btn = $(btnId);
  const input = $(inputId);
  const icon = $(iconId);
  if (!btn || !input || !icon) return;
  btn.addEventListener('click', () => {
    const isPwd = input.type === 'password';
    input.type = isPwd ? 'text' : 'password';
    icon.className = isPwd ? 'fas fa-eye-slash' : 'fas fa-eye';
  });
}

setupPasswordToggle('toggleLoginPassword', 'loginPassword', 'loginEyeIcon');

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAllMessages();

  const username = cleanInput($('loginUsername').value);
  const password = cleanInput($('loginPassword').value);

  $('loginUsername').value = username;
  $('loginPassword').value = password;

  if (!username || !password) return showError('الرجاء إدخال اسم المستخدم وكلمة السر');

  if (currentLoginRole === 'student' && !studentLoginEnabled) {
    return showError('تسجيل دخول الطلاب مغلق حالياً');
  }
  if (currentLoginRole === 'teacher' && !teacherLoginEnabled) {
    return showError('تسجيل دخول المعلمين مغلق حالياً');
  }

  const btn = $('loginBtn');
  const spinner = $('loginSpinner');
  const icon = $('loginIcon');
  const btnText = $('loginBtnText');

  btn.disabled = true;
  spinner.classList.add('show');
  icon.style.display = 'none';
  btnText.textContent = 'جاري التحقق...';

  const t0 = performance.now();

  try {
    const collectionName = currentLoginRole === 'teacher' ? 'teachers' : 'users';

    // ⚡ قراءة سريعة (getDoc + memory cache)
    const items = await fetchUsersFast(collectionName, true);

    const user = items.find(u => (u.username || '').toLowerCase() === username.toLowerCase());

    if (!user) {
      const rs = await checkRequestOnLogin(username, password);
      if (rs === 'pending') throw new Error(PENDING_LOGIN_MSG);
      if (rs === 'rejected') throw new Error('عذراً، تم رفض طلب إنشاء حسابك من قبل الإدارة');
      if (rs === 'wrongpass') throw new Error('كلمة السر غير صحيحة');
      throw new Error('اسم المستخدم غير صحيح');
    }

    const encrypted = encryptPassword(password);
    if (encrypted !== user.passwordEncrypted) throw new Error('كلمة السر غير صحيحة');

    if (user.isDisabled === true) {
      const expired = user.disableUntil && new Date(user.disableUntil) < new Date();
      if (!expired) {
        showDisabledAccount(user);
        showToast('حسابك معطّل حالياً — راجع التفاصيل أسفل العنوان', 'error');
        btn.disabled = false;
        spinner.classList.remove('show');
        icon.style.display = '';
        btnText.textContent = 'تسجيل الدخول';
        return;
      }
    }

    // ✅ حفظ الجلسة أولاً (المستخدم جاهز للانتقال)
    saveSession(user, currentLoginRole, username);

    // 🚀 التوجيه فوراً — بدون انتظار markUserOnline
    const elapsed = Math.round(performance.now() - t0);
    console.log(`⚡ Login took ${elapsed}ms`);

    $('loginUsername').value = '';
    $('loginPassword').value = '';

    showSuccess(`مرحباً ${user.fullName || username}! جاري التوجيه...`);

    // ⚡ markUserOnline في الخلفية (لا يعطّل التوجيه)
    markUserOnline(collectionName, user.id);

    setTimeout(() => window.location.replace('index.html'), 400);

  } catch (err) {
    spinner.classList.remove('show');
    icon.style.display = '';
    btnText.textContent = 'تسجيل الدخول';
    btn.disabled = false;
    $('loginPassword').value = '';
    showError(err.message || 'حدث خطأ، حاول مرة أخرى', err.message === PENDING_LOGIN_MSG ? 8000 : undefined);
  }
});

const regAddr = createAddressWidget($('regAddressMount'));
const gAddr = createAddressWidget($('gAddressMount'));

$('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideAllMessages();

  if (currentRegRole === 'student' && !studentRegisterEnabled) {
    return showRegistrationClosed('تسجيل الطلاب مغلق حالياً');
  }
  if (currentRegRole === 'teacher' && !teacherRegisterEnabled) {
    return showRegistrationClosed('تسجيل المعلمين مغلق حالياً');
  }

  const fullName = cleanInput($('regFullName').value);
  const username = cleanInput($('regUsername').value);
  const password = cleanInput($('regPassword').value);
  const confirmPassword = cleanInput($('regConfirmPassword').value);
  const nationalId = cleanInput($('regNationalId').value);
  const birthDate = $('regBirthDate').value;
  const grade = $('regGrade').value;
  const phone = cleanInput($('regPhone').value);
  const email = cleanInput($('regEmail').value);

  if (!fullName || fullName.length < 3) return showError('الاسم الكامل يجب أن يكون 3 أحرف على الأقل');
  if (!username || username.length < 3) return showError('اسم المستخدم يجب أن يكون 3 أحرف على الأقل');
  if (!/^[a-zA-Z0-9_.\u0600-\u06FF]+$/.test(username)) return showError('اسم المستخدم يحتوي على أحرف غير مسموحة');
  if (!password || password.length < 6) return showError('كلمة السر يجب أن تكون 6 أحرف على الأقل');
  if (password !== confirmPassword) return showError('كلمتا السر غير متطابقتين');
  if (!phone || !/^01[0-9]{9}$/.test(phone)) return showError('رقم الهاتف غير صحيح (01xxxxxxxxx)');
  if (!email) return showError('البريد الإلكتروني مطلوب');
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return showError('البريد الإلكتروني غير صحيح');

  if (nationalIdEnabled && !nationalId) return showError('الرجاء إدخال الرقم القومي');

  if (nationalId) {
    const check = validateEgyptianNationalId(nationalId, birthDate);
    if (!check.valid) return showError(check.message);
  }

  if (!birthDate) return showError('الرجاء إدخال تاريخ الميلاد');
  if (!grade) {
    const gradeName = currentRegRole === 'teacher' ? 'المادة الدراسية' : 'الفرقة الدراسية';
    return showError(`الرجاء اختيار ${gradeName}`);
  }
  const regAddrErr = regAddr.validate();
  if (regAddrErr) return showError(regAddrErr);
  const regAddrVal = regAddr.getValue();
  if (!checkTerms()) return;

  const btn = $('registerBtn');
  const spinner = $('registerSpinner');
  const icon = $('registerIcon');
  const btnText = $('registerBtnText');

  btn.disabled = true;
  spinner.classList.add('show');
  icon.style.display = 'none';
  btnText.textContent = 'جاري إنشاء الحساب...';

  const t0 = performance.now();

  try {
    const collectionName = currentRegRole === 'teacher' ? 'teachers' : 'users';

    // ⚡ قراءة سريعة
    let items = await fetchUsersFast(collectionName, true);

    if (items.find(u => (u.username || '').toLowerCase() === username.toLowerCase())) {
      throw new Error('اسم المستخدم موجود بالفعل');
    }
    if (items.find(u => (u.phone || '') === phone)) {
      throw new Error('رقم الهاتف مسجّل بالفعل');
    }
    if (items.find(u => (u.email || '').toLowerCase() === email.toLowerCase())) {
      throw new Error('البريد الإلكتروني مسجّل بالفعل');
    }
    if (nationalId && items.find(u => (u.nationalId || '') === nationalId)) {
      throw new Error('الرقم القومي مسجّل بالفعل');
    }

    const approvalOn = await isApprovalOn();
    if (!approvalOn) await regAddr.commit();

    const now = new Date().toISOString();
    const prefix = currentRegRole === 'teacher' ? 'TCH-' : 'USR-';
    const newUser = {
      id: (currentRegRole === 'teacher' ? 'teacher_' : 'user_') + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      fullName, username,
      passwordEncrypted: encryptPassword(password),
      code: prefix + Date.now().toString().slice(-6),
      nationalId: nationalId || '',
      birthDate: birthDate || '',
      phone, email, grade,
      ...regAddrVal,
      googleAuth: false,
      avatarUrl: '',
      isDisabled: false,
      disableUntil: null,
      disableReason: '',
      isOnline: true,
      lastSeen: now,
      createdAt: now,
      updatedAt: now
    };

    // 📝 وضع طلبات الإنشاء مفعّل: نحفظ الطلب فقط بدون إنشاء الحساب أو تسجيل الدخول
    if (approvalOn) {
      newUser.isOnline = false;
      newUser.lastSeen = null;
      await submitSignupRequest(currentRegRole, newUser);
      $('registerForm').reset();
      regAddr.reset();
      $('regBirthDate').disabled = false;
      $('termsCheck').checked = false;
      spinner.classList.remove('show');
      icon.style.display = '';
      btnText.textContent = 'إنشاء الحساب';
      btn.disabled = false;
      showSuccess(PENDING_REGISTER_MSG, 8000);
      return;
    }

    // ✅ تحديث الذاكرة فوراً (حتى لا نقرأ من السيرفر مرة أخرى)
    items.push(newUser);
    setUsersToMemory(collectionName, items);

    // ⚡ كتابة أنحف عبر arrayUnion إذا المستند موجود
    const allRef = doc(db, collectionName, 'all');
    const snapCheck = await withTimeout(getDoc(allRef), 8000);

    if (snapCheck.exists()) {
      await withTimeout(updateDoc(allRef, {
        items: arrayUnion(newUser),
        updatedAt: serverTimestamp()
      }), 10000, 'تأخّر الاتصال أثناء حفظ الحساب');
    } else {
      await withTimeout(setDoc(allRef, {
        items: [newUser],
        updatedAt: serverTimestamp()
      }), 10000, 'تأخّر الاتصال أثناء حفظ الحساب');
    }

    // ✅ حفظ الجلسة
    saveSession(newUser, currentRegRole, username);

    const elapsed = Math.round(performance.now() - t0);
    console.log(`⚡ Register took ${elapsed}ms`);

    showSuccess('تم إنشاء حسابك بنجاح! جاري التوجيه...');
    setTimeout(() => window.location.replace('index.html'), 500);

  } catch (err) {
    spinner.classList.remove('show');
    icon.style.display = '';
    btnText.textContent = 'إنشاء الحساب';
    btn.disabled = false;
    showError(err.message || 'حدث خطأ، حاول مرة أخرى');
  }
});

async function handleGoogleAuth(mode) {
  hideAllMessages();

  const btn = mode === 'login' ? $('googleLoginBtn') : $('googleRegisterBtn');
  const originalHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الاتصال بـ Google...';

  try {
    const result = await signInWithPopup(auth, googleProvider);
    const googleUser = result.user;

    const googleData = {
      email: googleUser.email || '',
      displayName: googleUser.displayName || '',
      photoURL: googleUser.photoURL || '',
      uid: googleUser.uid
    };

    if (!googleData.email) throw new Error('لم نحصل على البريد الإلكتروني من Google');

    const role = mode === 'register' ? currentRegRole : currentLoginRole;
    const collectionName = role === 'teacher' ? 'teachers' : 'users';

    // ⚡ قراءة سريعة
    let items = await fetchUsersFast(collectionName, true);
    const existing = items.find(u => (u.email || '').toLowerCase() === googleData.email.toLowerCase());

    if (mode === 'login') {
      if (!existing) {
        const otherRole = role === 'teacher' ? 'student' : 'teacher';
        const otherCollection = otherRole === 'teacher' ? 'teachers' : 'users';

        let otherItems = await fetchUsersFast(otherCollection, true);
        const otherUser = otherItems.find(u => (u.email || '').toLowerCase() === googleData.email.toLowerCase());

        if (otherUser) {
          if (otherUser.isDisabled === true) {
            const expired = otherUser.disableUntil && new Date(otherUser.disableUntil) < new Date();
            if (!expired) {
              showDisabledAccount(otherUser);
              return;
            }
          }
          saveSession(otherUser, otherRole, otherUser.username);
          markUserOnline(otherCollection, otherUser.id);
          showSuccess(`مرحباً ${otherUser.fullName || otherUser.username}! جاري التوجيه...`);
          setTimeout(() => window.location.replace('index.html'), 400);
          return;
        }

        try {
          const qs = await withTimeout(getDocs(query(collection(db, SIGNUP_COL), where('email', '==', googleData.email))), 6000);
          const reqs = qs.docs.map(d => d.data()).filter(r => r.status !== 'approved');
          if (reqs.some(r => r.status === 'pending')) { try { await signOut(auth); } catch (e) {} throw new Error(PENDING_LOGIN_MSG); }
          if (reqs.some(r => r.status === 'rejected')) { try { await signOut(auth); } catch (e) {} throw new Error('عذراً، تم رفض طلب إنشاء حسابك من قبل الإدارة'); }
        } catch (e) {
          if (e && (e.message === PENDING_LOGIN_MSG || /رفض طلب/.test(e.message || ''))) throw e;
        }

        throw new Error('لا يوجد حساب مسجّل بهذا البريد — أنشئ حساباً جديداً');
      }

      if (existing.isDisabled === true) {
        const expired = existing.disableUntil && new Date(existing.disableUntil) < new Date();
        if (!expired) {
          showDisabledAccount(existing);
          return;
        }
      }

      // تحديث الصورة لو ما عندهاش (في الخلفية، بدون انتظار)
      if (!existing.avatarUrl && googleData.photoURL) {
        const idx = items.findIndex(u => u.id === existing.id);
        if (idx !== -1) {
          items[idx].avatarUrl = googleData.photoURL;
          items[idx].googleAuth = true;
          setUsersToMemory(collectionName, items);
          setDoc(doc(db, collectionName, 'all'), {
            items,
            updatedAt: serverTimestamp()
          }).catch(() => {});
        }
      }

      saveSession(existing, role, existing.username);
      markUserOnline(collectionName, existing.id);

      showSuccess(`مرحباً ${existing.fullName || existing.username}! جاري التوجيه...`);
      setTimeout(() => window.location.replace('index.html'), 400);

    } else {
      if (existing) {
        throw new Error('هذا البريد مسجّل بالفعل — سجّل الدخول بدلاً من إنشاء حساب');
      }

      googlePendingData = googleData;
      googlePendingRole = role;

      $('googleEmail').textContent = googleData.email;
      $('googleName').textContent = googleData.displayName || 'بدون اسم';

      const avatarEl = $('googleAvatar');
      if (googleData.photoURL) {
        avatarEl.innerHTML = `<img src="${googleData.photoURL}" alt="Google" onerror="this.parentNode.innerHTML='<i class=\\'fas fa-user\\'></i>'">`;
      } else {
        const firstChar = (googleData.displayName || '؟').charAt(0).toUpperCase();
        avatarEl.innerHTML = `<span style="font-weight:900; font-size:22px;">${firstChar}</span>`;
      }

      $('gFullName').value = googleData.displayName || '';
      $('gUsername').value = '';
      $('gPhone').value = '';
      $('gNationalId').value = '';
      $('gBirthDate').value = '';
      $('gBirthDate').disabled = false;

      updateGoogleGradeSelect(role);

      if (nationalIdEnabled) {
        $('gNidGroup').style.display = '';
        $('gBirthHint').textContent = '(يُحدد تلقائياً)';
      } else {
        $('gNidGroup').style.display = 'none';
        $('gBirthHint').textContent = '';
      }

      $('googleModalError').classList.remove('show');
      $('googleDataModal').classList.add('show');

      btn.disabled = false;
      btn.innerHTML = originalHTML;
      return;
    }

  } catch (err) {
    console.error('Google Auth Error:', err);

    let msg = 'حدث خطأ أثناء الاتصال بـ Google';
    if (err.code === 'auth/popup-closed-by-user') msg = 'تم إغلاق نافذة Google قبل إكمال العملية';
    else if (err.code === 'auth/popup-blocked') msg = 'المتصفح منع فتح نافذة Google';
    else if (err.code === 'auth/cancelled-popup-request') msg = 'تم إلغاء الطلب';
    else if (err.code === 'auth/network-request-failed') msg = 'تعذّر الاتصال — تحقق من الإنترنت';
    else if (err.code === 'auth/unauthorized-domain') msg = '⛔ هذا الدومين غير مصرّح به في Firebase';
    else if (err.message) msg = err.message;

    showError(msg);
    try { await signOut(auth); } catch (e) {}
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHTML;
  }
}

// ============================================================
// 💾 حفظ بيانات Google — سريع
// ============================================================
$('googleDataSave').addEventListener('click', async () => {
  if (!googlePendingData) return;

  const errEl = $('googleModalError');
  errEl.classList.remove('show');

  const fullName = cleanInput($('gFullName').value);
  const username = cleanInput($('gUsername').value);
  const phone = cleanInput($('gPhone').value);
  const nationalId = cleanInput($('gNationalId').value);
  const birthDate = $('gBirthDate').value;
  const grade = $('gGrade').value;

  if (!fullName || fullName.length < 3) {
    errEl.textContent = 'الاسم الكامل يجب أن يكون 3 أحرف على الأقل';
    errEl.classList.add('show');
    return;
  }
  if (!username || username.length < 3) {
    errEl.textContent = 'اسم المستخدم يجب أن يكون 3 أحرف على الأقل';
    errEl.classList.add('show');
    return;
  }
  if (!/^[a-zA-Z0-9_.\u0600-\u06FF]+$/.test(username)) {
    errEl.textContent = 'اسم المستخدم يحتوي على أحرف غير مسموحة';
    errEl.classList.add('show');
    return;
  }
  if (!phone || !/^01[0-9]{9}$/.test(phone)) {
    errEl.textContent = 'رقم الهاتف غير صحيح (01xxxxxxxxx)';
    errEl.classList.add('show');
    return;
  }
  if (nationalIdEnabled && !nationalId) {
    errEl.textContent = 'الرجاء إدخال الرقم القومي';
    errEl.classList.add('show');
    return;
  }
  if (nationalId) {
    const check = validateEgyptianNationalId(nationalId, birthDate);
    if (!check.valid) {
      errEl.textContent = check.message;
      errEl.classList.add('show');
      return;
    }
  }
  if (!birthDate) {
    errEl.textContent = 'الرجاء إدخال تاريخ الميلاد';
    errEl.classList.add('show');
    return;
  }
  if (!grade) {
    const gradeName = googlePendingRole === 'teacher' ? 'المادة الدراسية' : 'الفرقة الدراسية';
    errEl.textContent = `الرجاء اختيار ${gradeName}`;
    errEl.classList.add('show');
    return;
  }

  const gAddrErr = gAddr.validate();
  if (gAddrErr) {
    errEl.textContent = gAddrErr;
    errEl.classList.add('show');
    return;
  }
  const gAddrVal = gAddr.getValue();

  const btn = $('googleDataSave');
  const originalHTML = btn.innerHTML;
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري الإنشاء...';

  const t0 = performance.now();

  try {
    const role = googlePendingRole;
    const collectionName = role === 'teacher' ? 'teachers' : 'users';

    // ⚡ قراءة سريعة
    let items = await fetchUsersFast(collectionName, true);

    if (items.find(u => (u.username || '').toLowerCase() === username.toLowerCase())) {
      throw new Error('اسم المستخدم موجود بالفعل');
    }
    if (items.find(u => (u.phone || '') === phone)) {
      throw new Error('رقم الهاتف مسجّل بالفعل');
    }
    if (items.find(u => (u.email || '').toLowerCase() === googlePendingData.email.toLowerCase())) {
      throw new Error('البريد الإلكتروني مسجّل بالفعل');
    }
    if (nationalId && items.find(u => (u.nationalId || '') === nationalId)) {
      throw new Error('الرقم القومي مسجّل بالفعل');
    }

    const approvalOn = await isApprovalOn();
    if (!approvalOn) await gAddr.commit();

    const now = new Date().toISOString();
    const prefix = role === 'teacher' ? 'TCH-' : 'USR-';
    const newUser = {
      id: (role === 'teacher' ? 'teacher_' : 'user_') + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      fullName, username,
      passwordEncrypted: encryptPassword('google_' + googlePendingData.uid),
      code: prefix + Date.now().toString().slice(-6),
      nationalId: nationalId || '',
      birthDate: birthDate || '',
      phone,
      email: googlePendingData.email,
      grade,
      ...gAddrVal,
      googleAuth: true,
      googleUid: googlePendingData.uid,
      avatarUrl: googlePendingData.photoURL || '',
      isDisabled: false,
      disableUntil: null,
      disableReason: '',
      isOnline: true,
      lastSeen: now,
      createdAt: now,
      updatedAt: now
    };

    if (approvalOn) {
      newUser.isOnline = false;
      newUser.lastSeen = null;
      await submitSignupRequest(role, newUser);
      $('googleDataModal').classList.remove('show');
      googlePendingData = null;
      try { await signOut(auth); } catch (e) {}
      $('termsCheck').checked = false;
      showSuccess(PENDING_REGISTER_MSG, 8000);
      return;
    }

    items.push(newUser);
    setUsersToMemory(collectionName, items);

    const allRef = doc(db, collectionName, 'all');
    const snapCheck = await withTimeout(getDoc(allRef), 8000);

    if (snapCheck.exists()) {
      await withTimeout(updateDoc(allRef, {
        items: arrayUnion(newUser),
        updatedAt: serverTimestamp()
      }), 10000, 'تأخّر الاتصال أثناء حفظ الحساب');
    } else {
      await withTimeout(setDoc(allRef, {
        items: [newUser],
        updatedAt: serverTimestamp()
      }), 10000, 'تأخّر الاتصال أثناء حفظ الحساب');
    }

    $('googleDataModal').classList.remove('show');

    saveSession(newUser, role, username);

    const elapsed = Math.round(performance.now() - t0);
    console.log(`⚡ Google Register took ${elapsed}ms`);

    showSuccess('تم إنشاء حسابك بنجاح! جاري التوجيه...');
    setTimeout(() => window.location.replace('index.html'), 500);

  } catch (err) {
    console.error(err);
    errEl.textContent = err.message || 'حدث خطأ، حاول مرة أخرى';
    errEl.classList.add('show');
  } finally {
    btn.disabled = false;
    btn.innerHTML = originalHTML;
  }
});

// إلغاء Google Modal
$('googleDataCancel').addEventListener('click', async () => {
  $('googleDataModal').classList.remove('show');
  googlePendingData = null;
  try { await signOut(auth); } catch (e) {}
});

$('googleDataModal').addEventListener('click', async (e) => {
  if (e.target === $('googleDataModal')) {
    $('googleDataModal').classList.remove('show');
    googlePendingData = null;
    try { await signOut(auth); } catch (er) {}
  }
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('confirmModal').classList.contains('show')) closeConfirm(false);
    if ($('googleDataModal').classList.contains('show')) {
      $('googleDataModal').classList.remove('show');
      googlePendingData = null;
    }
  }
});

// ============================================================
// 💾 حفظ الجلسة (كانت موجودة تحت، نقلناها للأعلى)
// ============================================================
// 🚫 رسالة بعد الخروج الإجباري بسبب التعطيل
try {
  if (sessionStorage.getItem('meezan_logout_reason') === 'disabled') {
    sessionStorage.removeItem('meezan_logout_reason');
    setTimeout(() => showError('تم تعطيل حسابك من قبل الإدارة وتم تسجيل خروجك. يمكنك تسجيل الدخول من جديد بعد انتهاء التعطيل.'), 400);
  }
} catch (e) {}

function saveSession(user, role, username) {
  try {
    sessionStorage.setItem('meezan_logged_in', 'true');
    sessionStorage.setItem('meezan_username', username);
    sessionStorage.setItem('meezan_role', role);
    sessionStorage.setItem('meezan_user_id', user.id);
    // وقت الدخول — يُستخدم لإنهاء الجلسات القديمة عند التعطيل
    const fAt = user.forceLogoutAt ? new Date(user.forceLogoutAt).getTime() : 0;
    sessionStorage.setItem('meezan_login_at', String(Math.max(Date.now(), fAt + 1)));
    sessionStorage.setItem('meezan_user_data', JSON.stringify({
      fullName: user.fullName,
      username: user.username,
      avatarUrl: user.avatarUrl || '',
      role: role
    }));
  } catch (e) {
    console.log('saveSession error:', e.message);
  }
}

// ============================================================
// 🟢 تحديث حالة الاتصال — سريع (بدون await في المسار الحرج)
// ============================================================
async function markUserOnline(collectionName, userId) {
  try {
    const snap = await getDoc(doc(db, collectionName, 'all'));
    if (!snap.exists()) return;
    const items = snap.data().items || [];
    const idx = items.findIndex(u => u.id === userId);
    if (idx === -1) return;
    items[idx].isOnline = true;
    items[idx].lastSeen = new Date().toISOString();
    setUsersToMemory(collectionName, items);
    await setDoc(doc(db, collectionName, 'all'), {
      items,
      updatedAt: serverTimestamp()
    });
  } catch (e) {
    console.log('mark online error:', e.message);
  }
}

// ============================================================
// 🧹 تنظيف الحقول
// ============================================================
['loginUsername', 'loginPassword', 'regFullName', 'regUsername', 'regPassword',
 'regConfirmPassword', 'regPhone', 'regEmail'].forEach(id => {
  const el = $(id);
  if (!el) return;
  el.addEventListener('blur', () => {
    const cleaned = cleanInput(el.value);
    if (el.value !== cleaned) el.value = cleaned;
  });
});

$('regNationalId').addEventListener('blur', (e) => {
  e.target.value = cleanInput(e.target.value).replace(/\D/g, '');
});

$('loginUsername').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); $('loginPassword').focus(); }
});
$('loginPassword').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); $('loginForm').requestSubmit(); }
});
