<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0B3D2E">
<title>ميزان | MEEZAN - التكليفات</title>
<link rel="icon" type="image/png" href="https://i.ibb.co/ymXPqr46/file-00000000af0c820aa687a3c3181a6a24.png">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  :root {
    --primary:#0B3D2E; --primary-light:#145A43; --primary-lighter:#1E7A5A;
    --accent:#C9A961; --accent-light:#E0C888;
    --bg-page:#F5F1E8; --bg-card:#FFFFFF; --bg-input:#F8FBF9;
    --text-main:#0B3D2E; --text-sub:#5A6B66; --border:#E0E5E1;
    --shadow:rgba(11,61,46,.15); --error:#C0392B; --success:#1E7A5A;
  }
  [data-theme="dark"] {
    --primary:#C9A961; --primary-light:#E0C888; --primary-lighter:#F0DBA8;
    --accent:#0B3D2E; --accent-light:#145A43;
    --bg-page:#0A1612; --bg-card:#11201B; --bg-input:#1A2C25;
    --text-main:#F5F1E8; --text-sub:#9BAEA6; --border:#1E3A31;
    --shadow:rgba(0,0,0,.5); --error:#E74C3C; --success:#2ECC71;
  }
  html,body { font-family:'Cairo',sans-serif; overflow-x:hidden; }
  body { background:var(--bg-page); color:var(--text-main); min-height:100vh; transition:background .4s; }
  .hidden { display:none !important; }

  .topbar { position:sticky; top:0; z-index:100; background:var(--bg-card); border-bottom:1px solid var(--border); box-shadow:0 4px 20px var(--shadow); }
  .topbar-inner { max-width:900px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .topbar-title { font-size:19px; font-weight:900; color:var(--primary); display:flex; align-items:center; gap:10px; min-width:0; }
  [data-theme="dark"] .topbar-title { color:var(--accent); }
  .topbar-title i { color:var(--accent); }
  [data-theme="dark"] .topbar-title i { color:var(--primary); }
  .topbar-actions { display:flex; gap:8px; flex-shrink:0; }
  .icon-btn { height:42px; width:42px; border-radius:12px; background:var(--bg-input); border:2px solid var(--border); color:var(--primary); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:.25s; text-decoration:none; }
  .icon-btn:hover { background:var(--primary); color:#fff; border-color:var(--primary); transform:translateY(-2px); }
  [data-theme="dark"] .icon-btn:hover { color:var(--bg-page); }

  .wrap { max-width:900px; margin:0 auto; padding:22px 20px 60px; }
  .list-head { display:flex; align-items:center; gap:12px; margin-bottom:18px; flex-wrap:wrap; }
  .list-head h2 { font-size:20px; font-weight:900; flex:1; display:flex; align-items:center; gap:10px; }
  .count { background:var(--primary); color:#fff; border-radius:20px; font-size:12.5px; padding:2px 11px; }
  [data-theme="dark"] .count { color:var(--bg-page); }
  .grade-pill { display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:800; background:var(--bg-card); border:2px solid var(--border); padding:6px 14px; border-radius:20px; }
  .grade-pill i { color:var(--accent); }
  [data-theme="dark"] .grade-pill i { color:var(--primary); }

  .rows { display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; align-items:center; gap:14px; background:var(--bg-card); border:2px solid var(--border); border-radius:16px; padding:14px 16px; box-shadow:0 4px 14px var(--shadow); transition:.25s; }
  .row:hover { border-color:var(--accent); transform:translateY(-2px); }
  .row-ic { width:46px; height:46px; border-radius:12px; flex-shrink:0; background:linear-gradient(135deg,var(--primary),var(--primary-lighter)); color:#fff; display:flex; align-items:center; justify-content:center; font-size:19px; }
  [data-theme="dark"] .row-ic { color:var(--bg-page); }
  .row-main { flex:1; min-width:0; }
  .row-title { font-size:16px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row-meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .badge { display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; color:var(--text-sub); background:var(--bg-input); border:1px solid var(--border); padding:2px 9px; border-radius:20px; }
  .row-actions { display:flex; gap:8px; flex-shrink:0; }
  .btn { font-family:inherit; font-size:14px; font-weight:800; border:none; border-radius:12px; padding:10px 16px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:.25s; }
  .btn-primary { background:linear-gradient(135deg,var(--primary),var(--primary-lighter)); color:#fff; box-shadow:0 6px 18px var(--shadow); }
  [data-theme="dark"] .btn-primary { color:var(--bg-page); }
  .btn-ghost { background:var(--bg-input); color:var(--text-main); border:2px solid var(--border); }
  .btn-ghost:hover { border-color:var(--accent); }
  .btn:hover { transform:translateY(-2px); }
  .btn:disabled { opacity:.6; cursor:wait; transform:none; }

  .empty-state { background:var(--bg-card); border:2px dashed var(--border); border-radius:20px; padding:60px 24px; text-align:center; color:var(--text-sub); }
  .empty-state i { font-size:48px; color:var(--accent); display:block; margin-bottom:14px; opacity:.7; }
  .empty-state h3 { color:var(--text-main); font-weight:800; margin-bottom:6px; }

  /* ===== Modals ===== */
  .overlay { position:fixed; inset:0; z-index:1000; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; padding:16px; }
  .modal { background:var(--bg-card); border:2px solid var(--border); border-radius:20px; padding:22px; width:100%; max-width:420px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .modal h3 { font-size:17px; font-weight:900; margin-bottom:4px; display:flex; align-items:center; gap:8px; }
  .modal p.sub { font-size:12.5px; color:var(--text-sub); font-weight:600; margin-bottom:14px; }
  .modal label { display:block; font-size:13px; font-weight:800; margin:12px 0 6px; }
  .field { width:100%; padding:12px 14px; border-radius:12px; border:2px solid var(--border); background:var(--bg-input); color:var(--text-main); font-family:inherit; font-size:15px; font-weight:600; }
  .field:focus { outline:none; border-color:var(--accent); }
  .modal-actions { display:flex; gap:10px; margin-top:18px; }
  .modal-actions .btn-primary { flex:1; }
  .view-modal { max-width:760px; max-height:92vh; display:flex; flex-direction:column; padding:14px; }
  .view-bar { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:10px; }
  .view-bar h3 { margin:0; font-size:15.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .view-body { overflow:auto; border-radius:12px; background:#cfd5d2; padding:10px; }
  [data-theme="dark"] .view-body { background:#06100c; }

/* ================= PAPER ================= */
  .paper {
    --lh:36px; --fs:24px; --ink:#1b3a9c;
    position:relative; width:100%; min-height:560px;
    padding:var(--pt,var(--lh)) 30px var(--lh) 30px;
    padding-inline-start:46px;
    background:#fff; color:var(--ink);
    box-shadow:0 8px 28px rgba(0,0,0,.28);
    overflow:hidden;
  }
  .paper.export { width:794px; min-height:1123px; box-shadow:none; }
  .paper.export .p-text { mix-blend-mode:normal; }
  .paper.export .w { vertical-align:top; }
  /* طبقة النص فقط للتصدير: الخلفية والسطور تترسم بالكانفاس */
  .paper.layer { background:transparent !important; box-shadow:none !important; }
  .paper.layer .p-lines, .paper.layer .p-margin, .paper.layer .p-hdr { display:none !important; }
  .p-lines,.p-margin,.p-hdr { position:absolute; pointer-events:none; display:none; }
  .p-lines { inset-inline:0; bottom:0; top:0; }
  .p-text { position:relative; z-index:2; font-size:var(--fs); line-height:var(--lh); color:var(--ink); white-space:pre-wrap; word-break:break-word; mix-blend-mode:multiply; }
  .p-line { min-height:var(--lh); }
  .p-line .w { display:inline-block; white-space:pre; }
  .p-title { text-align:center; font-size:1.12em; text-decoration:underline; text-underline-offset:5px; text-decoration-thickness:1px; }
  .p-date { text-align:end; font-size:.82em; }
  .p-ph { opacity:.4; }

  .fx-ball { text-shadow:0 0 .6px var(--ink); }
  .fx-gel { text-shadow:0 0 1px var(--ink), 0 0 .3px var(--ink); }
  .fx-fountain { text-shadow:0 0 1.4px var(--ink); }
  .fx-pencil { opacity:.82; text-shadow:0 0 1.3px var(--ink), 0 0 .3px #000; filter:contrast(1.1); }
  .fx-marker { text-shadow:0 0 1.6px var(--ink); }

  /* white */
  .paper[data-paper="white"] { padding-inline-start:40px; background:#fff linear-gradient(135deg,#fff,#fbfbfa); }
  /* lined */
  .paper[data-paper="lined"] .p-lines { display:block; background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),#b6cfe6 calc(var(--lh) - 1px),#b6cfe6 var(--lh)); }
  .paper[data-paper="lined"] { padding-inline-start:36px; }
  /* notebook */
  .paper[data-paper="notebook"] { padding-inline-start:84px; background:#fffefb; }
  .paper[data-paper="notebook"] .p-lines { display:block; background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),#a5c8e8 calc(var(--lh) - 1px),#a5c8e8 var(--lh)); }
  .paper[data-paper="notebook"] .p-margin { display:block; top:0; bottom:0; inset-inline-start:62px; width:2px; background:#e58a8a; }
  /* foolscap */
  .paper[data-paper="foolscap"] { --pt:calc(var(--lh)*2); padding-inline-start:84px; background:#fff; }
  .paper[data-paper="foolscap"] .p-lines { display:block; top:calc(var(--lh)*2); background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),#b4c3d6 calc(var(--lh) - 1px),#b4c3d6 var(--lh)); }
  .paper[data-paper="foolscap"] .p-margin { display:block; top:0; bottom:0; inset-inline-start:56px; width:6px; border-inline:1px solid #d9534f; }
  .paper[data-paper="foolscap"] .p-hdr { display:block; inset-inline:0; top:calc(var(--lh)*2 - 6px); height:6px; border-block:1px solid #d9534f; }
  /* graph */
  .paper[data-paper="graph"] { padding-inline-start:40px; background:#fff; }
  .paper[data-paper="graph"] .p-lines { display:block; background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),#a9cdb4 calc(var(--lh) - 1px),#a9cdb4 var(--lh)),repeating-linear-gradient(to right,transparent 0,transparent calc(var(--lh) - 1px),#a9cdb4 calc(var(--lh) - 1px),#a9cdb4 var(--lh)); }
  /* yellow */
  .paper[data-paper="yellow"] { padding-inline-start:84px; background:#fff3a8; }
  .paper[data-paper="yellow"] .p-lines { display:block; background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),#7fa6cf calc(var(--lh) - 1px),#7fa6cf var(--lh)); }
  .paper[data-paper="yellow"] .p-margin { display:block; top:0; bottom:0; inset-inline-start:58px; width:6px; border-inline:1px solid #d9534f; }
  /* aged */
  .paper[data-paper="aged"] { padding-inline-start:50px; background:radial-gradient(ellipse at center,#f6ead0 40%,#e3cf9f 100%); }
  .paper[data-paper="aged"] .p-lines { display:block; background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--lh) - 1px),rgba(139,105,60,.35) calc(var(--lh) - 1px),rgba(139,105,60,.35) var(--lh)); }

  .paper-opt .paper[data-paper] { padding:0 !important; }

  

  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(120px); background:var(--bg-card); color:var(--text-main); padding:13px 22px; border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.3); border:1px solid var(--border); font-weight:700; font-size:14px; display:flex; align-items:center; gap:10px; z-index:99999; transition:transform .4s, opacity .3s; opacity:0; max-width:calc(100vw - 32px); }
  .toast.show { transform:translateX(-50%) translateY(0); opacity:1; }
  .toast.success { border-color:var(--success); } .toast.success i { color:var(--success); }
  .toast.error { border-color:var(--error); } .toast.error i { color:var(--error); }

  @media (max-width:600px) {
    .wrap { padding:16px 12px 50px; }
    .topbar-inner { padding:10px 12px; }
    .topbar-title { font-size:15px; }
    .row { flex-wrap:wrap; }
    .row-ic { display:none; }
    .row-actions { width:100%; }
    .row-actions .btn { flex:1; }
    .paper { padding-inline-end:16px; }
    .paper[data-paper="notebook"],.paper[data-paper="foolscap"],.paper[data-paper="yellow"] { padding-inline-start:64px; }
    .paper[data-paper="notebook"] .p-margin { inset-inline-start:44px; }
    .paper[data-paper="foolscap"] .p-margin { inset-inline-start:38px; }
    .paper[data-paper="yellow"] .p-margin { inset-inline-start:40px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <div class="topbar-title"><i class="fas fa-file-pen"></i><span>جميع التكليفات</span></div>
    <div class="topbar-actions">
      <button class="icon-btn" id="themeToggle" title="الوضع الليلي/النهاري"><i class="fas fa-moon" id="themeIcon"></i></button>
      <a href="index.html" class="icon-btn" title="الرئيسية"><i class="fas fa-house"></i></a>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="list-head">
    <h2><i class="fas fa-folder-open"></i> تكليفاتك <span class="count" id="countBadge">0</span></h2>
    <span class="grade-pill"><i class="fas fa-graduation-cap"></i><span id="gradeText">—</span></span>
  </div>
  <div class="empty-state" id="loadingState">
    <i class="fas fa-spinner fa-spin"></i>
    <h3>جاري التحميل...</h3>
  </div>
  <div class="rows" id="rows"></div>
  <div class="empty-state hidden" id="emptyList">
    <i class="fas fa-file-pen"></i>
    <h3>لا توجد تكليفات لفرقتك حالياً</h3>
    <p>ستظهر هنا فور إضافة تكليف جديد.</p>
  </div>
</main>

<!-- نافذة الاسم والكود -->
<div class="overlay hidden" id="dlOverlay">
  <div class="modal">
    <h3><i class="fas fa-file-pdf"></i> تحميل التكليف PDF</h3>
    <p class="sub" id="dlSub"></p>
    <label for="dlName">الاسم</label>
    <input class="field" id="dlName" placeholder="اكتب اسمك" autocomplete="off">
    <label for="dlCode">الكود</label>
    <input class="field" id="dlCode" placeholder="اكتب الكود" autocomplete="off" dir="ltr" style="text-align:right">
    <div class="modal-actions">
      <button class="btn btn-primary" id="dlGo"><i class="fas fa-download"></i> تحميل</button>
      <button class="btn btn-ghost" id="dlCancel">إلغاء</button>
    </div>
  </div>
</div>

<!-- نافذة العرض -->
<div class="overlay hidden" id="viewOverlay">
  <div class="modal view-modal">
    <div class="view-bar">
      <h3 id="viewTitle"></h3>
      <button class="btn btn-ghost" id="viewClose"><i class="fas fa-xmark"></i> إغلاق</button>
    </div>
    <div class="view-body" id="viewBody"></div>
  </div>
</div>

<div class="toast" id="toast"><i class="fas fa-check-circle" id="toastIcon"></i><span id="toastText"></span></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAmkCOrSaklhUiDdDfZCpSDQNmMYP-Gdw0",
  authDomain: "qanon-c716d.firebaseapp.com",
  projectId: "qanon-c716d",
  storageBucket: "qanon-c716d.firebasestorage.app",
  messagingSenderId: "757756130875",
  appId: "1:757756130875:web:63c53534c6843e2a29ce1e",
  measurementId: "G-8FZGTC779Y"
};
const app = initializeApp(firebaseConfig);
/* كاش دائم داخل المتصفح (IndexedDB): البيانات تظهر فوراً من الكاش وتتحدث بالخلفية */
let db;
try {
  db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (e) {
  db = getFirestore(app);
}
const $ = (id) => document.getElementById(id);

/* ---------- حماية الدخول ---------- */
if (sessionStorage.getItem('meezan_logged_in') !== 'true') window.location.replace('login.html');

/* ---------- الثيم ---------- */
(function(){
  const t = localStorage.getItem('meezan_theme') || 'light';
  document.documentElement.setAttribute('data-theme', t);
  $('themeIcon').className = t === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
})();
$('themeToggle').addEventListener('click', () => {
  const next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('meezan_theme', next);
  $('themeIcon').className = next === 'dark' ? 'fas fa-sun' : 'fas fa-moon';
});

let tt;
function toast(text, type='success'){
  $('toastText').textContent = text;
  $('toast').className = 'toast show ' + type;
  $('toastIcon').className = type === 'error' ? 'fas fa-times-circle' : 'fas fa-check-circle';
  clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 2600);
}

/* ---------- الخطوط + رسم الورقة (نفس نسخة الأدمن) ---------- */
const loadedFonts = {};
const registeredCustom = new Set();
function famOf(key){
  if (!key) return 'Cairo';
  if (key.startsWith('custom:')) return 'cf_' + key.slice(7);
  return key;
}
function ensureFont(key){
  if (!key) return Promise.resolve();
  if (key.startsWith('custom:')) return Promise.resolve();
  if (loadedFonts[key]) return loadedFonts[key];
  loadedFonts[key] = new Promise((resolve) => {
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://fonts.googleapis.com/css2?family=' + key.replace(/ /g, '+') + '&display=swap';
    l.onload = () => resolve(); l.onerror = () => resolve();
    document.head.appendChild(l);
  });
  return loadedFonts[key];
}


function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for (let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619);} return h>>>0; }

function renderText(el, text, seed, j, fx){
  const rnd = mulberry32(seed); const jf = j / 5;
  el.textContent = '';
  String(text).split('\n').forEach(line => {
    const d = document.createElement('div');
    d.className = 'p-line'; d.dir = 'auto';
    if (!line.trim()) { d.innerHTML = '&nbsp;'; el.appendChild(d); return; }
    if (jf > 0) d.style.transform = `rotate(${((rnd()-.5)*.5*jf).toFixed(3)}deg)`;
    line.split(/(\s+)/).forEach(part => {
      if (!part) return;
      if (/^\s+$/.test(part)) { d.appendChild(document.createTextNode(part)); return; }
      const s = document.createElement('span'); s.className = 'w'; s.textContent = part;
      if (jf > 0) {
        s.style.transform = `translateY(${((rnd()-.5)*2.4*jf).toFixed(2)}px) rotate(${((rnd()-.5)*2.8*jf).toFixed(2)}deg)`;
        s.style.fontSize = (100 + (rnd()-.5)*7*jf).toFixed(1) + '%';
        if (fx === 'ball' || fx === 'pencil' || fx === 'gel') s.style.opacity = (0.86 + rnd()*0.14).toFixed(2);
      }
      d.appendChild(s);
    });
    el.appendChild(d);
  });
}

function fmtDate(iso){
  if (!iso) return '';
  const [y,m,d] = iso.split('-'); return `${d}/${m}/${y}`;
}

function isRtlData(d){
  const probe = (d.content || '') + (d.title || '');
  return /[\u0600-\u06FF]/.test(probe) || !/[A-Za-z]/.test(probe);
}

function paperBase(d){
  const p = document.createElement('div');
  p.className = 'paper'; p.dataset.paper = d.paper;
  p.dir = isRtlData(d) ? 'rtl' : 'ltr';
  p.style.setProperty('--lh', d.lh + 'px');
  p.style.setProperty('--fs', d.fs + 'px');
  p.style.setProperty('--ink', d.ink.c);
  p.style.fontFamily = `'${famOf(d.font)}', 'Cairo', cursive`;
  return p;
}

/* النص نفسه (البيانات اختيارية: تُكتب داخل الورقة بنفس الخط واللون) */
function buildText(d, header){
  const t = document.createElement('div');
  t.className = 'p-text fx-' + (d.ink.fx || 'ball');
  const seed = d.seed || 1;
  if (header && header.length) {
    const hb = document.createElement('div');
    renderText(hb, header.map(([k, v]) => k + ': ' + v).join('\n'), seed + 7, d.jitter, d.ink.fx);
    t.appendChild(hb);
    const gap = document.createElement('div'); gap.className = 'p-line'; gap.innerHTML = '&nbsp;'; t.appendChild(gap);
  }
  if (d.showDate && d.date) { const x = document.createElement('div'); x.className = 'p-date'; x.dir = 'auto'; x.textContent = fmtDate(d.date); t.appendChild(x); }
  if (d.showTitle && d.title) { const x = document.createElement('div'); x.className = 'p-title'; x.dir = 'auto'; x.textContent = d.title; t.appendChild(x); }
  const body = document.createElement('div');
  if (d.content && d.content.trim()) renderText(body, d.content, seed, d.jitter, d.ink.fx);
  else { body.className = 'p-ph'; renderText(body, 'ابدأ بكتابة تكليفك وسيظهر هنا بخط اليد...', seed, d.jitter, d.ink.fx); }
  t.appendChild(body);
  return t;
}

function buildPaper(d){
  const p = paperBase(d);
  ['p-lines','p-margin','p-hdr'].forEach(c => { const x = document.createElement('div'); x.className = c; p.appendChild(x); });
  p.appendChild(buildText(d));
  return p;
}



const todayDMY = () => { const n = new Date(); return `${String(n.getDate()).padStart(2,'0')}/${String(n.getMonth()+1).padStart(2,'0')}/${n.getFullYear()}`; };

/* ============================================================
   المستخدم (نفس مسار index.html: users/all → items[] → grade)
   ============================================================ */
const role = sessionStorage.getItem('meezan_role') || 'student';
const sessId = sessionStorage.getItem('meezan_user_id') || '';
const sessName = (sessionStorage.getItem('meezan_username') || '').trim().toLowerCase();
let me = null;
try { const raw = sessionStorage.getItem('meezan_user_data'); if (raw) me = { ...JSON.parse(raw), id: sessId }; } catch(e){}
let assignments = [];
let customFonts = [];
let ready = false;

/* ---------- كاش البيانات (localStorage) لعرض فوري عند كل دخول ---------- */
const CK = 'meezan_cache_v1:';
const meKey = sessId || sessName || 'anon';
function cacheGet(k){ try { const r = localStorage.getItem(CK + k); return r ? JSON.parse(r) : null; } catch(e){ return null; } }
function cacheSet(k, v){ try { localStorage.setItem(CK + k, JSON.stringify(v)); } catch(e){} }
(function(){
  const cA = cacheGet('assignments');
  if (Array.isArray(cA)) { assignments = cA; ready = true; }
  const cG = cacheGet('grade:' + meKey);
  if (cG && cG.grade) me = { ...(me || {}), grade: cG.grade };
})();
setTimeout(() => { if (!ready) { ready = true; renderList(); } }, 6000);

function myGrade(){ return String((me && me.grade) || '').trim(); }

function findMe(items){
  let u = null;
  if (sessId) u = items.find(x => x.id === sessId);
  if (!u && sessName) u = items.find(x => String(x.username || '').toLowerCase() === sessName);
  return u || null;
}
onSnapshot(doc(db, role === 'teacher' ? 'teachers' : 'users', 'all'), (snap) => {
  const items = snap.exists() ? (snap.data().items || []) : [];
  const u = findMe(items);
  if (u) { me = u; if (u.grade) cacheSet('grade:' + meKey, { grade: String(u.grade) }); }
  renderList();
}, () => {});

onSnapshot(collection(db, 'assignments'), (snap) => {
  if (snap.metadata.fromCache && snap.empty && !ready) return;
  assignments = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  ready = true;
  if (!(snap.metadata.fromCache && snap.empty)) cacheSet('assignments', assignments);
  renderList();
}, (err) => { ready = true; renderList(); if (!assignments.length) toast('تعذر تحميل التكليفات: ' + err.message, 'error'); });

onSnapshot(collection(db, 'customFonts'), (snap) => {
  customFonts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  customFonts.forEach(c => {
    if (registeredCustom.has(c.id)) return;
    registeredCustom.add(c.id);
    new FontFace('cf_' + c.id, `url(${c.data})`).load().then(ff => document.fonts.add(ff)).catch(() => {});
  });
}, () => {});

/* ============================================================
   القائمة — تظهر فقط تكليفات فرقة المستخدم (+ الموجهة للجميع)
   ============================================================ */
function visibleAssignments(){
  if (role === 'teacher') return assignments;
  const g = myGrade();
  return assignments.filter(a => { const ag = String(a.grade || '').trim(); return !ag || (g && ag === g); });
}
function badge(ic, t){
  const s = document.createElement('span'); s.className = 'badge';
  const i = document.createElement('i'); i.className = 'fas ' + ic;
  s.appendChild(i); s.appendChild(document.createTextNode(t)); return s;
}
function renderList(){
  $('gradeText').textContent = role === 'teacher' ? 'حساب معلم' : (myGrade() || 'غير محدد');
  const items = visibleAssignments().sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  $('countBadge').textContent = items.length;
  $('loadingState').classList.toggle('hidden', ready);
  $('emptyList').classList.toggle('hidden', !ready || items.length > 0);
  const box = $('rows'); box.innerHTML = '';
  items.forEach(a => {
    const row = document.createElement('div'); row.className = 'row';
    const ic = document.createElement('div'); ic.className = 'row-ic'; ic.innerHTML = '<i class="fas fa-file-lines"></i>';
    const main = document.createElement('div'); main.className = 'row-main';
    const t = document.createElement('div'); t.className = 'row-title'; t.textContent = a.title || 'بدون اسم';
    const meta = document.createElement('div'); meta.className = 'row-meta';
    if (a.subject) meta.appendChild(badge('fa-book', a.subject));
    meta.appendChild(badge('fa-graduation-cap', a.grade || 'كل الفرق'));
    if (a.date) meta.appendChild(badge('fa-calendar', fmtDate(a.date)));
    main.appendChild(t); main.appendChild(meta);
    const acts = document.createElement('div'); acts.className = 'row-actions';
    const v = document.createElement('button'); v.className = 'btn btn-primary'; v.innerHTML = '<i class="fas fa-eye"></i> عرض'; v.onclick = () => openView(a);
    const d = document.createElement('button'); d.className = 'btn btn-ghost'; d.innerHTML = '<i class="fas fa-file-pdf"></i> تحميل PDF'; d.onclick = () => openDownload(a);
    acts.appendChild(v); acts.appendChild(d);
    row.appendChild(ic); row.appendChild(main); row.appendChild(acts);
    box.appendChild(row);
  });
}

/* ============================================================
   عرض التكليف
   ============================================================ */
async function openView(a){
  $('viewTitle').textContent = a.title || '';
  const body = $('viewBody'); body.innerHTML = '';
  $('viewOverlay').classList.remove('hidden');
  await ensureFont(a.font);
  body.appendChild(buildPaper({ ...a, ink: a.ink || { c:'#1b3a9c', fx:'ball' } }));
}
$('viewClose').onclick = () => $('viewOverlay').classList.add('hidden');
$('viewOverlay').addEventListener('click', (e) => { if (e.target === $('viewOverlay')) $('viewOverlay').classList.add('hidden'); });

/* ============================================================
   تحميل PDF: الاسم ← الكود ← الفرقة ← التاريخ ← المادة ثم التكليف
   ============================================================ */
let dlTarget = null;
function openDownload(a){
  dlTarget = a;
  $('dlSub').textContent = a.title || '';
  $('dlName').value = ''; $('dlCode').value = '';
  $('dlOverlay').classList.remove('hidden');
  setTimeout(() => $('dlName').focus(), 50);
}
$('dlCancel').onclick = () => $('dlOverlay').classList.add('hidden');
$('dlOverlay').addEventListener('click', (e) => { if (e.target === $('dlOverlay')) $('dlOverlay').classList.add('hidden'); });
$('dlGo').addEventListener('click', async () => {
  const name = $('dlName').value.trim(), code = $('dlCode').value.trim();
  if (!name) { toast('اكتب الاسم أولاً', 'error'); $('dlName').focus(); return; }
  if (!code) { toast('اكتب الكود أولاً', 'error'); $('dlCode').focus(); return; }
  const btn = $('dlGo'); btn.disabled = true;
  try { await makePdf(dlTarget, name, code); $('dlOverlay').classList.add('hidden'); toast('تم تحميل الملف'); }
  catch (err) { toast(err.message || 'تعذر إنشاء الملف', 'error'); }
  btn.disabled = false;
});

const libCache = {};
function loadScript(src, test){
  if (test()) return Promise.resolve();
  if (libCache[src]) return libCache[src];
  libCache[src] = new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src;
    s.onload = res; s.onerror = () => rej(new Error('تعذر تحميل مكتبة التصدير'));
    document.head.appendChild(s);
  });
  return libCache[src];
}

/* ============================================================
   PDF: ورقة حقيقية بالكامل — كل صفحة بسطورها وهوامشها،
   والبيانات داخل الورقة بنفس خط ولون التكليف ثم يبدأ المحتوى
   ============================================================ */
const PAGE_W = 794, PAGE_H = 1123, SCALE = 2;
const PAPER_START = { white:40, lined:36, notebook:84, foolscap:84, graph:40, yellow:84, aged:50 };

function pdfLayout(d){
  const lh = d.lh;
  const pt = d.paper === 'foolscap' ? lh * 2 : lh;
  return {
    lh, pt,
    start: PAPER_START[d.paper] || 46,
    rows: Math.max(1, Math.floor((PAGE_H - pt - lh) / lh)),
    rtl: isRtlData(d)
  };
}

/* صفحة نص فقط (شفافة): idx = رقم الصفحة، أو null للقياس */
function makeExportPage(d, header, L, idx){
  const p = paperBase(d);
  p.classList.add('export', 'layer');
  p.style.width = PAGE_W + 'px';
  p.style.padding = '0';
  p.style.paddingTop = L.pt + 'px';
  p.style.paddingInlineStart = L.start + 'px';
  p.style.paddingInlineEnd = '30px';
  p.style.minHeight = '0';
  const t = buildText(d, header);
  if (idx === null) { p.style.height = 'auto'; p.appendChild(t); return { p, t }; }
  p.style.height = PAGE_H + 'px';
  const win = document.createElement('div');
  win.style.cssText = `position:relative;overflow:hidden;height:${L.rows * L.lh}px;`;
  t.style.marginTop = (-idx * L.rows * L.lh) + 'px';
  win.appendChild(t); p.appendChild(win);
  return { p, t };
}

/* رسم الورقة (الخلفية + السطور + الهوامش) مباشرة بالكانفاس — لأن html2canvas لا يرسم الـ repeating gradients */
function drawPaperBg(ctx, d, L){
  const W = PAGE_W, H = PAGE_H, lh = L.lh, type = d.paper;
  const fill = (c, x, y, w, h) => { ctx.fillStyle = c; ctx.fillRect(x, y, w, h); };
  const hLines = (c, from) => { for (let y = from + lh - 1; y < H; y += lh) fill(c, 0, y, W, 1); };
  const vx = (off, w) => L.rtl ? W - off - w : off;
  const redDouble = (off) => { const x = vx(off, 6); fill('#d9534f', x, 0, 1, H); fill('#d9534f', x + 5, 0, 1, H); };

  if (type === 'yellow') fill('#fff3a8', 0, 0, W, H);
  else if (type === 'notebook') fill('#fffefb', 0, 0, W, H);
  else if (type === 'aged') {
    const rx = W * Math.SQRT1_2, ry = H * Math.SQRT1_2;
    ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(rx, ry);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    g.addColorStop(0.4, '#f6ead0'); g.addColorStop(1, '#e3cf9f');
    ctx.fillStyle = g; ctx.fillRect(-W / 2 / rx, -H / 2 / ry, W / rx, H / ry);
    ctx.restore();
  } else {
    fill('#fff', 0, 0, W, H);
    if (type === 'white') {
      const g = ctx.createLinearGradient(0, 0, W, H);
      g.addColorStop(0, '#fff'); g.addColorStop(1, '#fbfbfa');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }

  switch (type) {
    case 'lined': hLines('#b6cfe6', 0); break;
    case 'notebook': hLines('#a5c8e8', 0); fill('#e58a8a', vx(62, 2), 0, 2, H); break;
    case 'foolscap':
      hLines('#b4c3d6', lh * 2);
      fill('#d9534f', 0, lh * 2 - 6, W, 1); fill('#d9534f', 0, lh * 2 - 1, W, 1);
      redDouble(56); break;
    case 'graph':
      hLines('#a9cdb4', 0);
      for (let x = lh - 1; x < W; x += lh) fill('#a9cdb4', x, 0, 1, H);
      break;
    case 'yellow': hLines('#7fa6cf', 0); redDouble(58); break;
    case 'aged': hLines('rgba(139,105,60,.35)', 0); break;
  }
}

async function makePdf(a, name, code){
  await Promise.all([
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', () => !!window.html2canvas),
    loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', () => !!(window.jspdf && window.jspdf.jsPDF)),
    ensureFont(a.font)
  ]);
  const d = {
    ...a,
    ink: a.ink || { c:'#1b3a9c', fx:'ball' },
    paper: a.paper || 'lined',
    lh: parseFloat(a.lh) || 36,
    fs: parseFloat(a.fs) || 24
  };
  const header = [
    ['الاسم', name],
    ['الكود', code],
    ['الفرقة', a.grade || myGrade() || '—'],
    ['التاريخ', todayDMY()],
    ['المادة', a.subject || '—']
  ];
  const L = pdfLayout(d);

  const host = document.createElement('div');
  host.style.cssText = `position:fixed;left:-99999px;top:0;width:${PAGE_W}px;`;
  document.body.appendChild(host);
  try {
    try { await document.fonts.load(`${d.fs}px "${famOf(d.font)}"`, (d.content || d.title || '') + 'أبجد الاسم الكود'); } catch(e){}
    await document.fonts.ready;

    // قياس الطول الكلي لتحديد عدد الصفحات
    const m = makeExportPage(d, header, L, null);
    host.appendChild(m.p);
    const totalRows = Math.max(1, Math.ceil(m.t.offsetHeight / L.lh - 0.02));
    host.removeChild(m.p);
    const pages = Math.max(1, Math.ceil(totalRows / L.rows));

    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p', 'pt', 'a4');
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight();

    for (let i = 0; i < pages; i++) {
      const { p } = makeExportPage(d, header, L, i);
      host.appendChild(p);
      const textCv = await window.html2canvas(p, { scale: SCALE, backgroundColor: null, useCORS: true, width: PAGE_W, height: PAGE_H, logging: false });
      host.removeChild(p);

      const pageCv = document.createElement('canvas');
      pageCv.width = PAGE_W * SCALE; pageCv.height = PAGE_H * SCALE;
      const ctx = pageCv.getContext('2d');
      ctx.scale(SCALE, SCALE);
      drawPaperBg(ctx, d, L);
      ctx.drawImage(textCv, 0, 0, PAGE_W, PAGE_H);

      if (i > 0) pdf.addPage();
      pdf.addImage(pageCv.toDataURL('image/jpeg', .93), 'JPEG', 0, 0, pw, ph);
      textCv.width = 0; pageCv.width = 0;
    }
    pdf.save((a.title || 'assignment').replace(/[\\/:*?"<>|]/g, '_') + '.pdf');
  } finally { host.remove(); }
}

/* تحميل مسبق لمكتبات التصدير وقت الفراغ عشان التحميل يبقى أسرع */
(window.requestIdleCallback || ((f) => setTimeout(f, 2500)))(() => {
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', () => !!window.html2canvas).catch(() => {});
  loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', () => !!(window.jspdf && window.jspdf.jsPDF)).catch(() => {});
});

renderList();
</script>
