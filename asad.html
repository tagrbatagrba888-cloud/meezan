function life(k){if(G.locked||G.used[k]>=CF.life[k].uses)return;G.used[k]++;stopT();say(k);const q=G.Q[G.i],c=q.a.findIndex(a=>a.c),L=left(),acc=CF.life[k].acc??100,right=Math.random()*100<acc;
 const wrongs=L.filter(j=>j!==c),lead=right?c:(wrongs[Math.random()*wrongs.length|0]??c);
 if(k==='fifty'){shuf(wrongs).slice(0,2).forEach(j=>G.gone.push(j));document.querySelectorAll('.a').forEach((b,j)=>b.classList.toggle('gone',G.gone.includes(j)));if(G.gone.includes(G.sel)){G.sel=null;$('#cf').disabled=true;document.querySelectorAll('.a').forEach(b=>b.classList.remove('sel'))}refLb();if(CF.time>0)tick();return}
 if(k==='phone'){const sure=right?70+Math.random()*28|0:35+Math.random()*25|0,lines=['ألو؟ أهلًا يا '+uname+'… سأقرأ السؤال بسرعة.','همم… دعني أفكر قليلًا…',right?`أنا واثق بنسبة ${sure}% أن الإجابة (${AL[lead]}): ${q.a[lead].t}`:`مش متأكد… أميل إلى (${AL[lead]}): ${q.a[lead].t}، لكن ثقتي ${sure}% فقط.`];
  pop(`<h3><i class="fas fa-phone"></i> مكالمة صديق</h3><div class="ph" id="phl"></div><button class="btn" data-a="close" style="margin-top:8px">إنهاء المكالمة</button>`);lines.forEach((t,x)=>setTimeout(()=>{const e=$('#phl');if(e)e.insertAdjacentHTML('beforeend',`<p>${esc(t)}</p>`)},900+x*1700))}
 else{const v={};let rest=100,ld=L.length>2?45+Math.random()*28|0:58+Math.random()*27|0;v[lead]=ld;rest-=ld;const o=L.filter(j=>j!==lead);o.forEach((j,x)=>{const s=x===o.length-1?rest:Math.round(Math.random()*rest*.7);v[j]=s;rest-=s});
  pop(`<h3><i class="fas fa-users"></i> رأي الجمهور</h3><div class="bars">${L.map(j=>`<div>${v[j]}%<i data-h="${v[j]}"></i>${AL[j]}</div>`).join('')}</div><button class="btn" data-a="close">تم</button>`);setTimeout(()=>document.querySelectorAll('.bars i').forEach(e=>e.style.height=e.dataset.h*.9+'%'),150)}
 refLb()}
function refLb(){document.querySelectorAll('.lb').forEach(b=>{const k=b.dataset.l,r=Math.max(0,CF.life[k].uses-G.used[k]);b.querySelector('.n').textContent=r;b.disabled=r<1})}

/* ===== النهاية والجائزة ===== */
async function end(kind){stopAll();stopT();const reached=kind==='win'?15:G.i,sf=safes(),won=kind==='lose'?Math.max(0,...sf.filter(n=>n<=reached)):reached,pz=won>0?P(won):null;let info='',wallet=0;
 if(pz&&pz.has&&CF.send&&pz.value>0){try{wallet=await award(pz,won)}catch(e){console.error(e);info=e==='dup'?'':'تعذر إضافة الهدية للمحفظة — تواصل مع الإدارة.'}}
 const real=wallet>0,sym=!!pz&&!real;say(kind==='win'?'win':kind==='quit'?'score':'lose');
 const ttl=kind==='win'?'🎉 مبروك! كسبت الجائزة الكبرى':kind==='quit'?'انسحبت بذكاء':kind==='lose'?'للأسف… إجابة خاطئة':'';
 show(`<div class="c"><h1 class="big" style="font-size:clamp(24px,6vw,40px)">${ttl}</h1><p class="sub">${won>0?'أنا كسبان لحد:':'لم تصل إلى جائزة هذه المرة.'}</p>
 ${pz?`<div class="prz">${real?(pz.g?gIco(pz.g):'🎁'):'🦁'}</div><h2 style="color:var(--gl);font-size:26px">${esc(pz.name)}</h2><p class="sub">أجبت على ${reached} من 15 سؤالًا${kind==='lose'&&won<reached?` — ونزلت إلى نقطة الأمان (السؤال ${won})`:''}.</p>
 <div class="note">${real?`🎁 تم إرسال الهدية إليك، وأُضيف <b>${wallet} ج.م</b> إلى محفظتك (٥٠٪ من قيمة الهدية).`:sym?'🦁 شكرًا لك! هذه هدية رمزية غير حقيقية.':''}</div>`:`<div class="prz">🦁</div><p class="sub">أجبت على ${reached} من 15 سؤالًا. جرّب مرة أخرى!</p>`}
 ${info?`<p class="sub" style="color:#ff9aa0">${info}</p>`:''}<button class="btn p" data-a="home"><i class="fas fa-rotate-right"></i> العب مرة أخرى</button><a class="btn" href="index.html" style="text-decoration:none;color:inherit"><i class="fas fa-house"></i> الرئيسية</a></div>`)}
async function award(pz,n){const half=r2(pz.value/2),id=Date.now()+'_'+Math.random().toString(36).slice(2,7),wR=doc(db,'wallets',uid),tR=doc(db,'wallet_transactions','tx_'+id+'_g'),aD=doc(db,'wwtbam_awards',G.sid);
 await runTransaction(db,async tx=>{const ex=await tx.get(aD);if(ex.exists())throw 'dup';const b=await tx.get(wR),rb=r2((b.exists()?Number(b.data().balance||0):0)+half),now=new Date().toISOString(),rl=b.exists()&&b.data().role||role;
  tx.set(wR,{userId:uid,userName:uname,role:rl,balance:rb,updatedAt:now},{merge:true});
  tx.set(tR,{userId:uid,userName:uname,role:rl,type:'credit',amount:half,balanceAfter:rb,label:`هدية مستلمة: ${pz.name}`,note:`جائزة ${NAME} — ٥٠٪ من ${pz.value} ج.م`,source:'game_gift_received',by:NAME,createdAt:now,giftId:pz.g?.id||'',qty:1});
  tx.set(aD,{uid,userName:uname,mode:G.m,question:n,prize:pz.name,giftId:pz.g?.id||'',total:pz.value,received:half,createdAt:serverTimestamp()})});
 try{const nid='notif_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),now=new Date().toISOString();await setDoc(doc(db,'notifications',nid),{id:nid,title:'هدية جديدة 🎁',body:`ربحت ${pz.name} في ${NAME} — أُضيف ${half} ج.م لمحفظتك`,type:'none',url:'',kind:'game',mediaType:'none',senderId:'meezan',senderName:NAME,createdAt:now,target:'custom',targetLabel:NAME,recipients:[uid]});
  const s=await getDoc(doc(db,'user_notifications',uid)),d=s.exists()?s.data():{};let ids=d.notifIds||[],u=d.unreadCount||0;ids=[nid,...ids].slice(0,100);u++;await setDoc(doc(db,'user_notifications',uid),{userId:uid,notifIds:ids,unreadCount:u,updatedAt:serverTimestamp()},{merge:true})}catch(e){}
 return half}

/* ===== الأحداث ===== */
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;const d=b.dataset;
 if(d.m)pick(d.m);else if(d.s!=null)sel(+d.s);else if(d.l)life(d.l);
 else if(d.a==='start')ask();else if(d.a==='confirm')confirmA();else if(d.a==='close')closePop();else if(d.a==='home'){G=null;if(bg){bg.pause();bg=null}home()}
 else if(d.a==='quit'&&!G.locked){stopT();pop(`<h3>الانسحاب؟</h3><p class="sub">ستأخذ جائزة السؤال ${G.i}: <b>${G.i?esc(P(G.i).name):'لا شيء'}</b></p><button class="btn p" data-a="yes">نعم، انسحب</button><button class="btn" data-a="close">أكمل اللعب</button>`)}
 else if(d.a==='yes'){$('#pp').innerHTML='';G.locked=true;end('quit')}
 else if(b.id==='lb'&&G){pop(`<h3>سلم الجوائز</h3><div class="lad" style="position:static;border:0;text-align:right">${lad()}</div><button class="btn" data-a="close">إغلاق</button>`)}});
document.addEventListener('visibilitychange',()=>{[bg,think].forEach(a=>a&&(document.hidden?a.pause():a.play().catch(()=>{})))});
boot();
</script></body></html>
