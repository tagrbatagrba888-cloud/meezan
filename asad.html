 try{CF=await loadCF(m);
  ['welcome','bg','think','q1'].forEach(k=>sUrl(k));playBg();
  const pools={};await Promise.all([...new Set(CF.map)].map(async j=>{const r=await getDocs(query(collection(db,'wwtbam_q'),where('ml','==',m+'_'+LV[j]),limit(300)));pools[j]=r.docs.map(x=>({id:x.id,...x.data()}))}));
  const Q=build(pools);if(!Q)return;['correct','wrong','fifty','phone','aud','score','win','lose',...Array.from({length:15},(_,i)=>'q'+(i+1))].forEach(k=>sUrl(k));
  G={m,Q,i:0,used:{fifty:0,phone:0,aud:0},sid:uid+'_'+Date.now(),sel:null,locked:false,rem:CF.time,gone:[],phase:'welcome'};save();welcome()}catch(e){console.error(e);show(`<div class="c"><p class="sub">تعذر تحميل اللعبة: ${esc(e.message||e)}</p><button class="btn" data-a="home">رجوع</button></div>`)}}
function build(pools){const used=new Set(),Q=[],all=shuf(Object.values(pools).flat());
 for(let i=0;i<15;i++){const pl=shuf(pools[CF.map[i]]||[]);let q=pl.find(x=>!used.has(x.id))||all.find(x=>!used.has(x.id));
  if(!q){show(`<div class="c"><div class="lion">📭</div><p class="sub">لا توجد أسئلة كافية لبدء هذه المسابقة بعد. حاول لاحقًا.</p><button class="btn" data-a="home">رجوع</button></div>`);return null}
  used.add(q.id);const o=q.a.map((t,j)=>({t,c:j===q.c}));Q.push({q:q.q,a:CF.shuffleA?shuf(o):o})}
 return Q}
function welcome(){G.phase='welcome';save();say('welcome');playBg();show(`<div class="c hero"><div class="lion">🎬</div><h1 class="big">أهلًا ${esc(uname)}</h1><p class="sub">${CF.time>0?`معك ${CF.time} ثانية لكل سؤال. `:''}لديك مساعدات: ${[['fifty','حذف إجابتين'],['phone','مكالمة صديق'],['aud','رأي الجمهور']].filter(([k])=>CF.life[k].on&&CF.life[k].uses>0).map(([,n])=>n).join('، ')||'بدون مساعدات'}. يمكنك الانسحاب في أي وقت وأخذ ما وصلت إليه.</p><button class="btn p" data-a="start"><i class="fas fa-play"></i> يلا نبدأ</button></div>`)}

/* ===== الجوائز ===== */
const P=n=>{const p=CF.prize[n-1]||{},g=GIFTS[p.gift];return{g,name:p.label||g?.name||(p.cash>0?p.cash+' ج.م':'—'),value:g?(Number(g.price)||0):(Number(p.cash)||0),has:!!(p.label||g||p.cash>0)}};
const safes=()=>String(CF.safe||'').split(/[,،\s]+/).map(Number).filter(n=>n>0&&n<15);
const gIco=g=>g?.img?`<img src="${esc(g.img)}" alt="">`:`<span>${esc(g?.icon||'🎁')}</span>`;
function lad(){const sf=safes();return `<ol>${Array.from({length:15},(_,k)=>{const n=k+1,p=P(n),cls=[n===G.i+1?'on':n<=G.i?'done':'',sf.includes(n)||n===15?'sf':''].join(' ');return `<li class="${cls}"><b>${n}</b><span>${esc(p.name)}</span>${p.g?gIco(p.g):''}</li>`}).join('')}</ol>`}

/* ===== السؤال ===== */
const ORD=['الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر','الثالث عشر','الرابع عشر','الخامس عشر'];
function intro(){stopAll();const i=G.i,k='q'+(i+1),sid=G.sid;G.wait=false;G.sel=null;G.locked=false;G.gone=[];G.rem=CF.time;G.phase='intro';save();
 show(`<div class="c"><p class="sub" style="margin:0 auto">الجائزة: ${esc(P(i+1).name)}</p><div class="rnd"><b>${i+1}</b></div><h1 class="big" style="font-size:clamp(24px,6vw,40px)">السؤال ${ORD[i]}</h1><p class="sub ld">جارٍ جلب السؤال<span>.</span><span>.</span><span>.</span></p></div>`);
 let d=false;const go=()=>{if(d)return;d=true;if(G&&G.sid===sid&&G.i===i)ask()};say(k,go);if(!CF.snd[k])setTimeout(go,900);setTimeout(go,45000)}
function ask(){stopAll();const i=G.i,q=G.Q[i],rs=G.rs;G.rs=null;G.sel=rs?rs.sel:null;G.locked=false;G.gone=rs&&rs.gone?rs.gone:[];G.rem=rs&&rs.rem!=null?rs.rem:CF.time;G.pauseSnd=false;G.pausePop=false;G.wait=true;G.phase='ask';const lf=k=>CF.life[k],n=k=>Math.max(0,lf(k).uses-G.used[k]);
 show(`<div class="g"><div><div class="hud"><div class="inf"><b>السؤال ${i+1} من 15</b>الجائزة: ${esc(P(i+1).name)}</div>
 <div class="lf">${[['fifty','fa-scissors'],['phone','fa-phone'],['aud','fa-users']].filter(([k])=>lf(k).on&&lf(k).uses>0).map(([k,ic])=>`<button class="lb" data-l="${k}" ${n(k)<1?'disabled':''}><i class="fas ${ic}"></i><i class="n">${n(k)}</i></button>`).join('')}</div>
 ${CF.time>0?`<div class="tm" id="tm"><svg width="62" height="62"><circle class="bk" cx="31" cy="31" r="26"/><circle class="fg" id="fg" cx="31" cy="31" r="26" stroke-dasharray="163.4" stroke-dashoffset="0"/></svg><span id="ts">${CF.time}</span></div>`:''}</div>
 <div class="qb">${esc(q.q)}</div><div class="as">${q.a.map((a,j)=>`<button class="a" data-s="${j}"><b>${AL[j]}</b>${esc(a.t)}</button>`).join('')}</div>
 <div style="text-align:center;margin-top:14px"><button class="btn p" id="cf" data-a="confirm" disabled><i class="fas fa-lock"></i> تأكيد الإجابة</button><button class="btn" data-a="quit"><i class="fas fa-door-open"></i> انسحاب</button></div></div>
 <div class="lad">${lad()}</div></div>`);
 document.querySelectorAll('.a').forEach((b,j)=>{b.classList.toggle('gone',G.gone.includes(j));b.classList.toggle('sel',G.sel===j)});
 if(G.sel!=null&&G.sel>=0)$('#cf').disabled=false;
 startThink();
 if(rs&&rs.locked){G.locked=true;G.wait=false;document.querySelectorAll('.a,.lb').forEach(b=>b.disabled=true);$('#cf').disabled=true;draw();const sid=G.sid;setTimeout(()=>{if(!G||G.sid!==sid)return;stopThink();reveal(G.sel>=0&&!!q.a[G.sel]&&q.a[G.sel].c)},900)}
 else{tick();save()}}
let tmr=null;const stopT=()=>{clearInterval(tmr);tmr=null};
function tick(){stopT();if(!(CF.time>0))return;draw();let n=0;tmr=setInterval(()=>{G.rem=Math.max(0,G.rem-.25);draw();if(++n%4===0)save();if(G.rem<=0){stopT();timeout()}},250)}
function draw(){const f=$('#fg'),s=$('#ts'),t=$('#tm');if(!f)return;f.style.strokeDashoffset=163.4*(1-G.rem/CF.time);s.textContent=Math.ceil(G.rem);t.classList.toggle('lo',G.rem<=10)}
function sel(j){if(G.locked||G.gone.includes(j))return;G.sel=j;document.querySelectorAll('.a').forEach((b,x)=>b.classList.toggle('sel',x===j));$('#cf').disabled=false;save()}
async function confirmA(){if(G.locked||G.sel==null||G.pauseSnd||G.pausePop)return;G.locked=true;G.wait=false;save();stopT();stopVoice();startThink();document.querySelectorAll('.a,.lb').forEach(b=>b.disabled=true);$('#cf').disabled=true;
 await sleep(2400);stopThink();const q=G.Q[G.i];reveal(q.a[G.sel].c)}
async function timeout(){G.locked=true;G.wait=false;G.sel=-1;save();stopThink();document.querySelectorAll('.a,.lb').forEach(b=>b.disabled=true);toast('انتهى الوقت!');await sleep(800);reveal(false)}
async function reveal(ok){const q=G.Q[G.i];document.querySelectorAll('.a').forEach((b,x)=>{b.classList.remove('sel');if(q.a[x].c)b.classList.add('ok');else if(x===G.sel)b.classList.add('no')});
 if(ok){await new Promise(r=>{say('correct',r);setTimeout(r,10000)});await sleep(400);if(G.i===14){G.i=15;return end('win')}logG({reached:G.i+1});G.i++;intro()}
 else{await new Promise(r=>{say('wrong',r);setTimeout(r,10000)});await sleep(1200);end('lose')}}

/* ===== المساعدات ===== */
const resume=()=>{if(G&&G.wait&&!G.locked&&!G.pauseSnd&&!G.pausePop&&CF.time>0&&$('#fg'))tick()};
const pop=h=>{if(G){G.pausePop=true;stopT()}$('#pp').innerHTML=`<div class="pop"><div class="pb">${h}</div></div>`},closePop=()=>{$('#pp').innerHTML='';if(G){if(G.pauseSnd){stopVoice();G.pauseSnd=false;syncThink()}G.pausePop=false;resume()}};
const left=()=>G.Q[G.i].a.map((a,j)=>j).filter(j=>!G.gone.includes(j));
function life(k){if(G.locked||G.pauseSnd||G.used[k]>=CF.life[k].uses)return;G.used[k]++;G.pauseSnd=true;stopT();say(k,()=>{if(G){G.pauseSnd=false;resume()}});
 const q=G.Q[G.i],c=q.a.findIndex(a=>a.c),L=left(),acc=CF.life[k].acc??100,right=Math.random()*100<acc,wrongs=L.filter(j=>j!==c),lead=right?c:(wrongs[Math.random()*wrongs.length|0]??c);
 if(k==='fifty'){shuf(wrongs).slice(0,2).forEach(j=>G.gone.push(j));document.querySelectorAll('.a').forEach((b,j)=>b.classList.toggle('gone',G.gone.includes(j)));if(G.gone.includes(G.sel)){G.sel=null;$('#cf').disabled=true;document.querySelectorAll('.a').forEach(b=>b.classList.remove('sel'))}refLb();save();return}
 if(k==='phone'){const sure=right?70+Math.random()*28|0:35+Math.random()*25|0,lines=['ألو؟ أهلًا يا '+uname+'… سأقرأ السؤال بسرعة.','همم… دعني أفكر قليلًا…',right?`أنا واثق بنسبة ${sure}% أن الإجابة (${AL[lead]}): ${q.a[lead].t}`:`مش متأكد… أميل إلى (${AL[lead]}): ${q.a[lead].t}، لكن ثقتي ${sure}% فقط.`];
  pop(`<h3><i class="fas fa-phone"></i> مكالمة صديق</h3><div class="ph" id="phl"></div><button class="btn" data-a="close" style="margin-top:8px">إنهاء المكالمة</button>`);lines.forEach((x,i)=>setTimeout(()=>{const e=$('#phl');if(e)e.insertAdjacentHTML('beforeend',`<p>${esc(x)}</p>`)},900+i*1700))}
 else{const v={};let rest=100;const ld=L.length>2?45+Math.random()*28|0:58+Math.random()*27|0;v[lead]=ld;rest-=ld;const o=L.filter(j=>j!==lead);o.forEach((j,x)=>{const s=x===o.length-1?rest:Math.round(Math.random()*rest*.7);v[j]=s;rest-=s});
  pop(`<h3><i class="fas fa-users"></i> رأي الجمهور</h3><div class="bars">${L.map(j=>`<div>${v[j]}%<i data-h="${v[j]}"></i>${AL[j]}</div>`).join('')}</div><button class="btn" data-a="close">تم</button>`);setTimeout(()=>document.querySelectorAll('.bars i').forEach(e=>e.style.height=e.dataset.h*.9+'%'),150)}
 refLb();save()}
function refLb(){document.querySelectorAll('.lb').forEach(b=>{const k=b.dataset.l,r=Math.max(0,CF.life[k].uses-G.used[k]);b.querySelector('.n').textContent=r;b.disabled=r<1})}

/* ===== النهاية والجائزة ===== */
async function end(kind){G.wait=false;G.phase='end';stopAll();stopT();clr();const reached=kind==='win'?15:G.i,sf=safes(),won=kind==='lose'?Math.max(0,...sf.filter(n=>n<=reached)):reached,pz=won>0?P(won):null;let info='',wallet=0;
 const sk=kind==='win'?'win':kind==='quit'?'score':'lose';say(CF.snd[sk]?sk:(CF.snd.score?'score':sk));
 if(pz&&pz.has&&CF.send&&pz.value>0){try{wallet=await award(pz,won)}catch(e){console.error(e);info=e==='dup'?'':'تعذر إضافة الهدية للمحفظة — تواصل مع الإدارة.'}}
 const real=wallet>0,sym=!!pz&&!real;logG({kind,reached,won,prize:pz?pz.name:'',value:pz?pz.value:0,received:wallet,sent:real,endedAt:serverTimestamp()});
 const ttl=kind==='win'?'🎉 مبروك! كسبت الجائزة الكبرى':kind==='quit'?'انسحبت بذكاء':kind==='lose'?'للأسف… إجابة خاطئة':'';
 show(`<div class="c hero"><h1 class="big" style="font-size:clamp(24px,6vw,40px)">${ttl}</h1><p class="sub">${won>0?'أنا كسبان لحد:':'لم تصل إلى جائزة هذه المرة.'}</p>
 ${pz?`<div class="prz">${real?(pz.g?gIco(pz.g):'🎁'):'🦁'}</div><h2 style="font-size:26px">${esc(pz.name)}</h2><p class="sub">أجبت على ${reached} من 15 سؤالًا${kind==='lose'&&won<reached?` — ونزلت إلى نقطة الأمان (السؤال ${won})`:''}.</p>
 <div class="note">${real?`🎁 تم إرسال الهدية إليك، وأُضيف <b>${wallet} ج.م</b> إلى محفظتك (٥٠٪ من قيمة الهدية).`:sym?'🦁 شكرًا لك! هذه هدية رمزية غير حقيقية.':''}</div>`:`<div class="prz">🦁</div><p class="sub">أجبت على ${reached} من 15 سؤالًا. جرّب مرة أخرى!</p>`}
 ${info?`<p class="sub" style="color:#ffb3b8">${info}</p>`:''}<button class="btn p" data-a="home"><i class="fas fa-rotate-right"></i> العب مرة أخرى</button><a class="btn" href="index.html"><i class="fas fa-house"></i> الرئيسية</a></div>`)}
async function award(pz,n){const half=r2(pz.value/2),id=Date.now()+'_'+Math.random().toString(36).slice(2,7),wR=doc(db,'wallets',uid),tR=doc(db,'wallet_transactions','tx_'+id+'_g'),aD=doc(db,'wwtbam_awards',G.sid);
 await runTransaction(db,async tx=>{const ex=await tx.get(aD);if(ex.exists())throw 'dup';const b=await tx.get(wR),rb=r2((b.exists()?Number(b.data().balance||0):0)+half),now=new Date().toISOString(),rl=b.exists()&&b.data().role||role;
  tx.set(wR,{userId:uid,userName:uname,role:rl,balance:rb,updatedAt:now},{merge:true});
  tx.set(tR,{userId:uid,userName:uname,role:rl,type:'credit',amount:half,balanceAfter:rb,label:`هدية مستلمة: ${pz.name}`,note:`جائزة ${NAME} — ٥٠٪ من ${pz.value} ج.م`,source:'game_gift_received',by:NAME,createdAt:now,giftId:pz.g?.id||'',qty:1});
  tx.set(aD,{uid,userName:uname,mode:G.m,question:n,prize:pz.name,giftId:pz.g?.id||'',total:pz.value,received:half,createdAt:serverTimestamp()})});
 try{const nid='notif_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),now=new Date().toISOString();await setDoc(doc(db,'notifications',nid),{id:nid,title:'هدية جديدة 🎁',body:`ربحت ${pz.name} في ${NAME} — أُضيف ${half} ج.م لمحفظتك`,type:'none',url:'',kind:'game',mediaType:'none',senderId:'meezan',senderName:NAME,createdAt:now,target:'custom',targetLabel:NAME,recipients:[uid]});
  const s=await getDoc(doc(db,'user_notifications',uid)),d=s.exists()?s.data():{};let ids=d.notifIds||[],u=d.unreadCount||0;ids=[nid,...ids].slice(0,100);u++;await setDoc(doc(db,'user_notifications',uid),{userId:uid,notifIds:ids,unreadCount:u,updatedAt:serverTimestamp()},{merge:true})}catch(e){}
 return half}

const logG=x=>{try{setDoc(doc(db,'wwtbam_games',G.sid),{uid,name:uname,mode:G.m,gameName:NAME,...x},{merge:true}).catch(e=>console.error('wwtbam_games',e))}catch(e){}};
/* ===== الأحداث ===== */
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b)return;const d=b.dataset;
 if(d.m)pick(d.m);else if(d.s!=null)sel(+d.s);else if(d.l)life(d.l);
 else if(d.a==='start'){logG({kind:'playing',reached:0,createdAt:serverTimestamp()});intro()}else if(d.a==='confirm')confirmA();else if(d.a==='close')closePop();else if(d.a==='home'){clr();G=null;stopAll();if(bg){bg.pause();bg=null}home()}
 else if(d.a==='quit'&&!G.locked){stopT();pop(`<h3>الانسحاب؟</h3><p class="sub">ستأخذ جائزة السؤال ${G.i}: <b>${G.i?esc(P(G.i).name):'لا شيء'}</b></p><button class="btn p" data-a="yes">نعم، انسحب</button><button class="btn" data-a="close">أكمل اللعب</button>`)}
 else if(d.a==='yes'){$('#pp').innerHTML='';G.locked=true;end('quit')}
 else if(b.id==='lb'&&G){pop(`<h3>سلم الجوائز</h3><div class="lad" style="position:static;border:0;text-align:right">${lad()}</div><button class="btn" data-a="close">إغلاق</button>`)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){bg&&bg.pause();think&&think.pause()}else{bg&&bg.play().catch(()=>{});syncThink()}});
boot();
</script></body></html>
