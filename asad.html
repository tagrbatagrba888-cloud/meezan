 .hero h2{font-size:25px}.life{width:58px;height:40px;font-size:17px}.emblem{width:120px;height:120px}.lion{font-size:60px}

const audC = new Map(); let live = [];

  const p = Promise.all(Array.from({length:+a[2]||1}, (_,i) => getDoc(doc(db,'mm_media',`${a[1]}_${i}`)).then(s => s.exists() ? s.data().data : null))).then(x => x.some(v => v == null) ? '' : x.join('')).catch(e => { console.warn('audio load failed', e); return ''; });

async function play(item){ if (S.mute || !item || !item.ptr) return null; unlockAudio(); const d = await loadAudio(item.ptr); if (!d || S.mute) return null;
  const el = POOL.find(x => !x._busy) || new Audio(); el._busy = true; el._u = false; const h = mkH(); live.push(h);
  const free = () => { el._busy = false; el.onended = null; };
  h.stop = () => { free(); el.pause(); };
  el.onended = () => { free(); if (h.done) return; h.done = true; live = live.filter(x => x !== h); h.fire('ended'); };
  try { el.src = d; el.currentTime = 0; await el.play(); } catch(e){ console.warn('audio blocked', e); unlocked = false; free(); live = live.filter(x => x !== h); h.done = true; return null; }
  return h; }
const stopAll = () => { live.forEach(a => { try { a.pause(); } catch(e){} }); live = []; };
const stopA = a => { if (!a) return; try { a.pause(); } catch(e){} live = live.filter(x => x !== a); };
function waitEnd(a, max){ return new Promise(res => { if (!a) return res(); const t = setTimeout(done, max); function done(){ clearTimeout(t); a.removeEventListener('ended', done); a.removeEventListener('pause', done); res(); } a.addEventListener('ended', done); a.addEventListener('pause', done); }); }
const pick = arr => arr && arr.length ? arr[rnd(arr.length)] : null;
function setMute(m){ S.mute = m; localStorage.setItem('mm_mute', m ? '1' : '0'); $('muteIc').className = m ? 'fas fa-volume-xmark' : 'fas fa-volume-high'; if (m) stopAll(); }
$('muteBtn').onclick = () => setMute(!S.mute); setMute(S.mute);

/* ============ تحميل البيانات ============ */
const dayStart = () => { const d = new Date(); d.setHours(0,0,0,0); return d.getTime(); };
async function load(){
  const [c, s, qs, gf, pl] = await Promise.all([
    getDoc(doc(db,'settings','millionaire')), getDoc(doc(db,'settings','millionaire_sounds')), getDocs(collection(db,'mm_questions')), getDocs(collection(db,'live_gifts')),
    uid ? getDocs(query(collection(db,'mm_plays'), where('uid','==',uid))) : Promise.resolve({docs:[]})]);
  S.cfg = merge(DEF, c.exists() ? c.data() : {}); S.snd = s.exists() ? s.data() : {};
  S.qs = qs.docs.map(d => ({id:d.id, ...d.data()})).filter(q => q.active !== false && q.text && (q.options||[]).length === 4);
  S.gifts = gf.docs.map(d => ({id:d.id, ...d.data()}));
  S.plays = pl.docs.map(d => ({id:d.id, ...d.data()})).sort((a,b) => tms(b.startedAt) - tms(a.startedAt));
  // أي جولة غير منتهية (تحديث الصفحة أثناء اللعب) تُحسب خسارة
  for (const p of S.plays.filter(p => p.status === 'playing')){ p.status = 'lost'; p.endedAt = Timestamp.now(); updateDoc(doc(db,'mm_plays',p.id), {status:'lost', endedAt:serverTimestamp(), abandoned:true}).catch(() => {}); }
  document.title = `${S.cfg.name} | MEEZAN`; $('tName').textContent = S.cfg.name;
  // الأسماء الكاملة
  try { for (const col of ['users','teachers']){ const x = await getDoc(doc(db,col,'all')); (x.exists() ? x.data().items||[] : []).forEach(u => S.users[u.id] = u); } } catch(e){}
  if (S.cfg.showBoard){ try { const b = await getDocs(query(collection(db,'mm_plays'), orderBy('startedAt','desc'), limit(150)));
      const seen = new Set(); S.board = b.docs.map(d => d.data()).filter(p => p.status === 'won' && !seen.has(p.uid) && seen.add(p.uid)).slice(0,8); } catch(e){} }
  S.ready = true; preload(); }
function preload(){ ['start','firstq','suspense','end'].forEach(k => S.snd[k]?.ptr && loadAudio(S.snd[k].ptr)); (S.snd.correct||[]).forEach(x => loadAudio(x.ptr)); (S.snd.wrong||[]).forEach(x => loadAudio(x.ptr)); }
const myName = () => { const u = S.users[uid]; return (u && (u.fullName || u.name || u.displayName)) || meData.fullName || meData.name || meData.username || 'مستخدم'; };

/* ============ قواعد اللعب ============ */
function canPlay(){ const c = S.cfg, r = c.replay;
  if (!c.enabled) return {ok:false, msg:'اللعبة متوقفة حالياً — عد لاحقاً'};
  if (!buildRound(true).length) return {ok:false, msg:'لا توجد أسئلة كافية حالياً — عد لاحقاً'};
  const last = S.plays[0];
  if (last){ if (last.status === 'won' && !r.afterWin) return {ok:false, msg:'لقد فزت بالفعل — لا يمكن إعادة اللعب 🏆'};
    if (last.status !== 'won' && !r.afterLose) return {ok:false, msg:'لا يمكن إعادة اللعب بعد الخسارة'};
    if (+r.cooldown > 0){ const end = tms(last.endedAt) || tms(last.startedAt), left = end + r.cooldown*60000 - Date.now(); if (left > 0) return {ok:false, msg:`يمكنك اللعب مجدداً بعد ${ar(Math.ceil(left/60000))} دقيقة ⏳`}; } }
  if (+r.maxPerDay > 0){ const n = S.plays.filter(p => tms(p.startedAt) >= dayStart()).length; if (n >= r.maxPerDay) return {ok:false, msg:`وصلت للحد اليومي (${ar(r.maxPerDay)} جولات) — عد غداً`}; }
  return {ok:true}; }

/* كل جولة تسحب أسئلة جديدة: غير المشاهَدة أولاً ثم الأقدم مشاهدة */
const seenKey = 'mm_seen_' + uid;
const seenMap = () => { try { return JSON.parse(localStorage.getItem(seenKey) || '{}') || {}; } catch(e){ return {}; } };
function buildRound(dry){
  const sm = seenMap(), out = [];
  LV.forEach(l => { const n = +lvl(l).count || 0; if (!n) return; let pool = S.qs.filter(q => q.level === l);
    pool = shuf(pool).sort((a,b) => (sm[a.id]||0) - (sm[b.id]||0)); let take = pool.slice(0, n);
    if (!S.cfg.shuffleQ) take.sort((a,b) => tms(a.ts||a.createdAt) - tms(b.ts||b.createdAt)); else take = shuf(take);
    take.forEach(q => out.push({q, level:l})); });
  if (dry) return out;
  const t = Date.now(); out.forEach(x => sm[x.q.id] = t); const ks = Object.keys(sm); if (ks.length > 2500) ks.sort((a,b) => sm[a]-sm[b]).slice(0, ks.length-2000).forEach(k => delete sm[k]); try { localStorage.setItem(seenKey, JSON.stringify(sm)); } catch(e){}
  return out.map(({q, level}) => { let opts = q.options.map((t,i) => ({t, ok:i === q.correct})); if (S.cfg.shuffleO) opts = shuf(opts);
    return {id:q.id, text:q.text, opts, correct:opts.findIndex(o => o.ok), level, giftId:q.giftId||'', giftQty:q.giftQty||1}; }); }
const safeList = () => String(S.cfg.safePoints||'').split(/[,،\s]+/).map(Number).filter(n => n > 0);

/* ============ الواجهة: الشاشة الرئيسية ============ */
const app = $('app');
let tick = null;
function showIntro(){
  clearInterval(tick); stopAll(); const c = S.cfg, chk = canPlay(), rounds = LV.reduce((a,l) => a + (+lvl(l).count||0), 0);

  app.innerHTML = `<div class="card hero"><div class="emblem"><div class="lion">🦁</div></div><h2>${esc(c.name)}</h2><p>${esc(c.tagline)}</p>
    <div class="info"><span class="chip g"><i class="fas fa-list-ol"></i> ${ar(rounds)} سؤال</span>${LV.filter(l => +lvl(l).count).map(l => `<span class="chip" style="border-color:${esc(lvl(l).color)}"><i class="fas fa-circle" style="color:${esc(lvl(l).color)};font-size:8px"></i> ${esc(lvl(l).label)} ×${ar(lvl(l).count)}</span>`).join('')}</div>
    ${c.rules ? `<div class="rules"><i class="fas fa-scroll" style="color:var(--gold)"></i> ${esc(c.rules)}</div>` : ''}
    <div class="info">${Object.entries(c.lifelines).filter(([k,v]) => v.on).map(([k,v]) => `<span class="chip g"><i class="fas ${{fifty:'fa-scissors',ai:'fa-robot',audience:'fa-people-group'}[k]}"></i> ${esc(v.label)}</span>`).join('')}</div>
    ${S.plays.length ? `<div class="info"><span class="chip"><i class="fas fa-gamepad"></i> لعبت ${ar(S.plays.length)} مرة</span><span class="chip"><i class="fas fa-trophy" style="color:var(--gold)"></i> فزت ${ar(wins)}</span></div>` : ''}
    ${chk.ok ? '' : `<div class="msg">${esc(chk.msg)}</div>`}
    <button class="btn gold big" id="goBtn" ${chk.ok ? '' : 'disabled'}><i class="fas fa-play"></i> ${S.plays.length ? 'العب مرة أخرى' : 'ابدأ اللعب'}</button></div>
    ${c.showBoard && S.board.length ? `<div class="card"><div class="sec-t"><i class="fas fa-trophy"></i> أبطال اللعبة</div>${S.board.map(p => { const u = S.users[p.uid], n = (u && (u.fullName || u.name)) || p.name || 'مستخدم'; return `<div class="brow"><div class="av">${esc(String(n).charAt(0))}</div><b>${esc(n)}</b><small>${(p.giftNames||[]).length ? esc(p.giftNames.join('، ')) : 'فائز 🏆'}</small></div>`; }).join('')}</div>` : ''}`;

/* ============ اللعبة ============ */
let G = null;
const timer = {iv:null, end:0, total:0, left:0, run:false, onEnd:null};
function tStart(sec, onEnd){ tStop(); timer.total = sec; timer.left = sec*1000; timer.onEnd = onEnd; timer.run = true; timer.end = Date.now() + timer.left; timer.iv = setInterval(tTick, 200); tTick(); }
function tStop(){ clearInterval(timer.iv); timer.iv = null; timer.run = false; }
function tPause(){ if (!timer.run) return; timer.left = Math.max(0, timer.end - Date.now()); clearInterval(timer.iv); timer.iv = null; timer.run = false; timer.paused = true; }
function tResume(){ if (!timer.paused) return; timer.paused = false; timer.run = true; timer.end = Date.now() + timer.left; timer.iv = setInterval(tTick, 200); }
function tTick(){ const left = Math.max(0, timer.end - Date.now()), s = Math.ceil(left/1000), n = $('tNum'), box = $('tBox'); if (n){ n.textContent = ar(s); n.style.setProperty('--p', (left/(timer.total*1000)*100).toFixed(1)); } if (box) box.classList.toggle('low', s <= 5);
  if (left <= 0){ tStop(); timer.onEnd && timer.onEnd(); } }

async function startGame(){

  Object.entries(S.cfg.lifelines).forEach(([k,v]) => G.lives[k] = v.on ? (+v.uses||1) : 0);
  app.innerHTML = `<div class="card splash"><div class="lion">🦁</div><h2>${esc(S.cfg.name)}</h2><p style="margin:10px 0;font-weight:700">استعد… الجولة ستبدأ الآن</p><button class="btn out" id="skipB"><i class="fas fa-forward"></i> تخطي</button></div>`;
  let skip; const sk = new Promise(r => skip = r); $('skipB').onclick = () => skip();
  try { const ref = await addDoc(collection(db,'mm_plays'), {uid, name:myName(), grade:S.users[uid]?.grade || meData.grade || '', avatar:/^https?:/.test(S.users[uid]?.avatarUrl||'') ? S.users[uid].avatarUrl : '', status:'playing', reached:0, total:round.length, levelLabel:'', giftNames:[], startedAt:serverTimestamp()});
    G.playId = ref.id; S.plays.unshift({id:ref.id, uid, status:'playing', startedAt:Timestamp.now()}); } catch(e){ console.error(e); toast('تعذر بدء الجولة — تحقق من الاتصال'); return showIntro(); }

const rungHtml = () => G.round.map((x, i) => { const g = x.giftId ? giftOf(x.giftId) : null, safe = safeList().includes(i+1);
  return `<div class="rung ${i === G.i ? 'cur' : ''} ${i < G.i ? 'done' : ''} ${safe ? 'safe' : ''}"><span class="no" style="background:${esc(lvl(x.level).color)}">${ar(i+1)}</span><span class="gf">${g ? giftIco(g) + esc(g.name) + (x.giftQty > 1 ? ' ×' + ar(x.giftQty) : '') : '<span style="opacity:.5">—</span>'}</span></div>`; }).join('');
const LIFE_IC = {fifty:'<b class="f5">50:50</b>', ai:'<i class="fas fa-robot"></i>', audience:'<i class="fas fa-people-group"></i>'};
const lifeBtns = () => Object.entries(S.cfg.lifelines).filter(([k,v]) => v.on).map(([k,v]) => `<button class="life" data-life="${k}" ${G.lives[k] > 0 && !G.locked ? '' : 'disabled'} title="${esc(v.label)}">${LIFE_IC[k] || ''}${(+v.uses||1) > 1 ? `<span class="n">${ar(G.lives[k])}</span>` : ''}</button>`).join('');

function showQ(){

  const first = G.i === 0 && !!(S.snd.firstq && S.snd.firstq.ptr) && !S.mute;
  app.innerHTML = `<div class="gm"><div>
    <div class="gtop"><div class="lifes" id="lifes">${lifeBtns()}</div>
      <div class="gmid"><span class="lvtag" style="background:${esc(L.color)}">${esc(L.label)}</span><span class="qn">السؤال ${ar(G.i+1)} من ${ar(G.round.length)}</span></div>
      <div class="tcol">${+L.timer ? `<div class="tim" id="tBox"><span class="ring" id="tNum">${ar(L.timer)}</span></div>` : ''}<button class="ib ladbtn" id="ladBtn" aria-label="الجوائز"><i class="fas fa-ranking-star"></i></button></div></div>

    <aside class="ladder card" id="ladder" style="padding:12px"><div class="sec-t" style="font-size:14px;margin-bottom:8px"><i class="fas fa-ranking-star"></i> سلم الجوائز</div><div class="lad">${rungHtml()}</div></aside></div>`;
  fixFsm();
  if ($('ladBtn')) $('ladBtn').onclick = () => $('ladder').classList.toggle('show');
  $('opts').addEventListener('click', e => { const b = e.target.closest('[data-o]'); if (!b || G.locked) return; selectOpt(+b.dataset.o); });

  $('quitB').onclick = quit;
  const tok = G.tok, qi = G.i;

  /* صوت واحد فقط: مع أول سؤال يظهر في الجولة (أيًّا كان ترتيبه) ثم يبدأ العدّاد */

      waitEnd(a, 60000).then(() => { if (G.qAud === a) G.qAud = null; startT(); }); if ($('skipA')) $('skipA').onclick = () => stopA(a); }); }
  else startT(); }

function selectOpt(i){ if (G.locked || G.removed.has(i)) return; G.sel = i;
  document.querySelectorAll('.opt').forEach((b, k) => b.classList.toggle('sel', k === i));
  $('conf').innerHTML = `<button class="btn gold" id="cfB"><i class="fas fa-check"></i> تأكيد الإجابة (${LETTERS[i]})</button>`; $('cfB').onclick = confirmAns; }

async function confirmAns(){
  if (G.locked || G.sel < 0) return; G.locked = true; const tok = G.tok, q = G.round[G.i], sel = G.sel; tStop(); stopA(G.qAud); G.qAud = null;
  $('opts').classList.add('lock'); $('conf').innerHTML = '<span class="chip g"><i class="fas fa-hourglass-half"></i> إجابتك نهائية… انتظر</span>'; document.querySelectorAll('.life').forEach(b => b.disabled = true);
  const sa = await play(S.snd.suspense); await Promise.all([sleep(2400), sa ? waitEnd(sa, 6500) : sleep(0)]); stopA(sa); if (G.tok !== tok) return;
  const ok = sel === q.correct, btns = document.querySelectorAll('.opt');
  if (ok){ btns[sel].classList.add('ok'); } else { btns[sel].classList.add('no'); if (S.cfg.showCorrectOnLose) btns[q.correct].classList.add('ok'); $('app').classList.add('shake'); setTimeout(() => $('app').classList.remove('shake'), 600); }
  $('conf').innerHTML = ok ? '<span class="chip g"><i class="fas fa-circle-check"></i> إجابة صحيحة! 🎉</span>' : '<span class="chip" style="border-color:var(--bad)"><i class="fas fa-circle-xmark"></i> للأسف إجابة خاطئة</span>';
  const ra = await play(pick(ok ? S.snd.correct : S.snd.wrong)); await Promise.all([sleep(2200), ra ? waitEnd(ra, 5000) : sleep(0)]); stopA(ra); if (G.tok !== tok) return;

  updateDoc(doc(db,'mm_plays',G.playId), {reached:G.correct, giftNames:prizeNames(keptPrizes('quit'))}).catch(() => {});
  if (G.i + 1 >= G.round.length) return finish('won'); G.i++; showQ(); }

/* ============ وسائل المساعدة ============ */
async function useLife(k){ if (G.locked || !(G.lives[k] > 0)) return; const q = G.round[G.i], L = lvl(q.level), cfg = S.cfg.lifelines[k]; G.lives[k]--; $('lifes').innerHTML = lifeBtns(); tPause();
  const remain = [0,1,2,3].filter(i => !G.removed.has(i)), wrongs = remain.filter(i => i !== q.correct);
  if (k === 'fifty'){ shuf(wrongs).slice(0,2).forEach(i => { G.removed.add(i); document.querySelectorAll('.opt')[i].classList.add('gone'); });
    if (G.removed.has(G.sel)){ G.sel = -1; $('conf').innerHTML = ''; document.querySelectorAll('.opt').forEach(b => b.classList.remove('sel')); } tResume(); return; }
  if (k === 'ai'){ const acc = (+L.ai || 0)/100, right = Math.random() < acc, ans = right ? q.correct : (wrongs.length ? pick(wrongs) : q.correct);
    const ov = modal(`<h3><i class="fas fa-robot"></i> ${esc(cfg.name || 'المساعد')}</h3><div class="friend"><div class="fa"><i class="fas fa-robot"></i></div><div style="flex:1;font-weight:800;line-height:1.9" id="aiTx">يفكر<span class="dots"><span>.</span><span>.</span><span>.</span></span></div></div><button class="btn gold" id="mClose" style="margin-top:14px;display:none">حسناً</button>`);
    await sleep(1800); ov.querySelector('#aiTx').innerHTML = `${esc(cfg.msg || 'أعتقد أن الإجابة هي')} <b style="color:var(--gold2)">${LETTERS[ans]}: ${esc(q.opts[ans].t)}</b>`; const b = ov.querySelector('#mClose'); b.style.display = 'inline-flex'; b.onclick = () => { ov.remove(); tResume(); }; return; }
  if (k === 'audience'){ const acc = (+L.aud || 0)/100, right = Math.random() < acc; let top = right ? q.correct : (wrongs.length ? pick(wrongs) : q.correct), pct = {};
    remain.forEach(i => pct[i] = 0); let rest = 100, tp = right ? 42 + rnd(40) : 34 + rnd(26); if (remain.length === 2) tp = right ? 62 + rnd(30) : 55 + rnd(20); pct[top] = tp; rest -= tp;
    const others = remain.filter(i => i !== top); others.forEach((i, idx) => { const v = idx === others.length-1 ? rest : rnd(rest + 1); pct[i] = v; rest -= v; });
    const ov = modal(`<h3><i class="fas fa-people-group"></i> رأي الجمهور</h3><div class="bars">${[0,1,2,3].map(i => `<div class="bar"><b>${G.removed.has(i) ? '' : ar(pct[i]) + '٪'}</b><i data-h="${G.removed.has(i) ? 0 : pct[i]}"></i><span>${LETTERS[i]}</span></div>`).join('')}</div><button class="btn gold" id="mClose" style="margin-top:12px">حسناً</button>`);
    requestAnimationFrame(() => requestAnimationFrame(() => ov.querySelectorAll('.bar i').forEach(e => e.style.height = (e.dataset.h * 1.6) + 'px'))); ov.querySelector('#mClose').onclick = () => { ov.remove(); tResume(); }; } }
function modal(html){ const ov = document.createElement('div'); ov.className = 'ov'; ov.innerHTML = `<div class="md">${html}</div>`; document.body.appendChild(ov); return ov; }

/* ============ النهاية ============ */
function keptPrizes(mode){ const c = S.cfg;
  if (mode === 'quit' || mode === 'each' && true) { /* الكل المكتسب */ }
  if (mode === 'quit') return G.earned;
  if (mode === 'won') return G.earned;
  const pm = c.prizeMode; if (pm === 'each') return G.earned; if (pm === 'final') return [];
  const lastSafe = Math.max(0, ...safeList().filter(n => n <= G.correct)); return G.earned.filter(e => e.qn <= lastSafe); }
const prizeNames = list => { const m = new Map(); list.forEach(e => m.set(e.giftId, (m.get(e.giftId)||0) + e.qty)); return [...m.entries()].map(([id, n]) => { const g = giftOf(id); return `${g ? g.name : 'هدية'}${n > 1 ? ' ×' + n : ''}`; }); };
async function quit(){ if (!G || G.locked) return; const ov = modal(`<h3>الانسحاب</h3><p style="font-weight:700;line-height:1.9;margin-bottom:14px">ستنهي الجولة وتحتفظ بهداياك التي ربحتها حتى الآن (${ar(G.earned.length)} هدية). هل أنت متأكد؟</p><div style="display:flex;gap:10px;justify-content:center"><button class="btn out" id="qN">أكمل اللعب</button><button class="btn gold" id="qY">انسحاب</button></div>`);
  tPause(); ov.querySelector('#qN').onclick = () => { ov.remove(); tResume(); }; ov.querySelector('#qY').onclick = () => { ov.remove(); finish('quit'); }; }
async function finish(status, reason){
  if (!G || G.over) return; G.over = true; tStop(); stopAll(); document.querySelectorAll('.ov').forEach(o => o.remove());
  const kept = status === 'won' ? G.earned : keptPrizes(status), names = prizeNames(kept), L = G.round[Math.min(G.i, G.round.length-1)], win = status === 'won';
  const sa = play(S.snd.end);
  try { await updateDoc(doc(db,'mm_plays',G.playId), {status, reached:G.correct, levelLabel:lvl(L.level).label, giftNames:names, endedAt:serverTimestamp(), reason:reason||''});
    const p = S.plays.find(x => x.id === G.playId); if (p){ p.status = status; p.endedAt = Timestamp.now(); }
    if (kept.length){ const b = writeBatch(db), m = new Map(); kept.forEach(e => m.set(e.giftId, (m.get(e.giftId)||0) + e.qty));
      m.forEach((qty, gid) => { const g = giftOf(gid) || {}; b.set(doc(collection(db,'mm_prizes')), {uid, name:myName(), playId:G.playId, giftId:gid, giftName:g.name||'', giftIcon:g.icon||'', giftImg:g.img||'', qty, price:Number(g.price)||0, status:'won', createdAt:serverTimestamp()}); }); await b.commit(); }
  } catch(e){ console.error(e); toast('تعذر حفظ النتيجة'); }
  const total = G.round.length, reasonTx = reason === 'time' ? 'انتهى الوقت ⏰' : reason === 'wrong' ? 'إجابة خاطئة' : '';
  app.innerHTML = `<div class="card res ${win ? 'win' : 'lose'}"><div class="big">${win ? '🦁🏆' : status === 'quit' ? '🚪' : '😢'}</div>
    <h2>${win ? 'مبروك! لقد ربحت الأسد 🎉' : status === 'quit' ? 'انسحبت بهداياك' : 'حظاً أوفر هذه المرة'}</h2>
    <p style="font-weight:700;line-height:1.9">${win ? 'أجبت عن كل الأسئلة بنجاح!' : reasonTx}${!win ? ` — وصلت إلى السؤال ${ar(Math.min(G.correct + (status === 'lost' ? 1 : 0), total))} من ${ar(total)}` : ''}</p>
    ${names.length ? `<div class="sec-t" style="justify-content:center;margin-top:14px"><i class="fas fa-gift"></i> هداياك</div><div class="prz">${(() => { const m = new Map(); kept.forEach(e => m.set(e.giftId, (m.get(e.giftId)||0) + e.qty)); return [...m.entries()].map(([id, n]) => { const g = giftOf(id); return `<span class="pz">${giftIco(g)}${esc(g ? g.name : 'هدية')}${n > 1 ? ' ×' + ar(n) : ''}</span>`; }).join(''); })()}</div>` : `<div class="chip" style="margin:12px 0">لا هدايا في هذه الجولة</div>`}
    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button class="btn gold" id="again"><i class="fas fa-rotate-right"></i> العب مرة أخرى</button><a class="btn out" href="index.html" style="text-decoration:none"><i class="fas fa-home"></i> الرئيسية</a></div></div>`;
  fixFsm(); if (win) confetti();
  $('again').onclick = () => { const c = canPlay(); if (c.ok) startGame(); else { toast(c.msg); showIntro(); } };
  await sa; G = null; }
function confetti(){ const r = document.querySelector('.res'); if (!r) return; const cols = ['#C9A961','#F3E2B0','#2ECC71','#E74C3C','#3498DB','#fff']; for (let i = 0; i < 60; i++){ const d = document.createElement('i'); d.className = 'cf'; d.style.left = rnd(100) + '%'; d.style.background = cols[rnd(cols.length)]; d.style.animationDuration = (2.5 + Math.random()*2.5) + 's'; d.style.animationDelay = (Math.random()*1.2) + 's'; r.appendChild(d); setTimeout(() => d.remove(), 7000); } }

/* مغادرة أثناء اللعب = خسارة (محاولة أخيرة) */
addEventListener('pagehide', () => { if (G && !G.over && G.playId) updateDoc(doc(db,'mm_plays',G.playId), {status:'lost', endedAt:serverTimestamp(), abandoned:true}).catch(() => {}); });

load().then(showIntro).catch(e => { console.error(e); app.innerHTML = '<div class="card hero"><div class="lion">⚠️</div><h2>تعذر التحميل</h2><p>تحقق من الاتصال ثم أعد المحاولة</p><button class="btn gold" onclick="location.reload()">إعادة المحاولة</button></div>'; });
</script>
