setInterval(()=>{if(mode==='play'&&G&&!paused){adv(1/15);G.energy=cl(G.energy-C.diff.drain/100*2.5/15,0,100);hud()}},1000);
(async function boot(){rs();world();applyQ();requestAnimationFrame(frame);
 if(db){try{const s=await db.collection('game').doc('config').get();if(s.exists){const d=s.data();for(const k in d)if(d[k]!=null&&k!=='fb')C[k]=d[k]}}catch(e){}
  try{const m=await me().get();if(m.exists&&m.data().banned){$('ban').innerHTML='<h1>تم حظرك من اللعبة</h1><p>'+esc(m.data().banReason||'')+'</p>';$('ban').classList.add('on')}}catch(e){}}
 if(C.global.maint==='تشغيل'){$('menu').innerHTML='<h1>اللعبة تحت الصيانة</h1><p>جرّب بعد قليل.</p>';return}
 $('co').innerHTML=C.colleges.map(c=>'<option>'+esc(c.name)+'</option>').join('');
 if(localStorage.uniG){try{const g=JSON.parse(localStorage.uniG);if(!g.done){$('cont').style.display='';$('cont').textContent='متابعة ('+g.name+')'}}catch(e){}}})();
</script></body></html>
