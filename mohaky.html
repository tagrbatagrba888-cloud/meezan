function finishYear(){const v=Object.values(G.res),yp=v.length?v.reduce((a,s)=>a+pts(s),0)/v.length:0;G.gpa=G.yd?(G.gpa*G.yd+yp)/(G.yd+1):yp;G.yd++;G.know={};G.failed=[];G.res={};

function doIt(k){const h=G.clock;
 if(k==='lec'){if(h<8||h>16)return toast('القاعة مغلقة الآن. المحاضرات من 8 صباحا حتى 4 عصرا.');if(G.ph!=='term')return toast('مفيش محاضرات في الفترة دي.');chooser('اختر المحاضرة',c=>{G.know[c.name]=cl((G.know[c.name]||0)+gain(12),0,100);toast('حضرت محاضرة '+c.name);use(2,10)})}

 else if(k==='caf'){if(G.money<20)return toast('معكش فلوس كفاية.');G.money-=20;G.energy=cl(G.energy+25,0,100);adv(1);hud();save();toast('أكلت واسترحت')}

let jx=0,jy=0,jid=null,cid=null,lx=0,ly=0,cy=0,cp=.35;const K={},jb=$('jb'),jk=$('jk');
function jm(e){const r=jb.getBoundingClientRect(),sx=e.clientX-(r.left+r.width/2),sy=e.clientY-(r.top+r.height/2),dx=ROT?sy:sx,dy=ROT?-sx:sy,m=Math.min(1,Math.hypot(dx,dy)/45),a=Math.atan2(dy,dx);jx=Math.cos(a)*m;jy=Math.sin(a)*m;jk.style.transform='translate('+jx*45+'px,'+jy*45+'px)'}
jb.addEventListener('pointerdown',e=>{jid=e.pointerId;jb.setPointerCapture(jid);jm(e)});jb.addEventListener('pointermove',e=>{if(e.pointerId===jid)jm(e)});

cv.addEventListener('pointermove',e=>{if(e.pointerId!==cid)return;const s=ST.sen/50*.005,ax=e.clientX-lx,ay=e.clientY-ly,dx=ROT?ay:ax,dy=ROT?-ax:ay;cy-=dx*s;cp=cl(cp+dy*s,.1,1.1);lx=e.clientX;ly=e.clientY});
const ce=e=>{if(e.pointerId===cid)cid=null};cv.addEventListener('pointerup',ce);cv.addEventListener('pointercancel',ce);
const typing=e=>e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA');
addEventListener('keydown',e=>{if(typing(e))return;K[e.key.toLowerCase()]=1;if(e.key.toLowerCase()==='e')act()});addEventListener('keyup',e=>{if(!typing(e))K[e.key.toLowerCase()]=0});
function act(){if(!near||paused||mode!=='play')return;if(near.t==='enter')enter(near.b);else if(near.t==='exit')leave();else if(near.t==='talk'){const p=near.who;openChat(p.pid?{type:'pl',pid:p.pid,name:p.name,who:p}:{type:'bot',name:p.name,who:p})}else doIt(IN)}

let last=performance.now(),lat='';
function nearest(px,pz){let bd=2.7,bp=null;for(const p of npcs)if(p.g.visible){const d=Math.hypot(px-p.x,pz-p.z);if(d<bd){bd=d;bp=p}}for(const id in REM){const p=REM[id];if(p.g.visible){const d=Math.hypot(px-p.x,pz-p.z);if(d<bd){bd=d;bp=p}}}return bp}
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;let mv=false;
 if(mode==='play'&&G&&!paused){const kx=(K.d||K.arrowright?1:0)-(K.a||K.arrowleft?1:0),ky=(K.s||K.arrowdown?1:0)-(K.w||K.arrowup?1:0),ix=jx+kx,iy=jy+ky,m=Math.min(1,Math.hypot(ix,iy));
  if(m>.08){mv=true;const fx=-Math.sin(cy),fz=-Math.cos(cy),rx=Math.cos(cy),rz=-Math.sin(cy),vx=fx*-iy+rx*ix,vz=fz*-iy+rz*ix,l=Math.hypot(vx,vz)||1,sp=5.5*m*dt;let nx=pl.position.x+vx/l*sp,nz=pl.position.z+vz/l*sp;
   if(IN){nx=cl(nx,-9.2,9.2);nz=cl(nz,IZ-9.2,IZ+9.2)}else{nx=cl(nx,-190,190);nz=cl(nz,-190,190);AB.forEach(a=>{if(nx>a.x1&&nx<a.x2&&nz>a.z1&&nz<a.z2){const d=[nx-a.x1,a.x2-nx,nz-a.z1,a.z2-nz],i=d.indexOf(Math.min(...d));if(i===0)nx=a.x1;else if(i===1)nx=a.x2;else if(i===2)nz=a.z1;else nz=a.z2}})}
   pl.position.x=nx;pl.position.z=nz;pl.rotation.y=Math.atan2(vx,vz)}
  if(!IN){const px=pl.position.x,pz=pl.position.z;near=null;for(const b of B)if(Math.hypot(px-b.x,pz-b.dz)<3.2){near={t:'enter',b};break}
   if(!near){const p=nearest(px,pz);if(p)near={t:'talk',who:p}}
   if(mv)for(const b of B)if(Math.hypot(px-b.x,pz-(b.z+b.f*b.d/2))<2.4){enter(b);break}}
  else{const dz=pl.position.z-IZ;near=Math.hypot(pl.position.x,dz+3)<2.8?{t:'do'}:(dz>7?{t:'exit'}:null);if(mv&&dz>8.4&&Math.abs(pl.position.x)<2.4)leave()}
  const ab=$('act'),tx=!near?'':near.t==='enter'?'دخول '+near.b.n:near.t==='exit'?'خروج':near.t==='talk'?'💬 تحدث مع '+near.who.name:SPOT[IN];
  const auto=near&&(near.t==='enter'||near.t==='exit');ab.style.display=near&&!auto?'block':'none';if(tx!==lat){ab.textContent=tx;lat=tx}}
 if(G)pAnim(dt,mv);
  if(IN){if(INH){const o=INH.userData.o+((pl.position.z-IZ>5.2?1:0)-INH.userData.o)*Math.min(1,dt*6);INH.userData.o=o;INH.rotation.y=-o*1.7}rpStep(now/1000)}
  else if(G)for(const b of B)if(b.hg){const d=Math.hypot(pl.position.x-b.x,pl.position.z-(b.z+b.f*b.d/2)),o=b.o+((d<7?1:0)-b.o)*Math.min(1,dt*6);b.o=o;b.hg.rotation.y=-b.f*o*1.7}
 npcStep(((mode==='play'&&!paused)||mode==='menu'||mode==='cine')?dt:0);remStep(dt);presence(now);
 const t=now/1000;
 if(mode==='menu'){cam.position.set(Math.sin(t*.1)*90,38,Math.cos(t*.1)*90);cam.lookAt(0,5,0)}
 else if(mode==='cine'){const k=Math.min(1,(now-cs)/9000),a=t*.25,r=90-65*k,y=40-34*k;cam.position.set(Math.sin(a)*r,y,Math.cos(a)*r);cam.lookAt(0,6-4*k,0);if(k>=1)endCine()}
 else if(G){const p=pl.position,d=IN?5:7;cam.position.lerp(new THREE.Vector3(p.x+Math.sin(cy)*d*Math.cos(cp),p.y+1.6+Math.sin(cp)*d,p.z+Math.cos(cy)*d*Math.cos(cp)),.2);cam.lookAt(p.x,p.y+1.5,p.z);
  const hh=G.clock,day=Math.max(.15,Math.sin((hh-6)/12*Math.PI));if(!IN){sun.intensity=.25+.8*day;hemi.intensity=.35+.45*day;scene.background.setRGB(.1+.5*day,.15+.62*day,.25+.6*day);scene.fog.color.copy(scene.background)}
  sun.position.set(p.x+60,100,p.z+40);sun.target.position.copy(p)}
 rd.render(scene,cam)}
